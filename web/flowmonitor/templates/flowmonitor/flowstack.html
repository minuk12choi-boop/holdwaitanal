{% load static %}<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Multi Line Fab Monitor</title>
<style>
  :root { --bd:#E5E7EB; --fg:#111827; --mut:#6B7280; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Malgun Gothic","Segoe UI",sans-serif; color:var(--fg);
         font-size:14px; }
  header { border-bottom:1px solid var(--bd); padding:0 20px; display:flex;
           align-items:center; gap:28px; height:52px; }
  header .brand { font-weight:700; letter-spacing:-.02em; }
  header nav a { color:var(--mut); text-decoration:none; margin-right:20px;
                 font-size:14px; padding:6px 0; }
  header nav a.on { color:var(--fg); border-bottom:2px solid var(--fg); }
  /* 상단 현황 구역 */
  .status { display:grid; grid-template-columns:repeat(4,1fr); gap:0;
            border-bottom:1px solid var(--bd); }
  .card { border-right:1px solid var(--bd); position:relative; }
  .card:last-child { border-right:0; }
  .card .head { color:#fff; text-align:center; font-weight:600; padding:8px 0;
                font-size:15px; letter-spacing:-.01em; }
  .card .cell { border-top:1px solid var(--bd); padding:10px 12px; }
  .card .wip { display:flex; align-items:center; justify-content:space-between;
               gap:8px; }
  .card .wip .nums { display:flex; gap:18px; }
  .card .wip .nums div { text-align:left; }
  .card .wip b { display:block; font-size:19px; line-height:1.2; }
  .card .wip span { font-size:11px; color:var(--mut); }
  .card .wip select { font-size:11px; padding:3px 5px; border:1px solid var(--bd);
                      border-radius:4px; background:#fff; }
  .card .donut { display:flex; align-items:center; gap:12px; }
  .card .donut .cv { width:118px; height:118px; flex:0 0 118px; }
  .card .donut .txt { font-size:12px; color:var(--mut); line-height:1.5; }
  .card .donut .txt b { display:block; font-size:22px; color:var(--fg);
                        line-height:1.2; }
  .card .legend { display:flex; flex-wrap:wrap; gap:6px 10px; margin-top:6px; }
  .card .legend span { font-size:11px; color:var(--mut); cursor:pointer;
                       display:inline-flex; align-items:center; gap:4px; }
  .card .legend i { width:9px; height:9px; border-radius:2px; }
  .card .cellttl { font-size:11px; color:var(--mut); margin-bottom:6px; }
  .card .movebox { display:flex; align-items:center; gap:12px; }
  .card .movebox .cv { flex:1; height:96px; }
  .card .movetot { text-align:right; }
  .card .movetot b { display:block; font-size:24px; line-height:1.15; }
  .card .movetot span { font-size:11px; color:var(--mut); }
  /* Low WT 분석 */
  .wt .cellttl { display:flex; justify-content:space-between; align-items:center; }
  .wt select { font-size:11px; padding:2px 4px; border:1px solid var(--bd);
               border-radius:4px; }
  .wt table { width:100%; border-collapse:collapse; font-size:11px; }
  .wt th, .wt td { padding:3px 4px; text-align:right; white-space:nowrap; }
  .wt th:first-child, .wt td:first-child { text-align:left; color:var(--mut); }
  .wt thead th { color:var(--mut); font-weight:600; border-bottom:1px solid var(--bd); }
  .wt .big td { font-size:13px; font-weight:600; }
  .wt .rate td { color:var(--mut); border-bottom:1px solid var(--bd); }
  .wt .sec { color:var(--mut); padding-top:6px; font-size:10px; }
  .wt tr.pick { cursor:pointer; }
  .wt tr.pick:hover td { background:#F3F4F6; }
  .wt tr.on td { background:#EEF2FF; font-weight:600; }
  /* Drill-down */
  #drill { border-bottom:1px solid var(--bd); background:#FAFAFA; display:none; }
  #drill .bar { display:flex; align-items:center; justify-content:space-between;
                padding:8px 16px; border-bottom:1px solid var(--bd); }
  #drill .bar b { font-size:13px; }
  #drill .bar .path { color:var(--mut); font-size:12px; margin-left:8px; }
  #drill .bar button { border:1px solid var(--bd); background:#fff; border-radius:4px;
                       font-size:12px; padding:4px 10px; cursor:pointer; }
  #drill .scroll { max-height:320px; overflow:auto; }
  #drill table { border-collapse:collapse; font-size:11px; width:100%; }
  #drill th, #drill td { padding:4px 7px; border-bottom:1px solid var(--bd);
                         white-space:nowrap; text-align:left; }
  #drill thead th { position:sticky; top:0; background:#F3F4F6; color:var(--mut);
                    font-weight:600; z-index:1; }
  #drill td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .card .dev { position:absolute; inset:38px 0 0 0; background:rgba(255,255,255,.82);
               display:flex; align-items:center; justify-content:center;
               font-size:14px; color:var(--mut); font-weight:600; letter-spacing:.02em; }

  main { display:flex; gap:16px; padding:16px; align-items:flex-start; }
  .left { flex:0 0 32%; min-width:400px; }
  .right { flex:1; border:1px solid var(--bd); border-radius:6px; padding:16px;
           color:var(--mut); position:sticky; top:16px; }
  .panel { border:1px solid var(--bd); border-radius:6px; padding:10px 12px 6px;
           margin-bottom:10px; }
  .panel h2 { margin:0; font-size:13px; display:flex; justify-content:space-between;
              align-items:baseline; }
  .panel h2 .unit { color:var(--mut); font-size:11px; font-weight:400; }
  .wrap { position:relative; opacity:0; transition:opacity .28s ease-out; }
  .wrap.ready { opacity:1; }
  .topbar { display:flex; justify-content:space-between; align-items:center;
            margin:0 0 8px 2px; }
  #legend { display:flex; gap:14px; font-size:12px; }
  .toggle { display:inline-flex; border:1px solid var(--bd); border-radius:5px;
            overflow:hidden; font-size:12px; }
  .toggle button { border:0; background:#fff; color:var(--mut); padding:4px 10px;
                   cursor:pointer; }
  .toggle button.on { background:var(--fg); color:#fff; }
  .panel h2 .basis { color:var(--mut); font-size:11px; font-weight:400; }
  #legend span { display:inline-flex; align-items:center; gap:5px; }
  #legend i { width:14px; height:3px; border-radius:2px; display:inline-block; }
  .err { color:#B91C1C; font-size:13px; padding:8px 2px; }
  .err code { background:#FEF2F2; padding:1px 4px; border-radius:3px; }
  .notice { background:#FFFBEB; border:1px solid #FDE68A; color:#92400E;
            border-radius:5px; padding:8px 10px; font-size:12px; margin-bottom:10px; }
</style>
</head>
<body>
<header>
  <div class="brand">Multi Line Fab Monitor</div>
  <nav>
    {% for name, url in menu %}
      <a href="{{ url }}" {% if forloop.first %}class="on"{% endif %}>{{ name }}</a>
    {% endfor %}
  </nav>
</header>

<section class="status" id="status"></section>

<section id="drill"></section>

<main>
  <div class="left">
    <div id="notice" class="notice" style="display:none"></div>
    <div class="topbar">
      <div id="legend"></div>
      <div class="toggle" title="HOLD율 / WAIT성 진행불가율의 분모">
        <button id="b_qty" class="on" onclick="setBasis('qty')">매수</button>
        <button id="b_lot" onclick="setBasis('lot')">Lot수</button>
      </div>
    </div>
    {% for p in panels %}
    <div class="panel">
      <h2>{{ p.title }}<span class="unit">{% if p.basis %}<span class="basis"
          id="basis_{{ p.key }}">매수 기준</span> · {% endif %}{{ p.unit }}</span></h2>
      <div class="wrap" style="height:{{ p.px }}px">
        <canvas id="c_{{ p.key }}"></canvas>
      </div>
    </div>
    {% endfor %}
    <div id="err" class="err"></div>
  </div>
  <div class="right">상세 영역 (f3_live 연결 예정)</div>
</main>

<!-- 사내망 CDN 차단에 걸리지 않도록 로컬 static 을 먼저 쓴다 -->
<script src="{% static 'flowmonitor/chart.umd.js' %}"></script>
<script>
  if (!window.Chart) {
    document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/'
      + 'dist/chart.umd.min.js"><\/script>');
  }
</script>
<script>
const KIND_KO = { month: "월평균", week: "주평균", day: "일" };
const charts = {};
let basis = "qty";

function setBasis(b) {
  if (b === basis) return;
  basis = b;
  document.getElementById("b_qty").className = (b === "qty") ? "on" : "";
  document.getElementById("b_lot").className = (b === "lot") ? "on" : "";
  ["hold", "blocked"].forEach(k => {
    const el = document.getElementById("basis_" + k);
    if (el) el.textContent = (b === "qty") ? "매수 기준" : "Lot수 기준";
  });
  // ---------------------------------------------------------------------------
// 상단 현황 카드
// ---------------------------------------------------------------------------
const nf = (n) => Number(n || 0).toLocaleString("ko-KR");

// 도넛 가운데 텍스트
const donutCenter = {
  id: "donutCenter",
  afterDraw(c) {
    const t = c.$center;
    if (!t) return;
    const { top, bottom, left, right } = c.chartArea;
    const x = (left + right) / 2, y = (top + bottom) / 2;
    const ctx = c.ctx;
    ctx.save();
    ctx.textAlign = "center";
    ctx.fillStyle = t.color || "#111827";
    ctx.font = "600 19px 'Malgun Gothic', sans-serif";
    ctx.fillText(t.big, x, y + 2);
    ctx.fillStyle = "#6B7280";
    ctx.font = "10px 'Malgun Gothic', sans-serif";
    ctx.fillText(t.small, x, y + 17);
    ctx.restore();
  }
};

function cardHtml(c, i) {
  if (!c.ready) {
    return `<div class="card">
      <div class="head" style="background:${c.head}">${c.label}</div>
      <div class="cell" style="height:150px"></div>
      <div class="cell" style="height:120px"></div>
      <div class="cell" style="height:120px"></div>
      <div class="dev">개발중</div></div>`;
  }
  const opts = c.types.map(t => `<option value="${t}">${t}</option>`).join("");
  return `<div class="card">
    <div class="head" style="background:${c.head}">${c.label}</div>
    <div class="cell">
      <div class="wip">
        <div class="nums">
          <div><b id="wl_${i}">-</b><span>재공 LOT</span></div>
          <div><b id="wq_${i}">-</b><span>재공 매</span></div>
        </div>
        <select onchange="pickType(${i}, this.value)">${opts}</select>
      </div>
    </div>
    <div class="cell">
      <div class="donut">
        <div class="cv"><canvas id="dn_${i}"></canvas></div>
        <div class="txt" id="dt_${i}"></div>
      </div>
      <div class="legend" id="lg_${i}"></div>
    </div>
    <div class="cell">
      <div class="cellttl">대기 LOT 상위 설비 5</div>
      <div style="height:118px"><canvas id="eq_${i}"></canvas></div>
    </div>
    <div class="cell">
      <div class="cellttl">Shift 별 MOVE</div>
      <div class="movebox">
        <div class="cv"><canvas id="mv_${i}"></canvas></div>
        <div class="movetot"><b>${nf(c.move.total)}</b><span>당일 MOVE (매)</span></div>
      </div>
    </div>
    <div class="cell wt" id="wt_${i}"></div></div>`;
}

let STATUS_DATA = [];
const CUR_TYPE = {};      // 카드별 선택된 lot_type
const CUR_SEL = {};       // 카드별 선택된 status index

function curPack(i) {
  return STATUS_DATA[i].by_type[CUR_TYPE[i]];
}

function setCenter(i) {
  const p = curPack(i), sel = CUR_SEL[i], ch = window["dn" + i];
  const d = (sel === null || sel === undefined)
    ? { label: p.default.label, pct: p.default.pct, lots: p.default.lots,
        qty: p.default.qty, color: "#111827" }
    : { label: p.status[sel].name, pct: p.status[sel].pct,
        lots: p.status[sel].lots, qty: p.status[sel].qty,
        color: p.status[sel].color };
  ch.$center = { big: d.pct.toFixed(1) + "%", small: d.label, color: d.color };
  ch.draw();
  document.getElementById("dt_" + i).innerHTML =
    `<b>${nf(d.lots)} LOT</b>${nf(d.qty)} 매`;
}

function renderCard(i) {
  const p = curPack(i);
  document.getElementById("wl_" + i).textContent = nf(p.total.lots);
  document.getElementById("wq_" + i).textContent = nf(p.total.qty);
  document.getElementById("lg_" + i).innerHTML = p.status.map((st, si) =>
    `<span onclick="pickStatus(${i},${si})"><i style="background:${st.color}"></i>`
    + `${st.name} ${st.pct}%</span>`).join("");

  const dn = window["dn" + i];
  dn.data.datasets[0].data = p.status.map(s => s.lots);
  dn.$status = p.status;
  dn.update();
  setCenter(i);

  const eq = window["eq" + i];
  eq.data.labels = p.top_eqp.map(e => e.name);
  eq.data.datasets[0].data = p.top_eqp.map(e => e.lots);
  eq.$qty = p.top_eqp.map(e => e.qty);
  eq.update();
}

function pickType(i, t) {
  CUR_TYPE[i] = t;
  CUR_SEL[i] = null;
  renderCard(i);
}

function pickStatus(i, si) {
  CUR_SEL[i] = (CUR_SEL[i] === si) ? null : si;   // 다시 누르면 기본값
  setCenter(i);
}

// 조각 위에 상태 비율을 직접 표기
const donutSliceLabels = {
  id: "donutSliceLabels",
  afterDatasetsDraw(c) {
    const st = c.$status || [];
    const ctx = c.ctx;
    ctx.save();
    ctx.font = "600 10px 'Malgun Gothic', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    c.getDatasetMeta(0).data.forEach((arc, k) => {
      const v = st[k];
      if (!v || v.pct < 6) return;            // 너무 얇으면 생략
      const a = (arc.startAngle + arc.endAngle) / 2;
      const r = (arc.innerRadius + arc.outerRadius) / 2;
      ctx.fillStyle = "#fff";
      ctx.fillText(v.pct + "%",
                   arc.x + Math.cos(a) * r, arc.y + Math.sin(a) * r);
    });
    ctx.restore();
  }
};

function drawCards(res) {
  document.getElementById("status").innerHTML =
    res.cards.map((c, i) => cardHtml(c, i)).join("");
  STATUS_DATA = res.cards;

  res.cards.forEach((c, i) => {
    if (!c.ready) return;

    const p0 = c.by_type[c.types[0]];
    CUR_TYPE[i] = c.types[0];
    CUR_SEL[i] = null;

    window["dn" + i] = new Chart(document.getElementById("dn_" + i), {
      type: "doughnut",
      data: { labels: p0.status.map(s => s.name),
              datasets: [{ data: p0.status.map(s => s.lots),
                           backgroundColor: p0.status.map(s => s.color),
                           borderWidth: 0 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: "68%",
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (t) => {
            const st = (t.chart.$status || p0.status)[t.dataIndex];
            return `${st.name}  ${st.pct}% · ${nf(st.lots)} LOT · ${nf(st.qty)} 매`;
          } } }
        },
        onClick: (e, els) => { if (els.length) pickStatus(i, els[0].index); }
      },
      plugins: [donutCenter, donutSliceLabels]
    });

    window["eq" + i] = new Chart(document.getElementById("eq_" + i), {
      type: "bar",
      data: { labels: p0.top_eqp.map(e => e.name),
              datasets: [{ data: p0.top_eqp.map(e => e.lots),
                           backgroundColor: c.head, borderRadius: 2 }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        layout: { padding: { top: 16 } },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: (t) =>
                     `${t.parsed.y} LOT · ${nf((t.chart.$qty || [])[t.dataIndex])} 매` } } },
        scales: { x: { grid: { display: false }, ticks: { font: { size: 9 } } },
                  y: { display: false, beginAtZero: true, grace: "20%" } }
      },
      plugins: [{ id: "barLbl", afterDatasetsDraw(ch) {
        const ctx = ch.ctx; ctx.save();
        ctx.font = "10px 'Malgun Gothic'"; ctx.textAlign = "center";
        ch.getDatasetMeta(0).data.forEach((el, k) => {
          ctx.fillStyle = "#374151";
          ctx.fillText(ch.data.datasets[0].data[k], el.x, el.y - 4);
        });
        ctx.restore();
      } }]
    });
    window["eq" + i].$qty = p0.top_eqp.map(e => e.qty);

    new Chart(document.getElementById("mv_" + i), {
      type: "bar",
      data: { labels: ["GY", "DAY", "SW"],
              datasets: [{ data: [c.move.GY, c.move.DAY, c.move.SW],
                           backgroundColor: c.head, borderRadius: 2 }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        layout: { padding: { top: 16 } },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: (t) => nf(t.parsed.y) + " 매" } } },
        scales: { x: { grid: { display: false }, ticks: { font: { size: 10 } } },
                  y: { display: false, beginAtZero: true, grace: "20%" } }
      },
      plugins: [{ id: "mvLbl", afterDatasetsDraw(ch) {
        const ctx = ch.ctx; ctx.save();
        ctx.font = "10px 'Malgun Gothic'"; ctx.textAlign = "center";
        ch.getDatasetMeta(0).data.forEach((el, k) => {
          const v = ch.data.datasets[0].data[k];
          ctx.fillStyle = "#374151";
          ctx.fillText((v / 1000).toFixed(1) + "k", el.x, el.y - 4);
        });
        ctx.restore();
      } }]
    });

    renderCard(i);
  });
}

// ---------------------------------------------------------------------------
// Low WT 분석
// ---------------------------------------------------------------------------
const WT_OPTS = [
  { v: 0,   t: "WT = 0" },
  { v: 0.5, t: "WT ≤ 0.5" },
  { v: 1.0, t: "WT ≤ 1.0" },
];
const WT_STATE = {};      // 카드별 {max, bin}

function loadWt(i, line) {
  const st = WT_STATE[i] || (WT_STATE[i] = { max: 0, bin: "0" });
  fetch(`/api/lowwt/?line=${encodeURIComponent(line)}&max_wt=${st.max}`)
    .then(r => r.json()).then(d => drawWt(i, line, d));
}

function pickWtMax(i, line, v) {
  WT_STATE[i].max = parseFloat(v);
  WT_STATE[i].bin = "0";                 // 기준 변경 시 가장 심각한 구간부터
  loadWt(i, line);
}

function pickWtBin(i, line, key) {
  WT_STATE[i].bin = key;
  loadWt(i, line);
}

function drawWt(i, line, d) {
  const el = document.getElementById("wt_" + i);
  if (!el) return;
  if (!d.ready) {
    el.innerHTML = `<div class="cellttl">Low WT 분석</div>
      <div class="sec">${d.reason || "데이터 없음"}</div>`;
    return;
  }
  const st = WT_STATE[i];
  if (!d.dist["전체"][st.bin]) {
    const keys = d.bins.map(b => b.key);
    if (!keys.includes(st.bin)) st.bin = keys[0];
  }
  const opts = WT_OPTS.map(o =>
    `<option value="${o.v}" ${o.v === st.max ? "selected" : ""}>${o.t}</option>`).join("");
  const th = d.cols.map(c => `<th>${c}</th>`).join("");

  const sumRow = d.cols.map(c => `<td>${nf(d.summary[c].low)}</td>`).join("");
  const rateRow = d.cols.map(c => `<td>${d.summary[c].rate}%</td>`).join("");

  const distRows = d.bins.map(b => {
    const tds = d.cols.map(c =>
      `<td class="pick" onclick="event.stopPropagation();`
      + `openDrill('${line}','${c}','${b.key}','',${st.max})">`
      + `${nf(d.dist[c][b.key] || 0)}</td>`).join("");
    return `<tr class="pick ${b.key === st.bin ? "on" : ""}"
              onclick="pickWtBin(${i},'${line}','${b.key}')">
              <td>${b.label}</td>${tds}</tr>`;
  }).join("");

  const causeRows = d.causes.map(cz => {
    let any = false;
    const tds = d.cols.map(c => {
      const n = ((d.cause[c] || {})[st.bin] || {})[cz] || 0;
      if (n) any = true;
      const low = d.dist[c][st.bin] || 0;
      const pct = low ? (n / low * 100).toFixed(0) : 0;
      return `<td class="pick" title="${cz} · ${n} LOT · 구간 내 ${pct}%"
                 onclick="openDrill('${line}','${c}','${st.bin}','${cz}',${st.max})">`
             + `${n ? nf(n) : "-"}</td>`;
    }).join("");
    if (cz === "기타/미분류" && !any) return "";      // 0 이면 숨김
    return `<tr><td>${cz}</td>${tds}</tr>`;
  }).join("");

  el.innerHTML = `
    <div class="cellttl"><span>Low WT 분석</span>
      <select onchange="pickWtMax(${i},'${line}',this.value)">${opts}</select></div>
    <table>
      <thead><tr><th></th>${th}</tr></thead>
      <tbody>
        <tr class="big"><td>Low WT Lot</td>${sumRow}</tr>
        <tr class="rate"><td>Low WT율</td>${rateRow}</tr>
      </tbody>
    </table>
    <div class="sec">WT 구간 분포 (행 클릭 → 아래 원인 갱신)</div>
    <table><tbody>${distRows}</tbody></table>
    <div class="sec">원인 · ${d.bins.find(b => b.key === st.bin).label}</div>
    <table><tbody>${causeRows}</tbody></table>`;
}

// ---------------------------------------------------------------------------
// Drill-down: 화면 아래로 구역이 펼쳐지며 lot 상세를 보여준다
// ---------------------------------------------------------------------------
const NUM_COLS = new Set(["qty", "wt", "마지막이벤트경과_일", "스텝도착경과_일"]);

function closeDrill() {
  document.getElementById("drill").style.display = "none";
}

function openDrill(line, col, bin, cause, maxWt) {
  const el = document.getElementById("drill");
  el.style.display = "block";
  el.innerHTML = `<div class="bar"><b>불러오는 중…</b></div>`;
  el.scrollIntoView({ behavior: "smooth", block: "start" });

  const q = `line=${encodeURIComponent(line)}&col=${encodeURIComponent(col)}`
          + `&bin=${encodeURIComponent(bin)}&cause=${encodeURIComponent(cause)}`
          + `&max_wt=${maxWt}`;
  fetch("/api/lots/?" + q).then(r => r.json()).then(d => {
    const binLabel = { "0": "WT = 0", "0-0.5": "0 < WT ≤ 0.5",
                       "0.5-1": "0.5 < WT ≤ 1.0" }[d.bin] || d.bin;
    const head = d.cols.map(c => `<th>${c.t}</th>`).join("");
    const body = d.rows.map(r => "<tr>" + d.cols.map(c =>
      `<td class="${NUM_COLS.has(c.k) ? "num" : ""}">`
      + (r[c.k] === null || r[c.k] === undefined ? "" : r[c.k]) + "</td>").join("")
      + "</tr>").join("");
    el.innerHTML = `
      <div class="bar">
        <div><b>${d.rows.length.toLocaleString("ko-KR")} LOT</b>
          <span class="path">${d.line} · ${d.col} · ${binLabel}
            · ${d.cause} · ${d.biz_date}</span></div>
        <button onclick="closeDrill()">닫기</button>
      </div>
      <div class="scroll"><table><thead><tr>${head}</tr></thead>
        <tbody>${body || `<tr><td colspan="${d.cols.length}"
          style="color:#6B7280">해당 조건의 LOT 이 없습니다.</td></tr>`}</tbody>
      </table></div>`;
  });
}

fetch("/api/status/").then(r => r.json()).then(res => {
  if (window.Chart) drawCards(res);
  res.cards.forEach((c, i) => {
    if (c.ready) { WT_STATE[i] = { max: 0, bin: "0" }; loadWt(i, c.line); }
  });
});

load();
}

// 값 레이블을 점 위에 직접 그린다(별도 플러그인 의존 없이).
function fmtLabel(v, fmt, unit) {
  if (v === null || v === undefined) return "";
  if (fmt === "k") return (v / 1000).toFixed(1) + "k";
  if (fmt === "i") return Math.round(v) + (unit === "%" ? "%" : "");
  return v.toFixed(1);
}

const valueLabels = {
  id: "valueLabels",
  afterDatasetsDraw(c) {
    const ctx = c.ctx;
    ctx.save();
    ctx.font = "10px 'Malgun Gothic', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    c.data.datasets.forEach((ds, di) => {
      if (!c.isDatasetVisible(di)) return;
      const meta = c.getDatasetMeta(di);
      meta.data.forEach((el, i) => {
        const v = ds.data[i];
        if (v === null || v === undefined) return;
        const txt = fmtLabel(v, c.$fmt, c.$unit);
        // 선이 겹칠 때 글자끼리 붙지 않도록 데이터셋마다 살짝 어긋나게
        ctx.fillStyle = ds.borderColor;
        ctx.fillText(txt, el.x, el.y - 5 - (di % 2) * 11);
      });
    });
    ctx.restore();
  }
};

// 단위가 바뀌는 지점에 세로 구분선
const gapLine = {
  id: "gapLine",
  beforeDatasetsDraw(c) {
    const x = c.scales.x, ctx = c.ctx;
    (c.$kinds || []).forEach((k, i) => {
      if (k !== "gap") return;
      const px = x.getPixelForValue(i);
      ctx.save();
      ctx.strokeStyle = "#D1D5DB"; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(px, c.chartArea.top);
      ctx.lineTo(px, c.chartArea.bottom); ctx.stroke(); ctx.restore();
    });
  }
};

function load() {
  fetch("/api/flowstack/?basis=" + basis).then(r => r.json()).then(res => {
    if (!window.Chart) {
      document.getElementById("err").innerHTML =
        "Chart.js 로드 실패. <code>python manage.py collectstatic</code> 또는 "
        + "<code>web/flowmonitor/static/flowmonitor/chart.umd.js</code> 존재 여부 확인.";
      return;
    }
    const pts = res.order.reduce((a, k) => a + res.panels[k].datasets
      .reduce((b, ds) => b + ds.data.filter(v => v !== null).length, 0), 0);
    if (pts === 0) {
      document.getElementById("err").innerHTML =
        "적재는 됐지만 그릴 데이터가 없습니다. 진단: "
        + "<a href='/api/health/' target='_blank'>/api/health/</a>";
    }
    const nb = document.getElementById("notice");
    if (res.notice) { nb.textContent = res.notice; nb.style.display = "block"; }
    else { nb.style.display = "none"; }

    const first = res.panels[res.order[0]];
    document.getElementById("legend").innerHTML = first.datasets.map(
      d => `<span><i style="background:${d.borderColor}"></i>${d.label}</span>`).join("");

    res.order.forEach((key, idx) => {
      const d = res.panels[key];
      const last = idx === res.order.length - 1;   // x축 라벨은 마지막 패널에만

      if (charts[key]) {                            // 토글 시에는 데이터만 교체
        charts[key].data.labels = d.labels;
        charts[key].data.datasets = d.datasets;
        charts[key].$kinds = d.kinds;
        charts[key].$fmt = d.fmt;
        charts[key].$unit = d.unit;
        charts[key].update();
        return;
      }
      const ch = new Chart(document.getElementById("c_" + key), {
        type: "line",
        data: { labels: d.labels, datasets: d.datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          // 선이 아래에서 솟아오르는 기본 애니메이션은 끄고,
          // 컨테이너를 통째로 페이드인 시킨다(제자리에서 부드럽게).
          animation: false,
          animations: { colors: false, x: false, y: false },
          transitions: { active: { animation: { duration: 0 } } },
          interaction: { mode: "index", intersect: false },
          layout: { padding: { top: 20, right: 10, left: 2 } },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                title: (t) => {
                  const i = t[0].dataIndex;
                  const k = KIND_KO[d.kinds[i]] || "";
                  return d.labels[i] + (k ? " (" + k + ")" : "");
                },
                // 커서를 올리면 축약 없이 원래 값 그대로
                label: (t) => `${t.dataset.label}  `
                  + Number(t.parsed.y).toLocaleString("ko-KR",
                      { maximumFractionDigits: 1 }) + ` ${d.unit}`
              }
            }
          },
          scales: {
            x: { grid: { display: false },
                 ticks: { display: last, font: { size: 10 }, autoSkip: false } },
            // grace: 최대값 위로 여유를 둬 값 레이블이 잘리지 않게 한다.
          y: { beginAtZero: true, grace: "18%",
               ticks: { font: { size: 10 } } }
          }
        },
        plugins: [gapLine, valueLabels]
      });
      ch.$kinds = d.kinds;
      ch.$fmt = d.fmt;
      ch.$unit = d.unit;
      charts[key] = ch;
      ch.update();
      // 패널마다 아주 짧게 시차를 둬 위에서 아래로 자연스럽게 나타나게
      const wrap = document.getElementById("c_" + key).parentElement;
      setTimeout(() => wrap.classList.add("ready"), 30 + idx * 45);
    });
  });
}

const nf = (n) => Number(n || 0).toLocaleString("ko-KR");

// 도넛 가운데 텍스트
const donutCenter = {
  id: "donutCenter",
  afterDraw(c) {
    const t = c.$center;
    if (!t) return;
    const { top, bottom, left, right } = c.chartArea;
    const x = (left + right) / 2, y = (top + bottom) / 2;
    const ctx = c.ctx;
    ctx.save();
    ctx.textAlign = "center";
    ctx.fillStyle = t.color || "#111827";
    ctx.font = "600 19px 'Malgun Gothic', sans-serif";
    ctx.fillText(t.big, x, y + 2);
    ctx.fillStyle = "#6B7280";
    ctx.font = "10px 'Malgun Gothic', sans-serif";
    ctx.fillText(t.small, x, y + 17);
    ctx.restore();
  }
};

function cardHtml(c, i) {
  if (!c.ready) {
    return `<div class="card">
      <div class="head" style="background:${c.head}">${c.label}</div>
      <div class="cell" style="height:150px"></div>
      <div class="cell" style="height:120px"></div>
      <div class="cell" style="height:120px"></div>
      <div class="dev">개발중</div></div>`;
  }
  const opts = c.types.map(t => `<option value="${t}">${t}</option>`).join("");
  return `<div class="card">
    <div class="head" style="background:${c.head}">${c.label}</div>
    <div class="cell">
      <div class="wip">
        <div class="nums">
          <div><b id="wl_${i}">-</b><span>재공 LOT</span></div>
          <div><b id="wq_${i}">-</b><span>재공 매</span></div>
        </div>
        <select onchange="pickType(${i}, this.value)">${opts}</select>
      </div>
    </div>
    <div class="cell">
      <div class="donut">
        <div class="cv"><canvas id="dn_${i}"></canvas></div>
        <div class="txt" id="dt_${i}"></div>
      </div>
      <div class="legend" id="lg_${i}"></div>
    </div>
    <div class="cell">
      <div class="cellttl">대기 LOT 상위 설비 5</div>
      <div style="height:118px"><canvas id="eq_${i}"></canvas></div>
    </div>
    <div class="cell">
      <div class="cellttl">Shift 별 MOVE</div>
      <div class="movebox">
        <div class="cv"><canvas id="mv_${i}"></canvas></div>
        <div class="movetot"><b>${nf(c.move.total)}</b><span>당일 MOVE (매)</span></div>
      </div>
    </div>
    <div class="cell wt" id="wt_${i}"></div></div>`;
}

let STATUS_DATA = [];
const CUR_TYPE = {};      // 카드별 선택된 lot_type
const CUR_SEL = {};       // 카드별 선택된 status index

function curPack(i) {
  return STATUS_DATA[i].by_type[CUR_TYPE[i]];
}

function setCenter(i) {
  const p = curPack(i), sel = CUR_SEL[i], ch = window["dn" + i];
  const d = (sel === null || sel === undefined)
    ? { label: p.default.label, pct: p.default.pct, lots: p.default.lots,
        qty: p.default.qty, color: "#111827" }
    : { label: p.status[sel].name, pct: p.status[sel].pct,
        lots: p.status[sel].lots, qty: p.status[sel].qty,
        color: p.status[sel].color };
  ch.$center = { big: d.pct.toFixed(1) + "%", small: d.label, color: d.color };
  ch.draw();
  document.getElementById("dt_" + i).innerHTML =
    `<b>${nf(d.lots)} LOT</b>${nf(d.qty)} 매`;
}

function renderCard(i) {
  const p = curPack(i);
  document.getElementById("wl_" + i).textContent = nf(p.total.lots);
  document.getElementById("wq_" + i).textContent = nf(p.total.qty);
  document.getElementById("lg_" + i).innerHTML = p.status.map((st, si) =>
    `<span onclick="pickStatus(${i},${si})"><i style="background:${st.color}"></i>`
    + `${st.name} ${st.pct}%</span>`).join("");

  const dn = window["dn" + i];
  dn.data.datasets[0].data = p.status.map(s => s.lots);
  dn.$status = p.status;
  dn.update();
  setCenter(i);

  const eq = window["eq" + i];
  eq.data.labels = p.top_eqp.map(e => e.name);
  eq.data.datasets[0].data = p.top_eqp.map(e => e.lots);
  eq.$qty = p.top_eqp.map(e => e.qty);
  eq.update();
}

function pickType(i, t) {
  CUR_TYPE[i] = t;
  CUR_SEL[i] = null;
  renderCard(i);
}

function pickStatus(i, si) {
  CUR_SEL[i] = (CUR_SEL[i] === si) ? null : si;   // 다시 누르면 기본값
  setCenter(i);
}

// 조각 위에 상태 비율을 직접 표기
const donutSliceLabels = {
  id: "donutSliceLabels",
  afterDatasetsDraw(c) {
    const st = c.$status || [];
    const ctx = c.ctx;
    ctx.save();
    ctx.font = "600 10px 'Malgun Gothic', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    c.getDatasetMeta(0).data.forEach((arc, k) => {
      const v = st[k];
      if (!v || v.pct < 6) return;            // 너무 얇으면 생략
      const a = (arc.startAngle + arc.endAngle) / 2;
      const r = (arc.innerRadius + arc.outerRadius) / 2;
      ctx.fillStyle = "#fff";
      ctx.fillText(v.pct + "%",
                   arc.x + Math.cos(a) * r, arc.y + Math.sin(a) * r);
    });
    ctx.restore();
  }
};

function drawCards(res) {
  document.getElementById("status").innerHTML =
    res.cards.map((c, i) => cardHtml(c, i)).join("");
  STATUS_DATA = res.cards;

  res.cards.forEach((c, i) => {
    if (!c.ready) return;

    const p0 = c.by_type[c.types[0]];
    CUR_TYPE[i] = c.types[0];
    CUR_SEL[i] = null;

    window["dn" + i] = new Chart(document.getElementById("dn_" + i), {
      type: "doughnut",
      data: { labels: p0.status.map(s => s.name),
              datasets: [{ data: p0.status.map(s => s.lots),
                           backgroundColor: p0.status.map(s => s.color),
                           borderWidth: 0 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: "68%",
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (t) => {
            const st = (t.chart.$status || p0.status)[t.dataIndex];
            return `${st.name}  ${st.pct}% · ${nf(st.lots)} LOT · ${nf(st.qty)} 매`;
          } } }
        },
        onClick: (e, els) => { if (els.length) pickStatus(i, els[0].index); }
      },
      plugins: [donutCenter, donutSliceLabels]
    });

    window["eq" + i] = new Chart(document.getElementById("eq_" + i), {
      type: "bar",
      data: { labels: p0.top_eqp.map(e => e.name),
              datasets: [{ data: p0.top_eqp.map(e => e.lots),
                           backgroundColor: c.head, borderRadius: 2 }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        layout: { padding: { top: 16 } },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: (t) =>
                     `${t.parsed.y} LOT · ${nf((t.chart.$qty || [])[t.dataIndex])} 매` } } },
        scales: { x: { grid: { display: false }, ticks: { font: { size: 9 } } },
                  y: { display: false, beginAtZero: true, grace: "20%" } }
      },
      plugins: [{ id: "barLbl", afterDatasetsDraw(ch) {
        const ctx = ch.ctx; ctx.save();
        ctx.font = "10px 'Malgun Gothic'"; ctx.textAlign = "center";
        ch.getDatasetMeta(0).data.forEach((el, k) => {
          ctx.fillStyle = "#374151";
          ctx.fillText(ch.data.datasets[0].data[k], el.x, el.y - 4);
        });
        ctx.restore();
      } }]
    });
    window["eq" + i].$qty = p0.top_eqp.map(e => e.qty);

    new Chart(document.getElementById("mv_" + i), {
      type: "bar",
      data: { labels: ["GY", "DAY", "SW"],
              datasets: [{ data: [c.move.GY, c.move.DAY, c.move.SW],
                           backgroundColor: c.head, borderRadius: 2 }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        layout: { padding: { top: 16 } },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: (t) => nf(t.parsed.y) + " 매" } } },
        scales: { x: { grid: { display: false }, ticks: { font: { size: 10 } } },
                  y: { display: false, beginAtZero: true, grace: "20%" } }
      },
      plugins: [{ id: "mvLbl", afterDatasetsDraw(ch) {
        const ctx = ch.ctx; ctx.save();
        ctx.font = "10px 'Malgun Gothic'"; ctx.textAlign = "center";
        ch.getDatasetMeta(0).data.forEach((el, k) => {
          const v = ch.data.datasets[0].data[k];
          ctx.fillStyle = "#374151";
          ctx.fillText((v / 1000).toFixed(1) + "k", el.x, el.y - 4);
        });
        ctx.restore();
      } }]
    });

    renderCard(i);
  });
}

// ---------------------------------------------------------------------------
// Low WT 분석
// ---------------------------------------------------------------------------
const WT_OPTS = [
  { v: 0,   t: "WT = 0" },
  { v: 0.5, t: "WT ≤ 0.5" },
  { v: 1.0, t: "WT ≤ 1.0" },
];
const WT_STATE = {};      // 카드별 {max, bin}

function loadWt(i, line) {
  const st = WT_STATE[i] || (WT_STATE[i] = { max: 0, bin: "0" });
  fetch(`/api/lowwt/?line=${encodeURIComponent(line)}&max_wt=${st.max}`)
    .then(r => r.json()).then(d => drawWt(i, line, d));
}

function pickWtMax(i, line, v) {
  WT_STATE[i].max = parseFloat(v);
  WT_STATE[i].bin = "0";                 // 기준 변경 시 가장 심각한 구간부터
  loadWt(i, line);
}

function pickWtBin(i, line, key) {
  WT_STATE[i].bin = key;
  loadWt(i, line);
}

function drawWt(i, line, d) {
  const el = document.getElementById("wt_" + i);
  if (!el) return;
  if (!d.ready) {
    el.innerHTML = `<div class="cellttl">Low WT 분석</div>
      <div class="sec">${d.reason || "데이터 없음"}</div>`;
    return;
  }
  const st = WT_STATE[i];
  if (!d.dist["전체"][st.bin]) {
    const keys = d.bins.map(b => b.key);
    if (!keys.includes(st.bin)) st.bin = keys[0];
  }
  const opts = WT_OPTS.map(o =>
    `<option value="${o.v}" ${o.v === st.max ? "selected" : ""}>${o.t}</option>`).join("");
  const th = d.cols.map(c => `<th>${c}</th>`).join("");

  const sumRow = d.cols.map(c => `<td>${nf(d.summary[c].low)}</td>`).join("");
  const rateRow = d.cols.map(c => `<td>${d.summary[c].rate}%</td>`).join("");

  const distRows = d.bins.map(b => {
    const tds = d.cols.map(c =>
      `<td class="pick" onclick="event.stopPropagation();`
      + `openDrill('${line}','${c}','${b.key}','',${st.max})">`
      + `${nf(d.dist[c][b.key] || 0)}</td>`).join("");
    return `<tr class="pick ${b.key === st.bin ? "on" : ""}"
              onclick="pickWtBin(${i},'${line}','${b.key}')">
              <td>${b.label}</td>${tds}</tr>`;
  }).join("");

  const causeRows = d.causes.map(cz => {
    let any = false;
    const tds = d.cols.map(c => {
      const n = ((d.cause[c] || {})[st.bin] || {})[cz] || 0;
      if (n) any = true;
      const low = d.dist[c][st.bin] || 0;
      const pct = low ? (n / low * 100).toFixed(0) : 0;
      return `<td class="pick" title="${cz} · ${n} LOT · 구간 내 ${pct}%"
                 onclick="openDrill('${line}','${c}','${st.bin}','${cz}',${st.max})">`
             + `${n ? nf(n) : "-"}</td>`;
    }).join("");
    if (cz === "기타/미분류" && !any) return "";      // 0 이면 숨김
    return `<tr><td>${cz}</td>${tds}</tr>`;
  }).join("");

  el.innerHTML = `
    <div class="cellttl"><span>Low WT 분석</span>
      <select onchange="pickWtMax(${i},'${line}',this.value)">${opts}</select></div>
    <table>
      <thead><tr><th></th>${th}</tr></thead>
      <tbody>
        <tr class="big"><td>Low WT Lot</td>${sumRow}</tr>
        <tr class="rate"><td>Low WT율</td>${rateRow}</tr>
      </tbody>
    </table>
    <div class="sec">WT 구간 분포 (행 클릭 → 아래 원인 갱신)</div>
    <table><tbody>${distRows}</tbody></table>
    <div class="sec">원인 · ${d.bins.find(b => b.key === st.bin).label}</div>
    <table><tbody>${causeRows}</tbody></table>`;
}

// ---------------------------------------------------------------------------
// Drill-down: 화면 아래로 구역이 펼쳐지며 lot 상세를 보여준다
// ---------------------------------------------------------------------------
const NUM_COLS = new Set(["qty", "wt", "마지막이벤트경과_일", "스텝도착경과_일"]);

function closeDrill() {
  document.getElementById("drill").style.display = "none";
}

function openDrill(line, col, bin, cause, maxWt) {
  const el = document.getElementById("drill");
  el.style.display = "block";
  el.innerHTML = `<div class="bar"><b>불러오는 중…</b></div>`;
  el.scrollIntoView({ behavior: "smooth", block: "start" });

  const q = `line=${encodeURIComponent(line)}&col=${encodeURIComponent(col)}`
          + `&bin=${encodeURIComponent(bin)}&cause=${encodeURIComponent(cause)}`
          + `&max_wt=${maxWt}`;
  fetch("/api/lots/?" + q).then(r => r.json()).then(d => {
    const binLabel = { "0": "WT = 0", "0-0.5": "0 < WT ≤ 0.5",
                       "0.5-1": "0.5 < WT ≤ 1.0" }[d.bin] || d.bin;
    const head = d.cols.map(c => `<th>${c.t}</th>`).join("");
    const body = d.rows.map(r => "<tr>" + d.cols.map(c =>
      `<td class="${NUM_COLS.has(c.k) ? "num" : ""}">`
      + (r[c.k] === null || r[c.k] === undefined ? "" : r[c.k]) + "</td>").join("")
      + "</tr>").join("");
    el.innerHTML = `
      <div class="bar">
        <div><b>${d.rows.length.toLocaleString("ko-KR")} LOT</b>
          <span class="path">${d.line} · ${d.col} · ${binLabel}
            · ${d.cause} · ${d.biz_date}</span></div>
        <button onclick="closeDrill()">닫기</button>
      </div>
      <div class="scroll"><table><thead><tr>${head}</tr></thead>
        <tbody>${body || `<tr><td colspan="${d.cols.length}"
          style="color:#6B7280">해당 조건의 LOT 이 없습니다.</td></tr>`}</tbody>
      </table></div>`;
  });
}

fetch("/api/status/").then(r => r.json()).then(res => {
  if (window.Chart) drawCards(res);
  res.cards.forEach((c, i) => {
    if (c.ready) { WT_STATE[i] = { max: 0, bin: "0" }; loadWt(i, c.line); }
  });
});

load();
</script>
</body>
</html>
