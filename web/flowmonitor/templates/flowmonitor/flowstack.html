{% load static %}<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Multi Line Fab Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Sans+KR:wght@500;600;700&family=Poppins:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bd:#E5E7EB; --fg:#111827; --mut:#6B7280;
    --brand:#2F4B7C; --brand-on:#4C7DD1; --accent:#6A5ACD;
    /* 라틴 폰트를 먼저 두면 영문에만 적용되고 한글은 뒤 폰트로 넘어간다 */
    --f-body:"Poppins","Noto Sans KR","Malgun Gothic",sans-serif;
    --f-title:"Plus Jakarta Sans","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  }
  html { scroll-behavior:smooth; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--f-body); color:var(--fg); font-size:14px; }
  h1, h2, .brand, .card .head, .cellttl, .lbl { font-family:var(--f-title); }

  header { border-bottom:1px solid var(--bd); padding:0 18px; display:flex;
           align-items:center; height:52px; gap:26px; }
  header .brand { font-weight:700; letter-spacing:-.02em; }
  header nav a { color:var(--mut); text-decoration:none; margin-right:18px;
                 font-size:14px; padding:6px 0; }
  header nav a.on { color:var(--fg); border-bottom:2px solid var(--fg); }
  header .meta { margin-left:auto; font-size:12px; color:var(--mut);
                 white-space:nowrap; }
  header .meta b { color:var(--fg); font-weight:600; }

  /* 상단 현황 */
  .status { display:grid; grid-template-columns:repeat(4,1fr);
            border-bottom:1px solid var(--bd); }
  .card { border-right:1px solid var(--bd); position:relative; }
  .card:last-child { border-right:0; }
  .card .head { color:#fff; text-align:center; font-weight:700; padding:9px 0;
                font-size:16px; cursor:pointer; background:var(--brand);
                transition:background .15s; }
  .card.on .head { background:var(--brand-on); }
  .card.on { box-shadow:inset 0 0 0 2px var(--brand-on); }
  .card .cell { border-top:1px solid var(--bd); padding:11px 12px; }
  .cellttl { font-size:14px; font-weight:700; color:var(--accent);
             margin-bottom:9px; display:flex; justify-content:space-between;
             align-items:center; gap:6px; }
  .lbl { font-size:13px; font-weight:700; color:var(--fg); }

  /* 재공 */
  .wip .top { display:flex; align-items:flex-end; justify-content:space-between;
              gap:8px; margin-bottom:8px; }
  .wip .nums { display:flex; gap:20px; }
  .wip b { display:block; font-size:23px; line-height:1.1; font-weight:600; }
  .wip .stack { display:flex; height:10px; border-radius:5px; overflow:hidden;
                background:#F3F4F6; }
  .wip .stack i { display:block; height:100%; }
  .wip .stleg { display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:5px; }
  .wip .stleg span { font-size:11px; color:var(--mut);
                     display:inline-flex; align-items:center; gap:4px; }
  .wip .stleg i { width:8px; height:8px; border-radius:2px; }

  /* 체크박스 드롭다운 */
  .dd { position:relative; }
  .dd > button { font-size:11px; padding:4px 8px; border:1px solid var(--bd);
                 border-radius:4px; background:#fff; cursor:pointer; }
  .dd .menu { display:none; position:absolute; right:0; top:26px; z-index:20;
              background:#fff; border:1px solid var(--bd); border-radius:5px;
              box-shadow:0 4px 14px rgba(0,0,0,.10); padding:6px; min-width:118px; }
  .dd.open .menu { display:block; }
  .dd .menu label { display:flex; align-items:center; gap:6px; font-size:12px;
                    padding:3px 4px; cursor:pointer; white-space:nowrap; }
  .dd .menu label:hover { background:#F3F4F6; border-radius:3px; }

  /* 상태 원차트 */
  .donut { display:flex; align-items:center; gap:10px; }
  .donut .cv { width:112px; height:112px; flex:0 0 112px; }
  .legend { display:flex; flex-direction:column; gap:6px; flex:0 0 auto; }
  .legend span { font-size:12px; color:var(--mut); cursor:pointer;
                 display:flex; align-items:center; gap:5px; white-space:nowrap; }
  .legend span.on { color:var(--fg); font-weight:700; }
  .legend i { width:9px; height:9px; border-radius:2px; flex:0 0 9px; }
  .pickinfo { flex:1; text-align:center; }
  .pickinfo .nm { font-family:var(--f-title); font-weight:700; font-size:15px;
                  line-height:1.2; margin-bottom:4px; }
  .pickinfo .pc { font-size:26px; font-weight:600; line-height:1.1; }
  .pickinfo .sub { font-size:12px; color:var(--mut); margin-top:3px; }

  /* 토글 */
  .seg { display:inline-flex; border:1px solid var(--bd); border-radius:5px;
         overflow:hidden; }
  .seg button { border:0; background:#fff; color:var(--mut); font-size:11px;
                padding:3px 9px; cursor:pointer; }
  .seg button.on { background:var(--brand); color:#fff; }

  /* Shift MOVE (세로 배치, 맨 위가 당일 계) */
  .mv .row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .mv .row .k { width:34px; font-size:12px; color:var(--mut); flex:0 0 34px; }
  .mv .row .bar { flex:1; height:16px; background:#F3F4F6; border-radius:3px;
                  overflow:hidden; }
  .mv .row .bar i { display:block; height:100%; background:var(--brand); }
  .mv .row .v { width:60px; text-align:right; font-size:12px;
                font-variant-numeric:tabular-nums; }
  .mv .tot .k, .mv .tot .v { color:var(--accent); font-weight:700; }
  .mv .tot .bar i { background:var(--accent); }
  .mv .tot .v { font-size:15px; }

  /* Low WT */
  .wt table { width:100%; border-collapse:collapse; font-size:11px; }
  .wt th, .wt td { padding:3px 4px; text-align:right; white-space:nowrap; }
  .wt th:first-child, .wt td:first-child { text-align:left; color:var(--mut); }
  .wt thead th { color:var(--mut); font-weight:600; border-bottom:1px solid var(--bd); }
  .wt .big td { font-size:13px; font-weight:600; }
  .wt .rate td { color:var(--mut); border-bottom:1px solid var(--bd); }
  .wt .sec { color:var(--mut); padding-top:7px; font-size:10px; }
  .wt tr.pick { cursor:pointer; }
  .wt tr.on > td:first-child { font-weight:700; color:var(--fg); }
  .wt td.cell-pick { cursor:pointer; border-radius:3px; }
  .wt td.cell-pick:hover { background:var(--brand); color:#fff; }
  .wt td.none { color:#C4C7CE; }
  .wt select, .wt input { font-size:11px; padding:2px 4px;
                          border:1px solid var(--bd); border-radius:4px; }

  /* 개발중 */
  .dev { position:absolute; inset:40px 0 0 0; background:rgba(255,255,255,.72);
         backdrop-filter:blur(2px); display:flex; align-items:center;
         justify-content:center; font-family:var(--f-title); font-size:15px;
         color:var(--brand); font-weight:700; letter-spacing:.04em; }
  .ghost .cell { opacity:.5; }
  .ghost .gcircle { width:112px; height:112px; border-radius:50%; margin:0 auto;
                    background:conic-gradient(#2F4B7C 0 42%, #4C7DD1 0 68%,
                               #7FB3E8 0 86%, #B9D4F2 0 100%); }
  .ghost .gbars { display:flex; align-items:flex-end; gap:8px; height:84px; }
  .ghost .gbars i { flex:1; background:var(--brand); border-radius:2px 2px 0 0; }
  .ghost .glines i { display:block; height:9px; margin-bottom:7px;
                     background:var(--brand); border-radius:3px; opacity:.75; }

  /* 본문 */
  main { display:flex; gap:16px; padding:16px; align-items:flex-start; }
  .left { flex:0 0 32%; min-width:400px; }
  .detail { flex:1; border:1px solid var(--bd); border-radius:6px; padding:0;
            overflow:hidden; scroll-margin-top:16px; }
  .detail .empty { padding:22px 16px; color:var(--mut); font-size:13px; }
  .panel { border:1px solid var(--bd); border-radius:6px; padding:10px 12px 6px;
           margin-bottom:10px; }
  .panel h2 { margin:0; font-size:14px; display:flex;
              justify-content:space-between; align-items:baseline;
              color:var(--accent); }
  .panel h2 .unit { color:var(--mut); font-size:11px; font-weight:400; }
  .wrap { position:relative; opacity:0; transition:opacity .28s ease-out; }
  .wrap.ready { opacity:1; }
  .topbar { display:flex; justify-content:space-between; align-items:center;
            margin:0 0 8px 2px; }
  #legend2 { display:flex; gap:14px; font-size:12px; }
  #legend2 span { display:inline-flex; align-items:center; gap:5px; }
  #legend2 i { width:14px; height:3px; border-radius:2px; }
  .notice { background:#FFFBEB; border:1px solid #FDE68A; color:#92400E;
            border-radius:5px; padding:8px 10px; font-size:12px; margin-bottom:10px; }
  .err { color:#B91C1C; font-size:13px; padding:8px 2px; }
  .err code { background:#FEF2F2; padding:1px 4px; border-radius:3px; }

  /* 드릴다운 */
  .bar { display:flex; align-items:center; justify-content:space-between;
         padding:9px 12px; border-bottom:1px solid var(--bd); background:#F9FAFB; }
  .bar b { font-size:13px; }
  .bar .path { color:var(--mut); font-size:12px; margin-left:8px; }
  .bar button { border:1px solid var(--bd); background:#fff; border-radius:4px;
                font-size:12px; padding:4px 10px; cursor:pointer; }
  .scroll { max-height:560px; overflow:auto; }
  .scroll table { border-collapse:collapse; font-size:11px; width:100%; }
  .scroll th, .scroll td { padding:4px 7px; border-bottom:1px solid var(--bd);
                           white-space:nowrap; text-align:left; }
  .scroll thead th { position:sticky; top:0; background:#F3F4F6; color:var(--mut);
                     font-weight:600; z-index:1; }
  .scroll td.num { text-align:right; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<header>
  <div class="brand">Multi Line Fab Monitor</div>
  <nav>
    {% for name, url in menu %}
      <a href="{{ url }}" {% if forloop.first %}class="on"{% endif %}>{{ name }}</a>
    {% endfor %}
  </nav>
  <div class="meta">문의: <b>minuk12.choi</b> / 적재시각: <b id="snapAt">-</b></div>
</header>

<section class="status" id="status"></section>

<main>
  <div class="left">
    <div id="notice" class="notice" style="display:none"></div>
    <div class="topbar">
      <div id="legend2"></div>
      <div class="seg" title="HOLD율 / WAIT성 진행불가율의 분모">
        <button id="b_qty" class="on" onclick="setBasis('qty')">매수</button>
        <button id="b_lot" onclick="setBasis('lot')">Lot수</button>
      </div>
    </div>
    {% for p in panels %}
    <div class="panel">
      <h2>{{ p.title }}<span class="unit">{{ p.unit }}</span></h2>
      <div class="wrap" style="height:{{ p.px }}px">
        <canvas id="c_{{ p.key }}"></canvas>
      </div>
    </div>
    {% endfor %}
    <div id="err" class="err"></div>
  </div>

  <div class="detail" id="drill">
    <div class="empty">현황 카드의 <b>Low WT</b> 숫자나 좌측 추이 차트의
      <b>일별 지점</b>을 클릭하면 해당 LOT 상세가 여기에 표시됩니다.</div>
  </div>
</main>

<script src="{% static 'flowmonitor/chart.umd.js' %}"></script>
<script>
if (window.Chart) {
  Chart.defaults.font.family = "'Poppins','Noto Sans KR','Malgun Gothic',sans-serif";
  Chart.defaults.font.size = 11;
  Chart.defaults.color = "#374151";
}

const BRAND = "#2F4B7C";
const TYPE_COLORS = ["#2F4B7C", "#4C7DD1", "#7FB3E8", "#B9D4F2", "#D8E5F5"];
const KIND_KO = { month: "월평균", week: "주평균", day: "일" };
const nf = (n) => Number(n || 0).toLocaleString("ko-KR");

/* 화면 하단으로 부드럽게 이동. 위치 계산 후 window.scrollTo 로 제어한다
   (sticky/overflow 컨테이너에서 scrollIntoView 가 순간이동처럼 보이는 것 방지) */
function smoothTo(el) {
  const y = el.getBoundingClientRect().top + window.pageYOffset - 12;
  window.scrollTo({ top: y, behavior: "smooth" });
}

/* ===========================================================================
   상단 현황 카드
   =========================================================================== */
let CARDS = [];
const SEL_STATUS = {};
const EQP_UNIT = {};

function ghostCard(c) {
  return `<div class="card ghost">
    <div class="head">${c.label}</div>
    <div class="cell"><div class="wip">
      <div class="top"><div class="nums">
        <div><b>3,412</b><div class="lbl">재공 LOT</div></div>
        <div><b>84,300</b><div class="lbl">재공 매</div></div>
      </div></div>
      <div class="stack"><i style="width:52%;background:#2F4B7C"></i>
        <i style="width:31%;background:#4C7DD1"></i>
        <i style="width:17%;background:#7FB3E8"></i></div>
    </div></div>
    <div class="cell"><div class="gcircle"></div></div>
    <div class="cell"><div class="cellttl">대기 LOT 상위 설비 5</div>
      <div class="gbars">${[62, 48, 37, 29, 21].map(h =>
        `<i style="height:${h}%"></i>`).join("")}</div></div>
    <div class="cell"><div class="cellttl">Shift 별 MOVE</div>
      <div class="glines">${[92, 70, 55, 40].map(w =>
        `<i style="width:${w}%"></i>`).join("")}</div></div>
    <div class="cell"><div class="cellttl">Low WT 분석</div>
      <div class="glines">${[90, 70, 55].map(w =>
        `<i style="width:${w}%"></i>`).join("")}</div></div>
    <div class="dev">개발중</div></div>`;
}

function cardHtml(c, i) {
  if (!c.ready) return ghostCard(c);
  const dft = c.default_types || [];
  const boxes = c.types.map(t =>
    `<label><input type="checkbox" value="${t}" ${dft.includes(t) ? "checked" : ""}`
    + ` onchange="onTypeCheck(${i})">${t}</label>`).join("");
  return `<div class="card" id="cd_${i}">
    <div class="head" onclick="pickCard(${i})">${c.label}</div>

    <div class="cell"><div class="wip">
      <div class="top">
        <div class="nums">
          <div><b id="wl_${i}">-</b><div class="lbl">재공 LOT</div></div>
          <div><b id="wq_${i}">-</b><div class="lbl">재공 매</div></div>
        </div>
        <div class="dd" id="dd_${i}">
          <button onclick="toggleDd(${i})" id="ddb_${i}">전체 &#9662;</button>
          <div class="menu">${boxes}</div>
        </div>
      </div>
      <div class="stack" id="ws_${i}"></div>
      <div class="stleg" id="wg_${i}"></div>
    </div></div>

    <div class="cell"><div class="donut">
      <div class="legend" id="lg_${i}"></div>
      <div class="cv"><canvas id="dn_${i}"></canvas></div>
      <div class="pickinfo" id="dt_${i}"></div>
    </div></div>

    <div class="cell">
      <div class="cellttl"><span>대기 LOT 상위 설비 5</span>
        <span class="seg">
          <button class="on" id="eul_${i}" onclick="setEqpUnit(${i},'lots')">LOT</button>
          <button id="euq_${i}" onclick="setEqpUnit(${i},'qty')">매</button>
        </span></div>
      <div style="height:112px"><canvas id="eq_${i}"></canvas></div>
    </div>

    <div class="cell">
      <div class="cellttl">Shift 별 MOVE</div>
      <div class="mv" id="mv_${i}"></div>
    </div>

    <div class="cell wt" id="wt_${i}"></div>
  </div>`;
}

function pickCard(i) {
  document.querySelectorAll(".card").forEach(el => el.classList.remove("on"));
  const el = document.getElementById("cd_" + i);
  if (el) el.classList.add("on");
}

function toggleDd(i) {
  const el = document.getElementById("dd_" + i);
  const open = el.classList.contains("open");
  document.querySelectorAll(".dd").forEach(x => x.classList.remove("open"));
  if (!open) el.classList.add("open");
}
document.addEventListener("click", e => {
  if (!e.target.closest(".dd")) {
    document.querySelectorAll(".dd").forEach(x => x.classList.remove("open"));
  }
});

function selectedTypes(i) {
  return [...document.querySelectorAll("#dd_" + i + " input:checked")].map(x => x.value);
}

function onTypeCheck(i) {
  const t = selectedTypes(i);
  document.getElementById("ddb_" + i).innerHTML =
    (t.length ? (t.length <= 2 ? t.join(",") : t.length + "개 선택") : "전체")
    + " &#9662;";
  reloadCard(i);
}

function setEqpUnit(i, u) {
  EQP_UNIT[i] = u;
  document.getElementById("eul_" + i).className = (u === "lots") ? "on" : "";
  document.getElementById("euq_" + i).className = (u === "qty") ? "on" : "";
  renderCard(i);
}

function setStatusInfo(i) {
  const p = CARDS[i].sel, sel = SEL_STATUS[i];
  const d = (sel === null || sel === undefined)
    ? { label: p.default.label, pct: p.default.pct, lots: p.default.lots,
        qty: p.default.qty, color: BRAND }
    : { label: p.status[sel].name, pct: p.status[sel].pct,
        lots: p.status[sel].lots, qty: p.status[sel].qty, color: p.status[sel].color };
  document.getElementById("dt_" + i).innerHTML =
    `<div class="nm" style="color:${d.color}">${d.label}</div>
     <div class="pc">${d.pct.toFixed(1)}%</div>
     <div class="sub">${nf(d.lots)} LOT &middot; ${nf(d.qty)} 매</div>`;
  document.querySelectorAll("#lg_" + i + " span").forEach((el, k) => {
    el.classList.toggle("on",
      k === (sel === null || sel === undefined ? 0 : sel + 1));
  });
}

function pickStatus(i, si) {
  SEL_STATUS[i] = (SEL_STATUS[i] === si) ? null : si;
  setStatusInfo(i);
}
function pickDefault(i) { SEL_STATUS[i] = null; setStatusInfo(i); }

/* 값이 클수록 진하게. 1위가 가장 진한 남색. */
function shade(v, max) {
  const a = 0.25 + 0.75 * (max ? v / max : 0);
  return "rgba(47,75,124," + a.toFixed(2) + ")";
}

function renderCard(i) {
  const c = CARDS[i], p = c.sel;

  document.getElementById("wl_" + i).textContent = nf(p.total.lots);
  document.getElementById("wq_" + i).textContent = nf(p.total.qty);

  const tot = c.by_lot_type.reduce((a, x) => a + x.lots, 0) || 1;
  document.getElementById("ws_" + i).innerHTML = c.by_lot_type.map((x, k) =>
    `<i style="width:${x.lots / tot * 100}%;background:${TYPE_COLORS[k % 5]}"
        title="${x.name} ${nf(x.lots)} LOT / ${nf(x.qty)} 매"></i>`).join("");
  document.getElementById("wg_" + i).innerHTML = c.by_lot_type.map((x, k) =>
    `<span><i style="background:${TYPE_COLORS[k % 5]}"></i>${x.name}
       ${(x.lots / tot * 100).toFixed(0)}%</span>`).join("");

  document.getElementById("lg_" + i).innerHTML =
    `<span onclick="pickDefault(${i})"><i style="background:${BRAND}"></i>`
    + `${p.default.label}</span>`
    + p.status.map((st, si) =>
        `<span onclick="pickStatus(${i},${si})"><i style="background:${st.color}"></i>`
        + `${st.name}</span>`).join("");

  const dn = window["dn" + i];
  dn.data.datasets[0].data = p.status.map(s => s.lots);
  dn.data.datasets[0].backgroundColor = p.status.map(s => s.color);
  dn.$status = p.status;
  dn.update();
  setStatusInfo(i);

  const unit = EQP_UNIT[i] || "lots";
  const vals = p.top_eqp.map(e => unit === "lots" ? e.lots : e.qty);
  const mx = Math.max.apply(null, vals.concat([0]));
  const eq = window["eq" + i];
  eq.data.labels = p.top_eqp.map(e => e.name);
  eq.data.datasets[0].data = vals;
  eq.data.datasets[0].backgroundColor = vals.map(v => shade(v, mx));
  eq.$alt = p.top_eqp.map(e => unit === "lots" ? e.qty : e.lots);
  eq.$unit = unit;
  eq.update();

  const m = c.move, mmax = Math.max(m.total, 1);
  const row = (k, v, cls) =>
    `<div class="row ${cls || ""}"><div class="k">${k}</div>
       <div class="bar"><i style="width:${Math.min(v / mmax * 100, 100)}%"></i></div>
       <div class="v">${nf(v)}</div></div>`;
  document.getElementById("mv_" + i).innerHTML =
    row("계", m.total, "tot") + row("GY", m.GY) + row("DAY", m.DAY) + row("SW", m.SW);
}

function reloadCard(i) {
  const c = CARDS[i];
  fetch("/api/status/?line=" + encodeURIComponent(c.line)
        + "&types=" + encodeURIComponent(selectedTypes(i).join(",")))
    .then(r => r.json()).then(res => {
      const nc = res.cards[0];
      if (!nc || !nc.ready) return;
      CARDS[i] = Object.assign({}, CARDS[i], nc);
      SEL_STATUS[i] = null;
      renderCard(i);
    });
}

const sliceLabels = {
  id: "sliceLabels",
  afterDatasetsDraw(ch) {
    const st = ch.$status || [];
    const ctx = ch.ctx;
    ctx.save();
    ctx.font = "600 10px 'Poppins','Noto Sans KR',sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ch.getDatasetMeta(0).data.forEach((arc, k) => {
      const v = st[k];
      if (!v || v.pct < 6) return;
      const a = (arc.startAngle + arc.endAngle) / 2;
      const r = arc.outerRadius * 0.62;
      ctx.fillStyle = "#fff";
      ctx.fillText(v.pct + "%", arc.x + Math.cos(a) * r, arc.y + Math.sin(a) * r);
    });
    ctx.restore();
  }
};

const barLabels = {
  id: "barLabels",
  afterDatasetsDraw(ch) {
    const ctx = ch.ctx;
    ctx.save();
    ctx.font = "10px 'Poppins','Noto Sans KR',sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "#374151";
    ch.getDatasetMeta(0).data.forEach((el, k) => {
      ctx.fillText(nf(ch.data.datasets[0].data[k]), el.x, el.y - 4);
    });
    ctx.restore();
  }
};

function drawCards(res) {
  CARDS = res.cards;
  document.getElementById("status").innerHTML =
    res.cards.map((c, i) => cardHtml(c, i)).join("");
  document.getElementById("snapAt").textContent = res.snapshot_at || "-";

  res.cards.forEach((c, i) => {
    if (!c.ready) return;
    SEL_STATUS[i] = null;
    EQP_UNIT[i] = "lots";

    const dft = c.default_types || [];
    document.getElementById("ddb_" + i).innerHTML =
      (dft.length ? dft.join(",") : "전체") + " &#9662;";

    const p0 = c.sel;
    window["dn" + i] = new Chart(document.getElementById("dn_" + i), {
      type: "doughnut",
      data: { labels: p0.status.map(s => s.name),
              datasets: [{ data: p0.status.map(s => s.lots),
                           backgroundColor: p0.status.map(s => s.color),
                           borderWidth: 0 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: 0, animation: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (t) => {
            const st = (t.chart.$status || p0.status)[t.dataIndex];
            return st.name + "  " + st.pct + "% / " + nf(st.lots) + " LOT / "
                   + nf(st.qty) + " 매";
          } } }
        },
        onClick: (e, els) => { if (els.length) pickStatus(i, els[0].index); }
      },
      plugins: [sliceLabels]
    });

    window["eq" + i] = new Chart(document.getElementById("eq_" + i), {
      type: "bar",
      data: { labels: p0.top_eqp.map(e => e.name),
              datasets: [{ data: p0.top_eqp.map(e => e.lots), borderRadius: 2 }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        layout: { padding: { top: 16 } },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: (t) => {
                     const u = t.chart.$unit === "lots" ? "LOT" : "매";
                     const o = t.chart.$unit === "lots" ? "매" : "LOT";
                     return nf(t.parsed.y) + " " + u + " / "
                            + nf((t.chart.$alt || [])[t.dataIndex]) + " " + o;
                   } } } },
        scales: { x: { grid: { display: false }, ticks: { font: { size: 9 } } },
                  y: { display: false, beginAtZero: true, grace: "20%" } }
      },
      plugins: [barLabels]
    });

    renderCard(i);
    loadWt(i, c.line);
  });
}

/* ===========================================================================
   Low WT 분석
   =========================================================================== */
const WT_OPTS = [
  { v: 0, t: "WT = 0" }, { v: 0.5, t: "WT <= 0.5" }, { v: 1.0, t: "WT <= 1.0" }
];
const WT_STATE = {};
const WT_LABELS = {};

function loadWt(i, line) {
  const st = WT_STATE[i] || (WT_STATE[i] = { max: 0, bin: "0" });
  fetch("/api/lowwt/?line=" + encodeURIComponent(line) + "&max_wt=" + st.max)
    .then(r => r.json()).then(d => drawWt(i, line, d));
}

function pickWtMax(i, line, v) {
  if (v === "custom") {
    const el = document.getElementById("wtc_" + i);
    if (el) { el.style.display = ""; el.focus(); }
    return;
  }
  WT_STATE[i].max = parseFloat(v);
  WT_STATE[i].bin = "0";
  loadWt(i, line);
}

function pickWtCustom(i, line, v) {
  const x = parseFloat(v);
  if (isNaN(x) || x < 0) return;
  WT_STATE[i].max = x;
  WT_STATE[i].bin = "0";
  loadWt(i, line);
}

function pickWtBin(i, line, key) { WT_STATE[i].bin = key; loadWt(i, line); }

function drawWt(i, line, d) {
  const el = document.getElementById("wt_" + i);
  if (!el) return;
  if (!d.ready) {
    el.innerHTML = `<div class="cellttl">Low WT 분석</div>
      <div class="sec">${d.reason || "데이터 없음"}</div>`;
    return;
  }
  const st = WT_STATE[i];
  WT_LABELS[i] = {};
  d.bins.forEach(b => { WT_LABELS[i][b.key] = b.label; });
  if (!d.bins.some(b => b.key === st.bin)) st.bin = d.bins[0].key;

  const known = WT_OPTS.some(o => o.v === st.max);
  const opts = WT_OPTS.map(o =>
    `<option value="${o.v}" ${o.v === st.max ? "selected" : ""}>${o.t}</option>`).join("")
    + `<option value="custom" ${known ? "" : "selected"}>직접 입력</option>`;
  const has = (c) => d.summary[c].has;
  const th = d.cols.map(c => `<th>${c}</th>`).join("");
  const sumRow = d.cols.map(c => has(c)
    ? `<td>${nf(d.summary[c].low)}</td>`
    : `<td class="none" title="이 shift 스냅샷이 아직 없습니다">-</td>`).join("");
  const rateRow = d.cols.map(c => has(c)
    ? `<td>${d.summary[c].rate}%</td>` : `<td class="none">-</td>`).join("");

  const distRows = d.bins.map(b => {
    const tds = d.cols.map(c => {
      if (!has(c)) return `<td class="none">-</td>`;
      return `<td class="cell-pick" title="클릭: ${c} / ${b.label} LOT 목록"`
        + ` onclick="event.stopPropagation();openDrill({line:'${line}',col:'${c}',`
        + `bin:'${b.key}',max_wt:${st.max},bin_label:'${b.label}'})">`
        + `${nf(d.dist[c][b.key] || 0)}</td>`;
    }).join("");
    return `<tr class="pick ${b.key === st.bin ? "on" : ""}"
      onclick="pickWtBin(${i},'${line}','${b.key}')">
      <td title="클릭: 이 구간으로 원인 갱신">${b.label}</td>${tds}</tr>`;
  }).join("");

  const causeRows = d.causes.map(cz => {
    let any = false;
    const tds = d.cols.map(c => {
      if (!has(c)) return `<td class="none">-</td>`;
      const n = ((d.cause[c] || {})[st.bin] || {})[cz] || 0;
      if (n) any = true;
      const low = d.dist[c][st.bin] || 0;
      const pct = low ? (n / low * 100).toFixed(0) : 0;
      return `<td class="cell-pick" title="${cz} / ${n} LOT / 구간 내 ${pct}%"`
        + ` onclick="openDrill({line:'${line}',col:'${c}',bin:'${st.bin}',`
        + `cause:'${cz}',max_wt:${st.max},bin_label:'${WT_LABELS[i][st.bin] || ""}'})">`
        + `${nf(n)}</td>`;
    }).join("");
    if (cz === "기타/미분류" && !any) return "";
    return `<tr><td>${cz}</td>${tds}</tr>`;
  }).join("");

  el.innerHTML = `
    <div class="cellttl"><span>Low WT 분석</span>
      <span style="display:flex;gap:4px;align-items:center">
        <select onchange="pickWtMax(${i},'${line}',this.value)">${opts}</select>
        <input type="number" step="0.1" min="0" value="${st.max}" id="wtc_${i}"
               style="width:52px;${known ? "display:none" : ""}"
               onchange="pickWtCustom(${i},'${line}',this.value)">
      </span></div>
    <table><thead><tr><th></th>${th}</tr></thead><tbody>
      <tr class="big"><td>Low WT Lot</td>${sumRow}</tr>
      <tr class="rate"><td>Low WT율</td>${rateRow}</tr>
    </tbody></table>
    <div class="sec">WT 구간 분포 &middot; 구간명 클릭 = 원인 갱신,
      숫자 클릭 = 해당 셀 LOT 목록</div>
    <table><tbody>${distRows}</tbody></table>
    <div class="sec">원인 &middot; ${WT_LABELS[i][st.bin] || ""}</div>
    <table><tbody>${causeRows}</tbody></table>`;
}

/* ===========================================================================
   드릴다운
   =========================================================================== */
const NUM_COLS = new Set(["qty", "wt", "마지막이벤트경과_일", "스텝도착경과_일"]);

function closeDrill() {
  document.getElementById("drill").innerHTML =
    `<div class="empty">현황 카드의 <b>Low WT</b> 숫자나 좌측 추이 차트의
      <b>일별 지점</b>을 클릭하면 해당 LOT 상세가 여기에 표시됩니다.</div>`;
}

function openDrill(opt) {
  const el = document.getElementById("drill");
  el.innerHTML = `<div class="bar"><b>불러오는 중…</b></div>`;
  smoothTo(el);

  const binLabelIn = opt.bin_label || "";
  const q = Object.entries(opt)
    .filter(([k, v]) => k !== "bin_label" && v !== undefined && v !== null && v !== "")
    .map(([k, v]) => k + "=" + encodeURIComponent(v)).join("&");

  fetch("/api/lots/?" + q).then(r => r.json()).then(d => {
    const path = [d.line, d.col, binLabelIn, d.status,
                  (d.cause && d.cause !== "전체" ? d.cause : ""), d.biz_date]
                 .filter(Boolean).join(" / ");
    const cols = d.cols || [];
    const rows = d.rows || [];
    const head = cols.map(c => `<th>${c.t}</th>`).join("");
    const body = rows.map(r => "<tr>" + cols.map(c =>
      `<td class="${NUM_COLS.has(c.k) ? "num" : ""}">`
      + (r[c.k] === null || r[c.k] === undefined ? "" : r[c.k]) + "</td>").join("")
      + "</tr>").join("");
    el.innerHTML = `
      <div class="bar">
        <div><b>${nf(rows.length)} LOT</b><span class="path">${path}</span></div>
        <button onclick="closeDrill()">닫기</button>
      </div>
      <div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${body
        || `<tr><td colspan="${cols.length}" style="color:#6B7280">`
           + `해당 조건의 LOT 이 없습니다.</td></tr>`}</tbody></table></div>`;
    smoothTo(el);
  });
}

/* ===========================================================================
   FlowStack (추이)
   =========================================================================== */
const charts = {};
let basis = "qty";

function setBasis(b) {
  if (b === basis) return;
  basis = b;
  document.getElementById("b_qty").className = (b === "qty") ? "on" : "";
  document.getElementById("b_lot").className = (b === "lot") ? "on" : "";
  load();
}

const gapLine = {
  id: "gapLine",
  beforeDatasetsDraw(c) {
    const x = c.scales.x, ctx = c.ctx;
    (c.$kinds || []).forEach((k, i) => {
      if (k !== "gap") return;
      const px = x.getPixelForValue(i);
      ctx.save();
      ctx.strokeStyle = "#D1D5DB"; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(px, c.chartArea.top);
      ctx.lineTo(px, c.chartArea.bottom); ctx.stroke(); ctx.restore();
    });
  }
};

function fmtLabel(v, fmt, unit) {
  if (v === null || v === undefined) return "";
  if (fmt === "k") return (v / 1000).toFixed(1) + "k";
  if (fmt === "i") return Math.round(v) + (unit === "%" ? "%" : "");
  return v.toFixed(1);
}

const valueLabels = {
  id: "valueLabels",
  afterDatasetsDraw(c) {
    const ctx = c.ctx;
    ctx.save();
    ctx.font = "10px 'Poppins','Noto Sans KR',sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    c.data.datasets.forEach((ds, di) => {
      if (!c.isDatasetVisible(di)) return;
      c.getDatasetMeta(di).data.forEach((el, i) => {
        const v = ds.data[i];
        if (v === null || v === undefined) return;
        ctx.fillStyle = ds.borderColor;
        ctx.fillText(fmtLabel(v, c.$fmt, c.$unit), el.x, el.y - 5 - (di % 2) * 11);
      });
    });
    ctx.restore();
  }
};

function load() {
  fetch("/api/flowstack/?basis=" + basis).then(r => r.json()).then(res => {
    if (!window.Chart) {
      document.getElementById("err").innerHTML =
        "Chart.js 로드 실패. <code>web/flowmonitor/static/flowmonitor/chart.umd.js</code>"
        + " 존재 여부 확인.";
      return;
    }
    const nb = document.getElementById("notice");
    if (res.notice) { nb.textContent = res.notice; nb.style.display = "block"; }
    else { nb.style.display = "none"; }

    let pts = 0;
    res.order.forEach(k => {
      res.panels[k].datasets.forEach(ds => {
        ds.data.forEach(v => { if (v !== null && v !== undefined) pts += 1; });
      });
    });
    document.getElementById("err").innerHTML = (pts === 0)
      ? "적재는 됐지만 그릴 데이터가 없습니다. 진단: "
        + "<a href='/api/health/' target='_blank'>/api/health/</a>"
      : "";

    const first = res.panels[res.order[0]];
    document.getElementById("legend2").innerHTML = first.datasets.map(
      d => `<span><i style="background:${d.borderColor}"></i>${d.label}</span>`).join("");

    res.order.forEach((key, idx) => {
      const d = res.panels[key];
      const last = idx === res.order.length - 1;

      if (charts[key]) {
        charts[key].data.labels = d.labels;
        charts[key].data.datasets = d.datasets;
        charts[key].$kinds = d.kinds;
        charts[key].$fmt = d.fmt;
        charts[key].$unit = d.unit;
        charts[key].update();
        return;
      }

      const ch = new Chart(document.getElementById("c_" + key), {
        type: "line",
        data: { labels: d.labels, datasets: d.datasets },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          interaction: { mode: "index", intersect: false },
          layout: { padding: { top: 20, right: 10, left: 2 } },
          onClick: (e, els) => {
            if (!els.length) return;
            const day = (d.dates || [])[els[0].index];
            if (!day) return;
            openDrill({ line: d.datasets[els[0].datasetIndex].label,
                        col: "전체", biz_date: day, status: d.status });
          },
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: {
              title: (t) => {
                const i2 = t[0].dataIndex;
                const k = KIND_KO[d.kinds[i2]] || "";
                return d.labels[i2] + (k ? " (" + k + ")" : "");
              },
              label: (t) => t.dataset.label + "  "
                + Number(t.parsed.y).toLocaleString("ko-KR",
                    { maximumFractionDigits: 1 }) + " " + d.unit
            } }
          },
          scales: {
            x: { grid: { display: false },
                 ticks: { display: last, font: { size: 10 }, autoSkip: false } },
            y: { beginAtZero: true, grace: "18%", ticks: { font: { size: 10 } } }
          }
        },
        plugins: [gapLine, valueLabels]
      });
      ch.$kinds = d.kinds;
      ch.$fmt = d.fmt;
      ch.$unit = d.unit;
      charts[key] = ch;
      ch.update();

      const wrap = document.getElementById("c_" + key).parentElement;
      setTimeout(() => wrap.classList.add("ready"), 30 + idx * 45);
    });
  });
}

function statusError(msg) {
  document.getElementById("status").innerHTML =
    `<div style="padding:18px;color:#B91C1C;font-size:13px">
       상단 현황을 그리지 못했습니다: ${msg}
       <a href="/api/status/" target="_blank">/api/status/</a> 확인</div>`;
}

fetch("/api/status/")
  .then(r => r.ok ? r.json() : Promise.reject("HTTP " + r.status))
  .then(res => {
    if (!window.Chart) return statusError("Chart.js 로드 실패");
    try {
      drawCards(res);
    } catch (e) {
      console.error(e);
      statusError(e.message);
    }
  })
  .catch(e => statusError(e));
load();
</script>
