{% load static %}<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Multi Line Fab Monitor</title>
<style>
  :root { --bd:#E5E7EB; --fg:#111827; --mut:#6B7280; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Malgun Gothic","Segoe UI",sans-serif; color:var(--fg);
         font-size:14px; }
  header { border-bottom:1px solid var(--bd); padding:0 20px; display:flex;
           align-items:center; gap:28px; height:52px; }
  header .brand { font-weight:700; letter-spacing:-.02em; }
  header nav a { color:var(--mut); text-decoration:none; margin-right:20px;
                 font-size:14px; padding:6px 0; }
  header nav a.on { color:var(--fg); border-bottom:2px solid var(--fg); }
  /* 상단 현황 구역 */
  .status { display:grid; grid-template-columns:repeat(4,1fr); gap:0;
            border-bottom:1px solid var(--bd); }
  .card { border-right:1px solid var(--bd); position:relative; }
  .card:last-child { border-right:0; }
  .card .head { color:#fff; text-align:center; font-weight:600; padding:8px 0;
                font-size:15px; letter-spacing:-.01em; }
  .card .cell { border-top:1px solid var(--bd); padding:10px 12px; }
  .card .donut { display:flex; align-items:center; gap:12px; }
  .card .donut .cv { width:118px; height:118px; flex:0 0 118px; }
  .card .donut .txt { font-size:12px; color:var(--mut); line-height:1.5; }
  .card .donut .txt b { display:block; font-size:22px; color:var(--fg);
                        line-height:1.2; }
  .card .legend { display:flex; flex-wrap:wrap; gap:6px 10px; margin-top:6px; }
  .card .legend span { font-size:11px; color:var(--mut); cursor:pointer;
                       display:inline-flex; align-items:center; gap:4px; }
  .card .legend i { width:9px; height:9px; border-radius:2px; }
  .card .cellttl { font-size:11px; color:var(--mut); margin-bottom:6px; }
  .card .movebox { display:flex; align-items:center; gap:12px; }
  .card .movebox .cv { flex:1; height:96px; }
  .card .movetot { text-align:right; }
  .card .movetot b { display:block; font-size:24px; line-height:1.15; }
  .card .movetot span { font-size:11px; color:var(--mut); }
  .card .dev { position:absolute; inset:38px 0 0 0; background:rgba(255,255,255,.82);
               display:flex; align-items:center; justify-content:center;
               font-size:14px; color:var(--mut); font-weight:600; letter-spacing:.02em; }

  main { display:flex; gap:16px; padding:16px; align-items:flex-start; }
  .left { flex:0 0 32%; min-width:400px; }
  .right { flex:1; border:1px solid var(--bd); border-radius:6px; padding:16px;
           color:var(--mut); position:sticky; top:16px; }
  .panel { border:1px solid var(--bd); border-radius:6px; padding:10px 12px 6px;
           margin-bottom:10px; }
  .panel h2 { margin:0; font-size:13px; display:flex; justify-content:space-between;
              align-items:baseline; }
  .panel h2 .unit { color:var(--mut); font-size:11px; font-weight:400; }
  .wrap { position:relative; opacity:0; transition:opacity .28s ease-out; }
  .wrap.ready { opacity:1; }
  .topbar { display:flex; justify-content:space-between; align-items:center;
            margin:0 0 8px 2px; }
  #legend { display:flex; gap:14px; font-size:12px; }
  .toggle { display:inline-flex; border:1px solid var(--bd); border-radius:5px;
            overflow:hidden; font-size:12px; }
  .toggle button { border:0; background:#fff; color:var(--mut); padding:4px 10px;
                   cursor:pointer; }
  .toggle button.on { background:var(--fg); color:#fff; }
  .panel h2 .basis { color:var(--mut); font-size:11px; font-weight:400; }
  #legend span { display:inline-flex; align-items:center; gap:5px; }
  #legend i { width:14px; height:3px; border-radius:2px; display:inline-block; }
  .err { color:#B91C1C; font-size:13px; padding:8px 2px; }
  .err code { background:#FEF2F2; padding:1px 4px; border-radius:3px; }
  .notice { background:#FFFBEB; border:1px solid #FDE68A; color:#92400E;
            border-radius:5px; padding:8px 10px; font-size:12px; margin-bottom:10px; }
</style>
</head>
<body>
<header>
  <div class="brand">Multi Line Fab Monitor</div>
  <nav>
    {% for name, url in menu %}
      <a href="{{ url }}" {% if forloop.first %}class="on"{% endif %}>{{ name }}</a>
    {% endfor %}
  </nav>
</header>

<section class="status" id="status"></section>

<main>
  <div class="left">
    <div id="notice" class="notice" style="display:none"></div>
    <div class="topbar">
      <div id="legend"></div>
      <div class="toggle" title="HOLD율 / WAIT성 진행불가율의 분모">
        <button id="b_qty" class="on" onclick="setBasis('qty')">매수</button>
        <button id="b_lot" onclick="setBasis('lot')">Lot수</button>
      </div>
    </div>
    {% for p in panels %}
    <div class="panel">
      <h2>{{ p.title }}<span class="unit">{% if p.basis %}<span class="basis"
          id="basis_{{ p.key }}">매수 기준</span> · {% endif %}{{ p.unit }}</span></h2>
      <div class="wrap" style="height:{{ p.px }}px">
        <canvas id="c_{{ p.key }}"></canvas>
      </div>
    </div>
    {% endfor %}
    <div id="err" class="err"></div>
  </div>
  <div class="right">상세 영역 (f3_live 연결 예정)</div>
</main>

<!-- 사내망 CDN 차단에 걸리지 않도록 로컬 static 을 먼저 쓴다 -->
<script src="{% static 'flowmonitor/chart.umd.js' %}"></script>
<script>
  if (!window.Chart) {
    document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/'
      + 'dist/chart.umd.min.js"><\/script>');
  }
</script>
<script>
const KIND_KO = { month: "월평균", week: "주평균", day: "일" };
const charts = {};
let basis = "qty";

function setBasis(b) {
  if (b === basis) return;
  basis = b;
  document.getElementById("b_qty").className = (b === "qty") ? "on" : "";
  document.getElementById("b_lot").className = (b === "lot") ? "on" : "";
  ["hold", "blocked"].forEach(k => {
    const el = document.getElementById("basis_" + k);
    if (el) el.textContent = (b === "qty") ? "매수 기준" : "Lot수 기준";
  });
  // ---------------------------------------------------------------------------
// 상단 현황 카드
// ---------------------------------------------------------------------------
const nf = (n) => Number(n || 0).toLocaleString("ko-KR");

// 도넛 가운데 텍스트
const donutCenter = {
  id: "donutCenter",
  afterDraw(c) {
    const t = c.$center;
    if (!t) return;
    const { top, bottom, left, right } = c.chartArea;
    const x = (left + right) / 2, y = (top + bottom) / 2;
    const ctx = c.ctx;
    ctx.save();
    ctx.textAlign = "center";
    ctx.fillStyle = t.color || "#111827";
    ctx.font = "600 19px 'Malgun Gothic', sans-serif";
    ctx.fillText(t.big, x, y + 2);
    ctx.fillStyle = "#6B7280";
    ctx.font = "10px 'Malgun Gothic', sans-serif";
    ctx.fillText(t.small, x, y + 17);
    ctx.restore();
  }
};

function cardHtml(c, i) {
  if (!c.ready) {
    return `<div class="card">
      <div class="head" style="background:${c.head}">${c.label}</div>
      <div class="cell" style="height:150px"></div>
      <div class="cell" style="height:120px"></div>
      <div class="cell" style="height:120px"></div>
      <div class="dev">개발중</div></div>`;
  }
  const leg = c.status.map((st, si) =>
    `<span onclick="pickStatus(${i},${si})"><i style="background:${st.color}"></i>${st.name}</span>`
  ).join("");
  return `<div class="card">
    <div class="head" style="background:${c.head}">${c.label}</div>
    <div class="cell">
      <div class="donut">
        <div class="cv"><canvas id="dn_${i}"></canvas></div>
        <div class="txt" id="dt_${i}"></div>
      </div>
      <div class="legend">${leg}</div>
    </div>
    <div class="cell">
      <div class="cellttl">대기 LOT 상위 설비 5</div>
      <div style="height:118px"><canvas id="eq_${i}"></canvas></div>
    </div>
    <div class="cell">
      <div class="cellttl">Shift 별 MOVE</div>
      <div class="movebox">
        <div class="cv"><canvas id="mv_${i}"></canvas></div>
        <div class="movetot"><b>${nf(c.move.total)}</b><span>당일 MOVE (매)</span></div>
      </div>
    </div></div>`;
}

let STATUS_DATA = [];

function setCenter(i, sel) {
  const c = STATUS_DATA[i], ch = window["dn" + i];
  const d = (sel === null || sel === undefined)
    ? { label: c.default.label, pct: c.default.pct, lots: c.default.lots,
        qty: c.default.qty, color: "#111827" }
    : { label: c.status[sel].name, pct: c.status[sel].pct,
        lots: c.status[sel].lots, qty: c.status[sel].qty,
        color: c.status[sel].color };
  ch.$center = { big: d.pct.toFixed(1) + "%", small: d.label, color: d.color };
  ch.draw();
  document.getElementById("dt_" + i).innerHTML =
    `<b>${nf(d.lots)} LOT</b>${nf(d.qty)} 매<br>
     <span style="color:#9CA3AF">전체 ${nf(c.total.lots)} LOT · ${nf(c.total.qty)} 매</span>`;
}

function pickStatus(i, si) {
  const cur = window["sel" + i];
  window["sel" + i] = (cur === si) ? null : si;   // 다시 누르면 기본값으로
  setCenter(i, window["sel" + i]);
}

function drawCards(res) {
  document.getElementById("status").innerHTML =
    res.cards.map((c, i) => cardHtml(c, i)).join("");
  STATUS_DATA = res.cards;

  res.cards.forEach((c, i) => {
    if (!c.ready) return;

    window["dn" + i] = new Chart(document.getElementById("dn_" + i), {
      type: "doughnut",
      data: { labels: c.status.map(s => s.name),
              datasets: [{ data: c.status.map(s => s.lots),
                           backgroundColor: c.status.map(s => s.color),
                           borderWidth: 0 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: "68%",
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (t) => {
            const st = c.status[t.dataIndex];
            return `${st.name}  ${st.pct}% · ${nf(st.lots)} LOT · ${nf(st.qty)} 매`;
          } } }
        },
        onClick: (e, els) => { if (els.length) pickStatus(i, els[0].index); }
      },
      plugins: [donutCenter]
    });
    window["sel" + i] = null;
    setCenter(i, null);

    new Chart(document.getElementById("eq_" + i), {
      type: "bar",
      data: { labels: c.top_eqp.map(e => e.name),
              datasets: [{ data: c.top_eqp.map(e => e.lots),
                           backgroundColor: c.head, borderRadius: 2 }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        layout: { padding: { top: 16 } },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: (t) =>
                     `${nf(t.parsed.y)} LOT · ${nf(c.top_eqp[t.dataIndex].qty)} 매` } } },
        scales: { x: { grid: { display: false }, ticks: { font: { size: 9 } } },
                  y: { display: false, beginAtZero: true, grace: "20%" } }
      },
      plugins: [{ id: "barLbl", afterDatasetsDraw(ch) {
        const ctx = ch.ctx; ctx.save();
        ctx.font = "10px 'Malgun Gothic'"; ctx.textAlign = "center";
        ch.getDatasetMeta(0).data.forEach((el, k) => {
          ctx.fillStyle = "#374151";
          ctx.fillText(nf(ch.data.datasets[0].data[k]), el.x, el.y - 4);
        });
        ctx.restore();
      } }]
    });

    new Chart(document.getElementById("mv_" + i), {
      type: "bar",
      data: { labels: ["GY", "DAY", "SW"],
              datasets: [{ data: [c.move.GY, c.move.DAY, c.move.SW],
                           backgroundColor: c.head, borderRadius: 2 }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        layout: { padding: { top: 16 } },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: (t) => nf(t.parsed.y) + " 매" } } },
        scales: { x: { grid: { display: false }, ticks: { font: { size: 10 } } },
                  y: { display: false, beginAtZero: true, grace: "20%" } }
      },
      plugins: [{ id: "mvLbl", afterDatasetsDraw(ch) {
        const ctx = ch.ctx; ctx.save();
        ctx.font = "10px 'Malgun Gothic'"; ctx.textAlign = "center";
        ch.getDatasetMeta(0).data.forEach((el, k) => {
          const v = ch.data.datasets[0].data[k];
          ctx.fillStyle = "#374151";
          ctx.fillText((v / 1000).toFixed(1) + "k", el.x, el.y - 4);
        });
        ctx.restore();
      } }]
    });
  });
}

fetch("/api/status/").then(r => r.json()).then(res => {
  if (window.Chart) drawCards(res);
});

load();
}

// 값 레이블을 점 위에 직접 그린다(별도 플러그인 의존 없이).
function fmtLabel(v, fmt, unit) {
  if (v === null || v === undefined) return "";
  if (fmt === "k") return (v / 1000).toFixed(1) + "k";
  if (fmt === "i") return Math.round(v) + (unit === "%" ? "%" : "");
  return v.toFixed(1);
}

const valueLabels = {
  id: "valueLabels",
  afterDatasetsDraw(c) {
    const ctx = c.ctx;
    ctx.save();
    ctx.font = "10px 'Malgun Gothic', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    c.data.datasets.forEach((ds, di) => {
      if (!c.isDatasetVisible(di)) return;
      const meta = c.getDatasetMeta(di);
      meta.data.forEach((el, i) => {
        const v = ds.data[i];
        if (v === null || v === undefined) return;
        const txt = fmtLabel(v, c.$fmt, c.$unit);
        // 선이 겹칠 때 글자끼리 붙지 않도록 데이터셋마다 살짝 어긋나게
        ctx.fillStyle = ds.borderColor;
        ctx.fillText(txt, el.x, el.y - 5 - (di % 2) * 11);
      });
    });
    ctx.restore();
  }
};

// 단위가 바뀌는 지점에 세로 구분선
const gapLine = {
  id: "gapLine",
  beforeDatasetsDraw(c) {
    const x = c.scales.x, ctx = c.ctx;
    (c.$kinds || []).forEach((k, i) => {
      if (k !== "gap") return;
      const px = x.getPixelForValue(i);
      ctx.save();
      ctx.strokeStyle = "#D1D5DB"; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(px, c.chartArea.top);
      ctx.lineTo(px, c.chartArea.bottom); ctx.stroke(); ctx.restore();
    });
  }
};

function load() {
  fetch("/api/flowstack/?basis=" + basis).then(r => r.json()).then(res => {
    if (!window.Chart) {
      document.getElementById("err").innerHTML =
        "Chart.js 로드 실패. <code>python manage.py collectstatic</code> 또는 "
        + "<code>web/flowmonitor/static/flowmonitor/chart.umd.js</code> 존재 여부 확인.";
      return;
    }
    const pts = res.order.reduce((a, k) => a + res.panels[k].datasets
      .reduce((b, ds) => b + ds.data.filter(v => v !== null).length, 0), 0);
    if (pts === 0) {
      document.getElementById("err").innerHTML =
        "적재는 됐지만 그릴 데이터가 없습니다. 진단: "
        + "<a href='/api/health/' target='_blank'>/api/health/</a>";
    }
    const nb = document.getElementById("notice");
    if (res.notice) { nb.textContent = res.notice; nb.style.display = "block"; }
    else { nb.style.display = "none"; }

    const first = res.panels[res.order[0]];
    document.getElementById("legend").innerHTML = first.datasets.map(
      d => `<span><i style="background:${d.borderColor}"></i>${d.label}</span>`).join("");

    res.order.forEach((key, idx) => {
      const d = res.panels[key];
      const last = idx === res.order.length - 1;   // x축 라벨은 마지막 패널에만

      if (charts[key]) {                            // 토글 시에는 데이터만 교체
        charts[key].data.labels = d.labels;
        charts[key].data.datasets = d.datasets;
        charts[key].$kinds = d.kinds;
        charts[key].$fmt = d.fmt;
        charts[key].$unit = d.unit;
        charts[key].update();
        return;
      }
      const ch = new Chart(document.getElementById("c_" + key), {
        type: "line",
        data: { labels: d.labels, datasets: d.datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          // 선이 아래에서 솟아오르는 기본 애니메이션은 끄고,
          // 컨테이너를 통째로 페이드인 시킨다(제자리에서 부드럽게).
          animation: false,
          animations: { colors: false, x: false, y: false },
          transitions: { active: { animation: { duration: 0 } } },
          interaction: { mode: "index", intersect: false },
          layout: { padding: { top: 20, right: 10, left: 2 } },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                title: (t) => {
                  const i = t[0].dataIndex;
                  const k = KIND_KO[d.kinds[i]] || "";
                  return d.labels[i] + (k ? " (" + k + ")" : "");
                },
                // 커서를 올리면 축약 없이 원래 값 그대로
                label: (t) => `${t.dataset.label}  `
                  + Number(t.parsed.y).toLocaleString("ko-KR",
                      { maximumFractionDigits: 1 }) + ` ${d.unit}`
              }
            }
          },
          scales: {
            x: { grid: { display: false },
                 ticks: { display: last, font: { size: 10 }, autoSkip: false } },
            // grace: 최대값 위로 여유를 둬 값 레이블이 잘리지 않게 한다.
          y: { beginAtZero: true, grace: "18%",
               ticks: { font: { size: 10 } } }
          }
        },
        plugins: [gapLine, valueLabels]
      });
      ch.$kinds = d.kinds;
      ch.$fmt = d.fmt;
      ch.$unit = d.unit;
      charts[key] = ch;
      ch.update();
      // 패널마다 아주 짧게 시차를 둬 위에서 아래로 자연스럽게 나타나게
      const wrap = document.getElementById("c_" + key).parentElement;
      setTimeout(() => wrap.classList.add("ready"), 30 + idx * 45);
    });
  });
}

function pickStatus(i, si) {
  const cur = window["sel" + i];
  window["sel" + i] = (cur === si) ? null : si;   // 다시 누르면 기본값으로
  setCenter(i, window["sel" + i]);
}

function drawCards(res) {
  document.getElementById("status").innerHTML =
    res.cards.map((c, i) => cardHtml(c, i)).join("");
  STATUS_DATA = res.cards;

  res.cards.forEach((c, i) => {
    if (!c.ready) return;

    window["dn" + i] = new Chart(document.getElementById("dn_" + i), {
      type: "doughnut",
      data: { labels: c.status.map(s => s.name),
              datasets: [{ data: c.status.map(s => s.lots),
                           backgroundColor: c.status.map(s => s.color),
                           borderWidth: 0 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: "68%",
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (t) => {
            const st = c.status[t.dataIndex];
            return `${st.name}  ${st.pct}% · ${nf(st.lots)} LOT · ${nf(st.qty)} 매`;
          } } }
        },
        onClick: (e, els) => { if (els.length) pickStatus(i, els[0].index); }
      },
      plugins: [donutCenter]
    });
    window["sel" + i] = null;
    setCenter(i, null);

    new Chart(document.getElementById("eq_" + i), {
      type: "bar",
      data: { labels: c.top_eqp.map(e => e.name),
              datasets: [{ data: c.top_eqp.map(e => e.lots),
                           backgroundColor: c.head, borderRadius: 2 }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        layout: { padding: { top: 16 } },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: (t) =>
                     `${nf(t.parsed.y)} LOT · ${nf(c.top_eqp[t.dataIndex].qty)} 매` } } },
        scales: { x: { grid: { display: false }, ticks: { font: { size: 9 } } },
                  y: { display: false, beginAtZero: true, grace: "20%" } }
      },
      plugins: [{ id: "barLbl", afterDatasetsDraw(ch) {
        const ctx = ch.ctx; ctx.save();
        ctx.font = "10px 'Malgun Gothic'"; ctx.textAlign = "center";
        ch.getDatasetMeta(0).data.forEach((el, k) => {
          ctx.fillStyle = "#374151";
          ctx.fillText(nf(ch.data.datasets[0].data[k]), el.x, el.y - 4);
        });
        ctx.restore();
      } }]
    });

    new Chart(document.getElementById("mv_" + i), {
      type: "bar",
      data: { labels: ["GY", "DAY", "SW"],
              datasets: [{ data: [c.move.GY, c.move.DAY, c.move.SW],
                           backgroundColor: c.head, borderRadius: 2 }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        layout: { padding: { top: 16 } },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: (t) => nf(t.parsed.y) + " 매" } } },
        scales: { x: { grid: { display: false }, ticks: { font: { size: 10 } } },
                  y: { display: false, beginAtZero: true, grace: "20%" } }
      },
      plugins: [{ id: "mvLbl", afterDatasetsDraw(ch) {
        const ctx = ch.ctx; ctx.save();
        ctx.font = "10px 'Malgun Gothic'"; ctx.textAlign = "center";
        ch.getDatasetMeta(0).data.forEach((el, k) => {
          const v = ch.data.datasets[0].data[k];
          ctx.fillStyle = "#374151";
          ctx.fillText((v / 1000).toFixed(1) + "k", el.x, el.y - 4);
        });
        ctx.restore();
      } }]
    });
  });
}

fetch("/api/status/").then(r => r.json()).then(res => {
  if (window.Chart) drawCards(res);
});

load();
</script>
</body>
</html>
