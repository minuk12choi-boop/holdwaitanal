let COL_ORDER = null;       // 사용자가 드래그로 바꾼 컬럼 순서(키 배열)

function allCols() {
  if (DRILL_DATA && DRILL_DATA.all_cols) { return DRILL_DATA.all_cols; }
  return (DRILL_DATA && DRILL_DATA.cols) ? DRILL_DATA.cols : [];
}

function visibleKeys() {
  const all = allCols();
  const v = all.filter(c => !HIDE_COLS[c.k]).map(c => c.k);
  return v.length ? v : all.map(c => c.k);
}

function drillCols() {
  const cols = (DRILL_DATA && DRILL_DATA.cols) ? DRILL_DATA.cols : [];
  if (!COL_ORDER) { return cols; }
  const by = {};
  cols.forEach(c => { by[c.k] = c; });
  const out = COL_ORDER.map(k => by[k]).filter(Boolean);
  cols.forEach(c => { if (out.indexOf(c) < 0) { out.push(c); } });
  return out;
}

function czGroup(i) { return (DATA.causes || [])[i] || { name: "", children: [] }; }

// 더 파고들 뜻이 있는가. 하위가 하나뿐이면 쪼개도 같은 값이라 뜻이 없다.
function czCanDrill(i, path) {
  return czNodesAt(i, path).length > 1;
}

function czNodesAt(i, path) {
  let list = czGroup(i).children || [];
  for (const p of path) {
    const hit = list.find(x => x.name === p.name);
    list = (hit && hit.children) || [];
  }
  return list;
}

function czFilter() {
  const f = { big: czGroup(CZ_SEL.i).name };
  for (const p of CZ_SEL.path) {
    if (p.kind === "mid") { f.mid = p.name; } else { f.sub = p.name; }
  }
  return f;
}

function czLabel(v, max) {
  v = String(v == null ? "" : v);
  return v.length > max ? v.slice(0, max - 1) + "…" : v;
}

function czReset() {
  CZ_SEL = { i: -1, path: [] };
  DRILL_KEY = { i: -1, node: null, list: [] };
  closeDrill();
  renderCause();
}
function czGo(depth) { CZ_SEL.path = CZ_SEL.path.slice(0, depth); renderCause(); }

// depth=0 : 상단 요약 차트 -> 경로를 새로 시작
// depth>0 : 드릴다운 차트   -> 현재 경로에 덧붙임
const SEL_COLOR = "#FFD700";

const CZ_TOP = 5;

const CZ_DEEP = 15;

const CZ_SCALE_X = {
  grid: { display: false },
  ticks: { font: { size: 9 }, autoSkip: false, maxRotation: 0, minRotation: 0,
           callback: function (v) {
             const lb = this.chart.data.labels[v];
             // 배열이면 두 줄 라벨이다(전체 제약). 각 줄만 줄여 준다.
             if (Array.isArray(lb)) { return lb.map(x => czLabel(x, 10)); }
             return czLabel(this.getLabelForValue(v), 10);
           } }
};

const popSelected = {
  id: "popSelected",
  beforeDatasetsDraw(chart) {
    chart.$drawnSel = 0;
    // 고르지 않은 막대를 흐리게. 그린 뒤 되돌린다.
    const dim = chart.$dim;
    if (!dim) { return; }
    chart.data.datasets.forEach((ds, di) => {
      chart.getDatasetMeta(di).data.forEach((el, k) => {
        if (dim[k] && el) { el.options.backgroundColor =
          fade(el.options.backgroundColor); }
      });
    });
  },
  afterDatasetsDraw(chart) {
    // 누적막대는 (구간, 계열) 쌍으로 지정한다. 계열이 다르면 자리도 다르다.
    const pairs = chart.$selPairs;
    if (pairs && pairs.length) {
      pairs.forEach(([k, di]) => { drawSel(chart, k, di); chart.$drawnSel++; });
      return;
    }
    // 고른 것을 모두 표시한다(하나여도 라벨로 찾는다).
    const many = chart.$selSet;
    if (many && many.size && chart.data.labels) {
      chart.data.labels.forEach((lb, k) => {
        if (many.has(lb)) { drawSel(chart, k); chart.$drawnSel++; }
      });
      return;
    }
    const sel = chart.$sel;
    if (sel === undefined || sel === null || sel < 0) { return; }
    drawSel(chart, sel);
    chart.$drawnSel++;
  }
};

if (window.Chart) { Chart.register(popSelected); }

// 색을 흐리게. 고르지 않은 막대에 쓴다.
function fade(c) {
  const t = String(c || "");
  if (t.startsWith("rgba")) {
    // 마지막 인자(투명도)만 바꾼다. 정규식은 쓰지 않는다.
    const a = t.indexOf("(") + 1;
    const b = t.lastIndexOf(")");
    const p = t.slice(a, b).split(",");
    if (p.length >= 3) {
      return "rgba(" + p[0] + "," + p[1] + "," + p[2] + ",0.18)";
    }
    return t;
  }
  if (t.startsWith("#") && t.length === 7) {
    return t + "2E";                       // 약 18%
  }
  return t;
}

function strongest(c) {
  if (typeof c !== "string") { return c; }
  const i = c.indexOf("(");
  const j = c.lastIndexOf(")");
  if (i > 0 && j > i && c.slice(0, i).trim().toLowerCase().indexOf("rgb") === 0) {
    const p = c.slice(i + 1, j).split(",").map(x => x.trim());
    if (p.length >= 3) { return "rgb(" + p[0] + ", " + p[1] + ", " + p[2] + ")"; }
  }
  return c;
}

function drawSel(chart, sel, dsIdx) {
  {
    // 누적막대는 어느 계열을 골랐는지가 중요하다.
    const di = (dsIdx !== undefined && dsIdx !== null) ? dsIdx
      : ((chart.$selDs === undefined || chart.$selDs === null)
         ? 0 : chart.$selDs);
    const el = (chart.getDatasetMeta(di).data || [])[sel];
    if (!el) { return; }
    const ctx = chart.ctx;
    const bg = chart.data.datasets[di].backgroundColor;
    const fill = strongest(Array.isArray(bg) ? bg[sel] : bg);

    ctx.save();
    ctx.fillStyle = fill;
    ctx.strokeStyle = SEL_COLOR;
    ctx.lineWidth = 3;
    ctx.lineJoin = "round";

    if (el.outerRadius !== undefined) {          // 원차트 조각
      ctx.beginPath();
      ctx.arc(el.x, el.y, el.outerRadius - 1.5, el.startAngle, el.endAngle);
      ctx.arc(el.x, el.y, el.innerRadius + 1.5, el.endAngle, el.startAngle, true);
      ctx.closePath();
      ctx.fill();                                // 계열 최강색으로 다시 채우고
      ctx.stroke();
    } else {                                     // 막대
      // 가로막대(indexAxis:'y')와 세로막대는 width/height/base 의미가 다르다.
      // 두 경우를 나눠 실제 막대와 정확히 겹치게 그린다.
      const p = el.getProps(["x", "y", "base", "width", "height"], true);
      const horiz = (chart.options.indexAxis === "y");
      let x0, y0, w, h;
      if (horiz) {
        x0 = Math.min(p.base, p.x);
        w  = Math.abs(p.x - p.base);
        h  = p.height || 0;
        y0 = p.y - h / 2;
      } else {
        y0 = Math.min(p.base, p.y);
        h  = Math.abs(p.base - p.y);
        w  = p.width || 0;
        x0 = p.x - w / 2;
      }
      const in_ = 1.5;                           // 선 굵기의 절반만큼 안쪽으로
      ctx.fillRect(x0, y0, w, h);                // 계열 최강색으로 다시 채우고
      ctx.strokeRect(x0 + in_, y0 + in_,
                     Math.max(w - in_ * 2, 1), Math.max(h - in_ * 2, 1));
    }
    ctx.restore();
  }
}

// 누적막대 툴팁 한 줄. 라인 ALL 이면 라인 이름과 비율을 함께 보인다.
// 라인 ALL 일 때, 그 조각을 라인별로 쪼개 여러 줄로 보여 준다.
//   list  차트가 그리는 원본 목록(각 항목에 by_line 이 있어야 한다)
function lineRows(list, idx, stName, unit, u) {
  return [];
  const x = (list || [])[idx];
  const by = x && (stName ? (x.by_line_status || {})[stName] : x.by_line);
  if (!by) { return []; }
  const tot = Object.values(by).reduce(
    (a, v) => a + (u === "lots" ? v.lots : v.qty), 0);
  return Object.keys(by).map(ln => {
    const v = u === "lots" ? by[ln].lots : by[ln].qty;
    return "   " + lineShort(ln) + " " + nf(v) + unit
      + (tot ? " (" + Math.round(v / tot * 100) + "%)" : "");
  });
}

function stackTip(t, unit) {
  const v = t.raw || 0;
  const ds = t.chart.data;
  let g = 0;
  ds.datasets.forEach(d => {
    if (d.type !== "line") { g += (d.data[t.dataIndex] || 0); }
  });
  const nm = t.dataset.label ? t.dataset.label + " " : "";
  return nm + nf(v) + unit
    + (g ? " (" + Math.round(v / g * 100) + "%)" : "");
}

function czBarChart(canvasId, onPick, pluginId) {
  return new Chart(document.getElementById(canvasId), {
    type: "bar",
    data: { labels: [], datasets: [
      { data: [], borderRadius: 3, order: 2, yAxisID: "y" },
      // 경과일 평균(일/lot). 막대 위에 겹치지 않게 별도 축을 쓴다.
      { type: "line", data: [], order: 1, yAxisID: "y2",
        borderColor: "#B4504F", backgroundColor: "#B4504F",
        borderWidth: 2, pointRadius: 3, pointHoverRadius: 4,
        tension: 0.25, spanGaps: true }
    ] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      onHover: (e, els, ch) => hoverCursor(ch, e.native || e),
      layout: { padding: { top: 16 } },
      plugins: { legend: { display: false },
                 tooltip: { callbacks: {
                   title: (t) => (t[0].chart.$nodes[t[0].dataIndex] || {}).name,
                   label: (t) => {
                     const x = t.chart.$nodes[t.dataIndex] || {};
                     if (t.dataset.type === "line") {
                       return "경과 평균 " + (x.elapsed_d == null ? "-"
                              : x.elapsed_d.toFixed(1) + " 일/lot");
                     }
                     return nf(x.lots) + " LOT / " + nf(x.qty) + " 매";
                   } } } },
      // 막대와 라인을 세로로 분리한다.
      //   막대 : 바닥 ~ 50%      (라벨은 그 바로 위)
      //   라인 : 68% ~ 90%       (라벨은 그 위)
      // 두 대역 사이 여백이 있어 막대·라인·라벨이 서로 겹치지 않는다.
      scales: {
        x: CZ_SCALE_X,
        y: { display: false, beginAtZero: true,
             afterDataLimits: (sc) => {
               // 누적이면 Chart.js 가 계열별 최대를 주므로 합계로 다시 잡는다.
               // 안 그러면 막대가 라인 대역(68~90%)까지 올라와 겹친다.
               const ch = sc.chart;
               let mx = 0;
               const n = (ch.data.labels || []).length;
               for (let k = 0; k < n; k++) {
                 let sum = 0;
                 ch.data.datasets.forEach(d => {
                   if (d.type !== "line") { sum += (d.data[k] || 0); }
                 });
                 if (sum > mx) { mx = sum; }
               }
               sc.max = (mx || sc.max || 1) / 0.50;
             } },
        y2: { display: false, position: "right",
              afterDataLimits: (sc) => {
                let a = sc.min, b = sc.max;
                if (!isFinite(a) || !isFinite(b)) { return; }
                if (b - a < 1e-9) {
                  const pad = Math.abs(b) * 0.5 || 1;   // 값이 하나뿐이거나 0
                  a = b - pad;
                }
                // a -> 68%, b -> 90% 위치에 오도록 축 범위를 역산
                const range = (b - a) / 0.22;
                sc.min = a - 0.68 * range;
                sc.max = sc.min + range;
              } } },
      onClick: (e, els) => {
        if (!els.length) { return; }
        const ev = e.native || e;
        // interaction 이 index 라 els 로는 어느 조각인지 알 수 없다.
        // 라인 ALL 에서 조각(라인)을 고르려면 좌표로 다시 찾는다.
        const ch = e.chart;
        const hit = ch.getElementsAtEventForMode(
          ev, "nearest", { intersect: true }, false);
        const ds = hit.length ? hit[0].datasetIndex : null;
        onPick(els[0].index, ev, ds);
      },
      interaction: { mode: "index", intersect: false }
    },
    plugins: [{
      id: pluginId,
      afterDatasetsDraw(ch) {
        const ctx = ch.ctx; ctx.save();
        ctx.font = "10px 'Poppins','Noto Sans KR',sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "bottom";
        const unit = (CAUSE_UNIT === "lots") ? " lot" : " 매";

        // 라인 ALL 이면 막대가 여러 벌이다. 합계를 맨 위 막대 위에 쓴다.
        const bars = ch.data.datasets
          .map((d, i) => ({ d: d, i: i }))
          .filter(x => x.d.type !== "line");
        const top = bars.length ? bars[bars.length - 1] : null;
        if (top) {
          ctx.fillStyle = "#374151";
          ch.getDatasetMeta(top.i).data.forEach((el, k) => {
            let sum = 0;
            bars.forEach(x => { sum += (x.d.data[k] || 0); });
            if (sum) { ctx.fillText(nf(sum) + unit, el.x, el.y - 4); }
          });
        }

        // 경과일 라인. 데이터셋 순서가 바뀌어도 type 으로 찾는다.
        const li = ch.data.datasets.findIndex(d => d.type === "line");
        if (li >= 0) {
          ctx.fillStyle = "#B4504F";
          ch.getDatasetMeta(li).data.forEach((el, k) => {
            const v = ch.data.datasets[li].data[k];
            if (v === null || v === undefined) { return; }
            ctx.fillText(v.toFixed(1) + " 일/lot", el.x, el.y - 7);
          });
        }
        ctx.restore();
      }
    }]
  });
}

function czApply(ch, nodes, u, selName, selList) {
  // 값에 따라 농도를 달리하면 1위 막대가 '선택된 것' 처럼 보인다.
  // 선택 표시는 3D 팝업이 전담하므로 막대색은 전부 같은 남색으로 둔다.
  ch.$nodes = nodes;
  ch.data.labels = nodes.map(x => x.name);
  const line = ch.data.datasets.find(d => d.type === "line");
  // 안 좋은 지표라 적색 계열. 라인 ALL 이면 라인별 누적막대로 바꾼다.
  // HOLD 를 건 주체(System)는 같은 계열의 옅은 색으로 나눈다.
  const bars = lineStack(nodes, u, "#F08080");
  bars.forEach(b => {
    b.backgroundColor = nodes.map(
      (x) => (x.name === "System Hold") ? "#F2B8B5" : "#F08080");
  });
  bars.forEach(b => { b.order = 2; b.yAxisID = "y"; b.borderRadius = 3; });
  if (line) {
    line.data = nodes.map(x =>
      (x.elapsed_d === null || x.elapsed_d === undefined) ? null : x.elapsed_d);
    ch.data.datasets = bars.concat([line]);
  } else {
    ch.data.datasets = bars;
  }

  const on = new Set((selList && selList.length ? selList : [selName])
    .filter(Boolean));
  ch.$selSet = on.size ? on : null;
  // 고르지 않은 막대는 흐리게. 축은 그대로 둔다.
  ch.$dim = on.size ? nodes.map(x => !on.has(x.name)) : null;
  markSelected(ch, nodes.findIndex(x => on.has(x.name)));
  keepBarWidth(ch, nodes.length);
  ch.update("none");
}

/* 항목이 줄어도 막대 굵기와 축 자리를 그대로 둔다.
   10 개이던 x축이 2 개가 되면 막대가 지나치게 굵어져 다른 카드처럼 보인다.
   기준 개수를 기억해 두고 그만큼의 자리를 유지한다.
--------------------------------------------------------------------- */
/* 고른 것만 남기고 나머지 막대를 감춘다. 자리와 굵기는 그대로 둔다.
   값을 빼 버리면 남은 막대가 가운데로 옮겨 가 위치 감각이 깨진다.
--------------------------------------------------------------------- */
/* 막대·조각 위에서만 손가락 커서. 여백에서는 기본 커서.
   차트 전체에 cursor:pointer 를 주면 빈 곳도 눌리는 것처럼 보인다.
--------------------------------------------------------------------- */
function hoverCursor(ch, ev) {
  const hit = ch.getElementsAtEventForMode(
    ev, "nearest", { intersect: true }, false);
  ch.canvas.style.cursor = hit.length ? "pointer" : "default";
}

function hideUnpicked(ch, names, picked) {
  // 고르지 않은 막대는 **지우지 않고 흐리게** 둔다.
  //   지우면 축이 줄어 Ctrl 로 더 고를 수 없고 남은 막대가 가운데로 몰린다.
  ch.$dim = (picked && picked.size)
    ? names.map(nm => !picked.has(nm)) : null;
}

function keepBarWidth(ch, n) {
  if (!ch || !n) { return; }
  // 그 차트에서 본 가장 많은 개수를 기준으로 삼는다.
  ch.$slots = Math.max(ch.$slots || 0, n);
  const slots = ch.$slots;
  const bp = Math.min(0.9, 0.9 * n / slots);
  const mt = Math.max(8, Math.round(240 / slots));
  // 누적막대는 계열마다 값이 달라도 굵기는 같아야 한다.
  // 한 계열에만 주면 Chart.js 가 계열별로 폭을 다시 계산해 어긋난다.
  ch.data.datasets.forEach(ds => {
    if (ds.type === "line") { return; }
    ds.barPercentage = bp;
    ds.categoryPercentage = 0.9;
    ds.maxBarThickness = mt;
  });
}

function markSelected(ch, selIdx) {
  ch.$sel = (selIdx === undefined || selIdx === null) ? -1 : selIdx;
}

// 이 대분류에서 지금 파고든 경로. 다른 차트 경로를 물려받지 않는다.
function basePathOf(i) {
  const st = CZ_STACK.filter(x => x.i === i).slice(-1)[0];
  if (st) { return st.path.slice(); }
  if (CZ_WIDE && CZ_WIDE.i === i) { return CZ_WIDE.path.slice(); }
  return [];
}

// 항목 하나를 조건으로 건다. OR 목록은 늘 (대분류, 중분류, 소분류) 3쌍이다.
function czSelect(i, basePath, node, ev) {
  const add = ev && (ev.ctrlKey || ev.metaKey);
  const path = basePath.concat([{ name: node.name, kind: node.kind || "sub" }]);
  const midP = path.find(p => p.kind === "mid");
  const subP = path.filter(p => p.kind !== "mid").slice(-1)[0];
  // 소분류(설비그룹) 아래 설비 ID 는 한 칸 더 내려간다.
  const subs = path.filter(p => p.kind !== "mid");
  const pick = {
    big: czGroup(i).name,
    mid: midP ? midP.name : null,
    // 고른 것이 중분류면 소분류는 비운다(그 중분류 전체를 뜻한다).
    sub: (node.kind === "mid") ? null : (subs[0] ? subs[0].name : null),
    eqp: (node.kind === "eqp") ? node.name
         : (subs.length > 1 ? subs[subs.length - 1].name : null),
  };
  const ck = (x) => [x.big || "", x.mid || "", x.sub || "",
                     x.eqp || ""].join(">");

  // 이미 고른 갈래를 더 파고든 것이면 그 항목을 '대체' 한다.
  // (안 그러면 Hold 또는 설비이슈 또는 설비이슈>TIT405 처럼 쌓인다)
  const ancestor = (a, b) => a.big === b.big
    && (!a.mid || a.mid === b.mid)
    && (!a.sub || a.sub === b.sub)
    && (!a.eqp || a.eqp === b.eqp);

  const prev = (DF_CAUSE && DF_CAUSE.or) ? DF_CAUSE.or.slice() : [];
  const same = prev.findIndex(x => ck(x) === ck(pick));
  let or;
  if (same >= 0) {
    or = prev.filter((_, k) => k !== same);      // 같은 것 재클릭 = 해제
  } else {
    const up = prev.findIndex(x => ancestor(x, pick));
    if (up >= 0) {
      or = prev.slice();
      or[up] = pick;                             // 그 갈래만 좁힌다
    } else if (add) {
      or = prev.concat([pick]);                  // 다른 갈래를 더한다
    } else {
      or = [pick];                               // 새로 시작
    }
  }
  DF_CAUSE = or.length ? { i: i, or: or } : null;
  DF_SRC.cause = "cause";        // 원인 차트에서 걸었다
  dfResetBelow(4, true);
  syncFromDF();
}

// 라인 ALL 이면 누른 조각이 곧 라인이다.
function czLineOf(ch, dsIdx) {
  return null;
  const ds = ch && ch.data.datasets[dsIdx];
  return (ds && ds.type !== "line" && ds.label) ? ds.label : null;
}

function czPick(i, node, depth, ev, seg) {
  if (!node) { return; }
  const add = ev && (ev.ctrlKey || ev.metaKey);
  // 하위가 하나뿐이면 말단으로 본다. 쪼개 봐야 같은 값이다.
  const leaf = !(node.children && node.children.length > 1);

  // Ctrl 이 아니면 이전 드릴다운은 모두 버린다(같은 차트 안이라도).
  if (!add) {
    if (CZ_STACK.length && CZ_STACK[0].i !== i) { CZ_STACK = []; }
    if (CZ_WIDE && CZ_WIDE.i !== i) { CZ_WIDE = null; }
  }
  if (depth === 0 && !add) { CZ_SEL = { i: i, path: [] }; }
  CZ_SEL.path = CZ_SEL.path.filter(p => p.kind !== "all");

  if (leaf) {
    czSelect(i, basePathOf(i), node, ev);
    return;
  }

  // 하위가 있다. Ctrl 이어도 무엇을 볼지 물어본다(둘 다 고를 수 있어야 한다).
  czAsk(i, basePathOf(i), node, ev);
}

/* 하위가 있는 항목: 전체로 볼지, 세부로 파고들지 고른다 -----------------
   좌측 차트는 해당 없다(늘 바로 적용).
--------------------------------------------------------------------- */
let CZ_ASK = null;

function czAsk(i, basePath, node, ev) {
  // Ctrl 여부를 기억한다. 팝업에서 고른 뒤에도 '함께 보기' 가 유지된다.
  CZ_ASK = { i: i, base: basePath.slice(), node: node,
             add: !!(ev && (ev.ctrlKey || ev.metaKey)) };
  const el = document.getElementById("czask");
  const kids = czNodesAt(i, basePath.concat(
    [{ name: node.name, kind: node.kind || "sub" }])).length;
  el.innerHTML =
    `<span class="askx" onclick="czAskClose()">×</span>`
    + `<div class="askttl">${node.name}</div>`
    + `<button onclick="czAskGo('all')">전체 보기</button>`
    + `<button onclick="czAskGo('deep')">세부 요소 보기 (${kids})</button>`;
  el.style.display = "block";
  // 누른 자리 근처에 띄운다.
  const x = (ev && ev.clientX) || 0;
  const y = (ev && ev.clientY) || 0;
  el.style.left = (x + window.pageXOffset + 8) + "px";
  el.style.top = (y + window.pageYOffset - 8) + "px";
}

function czAskClose() {
  CZ_ASK = null;
  const el = document.getElementById("czask");
  if (el) { el.style.display = "none"; }
}

function czAskGo(mode) {
  if (!CZ_ASK) { return; }
  const { i, base, node, add } = CZ_ASK;
  const path = base.concat([{ name: node.name, kind: node.kind || "sub" }]);
  czAskClose();

  if (mode === "deep") {
    // 세부 요소. **그 카드 아래에 한 장 더 쌓는다**(교체가 아니다).
    //   base 는 눌린 카드의 경로다. 그보다 깊은 카드만 걷어내고 붙인다.
    const keep = CZ_STACK.filter(
      x => x.i !== i || x.path.length <= base.length);
    CZ_STACK = keep.concat([{ i: i, path: path }]);
    CZ_SEL = { i: i, path: path.slice() };
    CZ_WIDE = null;
  }
  // 전체 보기든 세부 보기든 '그 항목을 골랐다' 는 사실은 같다.
  czSelect(i, base, node, add ? { ctrlKey: true } : null);
}

function czWhole(i) {
  // 조건 저장소를 거쳐야 LOT BALANCE 등 하위가 함께 좁혀진다.
  DF_CAUSE = { i: i, big: czGroup(i).name, mid: null, subs: [] };
  DF_SRC.cause = "cause";
  CZ_SEL = { i: -1, path: [] };
  dfResetBelow(4);
  syncFromDF();
}

/* 전체보기 : 셋을 합쳐 가로막대로 --------------------------------------
   카드가 세로로 길어 x/y 를 뒤집는다. y축 라벨은 '대분류' 줄바꿈 '중분류'.
--------------------------------------------------------------------- */
// 대분류별 막대 색. 원인 분석 카드의 색 계열을 따른다.
// 라인마다 정해진 색. 어느 차트에서 보든 같은 라인은 같은 색이다.
const LINE_COLORS = {
  "KFR4": "#3D3C3A",     // NRD
  "PFR1": "#3D5791",     // NRD-P
  "KFR7": "#045F5F",     // NRD-K
  "KFR6": "#667C26",     // NRD-V
};
const LINE_FALLBACK = ["#9B8AC4", "#B4504F", "#7A8B99"];

// 라인 짧은 이름. 범례 글자가 길면 차트를 가린다.
const LINE_SHORT = { "KFR4": "H", "PFR1": "P", "KFR7": "K", "KFR6": "V" };

function lineShort(name) { return LINE_SHORT[name] || String(name).slice(0, 2); }

// 라인 ALL 일 때 차트 제목 옆에 붙일 범례.
function lineLegendHtml() {
  return "";
  const ls = (DATA && DATA.line_dist) || [];
  if (!ls.length) { return ""; }
  return `<span class="linelg"><b>LINE</b>`
    + ls.map(x => `<i style="background:${lineColor(x.name)}"></i>`
        + `${lineShort(x.name)}`).join("")
    + `</span>`;
}

// 제목 줄에 범례를 붙이거나 걷는다.
function putLineLegend(cardId) {
  const card = document.getElementById(cardId);
  if (!card) { return; }
  const ttl = card.querySelector(".cellttl");
  if (!ttl) { return; }
  let lg = ttl.querySelector(".linelg");
  const html = lineLegendHtml();
  if (!html) { if (lg) { lg.remove(); } return; }
  if (!lg) {
    lg = document.createElement("span");
    ttl.insertBefore(lg, ttl.querySelector(".seg") || null);
  }
  lg.outerHTML = html;
}

function lineColor(name) {
  if (LINE_COLORS[name]) { return LINE_COLORS[name]; }
  const ls = (DATA && DATA.line_dist) || [];
  const i = ls.findIndex(x => x.name === name);
  return LINE_FALLBACK[(i < 0 ? 0 : i) % LINE_FALLBACK.length];
}

// 라인 ALL 이면 라인별 누적막대로 만든다. 아니면 단색 한 벌.
function lineStack(items, u, flat) {
  return [{ label: "", data: items.map(x => u === "lots" ? x.lots : x.qty),
            backgroundColor: flat }];
}

const STATUS_TONE = {
  "Hold": "#F08080",
  "Wait성 진행불가": "#E8C46A",
  "Bottleneck": "#84C09A",
};

let CAUSE_VIEW = "split";
let CAUSE_ALL_TOP = 20;        // 전체보기에 세울 항목 수
let czAllChart = null;

function setCauseView(v) {
  CAUSE_VIEW = v;
  document.getElementById("cv_split").className = (v === "split") ? "on" : "";
  document.getElementById("cv_all").className = (v === "all") ? "on" : "";
  document.getElementById("cz3").style.display = (v === "all") ? "none" : "";
  document.getElementById("czallw").style.display = (v === "all") ? "" : "none";
  CZ_STACK = []; CZ_WIDE = null;
  renderCause();
  resizeCharts();
}

// 대분류 이름을 짧게. y축 폭을 아낀다.
const BIG_SHORT = { "Wait성 진행불가": "Wait(불가)", "Bottleneck": "B/N" };

function setCauseAllTop(n) { CAUSE_ALL_TOP = n; renderCauseAllBar(); }

function renderCauseAllBar() {
  const u = CAUSE_UNIT;
  // 세 대분류를 한데 놓고 값 순으로 줄 세운다.
  // 한쪽으로 쏠리면 그것이 곧 답이다. 대분류별로 나눠 뽑지 않는다.
  const items = [];
  for (let i = 0; i < 3; i++) {
    const g = czGroup(i);
    (g.children || []).forEach(n => {
      items.push(Object.assign({}, n, { $big: g.name, $i: i }));
    });
  }
  items.sort((a, b) => (u === "lots" ? b.lots - a.lots : b.qty - a.qty));
  const nodes = items.slice(0, CAUSE_ALL_TOP);

  const vals = nodes.map(n => u === "lots" ? n.lots : n.qty);
  const eld = nodes.map(n => (n.eln ? +(n.eld / n.eln).toFixed(1) : null));
  const mx = Math.max(1, ...vals);
  const colors = nodes.map(n => (STATUS_TONE[n.$big] || "#F08080"));

  if (!czAllChart) {
    czAllChart = new Chart(document.getElementById("czall"), {
      type: "bar",
      data: { labels: [], datasets: [
        { data: [], borderRadius: 3, order: 2, xAxisID: "x" },
        { type: "line", data: [], order: 1, xAxisID: "x2",
          borderColor: "#B4504F", backgroundColor: "#B4504F",
          borderWidth: 2, pointRadius: 3, tension: .25, spanGaps: true }
      ] },
      options: {
        indexAxis: "y",                    // 시계방향 90도 회전
        responsive: true, maintainAspectRatio: false, animation: false,
        onHover: (e, els, ch) => hoverCursor(ch, e.native || e),
        layout: { padding: { right: 46 } },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: (t) => {
                     const n = (czAllChart.$nodes || [])[t.dataIndex] || {};
                     if (t.dataset.xAxisID === "x2") {
                       return "평균 경과 " + t.raw + "일";
                     }
                     return n.$big + " > " + n.name + "  "
                       + nf(n.lots) + " LOT / " + nf(n.qty) + " 매";
                   } } } },
        scales: {
          x: { display: false, beginAtZero: true,
               afterDataLimits: (sc) => { sc.max = (sc.max || 1) / 0.78; } },
          x2: { display: false, position: "top", beginAtZero: true,
                afterDataLimits: (sc) => { sc.max = (sc.max || 1) * 2.6; } },
          y: { grid: { display: false },
               ticks: { autoSkip: false, font: { size: 9 },
                        callback: function (v) {
                          const n = (czAllChart.$nodes || [])[v] || {};
                          // 위: 대분류, 아래: 중분류(길면 줄임)
                          const nm = String(n.name || "").trim() || "(빈 값)";
                          return [BIG_SHORT[n.$big] || n.$big,
                                  czLabel(nm, 14)];
                        } } }
        },
        onClick: (e) => {
          const hit = czAllChart.getElementsAtEventForMode(
            e.native || e, "nearest", { intersect: false }, false);
          if (!hit.length) { return; }
          const n = (czAllChart.$nodes || [])[hit[0].index];
          if (n) { czPick(n.$i, n, 0, e.native || e); }
        }
      },
      plugins: [{
        id: "czAllVal",
        afterDatasetsDraw(ch) {
          const ctx = ch.ctx; ctx.save();
          ctx.font = "9px 'Poppins','Noto Sans KR',sans-serif";
          ctx.textAlign = "left"; ctx.textBaseline = "middle";
          ctx.fillStyle = "#374151";
          ch.getDatasetMeta(0).data.forEach((el, k) => {
            const v = ch.data.datasets[0].data[k];
            if (v) { ctx.fillText(kfmt(v), el.x + 5, el.y); }
          });
          ctx.restore();
        }
      }]
    });
  }

  const p = document.getElementById("czallp");
  if (p) {
    p.innerHTML = `<span class="minittl">상위 ${nodes.length} / 전체 `
      + `${items.length}개 · </span>`
      + [20, 40, 80].map(n =>
          `<button class="rankbtn ${CAUSE_ALL_TOP === n ? "on" : ""}"`
          + ` onclick="setCauseAllTop(${n})">${n}</button>`).join("");
  }

  // 한 항목당 최소 높이를 주고, 넘치면 카드 안에서 세로 스크롤한다.
  const hbox = document.getElementById("czallh");
  if (hbox) { hbox.style.height = Math.max(240, nodes.length * 26) + "px"; }

  czAllChart.$nodes = nodes;
  czAllChart.data.labels = nodes.map((_, k) => k);
  czAllChart.data.datasets[0].data = vals;
  czAllChart.data.datasets[0].backgroundColor = colors;
  czAllChart.data.datasets[1].data = eld;
  const on = causeSelNames();
  czAllChart.$selSet = on;
  markSelected(czAllChart, nodes.findIndex(n => on.has(n.name)));
  czAllChart.update("none");
}

function renderCause() {
  const u = CAUSE_UNIT;
  putLineLegend("czcard");
  // 상위 계층(좌측 차트)에서 좁혀진 조건을 제목 옆에 보여 준다.
  const up = document.getElementById("czup");
  if (up) {
    // 좌측 차트 조건은 서로 다른 축이라 '>' 가 아니라 '·' 로 잇는다.
    const parts = [];
    DF_DEF.forEach(dd => {
      if ((DF_LV[dd.k] || 9) < 4) {
        const n = dfOneName(dd);
        if (n) { parts.push(n); }
      }
    });
    up.textContent = parts.length ? parts.join(" · ") : "";
  }

  for (let i = 0; i < 3; i++) {
    const g = czGroup(i);
    // 이 칸을 파고들었으면 그 단계의 목록을, 아니면 대분류 바로 아래를 그린다.
    // 대분류 차트는 늘 그 바로 아래 단계만 보여 준다.
    // 파고든 결과는 오른쪽 중분류 차트(#czside)에 따로 나온다.
    const all = g.children || [];
    const nodes = all.slice(0, CZ_TOP);
    const more = all.length - nodes.length;
    const deep = false;
    const path = [];

    const hd = document.getElementById("czh" + i);
    hd.innerHTML = `<span>${g.name || "-"}</span>`
      + `<span class="v">전체 ${nf(u === "lots" ? g.lots : g.qty)}`
      + `${u === "lots" ? " LOT" : " 매"}</span>`;
    hd.onclick = function () { czWhole(i); };      // 제목 = 전체 표

    // 경로 + 전체 순위 보기(계층과 무관하게 항목이 더 있으면 늘 제공)
    const p = document.getElementById("czp" + i);
    const rank = (more > 0)
      ? `<button class="rankbtn" onclick="czShowAll(${i})">전체 순위`
        + `<span class="cv">▸</span></button>` : "";
    if (deep) {
      p.innerHTML =
        `<span class="czback" onclick="czGo(${path.length - 1})">◀ 뒤로</span>`
        + `<a onclick="czGo(0)">전체</a>`
        + path.map((x, k) =>
            ` &gt; <a onclick="czGo(${k + 1})">${x.name}</a>`).join("")
        + (rank ? " " + rank : "");
    } else {
      p.innerHTML = rank;
    }

    if (!czCharts[i]) {
      czCharts[i] = czBarChart("czc" + i,
        (idx, ev, dsIdx) => czPick(i, (czCharts[i].$nodes || [])[idx], 0, ev,
                                   czLineOf(czCharts[i], dsIdx)),
        "czVal" + i);
    }
    // 이 칸에서 파고들었으면(중분류 차트든 표든) 연결 관계를 보인다.
    const srcHere = CZ_STACK.some(x => x.i === i)
      || (CZ_WIDE && CZ_WIDE.i === i)
      || causeSelNames(i).size > 0;
    // 이 대분류에서 고른 것 + 파고든 것 모두 테두리로 표시한다.
    const marks = causeSelNames(i);
    CZ_STACK.filter(x => x.i === i).forEach(x => marks.add(x.path[0].name));
    const here0 = nodes.filter(x => marks.has(x.name)).map(x => x.name);
    czCharts[i].$big = czGroup(i).name;
    czApply(czCharts[i], nodes, u, null, here0);
    // Bottleneck 카드에는 전 라인 토글을 붙인다.
    const hdEl = document.getElementById("czh" + i);
    const akey = czAllKey(i, []);
    if (hdEl && akey === "neck" && !hdEl.querySelector(".insall")) {
      hdEl.insertAdjacentHTML("beforeend", czAllBtn(akey));
    }
    const pEl = document.getElementById("czp" + i);
    if (pEl && akey) {
      const old = pEl.querySelector(".czallwrap");
      if (old) { old.remove(); }
      const html = czAllRows(akey, nodes);
      if (html) {
        pEl.insertAdjacentHTML("beforeend",
          `<div class="czallwrap">${html}</div>`);
      }
    }
    const col = document.getElementById("czh" + i).parentNode;
    col.classList.toggle("czsrc", !!srcHere);
  }

  if (CAUSE_VIEW === "all") { renderCauseAllBar(); }
  renderCzStack();
  renderCzWide();
}

/* 우측 드릴다운 중분류 차트 --------------------------------------------
   상위 차트를 그대로 두고 그 하위를 옆에 새로 띄운다.
   어느 막대에서 왔는지 남색 테두리로 표시한다.
--------------------------------------------------------------------- */
// 우측 열은 안의 카드가 하나라도 보일 때만 자리를 차지한다.






/* 선택 테두리와 내용이 겹치는지 잰다.
   콘솔에서 checkOverlap() 을 부르면 서버 터미널에 찍힌다.
--------------------------------------------------------------------- */


// 보이는 모든 차트를 컨테이너 폭에 다시 맞춘다.






/* 전체 제약 : 세 대분류를 합쳐 상위 15 ------------------------------------
   x축은 두 줄이다. 위가 더 아래 계층(중·소분류), 아래가 대분류.
--------------------------------------------------------------------------- */
/* 파고든 단계들 : LOT BALANCE 위에 하나씩 쌓인다 ----------------------
   더 쪼갤 게 없을 때까지 카드가 늘어난다. 각 카드는 자기 아래 단계를 만든다.
--------------------------------------------------------------------- */
function czStackClose(n) {
  CZ_STACK = CZ_STACK.slice(0, n);
  CZ_SEL = CZ_STACK.length
    ? { i: CZ_STACK[CZ_STACK.length - 1].i,
        path: CZ_STACK[CZ_STACK.length - 1].path.slice() }
    : { i: -1, path: [] };
  renderCause();
}

// 설비 단위로 보는 차트에는 '전 라인' 토글을 둔다.
//   같은 설비를 여러 라인이 쓰므로 제 라인만 봐선 뜻이 없다.
const CZ_ALL = {};            // 키 -> 켜짐
const CZ_ALL_DATA = {};       // 키 -> /api/eqp-wait/ 결과

function czAllKey(i, path) {
  const mid = (path || []).find(p => p.kind === "mid");
  if (czGroup(i).name === "Bottleneck") { return "neck"; }
  if (mid && mid.name === "설비이슈") { return "eqp"; }
  if (mid && mid.name === "TIP") { return "tip"; }
  return null;
}

function czAllToggle(key) {
  CZ_ALL[key] = !CZ_ALL[key];
  if (!CZ_ALL[key]) { renderCause(); return; }
  fetch("/api/eqp-wait/?kind=" + encodeURIComponent(key)
        + "&types=" + encodeURIComponent(selectedTypes().join(",")))
    .then(r => r.json()).then(d => { CZ_ALL_DATA[key] = d; renderCause(); });
}

function czAllBtn(key) {
  if (!key) { return ""; }
  return `<button class="insall ${CZ_ALL[key] ? "on" : ""}"`
    + ` onclick="event.stopPropagation();czAllToggle('${key}')"`
    + ` title="라인 구분 없이 그 설비 앞에 선 재공을 모두 본다">전 라인</button>`;
}

// 전 라인 보기일 때 막대 아래에 라인별 값을 적는다.
function czAllRows(key, nodes) {
  const d = key && CZ_ALL[key] && CZ_ALL_DATA[key];
  if (!d) { return ""; }
  const lab = d.labels || {};
  return nodes.slice(0, 8).map(n => {
    const hit = (d.rows || []).find(x => x.name === n.name);
    if (!hit) { return ""; }
    const parts = Object.keys(hit.by_line)
      .map(ln => `${lab[ln] || ln} ${kfmt(hit.by_line[ln])}`);
    return `<div class="czallrow"><b>${czLabel(n.name, 14)}</b>`
      + ` 전 라인 ${kfmt(hit.qty)}매 · ${parts.join(" · ")}</div>`;
  }).join("");
}

function renderCzStack() {
  const box = document.getElementById("czstack");
  if (!box) { return; }
  // 비어 있으면 자리를 비운다. 안 그러면 gap 만큼 아래 카드가 밀린다.
  box.style.display = CZ_STACK.length ? "" : "none";

  // 필요한 만큼만 카드를 만든다.
  if (box.childElementCount !== CZ_STACK.length) {
    czStackCharts.forEach(c => { if (c) { c.destroy(); } });
    czStackCharts.length = 0;
    box.innerHTML = CZ_STACK.map((_, n) =>
      `<div class="cell" id="czs${n}" style="border:1px solid var(--bd);`
      + `border-radius:6px;`
      + `padding:11px 12px;margin-bottom:10px">`
      + `<div class="cellttl"><span id="czst${n}"></span>`
      + `<button class="cardclr" onclick="czStackClose(${n})"`
      + ` title="이 단계 이후를 접는다">◀ 해제</button></div>`
      + `<div id="czsp${n}" class="czpath"></div>`
      + `<div style="height:230px"><canvas id="czsc${n}"></canvas></div>`
      + `</div>`).join("");
  }

  CZ_STACK.forEach((step, n) => {
    const g = czGroup(step.i);
    const nodes = czNodesAt(step.i, step.path).slice(0, 20);
    document.getElementById("czst" + n).textContent =
      [g.name].concat(step.path.map(x => x.name)).join(" > ");
    const akey = czAllKey(step.i, step.path);
    document.getElementById("czsp" + n).innerHTML =
      `<span class="minittl">상위 ${nodes.length}개 · 막대를 누르면 `
      + `${n + 1 < CZ_STACK.length ? "이 아래로 다시 파고든다"
                                   : "더 파고들거나 LOT 상세"}</span>`
      + czAllBtn(akey)
      + (czAllRows(akey, nodes)
         ? `<div class="czallwrap">${czAllRows(akey, nodes)}</div>` : "");

    if (!czStackCharts[n]) {
      czStackCharts[n] = czBarChart("czsc" + n, (idx, ev) => {
        const st = CZ_STACK[n];
        const node = (czStackCharts[n].$nodes || [])[idx];
        if (!st || !node) { return; }
        const next = st.path.concat([{ name: node.name,
                                       kind: node.kind || "sub" }]);
        // 더 쪼개도 뜻이 있을 때만 물어본다(하위가 둘 이상).
        if (!(ev && (ev.ctrlKey || ev.metaKey))
            && czCanDrill(st.i, next)) {
          czAsk(st.i, st.path, node, ev);
          return;
        }
        // 말단이면 표만 바꾸고 카드는 그대로 둔다.
        const keep = CZ_STACK;
        czPick(st.i, node, 1, ev);
        CZ_STACK = keep;
        renderCzStack();
      }, "czsVal" + n);
    }
    // 이 차트의 축에 실제로 있는 것만 고른 것으로 본다.
    const all = causeSelNames(step.i);
    const here = nodes.filter(x => all.has(x.name)).map(x => x.name);
    czStackCharts[n].$big = czGroup(step.i).name;
    czApply(czStackCharts[n], nodes, CAUSE_UNIT, null, here);
  });
}

/* 전체 순위 : 아래 넓은 패널 --------------------------------------------- */
let CZ_WIDE = null;          // {i, path}
let czWideChart = null;

function czShowAll(i) {
  // 다른 카드에서 열려 있던 것은 닫는다(리셋 규칙).
  if (CZ_WIDE && CZ_WIDE.i !== i) { CZ_WIDE = null; }
  if (CZ_STACK.length && CZ_STACK[0].i !== i) { CZ_STACK = []; }
  if (CZ_SEL.i !== i) { CZ_SEL = { i: i, path: [] }; }
  const path = CZ_SEL.path.slice();
  const same = CZ_WIDE && CZ_WIDE.i === i
    && CZ_WIDE.path.map(x => x.name).join("|") === path.map(x => x.name).join("|");
  CZ_WIDE = same ? null : { i: i, path: path };
  if (CAUSE_VIEW === "all") { renderCauseAllBar(); }
  renderCzStack();
  renderCzWide();
}

/* 우측 드릴다운 중분류 차트 --------------------------------------------
   상위 차트를 그대로 두고 그 하위를 옆에 새로 띄운다.
   어느 막대에서 왔는지 남색 테두리로 표시한다.
--------------------------------------------------------------------- */
// 좌측 세로축(필터~W/T 0)과 원인 분석 카드의 높이를 맞춘다.
// 우측 열 높이와는 무관하게 둔다.
function syncLeftHeight() {
  const sm = document.querySelector(".summary");
  const lc = document.querySelector(".rowcards > .leftcol");
  if (!sm || !lc) { return; }
  // 좌측 '마지막 카드의 아래선' 에 맞춘다.
  //   좌측은 페이지 위에서 시작하지만 우측 열은 요약카드 아래에서 시작한다.
  //   그래서 좌측 높이를 그대로 주면 시작점 차이만큼 아래로 삐져나간다.
  //   기준은 '이 열의 top' 이어야 한다.
  const last = sm.querySelector(".cell:last-of-type");
  const b = (last || sm).getBoundingClientRect();
  const h = Math.round(b.bottom - lc.getBoundingClientRect().top);
  if (h > 0 && lc.style.height !== h + "px") {
    lc.style.height = h + "px";
    resizeCharts();
  }
}

/* 추이 요약 --------------------------------------------------------------
   /main/ 은 지금 이 순간만 본다. 여기서는 최근 이력과 견줘
   어디서 언제부터 얼마나 줄었는지 말한다.
   계산에 몇 초 걸릴 수 있어 따로 부르고, 그 자리에만 '분석 중' 을 둔다.
--------------------------------------------------------------------- */




/* 히트맵 ------------------------------------------------------------------
   가로 일자 · 세로 LAYER 또는 STEP · 값 MOVE(파랑) 또는 재공(빨강).
   세로축은 전부 보여 준다. 화면에 보이는 만큼만 그리고 스크롤에 맞춰 잇는다.
--------------------------------------------------------------------- */
// 기간은 팝업에서 고른다. 기본 7일, 최대 30일 전까지 볼 수 있다.
let HEAT = { axis: "layer", metric: "move", days: 7, prod: [], plan: [],
             data: null, at: 0 };

function openHeat() {
  document.getElementById("hmmask").classList.add("on");
  loadHeat();
}

function closeHeat(ev) {
  if (ev && ev.target !== ev.currentTarget) { return; }
  document.getElementById("hmmask").classList.remove("on");
}

function setHeat(k, v) {
  // STEP 축은 수가 많아 PLAN 하나로 좁혀야 읽을 수 있다.
  if (k === "axis" && v === "step" && HEAT.plan.length !== 1) {
    const box = document.getElementById("hmBody");
    box.innerHTML = `<div class="minittl">STEP 으로 보려면 PLAN 을 `
      + `하나만 고르세요. 지금 `
      + `${HEAT.plan.length ? HEAT.plan.length + "개" : "전체"} 선택 중입니다.`
      + `</div>`;
    return;
  }
  HEAT[k] = v;
  ["move", "wip"].forEach(x =>
    document.getElementById("hm_" + x).className =
      (HEAT.metric === x) ? "on" : "");
  ["layer", "step"].forEach(x =>
    document.getElementById("hm_" + x).className =
      (HEAT.axis === x) ? "on" : "");
  [7, 14, 30].forEach(x =>
    document.getElementById("hm_d" + x).className =
      (HEAT.days === x) ? "on" : "");
  loadHeat();
}

// 히트맵 필터. 좌측 필터와 같은 규칙을 쓴다.
//   ALL 을 켜면 전부, 끄면 전부 해제된다.
//   '전부 해제' 는 전체가 아니므로 그동안은 조회하지 않는다.
function heatPicked(which, isAll) {
  const id = which === "prod" ? "hmpm" : "hmlm";
  const box = document.getElementById(id);
  const all = box.querySelector("input[data-all]");

  if (isAll) {
    const on = all.checked;
    box.querySelectorAll("input:not([data-all])")
       .forEach(x => { x.checked = on; });
  }
  const opts = [...box.querySelectorAll("input:not([data-all])")];
  const sel = opts.filter(x => x.checked).map(x => x.value);
  if (all) { all.checked = (sel.length === opts.length && opts.length > 0); }

  HEAT[which] = (sel.length === opts.length) ? [] : sel;

  const lb = which === "prod" ? "제품" : "PLAN";
  const btn = document.getElementById(which === "prod" ? "hmpb" : "hmlb");
  btn.innerHTML = `${sel.length === 0 ? lb + " 선택 없음"
    : lb + " " + (HEAT[which].length ? HEAT[which].length + "개" : "전체")}`
    + ` &#9662;`;
  btn.title = HEAT[which].length ? HEAT[which].join(", ") : `${lb} 전체`;

  if (sel.length === 0) { return; }      // 고르면 그때 조회한다
  loadHeat();
}

// 메뉴를 그린다. 좌측 필터와 같은 모양 · 같은 규칙이다.
function heatMenu(which, opts) {
  const id = which === "prod" ? "hmpm" : "hmlm";
  const btn = which === "prod" ? "hmpb" : "hmlb";
  const on = HEAT[which].length ? new Set(HEAT[which]) : new Set(opts);
  const isAll = !HEAT[which].length;
  document.getElementById(id).innerHTML =
    `<label class="dfall"><input type="checkbox" data-all`
    + `${isAll ? " checked" : ""}`
    + ` onchange="heatPicked('${which}', true)">ALL</label>`
    + `<input class="ddq" type="text" placeholder="검색"`
    + ` oninput="heatSearch('${id}')" onclick="event.stopPropagation()">`
    + opts.map(o => `<label data-opt="${o}"><input type="checkbox"`
        + ` value="${o}"${on.has(o) ? " checked" : ""}`
        + ` onchange="heatPicked('${which}', false)">${o}</label>`).join("");
  const lb = which === "prod" ? "제품" : "PLAN";
  const sel = HEAT[which];
  const b = document.getElementById(btn);
  b.innerHTML = `${lb} ${sel.length ? sel.length + "개" : "전체"} &#9662;`;
  b.title = sel.length ? sel.join(", ") : `${lb} 전체`;
}

function heatSearch(id) {
  const q = (document.querySelector("#" + id + " .ddq").value || "")
    .trim().toUpperCase();
  document.querySelectorAll("#" + id + " label[data-opt]").forEach(el => {
    el.style.display = (!q || el.dataset.opt.toUpperCase().indexOf(q) >= 0)
      ? "" : "none";
  });
}

function loadHeat() {
  const box = document.getElementById("hmBody");
  box.innerHTML = `<div class="minittl">불러오는 중…</div>`;
  const q = "line=" + encodeURIComponent(LINE)
    + "&axis=" + HEAT.axis + "&metric=" + HEAT.metric
    + "&days=" + HEAT.days
    + "&prod2=" + encodeURIComponent(HEAT.prod.join(","))
    + "&plan=" + encodeURIComponent(HEAT.plan.join(","))
    + "&biz_date=" + encodeURIComponent(SNAP_DATE || "");
  fetch("/api/heatmap/?" + q).then(r => r.json()).then(d => {
    HEAT.data = d;
    if (d.options) {
      heatMenu("prod", d.options.prod || []);
      heatMenu("plan", d.options.plan || []);
    }
    renderHeat();
  });
}

function heatColor(v, mx) {
  if (!v || !mx) { return "#fff"; }
  const t = Math.min(1, v / mx);
  // MOVE 는 파랑, 재공은 빨강. 흰색에서 짙어진다.
  return (HEAT.metric === "wip")
    ? `rgba(200,30,40,${(0.08 + t * 0.85).toFixed(2)})`
    : `rgba(30,80,190,${(0.08 + t * 0.85).toFixed(2)})`;
}

function renderHeat() {
  const d = HEAT.data || {};
  const box = document.getElementById("hmBody");
  if (!d.ready || !(d.keys || []).length) {
    box.innerHTML = `<div class="minittl">${d.reason || "데이터가 없습니다"}</div>`;
    return;
  }
  const head = `<tr><th class="hk">${d.axis === "layer" ? "LAYER" : "STEP"}</th>`
    + d.dates.map(x => `<th>${x.slice(5)}</th>`).join("") + `</tr>`;
  HEAT.at = 0;
  box.innerHTML = `<table class="hmt"><thead>${head}</thead>`
    + `<tbody id="hmTb"></tbody></table>`;
  heatMore(60);
  requestAnimationFrame(() => stickDiag("첫 렌더"));
  box.onscroll = () => {
    stickDiag("스크롤 " + Math.round(box.scrollTop));
    if (HEAT.at >= (d.keys || []).length) { return; }
    if (box.scrollTop + box.clientHeight < box.scrollHeight - 200) { return; }
    heatMore(60);
  };
}

// 틀고정 진단. ?debug=stick 으로 켠다.
//   헤더와 본문 셀이 실제로 어디에 놓이는지 재서 겹침을 확인한다.
function stickDiag(tag) {
  if (location.search.indexOf("debug=stick") < 0) { return; }
  const box = document.getElementById("hmBody");
  const th = box && box.querySelector(".hmt thead th:nth-child(2)");
  const td = box && box.querySelector(".hmt tbody tr td:nth-child(2)");
  if (!th || !td) { return; }
  const b = box.getBoundingClientRect();
  const h = th.getBoundingClientRect();
  const t = td.getBoundingClientRect();
  const cs = getComputedStyle(box);
  console.log(`[STICK] ${tag}`, {
    "상자 위": Math.round(b.top),
    "상자 padTop": cs.paddingTop,
    "헤더 위": Math.round(h.top),
    "헤더 아래": Math.round(h.bottom),
    "첫 셀 위": Math.round(t.top),
    "겹침(px)": Math.round(h.bottom - t.top),
    "헤더 z": getComputedStyle(th).zIndex,
    "셀 z": getComputedStyle(td).zIndex,
    "헤더 배경": getComputedStyle(th).backgroundColor,
  });
}

// 칸을 누르면 팝업을 닫고 그 조건으로 화면을 좁힌 뒤 표까지 연다.
//   날짜 · LAYER · 제품 · PLAN 은 좌측 필터에 그대로 있다.
//   STEP 축일 때는 좌측에 STEP 필터가 없어 표 쪽 조건으로 넘긴다.
function heatPick(key, date) {
  const isStep = HEAT.axis === "step";
  closeHeat();

  SNAP_DATE = date;
  SNAP_SHIFT = "";
  if (!isStep) { LAYERS = [key]; }
  if (HEAT.prod.length) { PROD2 = HEAT.prod.slice(); }
  if (HEAT.plan.length) { PLANS = HEAT.plan.slice(); }

  // 좌측 차트·원인 조건은 남겨 두면 서로 어긋난다. 여기서 정리한다.
  dfReset();
  CZ_STACK = []; CZ_WIDE = null; CZ_SEL = { i: -1, path: [] };
  czAskClose();

  const lb = isStep ? `${date} · STEP ${key}` : `${date} · LAYER ${key}`;
  loadSummary();
  // 표는 STEP 축일 때만 따로 조건을 준다(LAYER 는 좌측 필터가 이미 건다).
  openDrill(isStep ? { step_seq: key } : {}, lb, "heat");
}

function heatMore(n) {
  const d = HEAT.data || {};
  const tb = document.getElementById("hmTb");
  if (!tb) { return; }
  const to = Math.min(HEAT.at + n, d.keys.length);
  const unit = (HEAT.metric === "wip") ? "매" : "매";
  let out = "";
  for (let i = HEAT.at; i < to; i++) {
    out += `<tr><td class="hk">${d.keys[i]}</td>`;
    out += d.rows[i].map((v, k) =>
      `<td class="hcell" style="background:${heatColor(v, d.max)}"`
      + ` onclick="heatPick('${d.keys[i]}','${d.dates[k]}')"`
      + ` title="${d.keys[i]} · ${d.dates[k]} · ${nf(v)}${unit}`
      + `\n누르면 이 조건으로 화면을 좁힙니다">`
      + `${v ? kfmt(v) : ""}</td>`).join("");
    out += `</tr>`;
  }
  tb.insertAdjacentHTML("beforeend", out);
  HEAT.at = to;
}



/* 라인 요약 카드 --------------------------------------------------------
   매수가 많이 쌓인 곳을 순서대로 놓고, 그것이 만든 W/T 저해를 잇는다.
   카드를 누르면 그 원인으로 화면 전체가 좁혀진다.
--------------------------------------------------------------------- */
// 설비 카드에서 '전 라인' 을 켜면 그 설비 앞의 다른 라인 재공까지 본다.
const INS_ALL = { neck: false, eqp: false };
const INS_ALL_DATA = {};

function insAll(key) {
  INS_ALL[key] = !INS_ALL[key];
  if (!INS_ALL[key]) { delete INS_ALL_DATA[key]; renderInsight(); return; }
  const q = "kind=" + encodeURIComponent(key)
    + "&types=" + encodeURIComponent(selectedTypes().join(","));
  fetch("/api/eqp-wait/?" + q).then(r => r.json()).then(d => {
    INS_ALL_DATA[key] = d;
    renderInsight();
  });
}

// 전 라인 보기일 때 그 설비의 라인별 대기재공을 한 줄로.
function insAllRow(key, eqp) {
  const d = INS_ALL_DATA[key];
  if (!d) { return ""; }
  const hit = (d.rows || []).find(x => x.name === eqp);
  if (!hit) { return ""; }
  const parts = Object.keys(hit.by_line)
    .map(ln => `${(d.labels || {})[ln] || ln} ${kfmt(hit.by_line[ln])}`);
  return `<div class="insall-row">전 라인 ${kfmt(hit.qty)}매`
    + ` · ${parts.join(" · ")}</div>`;
}

let INS_FULL = null;          // 전체 순위로 펼친 카드 키

function insFull(key) {
  INS_FULL = (INS_FULL === key) ? null : key;
  renderInsight();
}

function renderInsight() {
  const box = document.getElementById("insight");
  const cards = (DATA && DATA.insights) || [];
  const any = cards.some(c => (c.rank || []).length);
  if (!any) { box.style.display = "none"; return; }
  box.style.display = "";

  // 제목에도 지금 걸린 조건을 계층으로 보여 준다.
  const cond = dfTitle();
  document.getElementById("insTtl").innerHTML =
    "지금 이 라인의 문제"
    + (cond ? ` <em>&gt; ${cond}</em>` : "");
  document.getElementById("insSub").textContent =
    `비율은 라인 전체 재공 ${nf((DATA.total || {}).qty || 0)}매 대비`;

  const body = document.getElementById("insBody");
  body.classList.toggle("full", !!INS_FULL);

  body.innerHTML = cards.map((c, ci) => {
    if (!(c.rank || []).length) { return ""; }
    // 전체 순위로 펼친 카드가 있으면 그 카드만 보인다.
    if (INS_FULL && INS_FULL !== c.key) { return ""; }
    const shown = INS_FULL === c.key ? c.rank : c.rank.slice(0, 5);
    const rows = shown.map((x, n) => {
      // 경로: 첫 칸은 굵게, 나머지는 > 로 잇는다
      const p = x.path.map((v, k) => k === 0
        ? `<b>${v}</b>` : `<span>${v}</span>`).join(`<i>&gt;</i>`);
      // 호환 그룹에서 막힌 설비가 있으면 그 때문에 neck 이 된 것이다.
      const bl = x.blocked
        ? `<span class="insbl" title="호환 그룹의 이 설비가 막혀 있다">`
          + `막힘 ${x.blocked.map(z => z.name).join(", ")}</span>`
        : (c.key === "neck" ? `<span class="insbl ok">순수 몰림</span>` : "");
      // 값과 단위를 또렷하게. 비율은 전체 대비(제품 대비) 순으로 적는다.
      const idle = (x.idle_avg !== null && x.idle_avg !== undefined)
        ? ` · 평균 ${x.idle_avg}일 대기` : "";
      const pp = (x.ppct !== null && x.ppct !== undefined)
        ? `<em>(${x.ppct}%)</em>` : "";
      const tip = x.path.join(" > ")
        + `  ${nf(x.qty)}매 (전체 ${x.pct}%`
        + (x.ppct !== null && x.ppct !== undefined
           ? ` · ${x.prod_name} 안에서 ${x.ppct}%` : "") + ")"
        + `  W/T 0 ${nf(x.wt0_qty)}매`
        + (x.idle_avg !== null && x.idle_avg !== undefined
           ? `  평균 ${x.idle_avg}일 대기` : "")
        + (x.blocked ? `  막힘 ${x.blocked.map(z => z.name).join(", ")}` : "");
      const allrow = (INS_ALL[c.key])
        ? insAllRow(c.key, x.path[x.path.length - 1]) : "";
      return `<div class="insline" title="${tip}" onclick="insPick(${ci},${n})">`
        + `<span class="insno">${n + 1}</span>`
        + `<span class="inspath">${p}</span>${bl}`
        + `<span class="insqty">${nf(x.qty)}<em>매</em></span>`
        + `<span class="inspc">${x.pct}%${pp}</span>`
        + `<span class="inswt">W/T 0 ${nf(x.wt0_qty)}매${idle}</span></div>`
        + allrow;
    }).join("");
    // 설비는 여러 라인이 나눠 쓴다. 전 라인 대기재공을 볼 수 있게 한다.
    const eqpCard = (c.key === "neck" || c.key === "eqp");
    const tg = eqpCard
      ? `<button class="insall ${INS_ALL[c.key] ? "on" : ""}"`
        + ` onclick="event.stopPropagation();insAll('${c.key}')"`
        + ` title="라인 구분 없이 그 설비 앞에 선 재공을 모두 본다">`
        + `전 라인</button>`
      : "";
    const fb = `<button class="insall ${INS_FULL === c.key ? "on" : ""}"`
      + ` onclick="event.stopPropagation();insFull('${c.key}')"`
      + ` title="이 카드만 남기고 상위 20개를 본다">전체 순위</button>`;
    // 전체 순위면 네 칸으로 나눠 세로 길이를 줄인다.
    const inner = (INS_FULL === c.key)
      ? `<div class="insgrid">${rows}</div>` : rows;
    return `<div class="inscard"><div class="insh">${c.title}${tg}${fb}`
      + `<span>${nf(c.qty)}매</span></div>${inner}</div>`;
  }).join("");
}

// 카드를 누르면 그 원인으로 화면 전체를 좁힌다.
function insPick(ci, n) {
  const c = (DATA.insights || [])[ci];
  const x = c && (c.rank || [])[n];
  if (!x) { return; }
  // 다른 곳에서 건 조건은 그대로 둔다. 요약카드가 건 것만 새로 잡는다.
  //   (제품별 비율에서 고른 제품이 풀리면 안 된다)
  DF_X = {};
  if (DF_SRC.cause === "insight") { DF_CAUSE = null; }
  if (DF_SRC.layer === "insight") { delete DF.layer; }
  const p = x.path.slice();
  // B/N · PREVENT 는 접두가 없어 첫 칸이 곧 AREA(또는 LINE)다.
  const head = (c.key === "neck" || c.key === "tip") ? c.key : p.shift();

  // 요약카드 전용 조건. 최상단 필터를 건드리면 요약카드 자체가 바뀐다.
  DF_X = {};
  if (c.key === "lot") {
    // [제품, (모듈), LAYER]
    if (p[0]) { DF_X.x_prod = [p[0]]; }
    if (p.length === 3) { DF_X.x_mod = [p[1]]; }
    if (p.length >= 2) {
      setCond("layer", p[p.length - 1], null, null, true, "insight");
    }
  } else {
    // [AREA, 설비]
    if (p[0]) { DF_X.x_area = [p[0]]; }
    if (p[1]) { DF_X.x_eqp = [p[1]]; }
  }

  // 원인도 함께 건다. 카드 머리가 곧 원인이다.
  const CAUSE_OF = {
    "HOLD": ["Hold", null],
    "예약제외": ["Wait성 진행불가", "예약제외"],
    "FTP": ["Wait성 진행불가", "FTP"],
  };
  // B/N · PREVENT 카드는 접두가 없다. 카드 종류로 판정한다.
  const cz = (c.key === "neck") ? ["Bottleneck", null]
    : (c.key === "tip") ? ["Wait성 진행불가", "TIP"]
    : (CAUSE_OF[head] || ["Wait성 진행불가", "설비이슈"]);
  const i = (DATA.causes || []).findIndex(g => g.name === cz[0]);
  DF_CAUSE = { i: i < 0 ? 0 : i,
               or: [{ big: cz[0], mid: cz[1], sub: null }] };
  DF_SRC.cause = "insight";      // 원인 차트가 아니라 요약카드에서 걸었다
  syncFromDF();
}


/* 선택 표시 · 화살표 진단 ---------------------------------------------
   실제로 화면에 보이는지까지 잰다. 코드가 돌았는지가 아니라
   그려진 픽셀과 화면 좌표를 확인한다. 값·이름은 보내지 않는다.
   주소에 ?debug=mark 를 붙이면 켜진다.
--------------------------------------------------------------------- */
const DBG_MARK = location.search.indexOf("debug=mark") >= 0;
let MARK_TIMER = null;

function dbgMark(why) {
  if (!DBG_MARK) { return; }
  clearTimeout(MARK_TIMER);
  MARK_TIMER = setTimeout(() => {
    const items = [{ sel: "── " + (why || "변화") + " ──", note: "" }];

    // 1) 조건 상태
    items.push({ sel: "  조건 개수",
                 note: `DF=${Object.keys(DF).length} cause=${!!DF_CAUSE}`
                   + ` X=${Object.keys(DF_X).length}`
                   + ` stack=${CZ_STACK.length} wide=${!!CZ_WIDE}` });

    // 2) 차트마다 선택 표시가 설정됐는지 + 실제로 그려졌는지
    const list = [["원차트", dnChart], ["재공", null], ["W/T", wtChart],
                  ["W/T0", wt0Chart], ["AREA", areaChart]];
    czCharts.forEach((c, i) => list.push(["원인" + i, c]));
    czStackCharts.forEach((c, i) => list.push(["세부" + i, c]));
    balCharts.forEach((c, i) => list.push(["BAL" + i, c]));
    list.forEach(([nm, ch]) => {
      if (!ch) { return; }
      const setN = ch.$selSet ? ch.$selSet.size : 0;
      const pairN = ch.$selPairs ? ch.$selPairs.length : 0;
      const selI = (ch.$sel === undefined || ch.$sel === null) ? -1 : ch.$sel;
      const dimN = ch.$dim ? ch.$dim.filter(Boolean).length : 0;
      const drawn = ch.$drawnSel || 0;      // popSelected 가 실제로 그린 수
      items.push({ sel: "  " + nm,
                   note: `selSet=${setN} pairs=${pairN} sel=${selI}`
                     + ` dim=${dimN} 그려짐=${drawn}` });
    });

    // 3) 화살표가 실제로 보이는지
    const svg = document.getElementById("flow");
    if (!svg) {
      items.push({ sel: "  화살표", note: "svg 요소가 없다" });
    } else {
      const r = svg.getBoundingClientRect();
      const cs = getComputedStyle(svg);
      const paths = svg.querySelectorAll("path[marker-end]");
      items.push({ sel: "  화살표 svg",
                   note: `display=${cs.display} z=${cs.zIndex}`
                     + ` w=${Math.round(r.width)} h=${Math.round(r.height)}`
                     + ` 선=${paths.length}개` });
      paths.forEach((pt, k) => {
        const b = pt.getBoundingClientRect();
        items.push({ sel: `    선 ${k + 1}`,
                     note: `x=${Math.round(b.left)}~${Math.round(b.right)}`
                       + ` y=${Math.round(b.top)}~${Math.round(b.bottom)}`
                       + ` 화면안=${b.width > 0 && b.height >= 0
                            && b.right > 0 && b.left < innerWidth}` });
      });
    }

    fetch("/api/debug-layout/", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kind: "mark", items: items })
    });
  }, 400);
}

/* 클릭 진단 ------------------------------------------------------------
   어느 막대·조각을 눌렀는지 서버 터미널에 남긴다.
   주소에 ?debug=pick 을 붙이면 켜진다.
--------------------------------------------------------------------- */
const DBG_PICK = location.search.indexOf("debug=pick") >= 0;
const DBG_LAYOUT = location.search.indexOf("debug=overlap") >= 0;

/* 화면이 바뀔 때마다 카드·차트의 자리를 서버 터미널에 남긴다.
   값이나 이름은 보내지 않는다. id / class 와 좌표·크기만 본다.
--------------------------------------------------------------------- */
let DBG_TIMER = null;

function dbgSnapshot(why) {

    });
    seen.forEach(x => items.push({

                     - cz.getBoundingClientRect().top) + "px" });
    }
    if (cz && smLast) {
      items.push({ sel: "  아래선 차이(원인분석 vs 좌측 마지막)",
                   note: Math.round(cz.getBoundingClientRect().bottom
                     - smLast.getBoundingClientRect().bottom) + "px" });
    }
    items.push({ sel: "  가로 초과",
                 note: (document.documentElement.scrollWidth
                        - document.documentElement.clientWidth) + "px" });

/* 레이아웃 진단 --------------------------------------------------------
   화면 오른쪽을 넘는 요소를 재서 서버 로그로 보낸다.
   콘솔 복사가 어려울 때 터미널에서 바로 확인한다.
   호출: 주소창에 ?debug=layout 을 붙이거나 콘솔에서 checkLayout()
----------------------------------------------------------------------- */
function selOf(el) {
  if (!el || el === document.documentElement) { return "html"; }
  let t = el.tagName.toLowerCase();
  if (el.id) { t += "#" + el.id; }
  else if (el.className && typeof el.className === "string") {
    const c = el.className.trim().split(/\s+/)[0];
    if (c) { t += "." + c; }
  }
  return t;
}

function checkLayout() {
  const vw = document.documentElement.clientWidth;
  const items = [];
  document.querySelectorAll("body *").forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) { return; }
    const over = Math.round(r.right - vw);
    if (over > 1) {
      items.push({ over: over, sel: selOf(el),
                   w: Math.round(r.width),
                   parent: selOf(el.parentElement) });
    }
  });
  // 바깥쪽(폭이 큰 것)부터 본다. 대개 첫 줄이 원인이다.
  items.sort((a, b) => b.w - a.w);
  fetch("/api/debug-layout/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ vw: vw,
                           sw: document.documentElement.scrollWidth,
                           items: items })
  });
  return items.length + "개 초과. 서버 터미널을 확인하세요.";
}

/* 선택 테두리와 내용이 겹치는지 잰다.
   콘솔에서 checkOverlap() 을 부르면 서버 터미널에 찍힌다.
--------------------------------------------------------------------- */
function checkOverlap() {
  const items = [];
  document.querySelectorAll(".czcol").forEach((col, n) => {
    const cs = getComputedStyle(col);
    const box = col.getBoundingClientRect();
    const on = col.classList.contains("czsrc");
    items.push({
      sel: `czcol#${n}${on ? " (선택됨)" : ""}`,
      note: `padding=${cs.paddingTop}/${cs.paddingRight}/`
        + `${cs.paddingBottom}/${cs.paddingLeft}`
        + ` box-shadow=${cs.boxShadow !== "none" ? "있음" : "없음"}`
        + ` w=${Math.round(box.width)} h=${Math.round(box.height)}`
    });
    // 자식이 테두리(안쪽 2px)를 침범하는지
    [...col.children].forEach((ch, k) => {
      const r = ch.getBoundingClientRect();
      const L = Math.round(r.left - box.left);
      const R = Math.round(box.right - r.right);
      const T = Math.round(r.top - box.top);
      const B = Math.round(box.bottom - r.bottom);
      const bad = [];
      if (L < 3) { bad.push("좌" + L); }
      if (R < 3) { bad.push("우" + R); }
      if (T < 3) { bad.push("상" + T); }
      if (B < 3) { bad.push("하" + B); }
      items.push({
        sel: `  └ ${ch.tagName.toLowerCase()}`
          + (ch.className ? "." + String(ch.className).split(" ")[0] : ""),
        note: `여백 상${T} 우${R} 하${B} 좌${L}`
          + (bad.length ? "   !! 테두리와 겹침(" + bad.join(",") + ")" : "")
      });
    });
  });
  // 좌측 세로축과 원인 분석 카드의 아래선이 맞는지도 함께 잰다.
  const sm = document.querySelector(".summary");
  const lc = document.querySelector(".rowcards > .leftcol");
  const cz = document.getElementById("czcard");
  if (sm && lc && cz) {
    const a = sm.getBoundingClientRect();
    const b = lc.getBoundingClientRect();
    const c = cz.getBoundingClientRect();
    // 좌우 첫 카드의 윗선이 어디서 어긋나는지 하나씩 잰다.
    items.push({ sel: "── 상단 정렬 ──", note: "" });
    const cz = document.getElementById("czcard");
    const far = document.querySelector(".rowcards > .farcol");
    const f1 = far && far.firstElementChild;
    [["czcard(원인 분석)", cz], ["farcol(우측 열)", far],
     ["우측 첫 카드", f1]].forEach(([nm, el]) => {
      if (!el) { return; }
      const r = el.getBoundingClientRect();
      const cs = getComputedStyle(el);
      items.push({ sel: "  " + nm,
                   note: `top=${Math.round(r.top)}`
                     + ` margin-top=${cs.marginTop} border-top=${cs.borderTopWidth}`
                     + ` padding-top=${cs.paddingTop}`
                     + (el.id ? "" : ` <${el.tagName.toLowerCase()}.`
                        + String(el.className).split(" ")[0] + ">") });
    });
    if (cz && f1) {
      const d = Math.round(f1.getBoundingClientRect().top
                           - cz.getBoundingClientRect().top);
      items.push({ sel: "  윗선 차이", note: `${d}px`
                   + (Math.abs(d) <= 1 ? "  맞음" : "  어긋남") });
    }

    items.push({ sel: "── 높이 정렬 ──", note: "" });
    items.push({ sel: "summary(좌측 전체)",
                 note: `top=${Math.round(a.top)} bottom=${Math.round(a.bottom)}`
                   + ` h=${Math.round(a.height)}` });
    items.push({ sel: "leftcol(원인 분석 열)",
                 note: `top=${Math.round(b.top)} bottom=${Math.round(b.bottom)}`
                   + ` h=${Math.round(b.height)}` });
    items.push({ sel: "czcard(원인 분석 카드)",
                 note: `top=${Math.round(c.top)} bottom=${Math.round(c.bottom)}`
                   + ` h=${Math.round(c.height)}` });
    // summary 는 마지막 카드에 margin-bottom 이 있어 컨테이너 bottom 과
    // 눈에 보이는 카드 아래선이 다르다. 마지막 카드를 직접 잰다.
    const lastL = sm.querySelector(".cell:last-of-type");
    if (lastL) {
      items.push({ sel: "  좌측 마지막 카드 id", note: lastL.id || "(없음)" });
    }
    if (lastL) {
      const d = lastL.getBoundingClientRect();
      const ms = getComputedStyle(lastL).marginBottom;
      items.push({ sel: "  좌측 마지막 카드",
                   note: `bottom=${Math.round(d.bottom)} margin-bottom=${ms}` });
      items.push({ sel: "  눈에 보이는 차이",
                   note: `${Math.round(c.bottom - d.bottom)}px` });
    }
    const gap = Math.round(c.bottom - a.bottom);
    items.push({ sel: "아래선 차이",
                 note: `${gap}px  `
                   + (Math.abs(gap) <= 2 ? "맞음"
                      : (gap > 0 ? "원인 분석이 더 아래로 내려감"
                                 : "원인 분석이 더 짧음")) });
    // 내부 차트 높이
    document.querySelectorAll(".cz3 > .czcol").forEach((el, k) => {
      const r = el.getBoundingClientRect();
      items.push({ sel: `  cz3 칸 ${k}`, note: `h=${Math.round(r.height)}` });
    });
  }

  fetch("/api/debug-layout/", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ kind: "overlap", items: items })
  });
  return "서버 터미널을 확인하세요.";
}

      if (n.children && n.children.length) {

          [{ name: n.name, kind: n.kind || "sub" }]);

        DF_SRC.cause = "cause";

                     mid: (CZ_WIDE.path.find(p => p.kind === "mid") || {}).name

          DRILL_KEY.i === i ? DRILL_KEY.list : null);

// 표가 어느 뷰에서 나왔는지. 다른 뷰를 누르면 이전 선택 표시를 지운다.
let DRILL_SRC = "";

function clearOtherSelections(src) {
  if (DRILL_SRC === src) { return; }
  if (!src) { DRILL_SRC = ""; return; }
  // 표시는 syncFromDF 가 맞춘다. 여기서는 출처만 기록한다.
  DRILL_SRC = src;
}

// 표 안에서 필터를 걸 컬럼
const FILTER_COLS = ["line", "전산라인", "dest_line_id", "fa_object4",
  "prod1", "prod2", "lot_id", "lot_type", "wt", "lot_status", "proc_id",
  "module1", "module2", "layer_id", "AREA", "step_seq", "step_desc",
  "eqpgroup", "eqpgroup_cham", "recipe_id", "cause"];

function drillSort(k) {
  const i = SORT_KEYS.findIndex(x => x.k === k);
  if (i < 0) { SORT_KEYS.push({ k: k, dir: 1 }); }
  else if (SORT_KEYS[i].dir === 1) { SORT_KEYS[i].dir = -1; }
  else { SORT_KEYS.splice(i, 1); }
  renderDrillTable();
}

function wtKey(v) {
  const n = Number(v);
  if (!isFinite(n) || n <= 0) { return "0"; }
  if (n <= 1) { return "0-1"; }
  if (n <= 2) { return "1-2"; }
  if (n <= 3) { return "2-3"; }
  if (n <= 4) { return "3-4"; }
  if (n <= 5) { return "4-5"; }
  return "5+";
}
const WT_LABEL = { "0": "WT = 0", "0-1": "0 < WT ≤ 1", "1-2": "1 < WT ≤ 2",
  "2-3": "2 < WT ≤ 3", "3-4": "3 < WT ≤ 4", "4-5": "4 < WT ≤ 5", "5+": "WT > 5" };

function passFilter(r) {
  for (const k in DFILT) {
    const set = DFILT[k];
    if (!set || !set.size) { continue; }
    const v = (r[k] === null || r[k] === undefined || r[k] === "")
      ? "(없음)" : String(r[k]);
    if (!set.has(v)) { return false; }
  }
  if (DFILT_WT && DFILT_WT.size && !DFILT_WT.has(wtKey(r.wt))) { return false; }
  return true;
}

function filteredRows() {
  if (FCACHE) { return FCACHE; }
  const rows = (DRILL_DATA && DRILL_DATA.rows) ? DRILL_DATA.rows : [];
  let need = !!(DFILT_WT && DFILT_WT.size);
  for (const k in DFILT) { if (DFILT[k] && DFILT[k].size) { need = true; break; } }
  FCACHE = need ? rows.filter(passFilter) : rows.slice();
  return FCACHE;
}

function sortedRows() {
  const rows = filteredRows();          // 캐시된 배열을 그대로 정렬한다
  if (!SORT_KEYS.length) { return rows; }
  const num = (v) => { const n = parseFloat(v); return isNaN(n) ? null : n; };
  rows.sort((a, b) => {
    for (const s of SORT_KEYS) {
      let x = a[s.k], y = b[s.k];
      if (x === undefined || x === null || x === "") { x = null; }
      if (y === undefined || y === null || y === "") { y = null; }
      if (x === null && y === null) { continue; }
      if (x === null) { return 1; }
      if (y === null) { return -1; }
      const nx = num(x), ny = num(y);
      let c;
      if (nx !== null && ny !== null) { c = nx - ny; }
      else { c = String(x).localeCompare(String(y), "ko"); }
      if (c) { return c * s.dir; }
    }
    return 0;
  });
  return rows;
}

/* 컬럼 표시/숨김 ------------------------------------------------------- */
function toggleCol(k, on) {

  syncAllColBox();

}

/* 표 필터 -------------------------------------------------------------- */
function dfOpen(k) {
  const el = document.getElementById("df_" + k);
  const open = el.classList.contains("open");
  document.querySelectorAll(".dd.open").forEach(d => d.classList.remove("open"));
  if (!open) { el.classList.add("open"); }
}

function dfSearch(k) {
  const q = (document.getElementById("dfq_" + k).value || "").trim().toLowerCase();
  document.querySelectorAll("#dfm_" + k + " label[data-opt]").forEach(el => {
    const v = (el.getAttribute("data-opt") || "").toLowerCase();
    el.style.display = (!q || v.indexOf(q) >= 0) ? "" : "none";
  });
}

function dfPick(ev, k, idx) {
  const box = document.getElementById("dfm_" + k);
  const boxes = [...box.querySelectorAll("input[data-opt-i]")];
  if (ev.shiftKey && dfLast[k] !== undefined) {      // shift 범위 선택
    const a = Math.min(dfLast[k], idx), b = Math.max(dfLast[k], idx);
    for (let i = a; i <= b; i++) { boxes[i].checked = ev.target.checked; }
  }
  dfLast[k] = idx;
  const sel = new Set(boxes.filter(x => x.checked).map(x => x.value));
  const target = (k === "wt") ? "wt" : k;
  if (sel.size === boxes.length) {                   // 전부 = 필터 없음
    if (target === "wt") { DFILT_WT = null; } else { delete DFILT[k]; }
  } else if (target === "wt") { DFILT_WT = sel; } else { DFILT[k] = sel; }
  const all = document.querySelector("#dfm_" + k + " input[data-all]");
  if (all) { all.checked = (sel.size === boxes.length); }
  dfLabel(k, sel.size, boxes.length);
  FCACHE = null;                        // 필터가 바뀌었으니 다시 거른다
  renderDrillTable();
}

function dfLabel(k, n, total) {
  const b = document.getElementById("dfb_" + k);
  if (!b) { return; }
  const t = (DRILL_DATA.cols.find(c => c.k === k) || {}).t || k;
  const all = (n === total);
  b.innerHTML = `<span>${t}${all ? "" : " " + n}</span><span>&#9662;</span>`;
  b.classList.toggle("on", !all);
}

function dfOptions(k) {
  const rows = (DRILL_DATA && DRILL_DATA.rows) ? DRILL_DATA.rows : [];
  if (k === "wt") { return Object.keys(WT_LABEL); }
  const set = new Set();
  for (const r of rows) {
    const v = (r[k] === null || r[k] === undefined || r[k] === "")
      ? "(없음)" : String(r[k]);
    set.add(v);
  }
  // 업무 순서가 있는 컬럼은 그 순서를 먼저 쓴다(lot_type, PLAN).
  const pri = ((DRILL_DATA && DRILL_DATA.order) || {})[k] || [];
  const at = (v) => {
    const i = pri.indexOf(v);
    return i < 0 ? pri.length : i;
  };
  return [...set].sort((a, b) =>
    (at(a) - at(b)) || a.localeCompare(b, "ko"));
}

// 보이는 컬럼과 필터·정렬이 적용된 그대로 탭 구분으로 복사한다.
function copyDrill() {
  if (!DRILL_DATA) { return; }
  const cols = drillCols().filter(c => !HIDE_COLS[c.k]);
  const rows = sortedRows();
  const line = (r) => cols.map(c => {
    const v = r[c.k];
    if (v === null || v === undefined) { return ""; }
    return c.k === "wt" ? Number(v).toFixed(1) : String(v);
  }).join("\t");
  const text = [cols.map(c => c.t).join("\t")]
    .concat(rows.map(line)).join("\n");

  const done = () => {
    const el = document.getElementById("drillCount");
    if (!el) { return; }
    const keep = el.textContent;
    el.textContent = nf(rows.length) + "행 복사됨";
    setTimeout(() => { el.textContent = keep; }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else { fallbackCopy(text, done); }
}

function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { /* 무시 */ }
  document.body.removeChild(ta);
}

// 조건이 걸린 카드에 테두리와 개수 배지를 준다.
/* 조건이 걸린 카드마다 제목 우측에 '해제' 버튼을 붙인다.
   차트마다 따로 만들지 않고 한 곳에서 관리한다.
--------------------------------------------------------------------- */
// 카드마다 그 카드가 거는 조건. 여럿이면 함께 해제한다.
const CARD_COND = {
  wipcard: ["type", "iprod"], stcard: ["status"], wtcard: ["wt"],
  wt0card: ["wt0"], areacard: ["iarea"], balpanel: ["layer"],
  czcard: ["cause"],
};

function syncCardClear() {
  Object.keys(CARD_COND).forEach(id => {
    const card = document.getElementById(id);
    if (!card) { return; }
    const ttl = card.querySelector(".cellttl");
    if (!ttl) { return; }
    const keys = CARD_COND[id];
    const on = keys.some(k =>
      (k === "cause") ? !!DF_CAUSE : (DF[k] || []).length > 0);

    let btn = ttl.querySelector(".cardclr");
    if (!on) { if (btn) { btn.remove(); } return; }
    if (!btn) {
      btn = document.createElement("button");
      btn.className = "cardclr";
      btn.title = "이 차트에서 고른 조건을 해제한다";
      btn.textContent = "◀ 해제";
      btn.onclick = (e) => {
        e.stopPropagation();
        keys.forEach(k => {
          if (k === "cause") {
            czAskClose(); CZ_STACK = []; CZ_WIDE = null;
            CZ_SEL = { i: -1, path: [] };
            DF_CAUSE = null;
          } else { delete DF[k]; }
        });
        syncFromDF();
      };
      ttl.appendChild(btn);
    }
  });
}

// 조건이 하나라도 걸려 있으면 헤더의 해제 버튼을 보인다.
//   좌측 필터 · 차트 조건 · 원인 · 요약카드 조건을 모두 센다.
//   markActiveCards 안에 두면 그 뒤 코드가 실패할 때 함께 묻힌다.
function syncClearBtn() {
  const btn = document.getElementById("clearAllBtn");
  if (!btn) { return; }
  const left = PROD1.length || PROD2.length || AREAS.length
    || PLANS.length || LOTS.length || LAYERS.length;
  const any = Object.keys(DF).length || DF_CAUSE
    || Object.keys(DF_X).length || left;
  btn.style.display = any ? "inline-block" : "none";
  btn.textContent = "조건 ALL 해제";
}

function markActiveCards() {
  syncClearBtn();
  const on = {
    wipcard: (DF.type || []).length,
    stcard: (DF.status || []).length,
    wtcard: (DF.wt || []).length,
    wt0card: (DF.wt0 || []).length,
    czcard: causeSelNames().size,
    balpanel: (DF.layer || []).length,
  };
  Object.keys(on).forEach(id => {
    const c = document.getElementById(id);
    if (!c) { return; }
    c.classList.toggle("active", !!on[id]);
    c.setAttribute("data-n", on[id] || "");
  });
  syncCardClear();
}

function renderDrillHead() {
  const cols = allCols();
  const allOn = cols.every(c => !HIDE_COLS[c.k]);
  document.getElementById("drillCols").innerHTML =
    `<label><input type="checkbox" id="colAll" ${allOn ? "checked" : ""}`
