{% extends "flowmonitor/base.html" %}
{% load static %}
{% block body %}
<div class="layout">
  <div class="summary">
    <div class="gfilter">
      <div class="prodf" style="margin-bottom:8px">
        <label class="datef" id="datefw">
          <span id="snapDateLb">-</span>
          <input type="date" id="snapDate"
                 onchange="pickSnapDate(this.value)" title="비우면 최신">
        </label>
        <div class="dd" id="dsh">
          <button onclick="toggleProd('dsh')" id="shb">SHIFT 최신 &#9662;</button>
          <div class="menu" id="shm"></div>
        </div>
      </div>
      <div class="lineseg" id="lineseg">
        {% for l in lines %}
          <button data-line="{{ l.line }}" {% if not l.ready %}disabled
            title="아직 적재된 데이터가 없습니다"{% endif %}
            onclick="pickLine('{{ l.line }}')">{{ l.label }}</button>
        {% endfor %}
      </div>
      <div class="prodf">
        <div class="dd" id="dp1">
          <button onclick="toggleProd('dp1')" id="p1b">제품군 전체 &#9662;</button>
          <div class="menu" id="p1m"></div>
        </div>
        <div class="dd" id="dp2">
          <button onclick="toggleProd('dp2')" id="p2b">제품 전체 &#9662;</button>
          <div class="menu" id="p2m"></div>
        </div>
      </div>
    </div>

    <div id="err" class="err"></div>

    <!-- 재공 뷰 -->
    <div class="cell">
      <div class="wip">
        <div class="top">
          <div class="nums">
            <div><b id="wl">-</b><div class="lbl">재공 LOT</div></div>
            <div><b id="wq">-</b><div class="lbl">재공 매</div></div>
          </div>
          <div style="display:flex;gap:6px;align-items:center">
            <button class="rankbtn" onclick="pickTypeAll()"
                    title="lot_type 을 가리지 않고 전부 본다">전체 보기</button>
            <div class="dd" id="dd">
              <button onclick="toggleDd()" id="ddb">전체 &#9662;</button>
              <div class="menu" id="ddm"></div>
            </div>
          </div>
        </div>
        <div class="stack" id="ws"></div>
        <div class="stleg" id="wg"></div>
      </div>
    </div>

    <!-- status 뷰 -->
    <div class="cell">
      <div class="donut">
        <div class="legend" id="lg"></div>
        <div class="cv"><canvas id="dn"></canvas></div>
        <div class="pickinfo" id="dt"></div>
      </div>
    </div>

    <!-- WT 분포 뷰 -->
    <div class="cell">
      <div class="cellttl"><span>W/T 분포</span>
        <span class="seg">
          <button id="wu_lots" onclick="setWtUnit('lots')">LOT</button>
          <button class="on" id="wu_qty" onclick="setWtUnit('qty')">매</button>
        </span></div>
      <div style="height:190px"><canvas id="wtc"></canvas></div>
    </div>

    <!-- W/T 0 재공 분포 -->
    <div class="cell">
      <div class="cellttl"><span>W/T 0 재공 분포</span>
        <span class="seg">
          <button id="zu_lots" onclick="setWt0Unit('lots')">LOT</button>
          <button class="on" id="zu_qty" onclick="setWt0Unit('qty')">매</button>
        </span></div>
      <div class="stsum" id="wt0sum"></div>
      <div class="minittl" style="margin-bottom:6px">마지막 작업 이후 경과일 기준</div>
      <div style="height:210px"><canvas id="wt0c"></canvas></div>
    </div>
  </div>

  <div style="flex:1; min-width:0">
    <div class="rowcards">
    <div class="cell trdcard" style="border:1px solid var(--bd);border-radius:6px;
                                     padding:11px 12px;margin-bottom:10px">
      <div class="cellttl"><span>SHIFT 추이</span>
        <span class="czback" id="trdback" style="display:none"
              onclick="trdBack()">◀ 뒤로</span></div>
      <div class="trdpath" id="trdpath"></div>
      <span class="seg" id="trdshift" style="display:none"></span>
      <div id="trdlegend" class="trdlg"></div>
      <div><canvas id="trdc"></canvas></div>
    </div>

    <div class="cell" style="flex:1;min-width:0;border:1px solid var(--bd);
                             border-radius:6px;padding:11px 12px;margin-bottom:10px">
      <div class="cellttl"><span>원인 분석</span>
        <span class="seg">
          <button id="cu_lots" onclick="setCauseUnit('lots')">LOT</button>
          <button class="on" id="cu_qty" onclick="setCauseUnit('qty')">매</button>
        </span></div>
      <div class="cz3">
        <div class="czcol"><div class="subttl czh" id="czh0"></div>
          <div id="czp0" class="czpath"></div>
          <div><canvas id="czc0"></canvas></div></div>
        <div class="czcol"><div class="subttl czh" id="czh1"></div>
          <div id="czp1" class="czpath"></div>
          <div><canvas id="czc1"></canvas></div></div>
        <div class="czcol"><div class="subttl czh" id="czh2"></div>
          <div id="czp2" class="czpath"></div>
          <div><canvas id="czc2"></canvas></div></div>
      </div>

    </div>
    </div>

    <!-- 전체 순위는 x축이 길어져 위 카드에 넣으면 안 보인다. 아래 전체 폭으로. -->
    <div class="cell" id="czdrill" style="display:none;border:1px solid var(--bd);
         border-radius:6px;padding:11px 12px;margin-bottom:10px">
      <div class="cellttl"><span id="czdttl"></span>
        <span class="v" id="czdcnt"></span></div>
      <div id="czdpath" class="czpath"></div>
      <div style="height:240px"><canvas id="czdc"></canvas></div>
    </div>

    <!-- W/T 0 구간 x status 분해. 폭이 넓어 라벨이 다 보인다. -->
    <div class="cell" id="wt0panel" style="display:none;border:1px solid var(--bd);
         border-radius:6px;padding:11px 12px;margin-bottom:10px">
      <div class="cellttl"><span>W/T 0 재공 · 경과기간 × STATUS</span></div>
      <div style="height:220px"><canvas id="wt0hc"></canvas></div>
    </div>

    <!-- LOT BALANCE : LAYER 별 재공 -->
    <div class="cell" id="balpanel" style="display:none;border:1px solid var(--bd);
         border-radius:6px;padding:11px 12px;margin-bottom:10px">
      <div class="cellttl"><span>LOT BALANCE</span>
        <span style="display:flex;gap:6px;align-items:center">
          <span class="seg">
            <button id="bu_lots" onclick="setBalUnit('lots')">LOT</button>
            <button class="on" id="bu_qty" onclick="setBalUnit('qty')">매</button>
          </span>
          <div class="dd" id="balpick">
            <button class="rankbtn" id="balexp" onclick="toggleBalExpand()">
              PLAN 펼치기<span class="cv">▼</span></button>
            <div class="menu" id="balmenu"></div>
          </div>
        </span></div>
      <div class="balpath" id="balpath"></div>
      <div id="balbody"></div>
    </div>

    <div class="detail" id="drill">
      <div class="empty">좌측 <b>W/T 분포</b>·<b>W/T 0 재공 분포</b> 막대나
        위 <b>원인 분석</b> 항목을 클릭하면 해당 LOT 상세가 여기에 표시됩니다.</div>
    </div>
  </div>
</div>

<script src="{% static 'flowmonitor/chart.umd.js' %}"></script>
<script>
if (window.Chart) {
  Chart.defaults.font.family = "'Poppins','Noto Sans KR','Malgun Gothic',sans-serif";
  Chart.defaults.font.size = 11;
  Chart.defaults.color = "#374151";
}

const BRAND = "#2F4B7C";
const TYPE_COLORS = ["#2F4B7C", "#4C7DD1", "#7FB3E8", "#B9D4F2", "#D8E5F5"];
const nf = (n) => Number(n || 0).toLocaleString("ko-KR");

let LINE = "{{ default_line }}";
let DATA = null;
let SEL_STATUS = null;
let WT_UNIT = "qty";
// lot_type 선택은 라인/뷰를 바꿔도 유지된다. 기본은 PP+PG.
let TYPE_PREF = (() => {
  try {
    const v = JSON.parse(localStorage.getItem("lotTypePref"));
    if (Array.isArray(v)) return v;
  } catch (e) {}
  return ["PP", "PG"];
})();
let CAUSE_UNIT = "qty";
let WT0_UNIT = "qty";
let dnChart = null;

// 예전에는 드릴다운 표로 스크롤을 옮겼다. 페이지가 짧아진 뒤로는
// 오히려 시야가 튀어서 쓰지 않는다.
function smoothTo(el) { /* no-op */ }

function toggleDd() {
  document.getElementById("dd").classList.toggle("open");
}
// 바깥을 누르면 열려 있는 드롭다운을 모두 닫는다(.dd 전체 대상)
document.addEventListener("click", e => {
  if (e.target.closest(".dd")) { return; }
  document.querySelectorAll(".dd.open").forEach(d => d.classList.remove("open"));
});

function selectedTypes() {
  const boxes = document.querySelectorAll("#ddm input:checked");
  if (!document.getElementById("ddm").innerHTML) return TYPE_PREF;   // 초기 로드
  return [...boxes].map(x => x.value);
}

function syncTypeLabel() {
  const t = selectedTypes();
  document.getElementById("ddb").innerHTML =
    (t.length ? (t.length <= 3 ? t.join(",") : t.length + "개 선택") : "전체") + " &#9662;";
}

function onTypeCheck() {
  TYPE_PREF = selectedTypes();
  try { localStorage.setItem("lotTypePref", JSON.stringify(TYPE_PREF)); } catch (e) {}
  syncTypeLabel();
  loadSummary();
}

let PROD1 = [], PROD2 = [];
let SNAP_DATE = "", SNAP_SHIFT = "";     // 빈 값이면 현재(f3_live)

// 날짜 / SHIFT 선택. 맨 위 '현재' 가 f3_live 다.
// SHIFT 기준 시각. f3_history 에 아직 없어도 선택지는 늘 보여준다.
const SHIFT_AT = { GY: "22:00", SW: "14:00", DAY: "06:00" };
const SHIFT_LIST = ["GY", "SW", "DAY"];

function renderSnap(d) {
  const snaps = d.snapshots || [];
  // 아래 목록과 버튼 라벨 양쪽에서 쓴다. 선언이 뒤에 있으면 TDZ 오류가 난다.
  const nowAt = (d.snapshot_at || "").slice(11, 16);
  const el = document.getElementById("snapDate");
  if (el && el.value !== SNAP_DATE) { el.value = SNAP_DATE; }
  const lb = document.getElementById("snapDateLb");
  if (lb) {
    // 비워 두면 '최신' 이지만, 그래도 어느 날짜인지는 보여야 한다.
    const snapD = (d.snapshot_at || "").slice(0, 10);
    lb.textContent = (SNAP_DATE || snapD).slice(2) || "최신";
  }
  if (el) {
    const ds = snaps.map(x => x.biz_date).sort();
    if (ds.length) { el.min = ds[0]; el.max = ds[ds.length - 1]; }
    const w = document.getElementById("datefw");
    if (w) { w.classList.toggle("on", !!SNAP_DATE); }
  }

  // 그 날짜에 실제로 적재된 shift 는 시각을 함께 보여준다.
  const have = {};
  snaps.filter(x => !SNAP_DATE || x.biz_date === SNAP_DATE)
       .forEach(x => { have[x.shift] = x.at; });

  const sm = document.getElementById("shm");
  sm.innerHTML = `<label><input type="radio" name="snaps"`
    + `${!SNAP_SHIFT ? " checked" : ""} onchange="pickSnapShift('')">`
    + `최신${nowAt ? " (" + nowAt + ")" : ""}</label>`
    + SHIFT_LIST.map(k => {
        const at = have[k] || SHIFT_AT[k];
        const off = !have[k] && SNAP_DATE;      // 그 날 데이터가 없는 shift
        return `<label${off ? ' style="color:var(--mut)"' : ""}>`
          + `<input type="radio" name="snaps"${SNAP_SHIFT === k ? " checked" : ""}`
          + `${off ? " disabled" : ""} onchange="pickSnapShift('${k}')">`
          + `${k} (${at})${off ? " · 없음" : ""}</label>`;
      }).join("");
  document.getElementById("shb").innerHTML =
    `<span>SHIFT ${SNAP_SHIFT || ("최신" + (nowAt ? " " + nowAt : ""))}</span>`
    + `<span>&#9662;</span>`;
  document.getElementById("shb").classList.toggle("on", !!SNAP_SHIFT);
}

function pickSnapDate(v) {
  SNAP_DATE = v;
  SNAP_SHIFT = "";              // 날짜가 바뀌면 shift 는 다시 고른다
  loadSummary();
}

function pickSnapShift(v) { SNAP_SHIFT = v; loadSummary(); }

function toggleProd(id) {
  const el = document.getElementById(id);
  const open = el.classList.contains("open");
  document.querySelectorAll(".dd").forEach(d => d.classList.remove("open"));
  if (!open) { el.classList.add("open"); }
}

const PROD_LABEL = { 1: "제품군", 2: "제품" };

// ALL 은 목록 맨 위의 전체 선택 스위치다.
// 내부적으로는 "선택 없음 = 전체" 로 다루므로, ALL 이 켜지면 빈 배열로 둔다.
function prodPicked(which, isAll) {
  const box = document.getElementById("p" + which + "m");
  const all = box.querySelector("input[data-all]");

  if (isAll) {
    const on = all.checked;
    box.querySelectorAll("input:not([data-all])").forEach(x => { x.checked = on; });
  }
  const opts = [...box.querySelectorAll("input:not([data-all])")];
  const sel = opts.filter(x => x.checked).map(x => x.value);
  if (all) { all.checked = (sel.length === opts.length && opts.length > 0); }

  // 전부 선택 == 전체(빈 배열). 다만 '전부 해제' 는 전체가 아니다.
  // 그때 빈 배열로 보내면 서버가 전체로 보고 다시 다 체크되어 되돌아간다.
  // 하나도 안 고른 동안에는 조회하지 않고 UI 상태만 유지한다.
  const eff = (sel.length === opts.length) ? [] : sel;
  if (which === 1) { PROD1 = eff; PROD2 = []; } else { PROD2 = eff; }
  if (sel.length === 0) {
    document.getElementById("p" + which + "b").innerHTML =
      `<span>${PROD_LABEL[which]} 선택 없음</span><span>&#9662;</span>`;
    return;                       // 항목을 고르면 그때 조회한다
  }
  loadSummary();
}

// 검색: 대소문자 무시 부분일치. 'dd' 로 *dd / dd* / *dd* 가 모두 걸린다.
function prodSearch(which) {
  const q = (document.getElementById("p" + which + "q").value || "")
    .trim().toLowerCase();
  document.querySelectorAll("#p" + which + "m label[data-opt]").forEach(el => {
    const v = (el.getAttribute("data-opt") || "").toLowerCase();
    el.style.display = (!q || v.indexOf(q) >= 0) ? "" : "none";
  });
}

function renderProd(d) {
  const fill = (which, opts, cur) => {
    opts = opts || [];
    const box = document.getElementById("p" + which + "m");
    const isAll = (cur.length === 0);          // 선택 없음 = 전체
    const set = new Set(cur);
    box.innerHTML =
      `<input class="ddq" id="p${which}q" type="text" placeholder="검색"`
      + ` oninput="prodSearch(${which})" onclick="event.stopPropagation()">`
      + `<label style="border-bottom:1px solid var(--bd);font-weight:600">`
      + `<input type="checkbox" data-all ${isAll ? "checked" : ""}`
      + ` onchange="prodPicked(${which}, true)">ALL</label>`
      + (opts.map(o =>
          `<label data-opt="${o}"><input type="checkbox" value="${o}"`
          + ` ${isAll || set.has(o) ? "checked" : ""}`
          + ` onchange="prodPicked(${which}, false)">${o}</label>`).join("")
         || `<label style="color:var(--mut)">값 없음</label>`);
    const btn = document.getElementById("p" + which + "b");
    btn.innerHTML = `<span>${PROD_LABEL[which]} `
      + (isAll ? "전체" : (cur.length <= 2 ? cur.join(",") : cur.length + "개"))
      + `</span><span>&#9662;</span>`;
    btn.classList.toggle("on", !isAll);      // 필터가 걸려 있으면 라인처럼 강조
  };
  fill(1, d.prod1_options, PROD1);
  fill(2, d.prod2_options, PROD2);
}

function pickLine(line) {
  LINE = line;
  document.querySelectorAll("#lineseg button").forEach(b =>
    b.classList.toggle("on", b.dataset.line === line));
  document.getElementById("ddm").innerHTML = "";   // 라인마다 lot_type 이 다를 수 있다
  PROD1 = []; PROD2 = [];                          // 제품구분도 라인별로 다르다
  loadSummary();
}

function setWtUnit(u) {
  WT_UNIT = u;
  document.getElementById("wu_lots").className = (u === "lots") ? "on" : "";
  document.getElementById("wu_qty").className = (u === "qty") ? "on" : "";
  renderWt();
}

function setCauseUnit(u) {
  CAUSE_UNIT = u;
  document.getElementById("cu_lots").className = (u === "lots") ? "on" : "";
  document.getElementById("cu_qty").className = (u === "qty") ? "on" : "";
  renderCause();
}

function setWt0Unit(u) {
  WT0_UNIT = u;
  document.getElementById("zu_lots").className = (u === "lots") ? "on" : "";
  document.getElementById("zu_qty").className = (u === "qty") ? "on" : "";
  renderWt0();
  renderWt0Panel(DRILL_SRC === "wt0");
}

/* --- 재공 --- */
function renderWip() {
  const d = DATA;
  document.getElementById("wl").textContent = nf(d.total.lots);
  document.getElementById("wq").textContent = nf(d.total.qty);

  if (!document.getElementById("ddm").innerHTML) {
    const sel = new Set(d.selected_types || []);
    document.getElementById("ddm").innerHTML = d.types.map(t =>
      `<label><input type="checkbox" value="${t}" ${sel.has(t) ? "checked" : ""}`
      + ` onchange="onTypeCheck()">${t}</label>`).join("");
    syncTypeLabel();
  }
  const tot = d.by_lot_type.reduce((a, x) => a + x.lots, 0) || 1;
  document.getElementById("ws").innerHTML = d.by_lot_type.map((x, k) =>
    `<i class="${SEL_TYPES.indexOf(x.name) >= 0 ? 'sel' : ''}"
        style="width:${x.lots / tot * 100}%;background:${TYPE_COLORS[k % 5]}"
        onclick="pickType('${x.name}', event)"
        title="${x.name} ${nf(x.lots)} LOT / ${nf(x.qty)} 매 (Ctrl 다중선택)"
        ></i>`).join("");
  document.getElementById("wg").innerHTML = d.by_lot_type.map((x, k) =>
    `<span><i style="background:${TYPE_COLORS[k % 5]}"></i>${x.name}
       ${(x.lots / tot * 100).toFixed(0)}%</span>`).join("");
}

let SEL_TYPES = [];                  // Ctrl 다중선택

function pickType(name, ev) {
  SEL_TYPES = (SEL_TYPES.length && SEL_TYPE !== null)
    ? multiPick(SEL_TYPES, name, ev) : [name];
  if (SEL_TYPE === name && SEL_TYPES.length === 1 && SEL_TYPES[0] === name
      && !(ev && (ev.ctrlKey || ev.metaKey))) {
    SEL_TYPE = null; SEL_TYPES = [];      // 같은 것을 다시 누르면 해제
  } else {
    SEL_TYPE = SEL_TYPES[SEL_TYPES.length - 1];
  }
  renderWip();
  requestAnimationFrame(() => {
    if (SEL_TYPES.length) {
      openDrill({ lot_type: SEL_TYPES.join(",") }, SEL_TYPES.join(", "), "type");
    } else { closeDrill(); }
    loadSummary(true);
  });
}

// lot_type 을 가리지 않고 지금 필터 그대로 전부 본다.
function pickTypeAll() {
  SEL_TYPE = null; SEL_TYPES = [];
  renderWip();
  openDrill({}, "전체", "type");
}

/* --- status --- */
const sliceLabels = {
  id: "sliceLabels",
  afterDatasetsDraw(ch) {
    const st = ch.$status || [];
    const ctx = ch.ctx;
    ctx.save();
    ctx.font = "600 10px 'Poppins','Noto Sans KR',sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ch.getDatasetMeta(0).data.forEach((arc, k) => {
      const v = st[k];
      if (!v || v.pct < 6) return;
      const a = (arc.startAngle + arc.endAngle) / 2;
      const r = arc.outerRadius * 0.62;
      ctx.fillStyle = "#fff";
      ctx.fillText(v.pct + "%", arc.x + Math.cos(a) * r, arc.y + Math.sin(a) * r);
    });
    ctx.restore();
  }
};

function setStatusInfo() {
  const d = DATA;
  const s = (SEL_STATUS === null)
    ? { label: d.default.label, pct: d.default.pct, lots: d.default.lots,
        qty: d.default.qty, color: BRAND }
    : { label: d.status[SEL_STATUS].name, pct: d.status[SEL_STATUS].pct,
        lots: d.status[SEL_STATUS].lots, qty: d.status[SEL_STATUS].qty,
        color: d.status[SEL_STATUS].color };
  document.getElementById("dt").innerHTML =
    `<div class="nm" style="color:${s.color}">${s.label}</div>
     <div class="pc">${s.pct.toFixed(1)}%</div>
     <div class="sub">${nf(s.lots)} LOT &middot; ${nf(s.qty)} 매</div>`;
  document.querySelectorAll("#lg span").forEach((el, k) =>
    el.classList.toggle("on", k === (SEL_STATUS === null ? 0 : SEL_STATUS + 1)));
}

function pickStatus(i) { SEL_STATUS = (SEL_STATUS === i) ? null : i; setStatusInfo(); }
function pickDefault() { SEL_STATUS = null; setStatusInfo(); }

function renderStatus() {
  const d = DATA;
  document.getElementById("lg").innerHTML =
    `<span onclick="pickDefault()"><i style="background:${BRAND}"></i>`
    + `${d.default.label}</span>`
    + d.status.map((st, i) =>
        `<span onclick="pickStatus(${i})"><i style="background:${st.color}"></i>`
        + `${st.name}</span>`).join("");

  if (!dnChart) {
    dnChart = new Chart(document.getElementById("dn"), {
      type: "doughnut",
      data: { labels: d.status.map(s => s.name),
              datasets: [{ data: d.status.map(s => s.lots),
                           backgroundColor: d.status.map(s => s.color),
                           borderWidth: 0 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: 0, animation: false,
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: (t) => {
                     const st = (t.chart.$status || [])[t.dataIndex] || {};
                     return st.name + "  " + st.pct + "% / " + nf(st.lots) + " LOT / "
                            + nf(st.qty) + " 매";
                   } } } },
        onClick: (e, els) => {
          if (!els.length) return;
          const i = els[0].index;
          pickStatus(i);
          const st = DATA.status[i];
          SEL_PIE = (SEL_PIE === st.name) ? null : st.name;
          markSelected(dnChart, DATA.status.findIndex(x => x.name === SEL_PIE));
          dnChart.update();
          if (SEL_PIE) { openDrill({ status: st.name }, st.name, "status"); }
          else { closeDrill(); }
          loadSummary(true);
        }
      },
      plugins: [sliceLabels]
    });
  }
  dnChart.data.labels = d.status.map(s => s.name);
  dnChart.data.datasets[0].data = d.status.map(s => s.lots);
  dnChart.data.datasets[0].backgroundColor = d.status.map(s => s.color);
  dnChart.$status = d.status;
  markSelected(dnChart, d.status.findIndex(s => s.name === SEL_PIE));
  dnChart.update();
  setStatusInfo();
}

/* --- LOT BALANCE : LAYER 별 재공 --------------------------------------
   접힌 상태는 전체 합산 한 줄. 펼치면 PLAN 별로 나뉘되 LAYER 는 같은
   x 위치에 맞춘다(없는 LAYER 는 빈칸). 메인 PLAN 이 맨 위.
----------------------------------------------------------------------- */
let BAL_UNIT = "qty";
let BAL_OPEN = false;
let BAL_DATA = null;
let BAL_PICK = null;      // 펼칠 PLAN 목록. null 이면 전부
let BAL_LABEL = "";       // 어떤 드릴다운에서 왔는지
let BAL_SRC = "";         // 그 드릴다운의 출처(되돌아갈 때 쓴다)
const balCharts = [];

function setBalUnit(u) {
  BAL_UNIT = u;
  document.getElementById("bu_lots").className = (u === "lots") ? "on" : "";
  document.getElementById("bu_qty").className = (u === "qty") ? "on" : "";
  drawBalance();
}

function toggleBalExpand() {
  const box = document.getElementById("balpick");
  const open = box.classList.contains("open");
  document.querySelectorAll(".dd.open").forEach(d => d.classList.remove("open"));
  if (open) { return; }
  renderBalMenu();
  box.classList.add("open");
}

// 펼칠 PLAN 을 고른다. 검색과 전체 선택을 함께 둔다.
function renderBalMenu() {
  // 서버가 이미 '메인 우선 -> 이름순' 으로 보낸다. 그 순서를 그대로 쓴다.
  const list = (BAL_DATA && BAL_DATA.plans) || [];
  const plans = list.map(p => p.name);
  const mainOf = {};
  list.forEach(p => { mainOf[p.name] = !!p.main; });
  const on = BAL_PICK ? new Set(BAL_PICK) : new Set(plans);
  document.getElementById("balmenu").innerHTML =
    `<input class="ddq" id="balq" type="text" placeholder="PLAN 검색"`
    + ` oninput="balSearch()" onclick="event.stopPropagation()">`
    + `<label class="dfall"><input type="checkbox"`
    + `${BAL_PICK === null ? " checked" : ""} onclick="balAll(event)"><b>ALL</b></label>`
    + plans.map(p => `<label data-opt="${p}"><input type="checkbox" value="${p}"`
        + `${on.has(p) ? " checked" : ""} onclick="balPick()">`
        + `${mainOf[p] ? "<b>★ " + p + "</b>" : p}</label>`).join("");
}

function balSearch() {
  const q = (document.getElementById("balq").value || "").trim().toLowerCase();
  document.querySelectorAll("#balmenu label[data-opt]").forEach(el => {
    const v = (el.getAttribute("data-opt") || "").toLowerCase();
    el.style.display = (!q || v.indexOf(q) >= 0) ? "" : "none";
  });
}

function balAll(ev) {
  const on = ev.target.checked;
  document.querySelectorAll("#balmenu input[value]").forEach(x => {
    x.checked = on;
  });
  balPick();
}

function balPick() {
  const boxes = [...document.querySelectorAll("#balmenu input[value]")];
  const sel = boxes.filter(x => x.checked).map(x => x.value);
  BAL_PICK = (sel.length === boxes.length) ? null : sel;
  BAL_OPEN = true;
  const btn = document.getElementById("balexp");
  btn.innerHTML = `PLAN ${BAL_PICK ? BAL_PICK.length + "개" : "전체"}`
    + `<span class="cv">▲</span>`;
  btn.classList.add("on");
  drawBalance();
}

function balCollapse() {
  BAL_OPEN = false; BAL_PICK = null;
  const btn = document.getElementById("balexp");
  btn.innerHTML = `PLAN 펼치기<span class="cv">▼</span>`;
  btn.classList.remove("on");
  drawBalance();
}

function loadBalance(show) {
  const box = document.getElementById("balpanel");
  if (!show) { box.style.display = "none"; return; }
  const q = "line=" + encodeURIComponent(LINE)
    + "&types=" + encodeURIComponent(selectedTypes().join(","))
    + "&prod1=" + encodeURIComponent(PROD1.join(","))
    + "&prod2=" + encodeURIComponent(PROD2.join(","))
    + "&biz_date=" + encodeURIComponent(SNAP_DATE)
    + "&shift=" + encodeURIComponent(SNAP_SHIFT);
  fetch("/api/balance/?" + q).then(r => r.json()).then(d => {
    BAL_DATA = d;
    box.style.display = (d.layers || []).length ? "block" : "none";
    drawBalance();
  });
}

function drawBalance() {
  const d = BAL_DATA;
  if (!d) { return; }
  const xs = d.layers || [];
  let rows = BAL_OPEN ? (d.plans || [])
                      : [{ name: "전체", data: d.total || [] }];
  if (BAL_OPEN && BAL_PICK) {
    const on = new Set(BAL_PICK);
    rows = rows.filter(r => on.has(r.name));
  }
  if (!rows.length) { rows = [{ name: "전체", data: d.total || [] }]; }

  document.getElementById("balpath").innerHTML =
    `<a onclick="balCollapse()">LOT BALANCE</a>`
    + (BAL_LABEL ? ` &gt; ${BAL_LABEL}` : "")
    + (BAL_OPEN ? ` &gt; PLAN ${BAL_PICK ? BAL_PICK.join(", ") : "전체"}` : "");

  // 캔버스를 필요한 만큼만 만들고 재사용한다.
  const body = document.getElementById("balbody");
  if (body.childElementCount !== rows.length) {
    balCharts.forEach(c => c && c.destroy());
    balCharts.length = 0;
    body.innerHTML = rows.map((r, i) =>
      `<div class="balrow"><div class="ballab">${r.name}</div>`
      + `<div class="balc"><canvas id="balc${i}"></canvas></div></div>`).join("");
  } else {
    rows.forEach((r, i) => {
      const el = body.children[i].querySelector(".ballab");
      if (el) { el.textContent = r.name; }
    });
  }

  rows.forEach((r, i) => {
    const vals = (r.data || []).map(v =>
      (BAL_UNIT === "lots" ? v.lots : v.qty) || 0);
    if (!balCharts[i]) {
      balCharts[i] = new Chart(document.getElementById("balc" + i), {
        type: "bar",
        data: { labels: xs, datasets: [{ data: vals, borderRadius: 2,
                                         backgroundColor: "#F98B99" }] },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          plugins: { legend: { display: false },
                     tooltip: { callbacks: { label: (t) =>
                       nf(t.raw) + (BAL_UNIT === "lots" ? " lot" : " 매") } } },
          scales: { x: { grid: { display: false },
                         ticks: { font: { size: 7 }, autoSkip: false,
                                  maxRotation: 90, minRotation: 90,
                                  padding: 0 } },
                    y: { display: false, beginAtZero: true, grace: "20%" } },
          onClick: (e, els) => {
            if (!els.length) { return; }
            const lay = xs[els[0].index];
            const f = Object.assign({}, LAST_DRILL ? LAST_DRILL.f : {},
                                    { layer_id: lay });
            const nm = rows[i].name;
            openDrill(f, [BAL_LABEL, nm === "전체" ? "" : nm, "LAYER " + lay]
                        .filter(Boolean).join(" > "), "balance");
          }
        },
        plugins: [{
          id: "balVal" + i,
          afterDatasetsDraw(ch) {
            const ctx = ch.ctx; ctx.save();
            ctx.font = "9px 'Poppins','Noto Sans KR',sans-serif";
            ctx.textAlign = "center"; ctx.textBaseline = "bottom";
            ctx.fillStyle = "#374151";
            ch.getDatasetMeta(0).data.forEach((el, k) => {
              const v = ch.data.datasets[0].data[k];
              if (v) { ctx.fillText(kfmt(v), el.x, el.y - 3); }
            });
            ctx.restore();
          }
        }]
      });
    } else {
      balCharts[i].data.labels = xs;             // x 축은 모든 PLAN 공통
      balCharts[i].data.datasets[0].data = vals;
      balCharts[i].update();
    }
  });
}

/* --- SHIFT 추이 : 막대=재공, 라인=원인 비율 --- */
let trdChart = null;
let TRD_DRILL = [];          // [] / [대분류] / [대분류, 중분류]
let TRD_OFF = {};            // 숨긴 라인
let TRD_SCOPE = "day";       // day = 그 날의 SHIFT, week = 최근 7일
let TRD_WSHIFT = "GY";       // 주간 보기에서 볼 SHIFT

const TRD_COLORS = ["#DC143C", "#F08080", "#E8C46A", "#84C09A", "#6699CC"];

// 7300 -> 7.3k
function kfmt(v) {
  const n = Number(v) || 0;
  return n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(Math.round(n));
}

// 뒤로: 원인 계층을 먼저 올라가고, 더 올라갈 게 없으면 일간 -> 주간
function trdBack() {
  if (TRD_DRILL.length) { TRD_DRILL.pop(); }
  else if (TRD_SCOPE === "day") { TRD_SCOPE = "week"; }
  else { return; }
  loadTrend();
}

function trdGo(n) { TRD_DRILL = TRD_DRILL.slice(0, n); loadTrend(); }
function trdScope(v) { TRD_SCOPE = v; loadTrend(); }
function trdWshift(v) { TRD_WSHIFT = v; loadTrend(); }
function trdToggle(k) { TRD_OFF[k] = !TRD_OFF[k]; loadTrend(); }

// 라인 하나를 골라 파고든다. 점을 정확히 찍기 어려워 범례에서도 부른다.
function trdDrill(k) {
  if (!k) { return; }
  // 더 내려갈 계층이 없으면 그 항목의 LOT 표를 연다.
  if (TRD_DRILL.length >= 2) { trdOpenTable(k); return; }
  TRD_DRILL.push(k);                            // Hold+Wait성 은 둘을 합쳐 본다
  TRD_OFF = {};
  loadTrend();
}

// 추이의 말단 항목 -> 드릴다운 표
function trdOpenTable(k) {
  const f = {};
  const p = TRD_DRILL;
  if (p[0] === "Hold+Wait성") { f.sub = k; }
  else {
    f.big = p[0];
    if (p.length > 1) { f.mid = p[1]; }
    f.sub = k;
  }
  if (TRD_SCOPE === "day") { f.shift = SNAP_SHIFT || ""; }
  openDrill(f, [].concat(p, [k]).join(" > "), "cause");
}

// 재공 막대: 주간에서 누르면 그 날짜의 SHIFT 추이로 들어간다.
function trdBarPick(i) {
  if (TRD_SCOPE !== "week") { return; }
  const p = (trdChart.$pts || [])[i];
  if (!p || !p.biz_date) { return; }
  SNAP_DATE = p.biz_date;
  TRD_SCOPE = "day";
  loadTrend();
  loadSummary();
}

function loadTrend() {
  const q = "line=" + encodeURIComponent(LINE)
    + "&types=" + encodeURIComponent(selectedTypes().join(","))
    + "&prod1=" + encodeURIComponent(PROD1.join(","))
    + "&prod2=" + encodeURIComponent(PROD2.join(","))
    + "&biz_date=" + encodeURIComponent(SNAP_DATE)
    + "&scope=" + TRD_SCOPE + "&wshift=" + TRD_WSHIFT
    + "&drill=" + encodeURIComponent(TRD_DRILL.join("|"));
  fetch("/api/trend/?" + q).then(r => r.json()).then(renderTrend);
}

function renderTrend(d) {
  const pts = d.points || [], keys = d.series || [];

  // 계층은 늘 '최근 7일' 에서 시작한다. 지금 위치가 어디인지 바로 보이게.
  const path = [`<a onclick="trdScope('week')">최근 7일</a>`];
  if (TRD_SCOPE === "day") { path.push(`<a onclick="trdScope('day')">당일 SHIFT</a>`); }
  TRD_DRILL.forEach((x, i) => {
    path.push(`<a onclick="trdGo(${i + 1})">${x}</a>`);
  });
  document.getElementById("trdpath").innerHTML = path.join(" &gt; ")
    + (TRD_DRILL.length ? ""
       : `<span style="color:var(--mut);font-weight:400"> · 항목별 상세 보기(범례 클릭)`
         + `</span>`);

  // 주간 보기에서만 SHIFT 토글
  const sw = document.getElementById("trdshift");
  if (sw) {
    sw.style.display = (TRD_SCOPE === "week") ? "" : "none";
    sw.innerHTML = ["GY", "DAY", "SW"].map(k =>
      `<button class="${TRD_WSHIFT === k ? "on" : ""}"`
      + ` onclick="trdWshift('${k}')">${k}</button>`).join("");
  }

  const bk = document.getElementById("trdback");
  if (bk) {
    bk.style.display = (TRD_DRILL.length || TRD_SCOPE === "day") ? "" : "none";
  }

  // 체크박스는 숨김/표시, 글자는 드릴다운.
  const canDrill = TRD_DRILL.length < 2;
  document.getElementById("trdlegend").innerHTML = keys.map((k, i) => {
    const drillable = canDrill;
    return `<label class="${drillable ? "drill" : ""}">`
      + `<input type="checkbox" ${TRD_OFF[k] ? "" : "checked"}`
      + ` onchange="trdToggle('${k}')">`
      + `<i style="display:inline-block;width:8px;height:8px;border-radius:2px;`
      + `background:${TRD_COLORS[i % 5]}"></i>`
      + `<span ${drillable ? `onclick="event.preventDefault();trdDrill('${k}')"`
                           : ""}>${k}</span></label>`;
  }).join("");

  const bars = { type: "bar", label: "재공", yAxisID: "y", order: 3,
                 backgroundColor: "#C9D3E4", borderRadius: 3,
                 data: pts.map(p => p.qty) };
  const lines = keys.filter(k => !TRD_OFF[k]).map((k) => {
    const col = TRD_COLORS[keys.indexOf(k) % 5];
    return {
      type: "line", label: k, yAxisID: "y2", order: 1,
      borderColor: col, backgroundColor: "#fff",
      borderWidth: 2, tension: .25, spanGaps: true,
      // 가운데가 빈 굵은 점. 크게 해서 찍기 쉽게 한다.
      pointRadius: 6, pointHoverRadius: 8, pointBorderWidth: 3,
      pointBorderColor: col, pointBackgroundColor: "#fff",
      data: pts.map(p => p.qty
        ? Math.round((p.series[k] || 0) / p.qty * 100) : 0)
    };
  });

  if (!trdChart) {
    trdChart = new Chart(document.getElementById("trdc"), {
      type: "bar", data: { labels: [], datasets: [] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: "index", intersect: false },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: (t) =>
                     t.dataset.yAxisID === "y2"
                       ? t.dataset.label + " " + t.raw + "%"
                       : "재공 " + nf(t.raw) + " 매" } } },
        // 위쪽 여백에 x축에 맞춘 라벨을 쌓는다. 시각요소와 겹치지 않는다.
        layout: { padding: { top: 8 } },
        scales: { x: { grid: { display: false }, ticks: { font: { size: 10 } } },
                  y: { display: false, beginAtZero: true, grace: "140%" },
                  y2: { position: "right", beginAtZero: true,
                        grid: { display: false },
                        ticks: { font: { size: 9 },
                                 callback: (v) => v + "%" } } },
        onClick: (e) => {
          // interaction 이 index 모드라 els[0] 은 늘 막대다.
          // 실제로 찍은 점을 다시 찾아야 어느 라인인지 알 수 있다.
          const hit = trdChart.getElementsAtEventForMode(
            e.native || e, "nearest", { intersect: true }, false);
          if (!hit.length) { return; }
          const ds = trdChart.data.datasets[hit[0].datasetIndex];
          if (!ds) { return; }
          if (ds.yAxisID !== "y2") { trdBarPick(hit[0].index); return; }
          trdDrill(ds.label);
        }
      },
      plugins: [{
        id: "trdLabels",
        afterDatasetsDraw(ch) {
          const ctx = ch.ctx;
          const xs = ch.getDatasetMeta(0).data;      // 막대 = x 기준
          if (!xs.length) { return; }
          ctx.save();
          ctx.font = "10px 'Poppins','Noto Sans KR',sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "top";
          const top = ch.chartArea.top + 2;
          const lh = 12;

          xs.forEach((el, k) => {
            // 1행: 재공
            ctx.fillStyle = "#374151";
            ctx.fillText(kfmt(ch.data.datasets[0].data[k]) + "매", el.x, top);
            // 2행부터: 라인별 색 네모 + 비율
            let row = 1;
            for (let di = 1; di < ch.data.datasets.length; di++) {
              const ds = ch.data.datasets[di];
              const v = ds.data[k];
              if (v === null || v === undefined) { continue; }
              const y = top + row * lh;
              ctx.fillStyle = ds.borderColor;
              ctx.fillRect(el.x - 22, y + 2, 7, 7);
              ctx.fillStyle = ds.borderColor;
              ctx.textAlign = "left";
              ctx.fillText(v + "%", el.x - 12, y);
              ctx.textAlign = "center";
              row++;
            }
          });
          ctx.restore();
        }
      }]
    });
  }
  trdChart.$pts = pts;
  trdChart.data.labels = pts.map(p => p.label);
  trdChart.data.datasets = [bars].concat(lines);
  // 라인이 바닥에 붙지 않게 그 계열의 최대값 기준으로 축을 잡는다.
  // 위쪽은 라벨 자리로 비워 둔다(라인 수만큼).
  let mx = 0;
  lines.forEach(ds => ds.data.forEach(v => { if (v > mx) { mx = v; } }));
  const head = 1 + lines.length;                 // 라벨 줄 수
  trdChart.options.scales.y2.max =
    Math.max(5, Math.ceil(mx * 1.15 / 5) * 5) * (1 + head * 0.28);
  trdChart.options.scales.y2.ticks.callback = (v) =>
    v <= mx * 1.2 ? Math.round(v) + "%" : "";
  trdChart.update();
}

/* --- 원인 분석 -------------------------------------------------------------
   상단 3개(대분류)는 항상 고정. 막대를 누르면 아래에 드릴다운 차트가 생긴다.
   경로 항목은 {name, kind} 로 들고 있어야 필터에서 중분류/소분류를 구분한다.
   (Hold / Bottleneck 은 중분류가 없어 첫 단계가 곧 소분류다.)
--------------------------------------------------------------------------- */
const czCharts = [null, null, null];
let czDrill = null;
let CZ_SEL = { i: -1, path: [] };          // 한 번에 하나만 파고든다
let DRILL_KEY = { i: -1, node: null, list: [] };  // 표가 어느 차트·막대에서 나왔는지

// Ctrl 을 누르고 고르면 같은 차트 안에서 여러 항목을 함께 본다.
function multiPick(cur, name, ev) {
  const add = ev && (ev.ctrlKey || ev.metaKey);
  const list = add ? (cur || []).slice() : [];
  const at = list.indexOf(name);
  if (at >= 0) { list.splice(at, 1); } else { list.push(name); }
  return list.length ? list : [name];
}

// 드릴다운 표 상태. closeDrill 이 초기 로딩에서도 불리므로 선언을 앞에 둔다.
let DRILL_DATA = null;      // 현재 표에 뿌린 원자료
let SORT_KEYS = [];         // [{k, dir}] 순서가 곧 정렬 우선순위
let HIDE_COLS = {};         // 감춘 컬럼
let DFILT = {};             // 표 자체 필터 {컬럼: Set(값)}
let DFILT_WT = null;        // WT 는 구간으로 고른다
let FCACHE = null;          // 필터 결과. 정렬만 바뀌면 재사용한다
let dfLast = {};            // shift 범위 선택 기준점
let COL_ORDER = null;       // 사용자가 드래그로 바꾼 컬럼 순서(키 배열)

function allCols() {
  if (DRILL_DATA && DRILL_DATA.all_cols) { return DRILL_DATA.all_cols; }
  return (DRILL_DATA && DRILL_DATA.cols) ? DRILL_DATA.cols : [];
}

function visibleKeys() {
  const all = allCols();
  const v = all.filter(c => !HIDE_COLS[c.k]).map(c => c.k);
  return v.length ? v : all.map(c => c.k);
}

function drillCols() {
  const cols = (DRILL_DATA && DRILL_DATA.cols) ? DRILL_DATA.cols : [];
  if (!COL_ORDER) { return cols; }
  const by = {};
  cols.forEach(c => { by[c.k] = c; });
  const out = COL_ORDER.map(k => by[k]).filter(Boolean);
  cols.forEach(c => { if (out.indexOf(c) < 0) { out.push(c); } });
  return out;
}
let SEL_WT = null, SEL_WT0 = null, SEL_TYPE = null, SEL_PIE = null;
let SEL_WTS = [], SEL_WT0S = [], SEL_PIES = [];

function czGroup(i) { return (DATA.causes || [])[i] || { name: "", children: [] }; }

function czNodesAt(i, path) {
  let list = czGroup(i).children || [];
  for (const p of path) {
    const hit = list.find(x => x.name === p.name);
    list = (hit && hit.children) || [];
  }
  return list;
}

function czFilter() {
  const f = { big: czGroup(CZ_SEL.i).name };
  for (const p of CZ_SEL.path) {
    if (p.kind === "mid") { f.mid = p.name; } else { f.sub = p.name; }
  }
  return f;
}

function czLabel(v, max) {
  v = String(v == null ? "" : v);
  return v.length > max ? v.slice(0, max - 1) + "…" : v;
}

function czReset() {
  CZ_SEL = { i: -1, path: [] };
  DRILL_KEY = { i: -1, node: null, list: [] };
  closeDrill();
  renderCause();
}
function czGo(depth) { CZ_SEL.path = CZ_SEL.path.slice(0, depth); renderCause(); }

// depth=0 : 상단 요약 차트 -> 경로를 새로 시작
// depth>0 : 드릴다운 차트   -> 현재 경로에 덧붙임
function czPick(i, node, depth, ev) {
  if (!node) { return; }
  const leaf = !(node.children && node.children.length);
  if (depth === 0 || CZ_SEL.i !== i) {
    CZ_SEL = { i: i, path: [] };        // 다른 막대를 누르면 이전 경로는 버린다
  }
  CZ_SEL.path = CZ_SEL.path.filter(p => p.kind !== "all");

  if (leaf) {
    // 말단: 차트는 그대로 두고 아래 표만 바꾼다.
    const keep = CZ_SEL.path.slice();
    const f = { big: czGroup(i).name };
    for (const p of keep) { if (p.kind === "mid") { f.mid = p.name; } }
    const list = (DRILL_KEY.i === i)
      ? multiPick(DRILL_KEY.list, node.name, ev) : [node.name];
    f.sub = list.join(",");
    DRILL_KEY = { i: i, node: list[list.length - 1], list: list };
    renderCause();
    openDrill(f, [czGroup(i).name].concat(keep.map(p => p.name))
                 .concat([list.join(", ")]).join(" > "), "cause");
    return;
  }

  CZ_SEL.path.push({ name: node.name, kind: node.kind || "sub" });
  DRILL_KEY = { i: -1, node: null, list: [] };
  DRILL_SRC = "cause";
  closeDrill();                 // 단계를 옮기면 이전 표는 무효다
  DRILL_SRC = "cause";
  renderCause();
}

// x축 라벨을 세로(시계방향 90도)로 세우고 길면 줄인다.
const CZ_SCALE_X = {
  grid: { display: false },
  ticks: { font: { size: 9 }, autoSkip: false, maxRotation: 0, minRotation: 0,
           callback: function (v) { return czLabel(this.getLabelForValue(v), 10); } }
};

function czBarChart(canvasId, onPick, pluginId) {
  return new Chart(document.getElementById(canvasId), {
    type: "bar",
    data: { labels: [], datasets: [
      { data: [], borderRadius: 3, order: 2, yAxisID: "y" },
      // 경과일 평균(일/lot). 막대 위에 겹치지 않게 별도 축을 쓴다.
      { type: "line", data: [], order: 1, yAxisID: "y2",
        borderColor: "#B4504F", backgroundColor: "#B4504F",
        borderWidth: 2, pointRadius: 3, pointHoverRadius: 4,
        tension: 0.25, spanGaps: true }
    ] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      layout: { padding: { top: 16 } },
      plugins: { legend: { display: false },
                 tooltip: { callbacks: {
                   title: (t) => (t[0].chart.$nodes[t[0].dataIndex] || {}).name,
                   label: (t) => {
                     const x = t.chart.$nodes[t.dataIndex] || {};
                     if (t.datasetIndex === 1) {
                       return "경과 평균 " + (x.elapsed_d == null ? "-"
                              : x.elapsed_d.toFixed(1) + " 일/lot");
                     }
                     return nf(x.lots) + " LOT / " + nf(x.qty) + " 매";
                   } } } },
      // 막대와 라인을 세로로 분리한다.
      //   막대 : 바닥 ~ 50%      (라벨은 그 바로 위)
      //   라인 : 68% ~ 90%       (라벨은 그 위)
      // 두 대역 사이 여백이 있어 막대·라인·라벨이 서로 겹치지 않는다.
      scales: {
        x: CZ_SCALE_X,
        y: { display: false, beginAtZero: true,
             afterDataLimits: (sc) => { sc.max = (sc.max || 1) / 0.50; } },
        y2: { display: false, position: "right",
              afterDataLimits: (sc) => {
                let a = sc.min, b = sc.max;
                if (!isFinite(a) || !isFinite(b)) { return; }
                if (b - a < 1e-9) {
                  const pad = Math.abs(b) * 0.5 || 1;   // 값이 하나뿐이거나 0
                  a = b - pad;
                }
                // a -> 68%, b -> 90% 위치에 오도록 축 범위를 역산
                const range = (b - a) / 0.22;
                sc.min = a - 0.68 * range;
                sc.max = sc.min + range;
              } } },
      onClick: (e, els) => {
        if (els.length) { onPick(els[0].index, e.native || e); }
      },
      interaction: { mode: "index", intersect: false }
    },
    plugins: [{
      id: pluginId,
      afterDatasetsDraw(ch) {
        const ctx = ch.ctx; ctx.save();
        ctx.font = "10px 'Poppins','Noto Sans KR',sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "bottom";
        ctx.fillStyle = "#374151";
        const unit = (CAUSE_UNIT === "lots") ? " lot" : " 매";
        ch.getDatasetMeta(0).data.forEach((el, k) => {
          ctx.fillText(nf(ch.data.datasets[0].data[k]) + unit, el.x, el.y - 4);
        });
        ctx.fillStyle = "#B4504F";
        ch.getDatasetMeta(1).data.forEach((el, k) => {
          const v = ch.data.datasets[1].data[k];
          if (v === null || v === undefined) { return; }
          ctx.fillText(v.toFixed(1) + " 일/lot", el.x, el.y - 7);
        });
        ctx.restore();
      }
    }]
  });
}

/* 선택된 요소를 굵은 테두리로 표시한다(발광 없음).
   Chart.register 로 전역 등록하므로 앞으로 만드는 차트도 자동 적용된다.
   각 차트는 ch.$sel 에 선택 인덱스(없으면 -1)만 넣으면 된다. */
const SEL_COLOR = "#FFD700";

// 선택된 요소는 자기 계열에서 가장 진한 색으로 채운다.
// rgba(...) 는 알파를 1 로, 그 외(hex 등)는 그대로 쓴다.
function strongest(c) {
  if (typeof c !== "string") { return c; }
  const i = c.indexOf("(");
  const j = c.lastIndexOf(")");
  if (i > 0 && j > i && c.slice(0, i).trim().toLowerCase().indexOf("rgb") === 0) {
    const p = c.slice(i + 1, j).split(",").map(x => x.trim());
    if (p.length >= 3) { return "rgb(" + p[0] + ", " + p[1] + ", " + p[2] + ")"; }
  }
  return c;
}

const popSelected = {
  id: "popSelected",
  afterDatasetsDraw(chart) {
    // 여러 개를 고른 경우 전부 표시한다.
    const many = chart.$selSet;
    if (many && many.size > 1 && chart.data.labels) {
      chart.data.labels.forEach((lb, k) => {
        if (many.has(lb)) { drawSel(chart, k); }
      });
      return;
    }
    const sel = chart.$sel;
    if (sel === undefined || sel === null || sel < 0) { return; }
    drawSel(chart, sel);
  }
};

function drawSel(chart, sel) {
  {
    const el = (chart.getDatasetMeta(0).data || [])[sel];
    if (!el) { return; }
    const ctx = chart.ctx;
    const bg = chart.data.datasets[0].backgroundColor;
    const fill = strongest(Array.isArray(bg) ? bg[sel] : bg);

    ctx.save();
    ctx.fillStyle = fill;
    ctx.strokeStyle = SEL_COLOR;
    ctx.lineWidth = 3;
    ctx.lineJoin = "round";

    if (el.outerRadius !== undefined) {          // 원차트 조각
      ctx.beginPath();
      ctx.arc(el.x, el.y, el.outerRadius - 1.5, el.startAngle, el.endAngle);
      ctx.arc(el.x, el.y, el.innerRadius + 1.5, el.endAngle, el.startAngle, true);
      ctx.closePath();
      ctx.fill();                                // 계열 최강색으로 다시 채우고
      ctx.stroke();
    } else {                                     // 막대
      // 가로막대(indexAxis:'y')와 세로막대는 width/height/base 의미가 다르다.
      // 두 경우를 나눠 실제 막대와 정확히 겹치게 그린다.
      const p = el.getProps(["x", "y", "base", "width", "height"], true);
      const horiz = (chart.options.indexAxis === "y");
      let x0, y0, w, h;
      if (horiz) {
        x0 = Math.min(p.base, p.x);
        w  = Math.abs(p.x - p.base);
        h  = p.height || 0;
        y0 = p.y - h / 2;
      } else {
        y0 = Math.min(p.base, p.y);
        h  = Math.abs(p.base - p.y);
        w  = p.width || 0;
        x0 = p.x - w / 2;
      }
      const in_ = 1.5;                           // 선 굵기의 절반만큼 안쪽으로
      ctx.fillRect(x0, y0, w, h);                // 계열 최강색으로 다시 채우고
      ctx.strokeRect(x0 + in_, y0 + in_,
                     Math.max(w - in_ * 2, 1), Math.max(h - in_ * 2, 1));
    }
    ctx.restore();
  }
};
if (window.Chart) { Chart.register(popSelected); }

function markSelected(ch, selIdx) {
  ch.$sel = (selIdx === undefined || selIdx === null) ? -1 : selIdx;
}

function czApply(ch, nodes, u, selName, selList) {
  // 값에 따라 농도를 달리하면 1위 막대가 '선택된 것' 처럼 보인다.
  // 선택 표시는 3D 팝업이 전담하므로 막대색은 전부 같은 남색으로 둔다.
  const vals = nodes.map(x => u === "lots" ? x.lots : x.qty);
  ch.$nodes = nodes;
  ch.data.labels = nodes.map(x => x.name);
  ch.data.datasets[0].data = vals;
  // 안 좋은 지표라 적색 계열(#F08080). 상위일수록 진하다(값 내림차순으로 온다).
  ch.data.datasets[0].backgroundColor = nodes.map((_, i) =>
    `rgba(240,128,128,${Math.max(1 - 0.11 * i, 0.25).toFixed(2)})`);
  ch.data.datasets[1].data = nodes.map(x =>

// 표 안에서 필터를 걸 컬럼
const FILTER_COLS = ["line", "전산라인", "dest_line_id", "fa_object4",
  "prod1", "prod2", "lot_id", "lot_type", "wt", "lot_status", "proc_id",
  "module1", "module2", "layer_id", "step_seq", "step_desc", "eqpgroup", "cause"];

function drillSort(k) {
  const i = SORT_KEYS.findIndex(x => x.k === k);
  if (i < 0) { SORT_KEYS.push({ k: k, dir: 1 }); }
  else if (SORT_KEYS[i].dir === 1) { SORT_KEYS[i].dir = -1; }
  else { SORT_KEYS.splice(i, 1); }
  renderDrillTable();
}

function wtKey(v) {
  const n = Number(v);
  if (!isFinite(n) || n <= 0) { return "0"; }
  if (n <= 1) { return "0-1"; }
  if (n <= 2) { return "1-2"; }
  if (n <= 3) { return "2-3"; }
  if (n <= 4) { return "3-4"; }
  if (n <= 5) { return "4-5"; }
  return "5+";
}
const WT_LABEL = { "0": "WT = 0", "0-1": "0 < WT ≤ 1", "1-2": "1 < WT ≤ 2",
  "2-3": "2 < WT ≤ 3", "3-4": "3 < WT ≤ 4", "4-5": "4 < WT ≤ 5", "5+": "WT > 5" };

function passFilter(r) {
  for (const k in DFILT) {
    const set = DFILT[k];
    if (!set || !set.size) { continue; }
    const v = (r[k] === null || r[k] === undefined || r[k] === "")
      ? "(없음)" : String(r[k]);
    if (!set.has(v)) { return false; }
  }
  if (DFILT_WT && DFILT_WT.size && !DFILT_WT.has(wtKey(r.wt))) { return false; }
  return true;
}

function filteredRows() {
  if (FCACHE) { return FCACHE; }
  const rows = (DRILL_DATA && DRILL_DATA.rows) ? DRILL_DATA.rows : [];
  let need = !!(DFILT_WT && DFILT_WT.size);
  for (const k in DFILT) { if (DFILT[k] && DFILT[k].size) { need = true; break; } }
  FCACHE = need ? rows.filter(passFilter) : rows.slice();
  return FCACHE;
}

function sortedRows() {
  const rows = filteredRows();          // 캐시된 배열을 그대로 정렬한다
  if (!SORT_KEYS.length) { return rows; }
  const num = (v) => { const n = parseFloat(v); return isNaN(n) ? null : n; };
  rows.sort((a, b) => {
    for (const s of SORT_KEYS) {
      let x = a[s.k], y = b[s.k];
      if (x === undefined || x === null || x === "") { x = null; }
      if (y === undefined || y === null || y === "") { y = null; }
      if (x === null && y === null) { continue; }
      if (x === null) { return 1; }
      if (y === null) { return -1; }
      const nx = num(x), ny = num(y);
      let c;
      if (nx !== null && ny !== null) { c = nx - ny; }
      else { c = String(x).localeCompare(String(y), "ko"); }
      if (c) { return c * s.dir; }
    }
    return 0;
  });
  return rows;
}

function dfPick(ev, k, idx) {
  const box = document.getElementById("dfm_" + k);
  const boxes = [...box.querySelectorAll("input[data-opt-i]")];
  if (ev.shiftKey && dfLast[k] !== undefined) {      // shift 범위 선택
    const a = Math.min(dfLast[k], idx), b = Math.max(dfLast[k], idx);
    for (let i = a; i <= b; i++) { boxes[i].checked = ev.target.checked; }
  }
  dfLast[k] = idx;
  const sel = new Set(boxes.filter(x => x.checked).map(x => x.value));
  const target = (k === "wt") ? "wt" : k;
  if (sel.size === boxes.length) {                   // 전부 = 필터 없음
    if (target === "wt") { DFILT_WT = null; } else { delete DFILT[k]; }
  } else if (target === "wt") { DFILT_WT = sel; } else { DFILT[k] = sel; }
  const all = document.querySelector("#dfm_" + k + " input[data-all]");
  if (all) { all.checked = (sel.size === boxes.length); }
  dfLabel(k, sel.size, boxes.length);
  FCACHE = null;                        // 필터가 바뀌었으니 다시 거른다

function dfLabel(k, n, total) {
  const b = document.getElementById("dfb_" + k);
  if (!b) { return; }
  const t = (DRILL_DATA.cols.find(c => c.k === k) || {}).t || k;

function dfOptions(k) {
  const rows = (DRILL_DATA && DRILL_DATA.rows) ? DRILL_DATA.rows : [];
  if (k === "wt") { return Object.keys(WT_LABEL); }
  const set = new Set();
  for (const r of rows) {
    const v = (r[k] === null || r[k] === undefined || r[k] === "")
      ? "(없음)" : String(r[k]);
    set.add(v);
  }
  return [...set].sort((a, b) => a.localeCompare(b, "ko"));
}

// 보이는 컬럼과 필터·정렬이 적용된 그대로 탭 구분으로 복사한다.
function copyDrill() {
  if (!DRILL_DATA) { return; }
  const cols = drillCols().filter(c => !HIDE_COLS[c.k]);
  const rows = sortedRows();
  const line = (r) => cols.map(c => {
    const v = r[c.k];
    if (v === null || v === undefined) { return ""; }
    return c.k === "wt" ? Number(v).toFixed(1) : String(v);
  }).join("\t");
  const text = [cols.map(c => c.t).join("\t")]
    .concat(rows.map(line)).join("\n");

  const done = () => {
    const el = document.getElementById("drillCount");
    if (!el) { return; }
    const keep = el.textContent;
    el.textContent = nf(rows.length) + "행 복사됨";
    setTimeout(() => { el.textContent = keep; }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else { fallbackCopy(text, done); }
}

function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { /* 무시 */ }
  document.body.removeChild(ta);
}

/* 연속공정 스텝 펼치기 --------------------------------------------------
   표의 재공 수는 lot 단위 집계라, 여기서 행을 늘려도 카운트는 그대로다.
----------------------------------------------------------------------- */
const STEP_CACHE = {};

function toggleSteps(ev, lot) {
  ev.stopPropagation();
  const btn = ev.target;
  const tr = btn.closest("tr");
  const open = tr.nextElementSibling
    && tr.nextElementSibling.classList.contains("steprow");

  // 이미 펼쳐져 있으면 접는다
  let n = tr.nextElementSibling;
  while (n && n.classList.contains("steprow")) {
    const x = n; n = n.nextElementSibling; x.remove();
  }
  if (open) { btn.textContent = "+"; return; }

  btn.textContent = "−";
  const draw = (rows) => {
    if (!rows.length) { btn.textContent = "+"; return; }
    const cols = drillCols().filter(c => !HIDE_COLS[c.k]);
    const keys = cols.map(c => c.k);
    const frag = [];
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      frag.push('<tr class="steprow"><td class="expcol"></td>');
      for (let j = 0; j < keys.length; j++) {
        const raw = r[keys[j]];
        frag.push("<td>");
        frag.push((raw === null || raw === undefined || keys[j] === "wt")
                  ? "" : raw);
        frag.push("</td>");
      }
      frag.push("</tr>");
    }
    tr.insertAdjacentHTML("afterend", frag.join(""));
  };

  if (STEP_CACHE[lot]) { draw(STEP_CACHE[lot]); return; }
  btn.textContent = "…";
  fetch("/api/lot-steps/?line=" + encodeURIComponent(LINE)
        + "&lot_id=" + encodeURIComponent(lot))
    .then(r => r.json()).then(d => {
      // 현스텝은 위에 이미 있으니 후속 스텝만 남긴다.
      STEP_CACHE[lot] = (d.rows || []).filter(r => !r["현스텝"]);
      btn.textContent = "−";
      draw(STEP_CACHE[lot]);
    })
    .catch(() => { btn.textContent = "+"; });
}

/* 컬럼 드래그 정렬 ------------------------------------------------------ */
let dragKey = null;

function colDragStart(ev, k) {
  dragKey = k;
  ev.dataTransfer.effectAllowed = "move";
  try { ev.dataTransfer.setData("text/plain", k); } catch (e) { /* 무시 */ }
  ev.target.classList.add("dragging");
}
function colDragOver(ev) {
  ev.preventDefault();
  ev.dataTransfer.dropEffect = "move";
  autoScroll(ev.clientX);           // 가장자리에 오면 표를 밀어준다
}

// 드래그 중에는 브라우저가 스크롤을 안 해준다. 직접 민다.
let scrollTimer = null;
function autoScroll(x) {
  const box = document.getElementById("drillBody");
  if (!box) { return; }
  const r = box.getBoundingClientRect();
  const EDGE = 60;                  // 가장자리 감지 폭
  let dx = 0;
  if (x < r.left + EDGE) { dx = -Math.max(8, (r.left + EDGE - x) / 2); }
  else if (x > r.right - EDGE) { dx = Math.max(8, (x - (r.right - EDGE)) / 2); }

  if (!dx) { stopScroll(); return; }
  if (scrollTimer) { return; }
  scrollTimer = setInterval(() => { box.scrollLeft += dx; }, 16);
}
function stopScroll() {
  if (scrollTimer) { clearInterval(scrollTimer); scrollTimer = null; }
}
function colDragEnd(ev) {
  stopScroll();
  dragKey = null;
  document.querySelectorAll("th.dragging").forEach(x =>
    x.classList.remove("dragging"));
}
function colDrop(ev, target) {
  ev.preventDefault();
  ev.stopPropagation();
  stopScroll();                       // 드롭으로 정렬이 걸리지 않게
  if (!dragKey || dragKey === target) { return; }
  const order = drillCols().map(c => c.k);
  const from = order.indexOf(dragKey);
  const to = order.indexOf(target);
  if (from < 0 || to < 0) { return; }
  order.splice(to, 0, order.splice(from, 1)[0]);
  COL_ORDER = order;
  dragKey = null;
  renderDrillHead();
  renderDrillTable();
}

function renderDrillSorts() {
  const box = document.getElementById("drillSorts");
  if (!box) { return; }
  const cols = allCols();
  const name = (k) => (cols.find(c => c.k === k) || {}).t || k;
  box.innerHTML = `<button class="dfclear" onclick="sortClearAll()">정렬 해제</button>`
    + (SORT_KEYS.length
       ? SORT_KEYS.map((s, i) =>
           `<button class="sortchip" onclick="drillSort('${s.k}')">`
           + `<b>${i + 1}</b> ${name(s.k)} ${s.dir === 1 ? "▲" : "▼"}</button>`).join("")
       : `<span class="minittl">컬럼명을 눌러 정렬</span>`);
}

function sortClearAll() { SORT_KEYS = []; renderDrillTable(); }

function renderDrillTable() {
  const d = DRILL_DATA;
  if (!d) { return; }
  const cols = drillCols().filter(c => !HIDE_COLS[c.k]);
  const rows = sortedRows();

  const head = `<th class="expcol"></th>` + cols.map(c => {
    const i = SORT_KEYS.findIndex(x => x.k === c.k);
    const mark = i < 0 ? ""
      : `<sup class="so">${i + 1}${SORT_KEYS[i].dir === 1 ? "▲" : "▼"}</sup>`;
    return `<th class="${NUM_COLS.has(c.k) ? "num " : ""}sortable" draggable="true"`
         + ` data-k="${c.k}" onclick="drillSort('${c.k}')"`
         + ` ondragstart="colDragStart(event,'${c.k}')"`
         + ` ondragover="colDragOver(event)"`
         + ` ondrop="colDrop(event,'${c.k}')"`
         + ` ondragend="colDragEnd(event)">${c.t}${mark}</th>`;
  }).join("");

  // 셀마다 <span class="c"> 를 넣으면 DOM 노드가 두 배가 되어 느려진다.
  // 가로 스크롤이 필요한 긴 값에만 span 을 쓴다.
  const LONG = 14;
  const keys = cols.map(c => c.k);
  const isNum = cols.map(c => NUM_COLS.has(c.k));
  const isWt = cols.map(c => c.k === "wt");
  const isSt = cols.map(c => c.k === "lot_status");
  const SC = d.status_colors || {};
  const nc = cols.length;

  const buf = [];
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const lot = r.lot_id;
    const many = (r._steps || 1) > 1;
    buf.push('<tr data-lot="' + lot + '">');
    buf.push('<td class="expcol">');
    if (many) {
      buf.push('<span class="expbtn" onclick="toggleSteps(event,\'' + lot
               + '\')">+</span>');
    }
    buf.push("</td>");
    for (let j = 0; j < nc; j++) {
      const raw = r[keys[j]];
      let v = (raw === null || raw === undefined) ? ""
        : (isWt[j] ? Number(raw).toFixed(1) : String(raw));
      // 상태 셀은 좌측 원차트와 같은 색을 배경으로 쓴다.
      const bg = isSt[j] && SC[v] ? ' style="background:' + SC[v] + '33"' : "";
      if (v.length > LONG) {
        buf.push(isNum[j] ? '<td class="num"' + bg + '><span class="c">'
                          : "<td" + bg + '><span class="c">');
        buf.push(v);
        buf.push("</span></td>");
      } else {
        buf.push(isNum[j] ? '<td class="num"' + bg + ">" : "<td" + bg + ">");
        buf.push(v);
        buf.push("</td>");
      }
    }
    buf.push("</tr>");
  }

  const cnt = document.getElementById("drillCount");
  if (cnt) {
    cnt.textContent = nf(rows.length) + " / " + nf((d.rows || []).length) + " 행";
  }
  renderDrillSorts();
  document.getElementById("drillBody").innerHTML =
    `<table class="grid"><thead><tr>${head}</tr></thead><tbody>`
    + (buf.length ? buf.join("")
       : `<tr><td colspan="${cols.length + 1}" style="color:#6B7280">`
         + `해당 조건의 LOT 이 없습니다.</td></tr>`)
    + `</tbody></table>`;
}

const SRC_TITLE = {
  balance: "LOT BALANCE 상세",
  cause: "원인 분석 상세", wt: "W/T 분포 상세", wt0: "W/T 0 재공 상세",
  type: "재공 lot_type 상세", status: "status 상세",
};

// 드릴다운 소제목. 영문은 대문자, 단계는 > 로 잇는다.
function drillTitle(src, label) {
  return [SRC_TITLE[src] || "LOT 상세", LINE, label]
    .filter(Boolean)
    .join(" > ")
    .replace(/[a-z]+/g, (m) => m.toUpperCase());
}

let LAST_DRILL = null;

function reopenDrill() {
  if (LAST_DRILL) { openDrill(LAST_DRILL.f, LAST_DRILL.l, LAST_DRILL.s, true); }
}

function openDrill(filt, label, src, keepView) {
  LAST_DRILL = { f: filt, l: label, s: src };
  clearOtherSelections(src || "");
  renderWt0Panel(src === "wt0");      // W/T0 드릴다운일 때만 보인다
  // 드릴다운이 열리면 LOT BALANCE 도. balance 자체에서 다시 부르지는 않는다.
  if (src !== "balance") {
    BAL_LABEL = label || ""; BAL_SRC = src || "";
    loadBalance(true);
  }
  const el = document.getElementById("drill");
  // 곧바로 자리표시자를 그려 '눌리지 않은 것처럼' 보이지 않게 한다.
  el.classList.add("loading");
  el.innerHTML = `<div class="cellttl"><span>${drillTitle(src, label)}</span></div>`
    + `<div class="bar"><b>불러오는 중…</b><span class="spin"></span></div>`;
  smoothTo(el);
  const base = { line: LINE, types: selectedTypes().join(","),
                 prod1: PROD1.join(","), prod2: PROD2.join(","),
                 biz_date: SNAP_DATE, shift: SNAP_SHIFT,
                 src: src || "",
                 cols: keepView ? visibleKeys().join(",") : "" };
  const q = Object.entries(Object.assign(base, filt || {}))
    .filter(([, v]) => v !== undefined && v !== null && v !== "")
    .map(([k, v]) => k + "=" + encodeURIComponent(v)).join("&");

  fetch("/api/lots-live/?" + q).then(r => r.json()).then(d => {
    el.classList.remove("loading");
    DRILL_DATA = d;
    SORT_KEYS = [];                       // 새 조건이면 정렬/필터 초기화
    HIDE_COLS = {}; DFILT = {}; DFILT_WT = null; dfLast = {}; FCACHE = null;
    el.innerHTML = `<div class="cellttl"><span>${drillTitle(src, label)}</span></div>
      <div class="bar">
        <div><b>${nf(d.lots || (d.rows || []).length)} LOT</b>
          <b style="margin-left:8px">${nf(d.qty || 0)} 매</b>
          <span class="path" id="drillCount"></span>
          <span class="path">컬럼명을 누르면 정렬 (1회 오름 · 2회 내림 · 3회 해제)
            · 컬럼명을 끌어 순서를 바꿀 수 있습니다</span>
        </div>
        <span style="margin-left:auto;display:flex;gap:6px">
          <button onclick="copyDrill()">복사하기</button>
          <button onclick="closeDrill()">닫기</button></span></div>
      <div class="dtools">
        <div class="drow"><span class="minittl">컬럼</span>
          <div class="chips" id="drillCols"></div></div>
        <div class="drow"><span class="minittl">필터</span>
          <div class="dfs" id="drillFilters"></div></div>
        <div class="drow"><span class="minittl">정렬</span>
          <div class="dfs" id="drillSorts"></div></div>
      </div>
      <div class="gridwrap" id="drillBody"></div>`;
    renderDrillHead();
    renderDrillTable();
  });
}

/* --- 로딩 --- */
function loadSummary(keepFocus) {
  // 라인/lot_type/제품구분이 바뀌면 지금 표는 다른 조건의 결과다.
  // keepFocus 는 좌측 막대를 눌러 원인 분석만 좁히는 경우라 선택을 유지한다.
  if (!keepFocus) {
    SEL_WT = null; SEL_WT0 = null; SEL_TYPE = null; SEL_PIE = null;
    SEL_TYPES = []; SEL_WTS = []; SEL_WT0S = []; SEL_PIES = [];
    CZ_SEL = { i: -1, path: [] };
    DRILL_KEY = { i: -1, node: null, list: [] };
    closeDrill();
  }

  fetch("/api/summary/?line=" + encodeURIComponent(LINE)
        + "&types=" + encodeURIComponent(selectedTypes().join(","))
        + "&prod1=" + encodeURIComponent(PROD1.join(","))
        + "&prod2=" + encodeURIComponent(PROD2.join(","))
        + "&f_status=" + encodeURIComponent(SEL_PIE || "")
        + "&f_wt=" + encodeURIComponent(SEL_WT || "")
        + "&f_wt0=" + encodeURIComponent(SEL_WT0 || "")
        + "&f_type=" + encodeURIComponent(SEL_TYPE || "")
        + "&biz_date=" + encodeURIComponent(SNAP_DATE)
        + "&shift=" + encodeURIComponent(SNAP_SHIFT))
    .then(r => r.ok ? r.json() : Promise.reject("HTTP " + r.status))
    .then(d => {
      const err = document.getElementById("err");
      if (!d.ready) {
        err.textContent = d.reason || "데이터 없음";
        if (d.snapshots) { renderSnap(d); }
        if (d.prod1_options) { renderProd(d); }   // 필터는 되돌릴 수 있어야 한다
        return;
      }
      err.textContent = "";
      DATA = d;
      SEL_STATUS = null;
      if (!keepFocus) { CZ_SEL = { i: -1, path: [] }; }
      document.getElementById("snapAt").textContent = d.snapshot_at || "-";
      renderSnap(d);
      renderProd(d);
      renderWip(); renderStatus(); renderWt(); renderWt0(); renderCause();
      loadTrend();
    })
    .catch(e => { document.getElementById("err").textContent = "조회 실패: " + e; });
}

pickLine(LINE);
</script>
{% endblock %}
