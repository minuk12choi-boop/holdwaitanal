{% extends "flowmonitor/base.html" %}
{% load static %}
{% block body %}
<div class="layout">
  <div class="summary">
    <div class="gfilter">
      <div class="prodf" style="margin-bottom:8px">
        <label class="datef" id="datefw">
          <span id="snapDateLb">-</span>
          <input type="date" id="snapDate"
                 onclick="if(this.showPicker){try{this.showPicker();}catch(e){}}"
                 onchange="pickSnapDate(this.value)" title="비우면 최신">
        </label>
        <div class="dd" id="dsh">
          <button onclick="toggleProd('dsh')" id="shb">SHIFT 최신 &#9662;</button>
          <div class="menu" id="shm"></div>
        </div>
      </div>
      <div class="lineseg" id="lineseg">
        {% for l in lines %}
          <button data-line="{{ l.line }}" {% if not l.ready %}disabled
            title="아직 적재된 데이터가 없습니다"{% endif %}
            onclick="pickLine('{{ l.line }}')">{{ l.label }}</button>
        {% endfor %}
      </div>
      <div class="prodf">
        <div class="dd" id="dp1">
          <button onclick="toggleProd('dp1')" id="p1b">제품군 전체 &#9662;</button>
          <div class="menu" id="p1m"></div>
        </div>
        <div class="dd" id="dp2">
          <button onclick="toggleProd('dp2')" id="p2b">제품 전체 &#9662;</button>
          <div class="menu" id="p2m"></div>
        </div>
        <div class="dd" id="dp3">
          <button onclick="toggleProd('dp3')" id="p3b">AREA 전체 &#9662;</button>
          <div class="menu" id="p3m"></div>
        </div>
      </div>
    </div>

    <div id="err" class="err"></div>

    <!-- 재공 뷰 -->
    <div class="cell" id="wipcard">
      <div class="wip">
        <div class="top">
          <div class="nums">
            <div><b id="wl">-</b><div class="lbl">재공 LOT</div></div>
            <div><b id="wq">-</b><div class="lbl">재공 매</div></div>
          </div>
          <div style="display:flex;gap:6px;align-items:center">
            <button class="rankbtn" onclick="pickTypeAll()"
                    title="lot_type 을 가리지 않고 전부 본다">전체 보기</button>
            <div class="dd" id="dd">
              <button onclick="toggleDd()" id="ddb">전체 &#9662;</button>
              <div class="menu" id="ddm"></div>
            </div>
          </div>
        </div>
        <div class="stack" id="ws"></div>
        <div class="stleg" id="wg"></div>
      </div>
    </div>

    <!-- status 뷰 -->
    <div class="cell" id="stcard">
      <div class="donut">
        <div class="legend" id="lg"></div>
        <div class="cv"><canvas id="dn"></canvas></div>
        <div class="pickinfo" id="dt"></div>
      </div>
    </div>

    <!-- WT 분포 뷰 -->
    <div class="cell" id="wtcard">
      <div class="cellttl"><span>W/T 분포</span>
        <span class="seg">
          <button id="wu_lots" onclick="setWtUnit('lots')">LOT</button>
          <button class="on" id="wu_qty" onclick="setWtUnit('qty')">매</button>
        </span></div>
      <div style="height:190px"><canvas id="wtc"></canvas></div>
    </div>

    <!-- W/T 0 재공 분포 -->
    <div class="cell" id="wt0card">
      <div class="cellttl"><span>W/T 0 재공 분포</span>
        <span class="seg">
          <button id="zu_lots" onclick="setWt0Unit('lots')">LOT</button>
          <button class="on" id="zu_qty" onclick="setWt0Unit('qty')">매</button>
        </span></div>
      <div class="stsum" id="wt0sum"></div>
      <div class="minittl" style="margin-bottom:6px">마지막 작업 이후 경과일 기준</div>
      <div style="height:210px"><canvas id="wt0c"></canvas></div>
    </div>
    <div class="cell" id="areacard" style="display:none">
      <div class="cellttl"><span>AREA 별 재공</span>
        <span class="seg">
          <button id="au_lots" onclick="setAreaUnit('lots')">LOT</button>
          <button class="on" id="au_qty" onclick="setAreaUnit('qty')">매</button>
        </span></div>
      <div style="height:150px"><canvas id="areac"></canvas></div>
    </div>
  </div>

  <div class="maincol">
    <!-- 라인 요약: 지금 무엇이 문제인가 -->
    <div class="cell" id="insight" style="display:none;border:1px solid var(--bd);
         border-radius:6px;padding:10px 12px;margin-bottom:10px">
      <div class="cellttl"><span>지금 이 라인의 문제</span>
        <span class="v" id="insSub"></span>
</div>
      <div class="insrow" id="insBody"></div>
    </div>

    <div class="rowcards">
    <div class="leftcol">
    <div class="cell" id="czcard" style="border:1px solid var(--bd);
                             border-radius:6px;padding:11px 12px;margin-bottom:0">
      <div class="cellttl"><span>원인 분석</span>
        <span class="v" id="czup"></span></div>
      <div class="cztools">
        <span class="seg">
          <button class="on" id="cv_split" onclick="setCauseView('split')"
                  title="Hold / Wait성 / Bottleneck 을 따로 본다">STATUS별</button>
          <button id="cv_all" onclick="setCauseView('all')"
                  title="셋을 합쳐 가로막대로 본다">전체보기</button>
        </span>
        <span class="seg">
          <button id="cu_lots" onclick="setCauseUnit('lots')">LOT</button>
          <button class="on" id="cu_qty" onclick="setCauseUnit('qty')">매</button>
        </span>
      </div>
      <div id="czallw" style="display:none;flex:1;min-height:0">
        <div class="czpath" id="czallp"></div>
        <div class="czallbox"><div id="czallh"><canvas id="czall"></canvas></div></div>
      </div>
      <div class="cz3" id="cz3">
        <div class="czcol"><div class="subttl czh" id="czh0"></div>
          <div id="czp0" class="czpath"></div>
          <div><canvas id="czc0"></canvas></div></div>
        <div class="czcol"><div class="subttl czh" id="czh1"></div>
          <div id="czp1" class="czpath"></div>
          <div><canvas id="czc1"></canvas></div></div>
        <div class="czcol"><div class="subttl czh" id="czh2"></div>
          <div id="czp2" class="czpath"></div>
          <div><canvas id="czc2"></canvas></div></div>
      </div>
    </div>
    </div>

    <!-- 세 번째 열: 전체 순위 · LOT BALANCE · 드릴다운 표 -->
    <div class="farcol">
    <!-- 원인 분석에서 파고들 때마다 카드가 하나씩 쌓인다(LOT BALANCE 위). -->
    <div id="czstack"></div>
    <div id="czask" class="askpop" style="display:none"></div>

<!-- 전체 순위는 x축이 길어져 위 카드에 넣으면 안 보인다. 아래 전체 폭으로. -->
    <div class="cell" id="czdrill" style="display:none;border:1px solid var(--bd);
         border-radius:6px;padding:11px 12px;margin-bottom:10px">
      <div class="cellttl"><span id="czdttl"></span>
        <span class="v" id="czdcnt"></span></div>
      <div id="czdpath" class="czpath"></div>
      <div style="height:240px"><canvas id="czdc"></canvas></div>
    </div>

    <!-- W/T 0 구간 x status 분해. 폭이 넓어 라벨이 다 보인다. -->
    <!-- LOT BALANCE : LAYER 별 재공 -->
    <div class="cell" id="balpanel" style="display:none;border:1px solid var(--bd);
         border-radius:6px;padding:11px 12px;margin-bottom:10px">
      <div class="cellttl"><span>LOT BALANCE</span>
        <span style="display:flex;gap:6px;align-items:center">
          <span class="seg">
            <button id="bu_lots" onclick="setBalUnit('lots')">LOT</button>
            <button class="on" id="bu_qty" onclick="setBalUnit('qty')">매</button>
          </span>
          <div class="dd" id="balpick">
            <button class="rankbtn" id="balexpProd" onclick="balOpenMenu('prod')">
              제품 펼치기<span class="cv">▼</span></button>
            <div class="menu" id="balmenuProd"></div>
          </div>
          <div class="dd" id="balpick2">
            <button class="rankbtn" id="balexpPlan" onclick="balOpenMenu('plan')">
              PLAN 펼치기<span class="cv">▼</span></button>
            <div class="menu" id="balmenuPlan"></div>
          </div>
          <button class="rankbtn" id="balfold" style="display:none"
                  onclick="balCollapse()">접기</button>
        </span></div>
      <div class="balpath" id="balpath"></div>
      <div id="balbody"></div>
    </div>

    <div class="detail" id="drill">
      <div class="empty">좌측 <b>W/T 분포</b>·<b>W/T 0 재공 분포</b> 막대나
        <b>원인 분석</b> 항목을 클릭하면 해당 LOT 상세가 여기에 표시됩니다.</div>
    </div>
    </div>
  </div>
  </div>
</div>

<script src="{% static 'flowmonitor/chart.umd.js' %}"></script>
<script>
if (window.Chart) {
  Chart.defaults.font.family = "'Poppins','Noto Sans KR','Malgun Gothic',sans-serif";
  Chart.defaults.font.size = 11;
  Chart.defaults.color = "#374151";
}

const BRAND = "#2F4B7C";
const TYPE_COLORS = ["#2F4B7C", "#4C7DD1", "#7FB3E8", "#B9D4F2", "#D8E5F5"];
const nf = (n) => Number(n || 0).toLocaleString("ko-KR");

let LINE = "{{ default_line }}";
let DATA = null;
let WT_UNIT = "qty";
// lot_type 선택은 라인/뷰를 바꿔도 유지된다. 기본은 PP+PG.
let TYPE_PREF = (() => {
  try {
    const v = JSON.parse(localStorage.getItem("lotTypePref"));
    if (Array.isArray(v)) return v;
  } catch (e) {}
  return ["PP", "PG"];
})();
let CAUSE_UNIT = "qty";
// 파고든 단계들. [{i, path}] 순서대로 카드가 쌓인다.
let CZ_STACK = [];
const czStackCharts = [];

let WT0_UNIT = "qty";
let dnChart = null;

function toggleDd() {
  document.getElementById("dd").classList.toggle("open");
}
// 바깥을 누르면 열려 있는 드롭다운을 모두 닫는다(.dd 전체 대상)
document.addEventListener("click", e => {
  if (e.target.closest(".dd")) { return; }
  document.querySelectorAll(".dd.open").forEach(d => d.classList.remove("open"));
});

function selectedTypes() {
  const boxes = document.querySelectorAll("#ddm input:checked");
  if (!document.getElementById("ddm").innerHTML) return TYPE_PREF;   // 초기 로드
  return [...boxes].map(x => x.value);
}

function syncTypeLabel() {
  const t = selectedTypes();
  document.getElementById("ddb").innerHTML =
    (t.length ? (t.length <= 3 ? t.join(",") : t.length + "개 선택") : "전체") + " &#9662;";
}

function onTypeCheck() {
  TYPE_PREF = selectedTypes();
  try { localStorage.setItem("lotTypePref", JSON.stringify(TYPE_PREF)); } catch (e) {}
  syncTypeLabel();
  loadSummary();
}

let PROD1 = [], PROD2 = [], AREAS = [];
let SNAP_DATE = "", SNAP_SHIFT = "";     // 빈 값이면 현재(f3_live)

// 날짜 / SHIFT 선택. 맨 위 '현재' 가 f3_live 다.
// SHIFT 기준 시각. f3_history 에 아직 없어도 선택지는 늘 보여준다.
const SHIFT_AT = { GY: "22:00", SW: "14:00", DAY: "06:00" };
const SHIFT_LIST = ["GY", "SW", "DAY"];

function renderSnap(d) {
  const snaps = d.snapshots || [];
  // 아래 목록과 버튼 라벨 양쪽에서 쓴다. 선언이 뒤에 있으면 TDZ 오류가 난다.
  const nowAt = (d.snapshot_at || "").slice(11, 16);
  const el = document.getElementById("snapDate");
  if (el && el.value !== SNAP_DATE) { el.value = SNAP_DATE; }
  const lb = document.getElementById("snapDateLb");
  if (lb) {
    // 비워 두면 '최신' 이지만, 그래도 어느 날짜인지는 보여야 한다.
    const snapD = (d.snapshot_at || "").slice(0, 10);
    lb.textContent = (SNAP_DATE || snapD).slice(2) || "최신";
  }
  if (el) {
    const ds = snaps.map(x => x.biz_date).sort();
    if (ds.length) { el.min = ds[0]; el.max = ds[ds.length - 1]; }
    const w = document.getElementById("datefw");
    if (w) { w.classList.toggle("on", !!SNAP_DATE); }
  }

  // 그 날짜에 실제로 적재된 shift 는 시각을 함께 보여준다.
  const have = {};
  snaps.filter(x => !SNAP_DATE || x.biz_date === SNAP_DATE)
       .forEach(x => { have[x.shift] = x.at; });

  const sm = document.getElementById("shm");
  sm.innerHTML = `<label><input type="radio" name="snaps"`
    + `${!SNAP_SHIFT ? " checked" : ""} onchange="pickSnapShift('')">`
    + `최신${nowAt ? " (" + nowAt + ")" : ""}</label>`
    + SHIFT_LIST.map(k => {
        const at = have[k] || SHIFT_AT[k];
        const off = !have[k] && SNAP_DATE;      // 그 날 데이터가 없는 shift
        return `<label${off ? ' style="color:var(--mut)"' : ""}>`
          + `<input type="radio" name="snaps"${SNAP_SHIFT === k ? " checked" : ""}`
          + `${off ? " disabled" : ""} onchange="pickSnapShift('${k}')">`
          + `${k} (${at})${off ? " · 없음" : ""}</label>`;
      }).join("");
  document.getElementById("shb").innerHTML =
    `<span>SHIFT ${SNAP_SHIFT || ("최신" + (nowAt ? " " + nowAt : ""))}</span>`
    + `<span>&#9662;</span>`;
  document.getElementById("shb").classList.toggle("on", !!SNAP_SHIFT);
}

function pickSnapDate(v) {
  SNAP_DATE = v;
  SNAP_SHIFT = "";              // 날짜가 바뀌면 shift 는 다시 고른다
  loadSummary();
}

function pickSnapShift(v) { SNAP_SHIFT = v; loadSummary(); }

function toggleProd(id) {
  const el = document.getElementById(id);
  const open = el.classList.contains("open");
  document.querySelectorAll(".dd").forEach(d => d.classList.remove("open"));
  if (!open) { el.classList.add("open"); }
}

const PROD_LABEL = { 1: "제품군", 2: "제품", 3: "AREA" };

// ALL 은 목록 맨 위의 전체 선택 스위치다.
// 내부적으로는 "선택 없음 = 전체" 로 다루므로, ALL 이 켜지면 빈 배열로 둔다.
function prodPicked(which, isAll) {
  const box = document.getElementById("p" + which + "m");
  const all = box.querySelector("input[data-all]");

  if (isAll) {
    const on = all.checked;
    box.querySelectorAll("input:not([data-all])").forEach(x => { x.checked = on; });
  }
  const opts = [...box.querySelectorAll("input:not([data-all])")];
  const sel = opts.filter(x => x.checked).map(x => x.value);
  if (all) { all.checked = (sel.length === opts.length && opts.length > 0); }

  // 전부 선택 == 전체(빈 배열). 다만 '전부 해제' 는 전체가 아니다.
  // 그때 빈 배열로 보내면 서버가 전체로 보고 다시 다 체크되어 되돌아간다.
  // 하나도 안 고른 동안에는 조회하지 않고 UI 상태만 유지한다.
  const eff = (sel.length === opts.length) ? [] : sel;
  if (which === 1) { PROD1 = eff; PROD2 = []; }
  else if (which === 2) { PROD2 = eff; }
  else { AREAS = eff; }
  if (sel.length === 0) {
    document.getElementById("p" + which + "b").innerHTML =
      `<span>${PROD_LABEL[which]} 선택 없음</span><span>&#9662;</span>`;
    return;                       // 항목을 고르면 그때 조회한다
  }
  loadSummary();
}

// 검색: 대소문자 무시 부분일치. 'dd' 로 *dd / dd* / *dd* 가 모두 걸린다.
function prodSearch(which) {
  const q = (document.getElementById("p" + which + "q").value || "")
    .trim().toLowerCase();
  document.querySelectorAll("#p" + which + "m label[data-opt]").forEach(el => {
    const v = (el.getAttribute("data-opt") || "").toLowerCase();
    el.style.display = (!q || v.indexOf(q) >= 0) ? "" : "none";
  });
}

function renderProd(d) {
  const fill = (which, opts, cur) => {
    opts = opts || [];
    const box = document.getElementById("p" + which + "m");
    const isAll = (cur.length === 0);          // 선택 없음 = 전체
    const set = new Set(cur);
    box.innerHTML =
      `<input class="ddq" id="p${which}q" type="text" placeholder="검색"`
      + ` oninput="prodSearch(${which})" onclick="event.stopPropagation()">`
      + `<label style="border-bottom:1px solid var(--bd);font-weight:600">`
      + `<input type="checkbox" data-all ${isAll ? "checked" : ""}`
      + ` onchange="prodPicked(${which}, true)">ALL</label>`
      + (opts.map(o =>
          `<label data-opt="${o}"><input type="checkbox" value="${o}"`
          + ` ${isAll || set.has(o) ? "checked" : ""}`
          + ` onchange="prodPicked(${which}, false)">${o}</label>`).join("")
         || `<label style="color:var(--mut)">값 없음</label>`);
    const btn = document.getElementById("p" + which + "b");
    btn.innerHTML = `<span>${PROD_LABEL[which]} `
      + (isAll ? "전체" : (cur.length <= 2 ? cur.join(",") : cur.length + "개"))
      + `</span><span>&#9662;</span>`;
    btn.classList.toggle("on", !isAll);      // 필터가 걸려 있으면 라인처럼 강조
  };
  fill(1, d.prod1_options, PROD1);
  fill(2, d.prod2_options, PROD2);
  fill(3, d.area_options, AREAS);
}

function pickLine(line) {
  LINE = line;
  document.querySelectorAll("#lineseg button").forEach(b =>
    b.classList.toggle("on", b.dataset.line === line));
  document.getElementById("ddm").innerHTML = "";   // 라인마다 lot_type 이 다를 수 있다
  PROD1 = []; PROD2 = []; AREAS = [];              // 제품구분도 라인별로 다르다
  loadSummary();
}

function setWtUnit(u) {
  WT_UNIT = u;
  document.getElementById("wu_lots").className = (u === "lots") ? "on" : "";
  document.getElementById("wu_qty").className = (u === "qty") ? "on" : "";
  renderWt();
}

function setCauseUnit(u) {
  CAUSE_UNIT = u;
  document.getElementById("cu_lots").className = (u === "lots") ? "on" : "";
  document.getElementById("cu_qty").className = (u === "qty") ? "on" : "";
  renderCause();
}

function setWt0Unit(u) {
  WT0_UNIT = u;
  document.getElementById("zu_lots").className = (u === "lots") ? "on" : "";
  document.getElementById("zu_qty").className = (u === "qty") ? "on" : "";
  renderWt0();
}

/* --- 재공 --- */
function renderWip() {
  const d = DATA;
  document.getElementById("wl").textContent = nf(d.total.lots);
  document.getElementById("wq").textContent = nf(d.total.qty);

  if (!document.getElementById("ddm").innerHTML) {
    const sel = new Set(d.selected_types || []);
    document.getElementById("ddm").innerHTML = d.types.map(t =>
      `<label><input type="checkbox" value="${t}" ${sel.has(t) ? "checked" : ""}`
      + ` onchange="onTypeCheck()">${t}</label>`).join("");
    syncTypeLabel();
  }
  const tot = d.by_lot_type.reduce((a, x) => a + x.lots, 0) || 1;
  document.getElementById("ws").innerHTML = d.by_lot_type.map((x, k) =>
    `<i class="${(DF.type || []).indexOf(x.name) >= 0 ? 'sel' : ''}"
        style="width:${x.lots / tot * 100}%;background:${TYPE_COLORS[k % 5]}"
        onclick="pickType('${x.name}', event)"
        title="${x.name} ${nf(x.lots)} LOT / ${nf(x.qty)} 매 (Ctrl 다중선택)"
        ></i>`).join("");
  document.getElementById("wg").innerHTML = d.by_lot_type.map((x, k) =>
    `<span><i style="background:${TYPE_COLORS[k % 5]}"></i>${x.name}
       ${(x.lots / tot * 100).toFixed(0)}%</span>`).join("");
}


function pickType(name, ev) {
  setCond("type", name, ev, null, false, "type");
  syncFromDF();
}

// lot_type 을 가리지 않고 지금 조건 그대로 전부 본다.
function pickTypeAll() {
  delete DF.type;
  syncFromDF();
  if (!Object.keys(DF).length && !DF_CAUSE) {
    openDrill({}, "전체", "multi");
  }
}

/* --- status --- */
const sliceLabels = {
  id: "sliceLabels",
  afterDatasetsDraw(ch) {
    const st = ch.$status || [];
    const ctx = ch.ctx;
    ctx.save();
    ctx.font = "600 10px 'Poppins','Noto Sans KR',sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ch.getDatasetMeta(0).data.forEach((arc, k) => {
      const v = st[k];
      if (!v || v.pct < 6) return;
      const a = (arc.startAngle + arc.endAngle) / 2;
      const r = arc.outerRadius * 0.62;
      ctx.fillStyle = "#fff";
      ctx.fillText(v.pct + "%", arc.x + Math.cos(a) * r, arc.y + Math.sin(a) * r);
    });
    ctx.restore();
  }
};

function setStatusInfo() {
  const d = DATA;
  const picked = (DF.status || [])
    .map(n => d.status.find(x => x.name === n)).filter(Boolean);

  let names, pct, lots, qty, color;
  if (!picked.length) {
    names = [d.default.label];
    pct = d.default.pct; lots = d.default.lots; qty = d.default.qty;
    color = d.default.color || BRAND;
  } else {
    // 여러 개를 고르면 합계를 보여 준다. 이름은 줄바꿈해 나열한다.
    names = picked.map(x => x.name);
    lots = picked.reduce((a, x) => a + x.lots, 0);
    qty = picked.reduce((a, x) => a + x.qty, 0);
    pct = d.total && d.total.lots ? (lots / d.total.lots * 100) : 0;
    color = picked.length === 1 ? picked[0].color : BRAND;
  }
  document.getElementById("dt").innerHTML =
    names.map(n => {
      const c = (d.status.find(x => x.name === n) || {}).color || color;
      return `<div class="nm" style="color:${c}">${n}</div>`;
    }).join("")
    + `<div class="pc">${pct.toFixed(1)}%</div>
       <div class="sub">${nf(lots)} LOT &middot; ${nf(qty)} 매</div>`;
  // 고른 것을 모두 굵게 표시한다.
  const on = new Set(DF.status || []);
  document.querySelectorAll("#lg span").forEach((el, k) =>
    el.classList.toggle("on", on.has((d.status[k] || {}).name)));
}

// 범례 클릭도 조건 저장소를 거친다(원차트 조각 클릭과 같은 동작).
function pickStatus(i, ev) {
  const st = (DATA.status || [])[i];
  if (!st) { return; }
  setCond("status", st.name, ev || null, null, false, "pie");
  syncFromDF();
}

// 원차트 전용 HTML 툴팁. body 에 붙여 어떤 요소에도 가리지 않는다.
function dnTooltip(ctx) {
  let el = document.getElementById("dntip");
  if (!el) {
    el = document.createElement("div");
    el.id = "dntip";
    el.className = "htip";
    document.body.appendChild(el);
  }
  const tt = ctx.tooltip;
  if (!tt || tt.opacity === 0) { el.style.opacity = "0"; return; }

  const i = (tt.dataPoints && tt.dataPoints[0]) ? tt.dataPoints[0].dataIndex : -1;
  const st = ((ctx.chart.$status || [])[i]) || {};
  el.innerHTML = `<i style="background:${st.color}"></i>${st.name}`
    + `<b>${st.pct}%</b>${nf(st.lots)} LOT · ${nf(st.qty)} 매`;

  const box = ctx.chart.canvas.getBoundingClientRect();
  el.style.opacity = "1";
  el.style.left = (box.left + window.pageXOffset + tt.caretX + 12) + "px";
  el.style.top = (box.top + window.pageYOffset + tt.caretY - 10) + "px";
}

function renderStatus() {
  const d = DATA;
  // 범례는 status 네 개만. 기본 표시(HOLD)는 원 우측에 나온다.
  document.getElementById("lg").innerHTML =
    d.status.map((st, i) =>
        `<span onclick="pickStatus(${i})"><i style="background:${st.color}"></i>`
        + `${st.name}</span>`).join("");

  if (!dnChart) {
    dnChart = new Chart(document.getElementById("dn"), {
      type: "doughnut",
      data: { labels: d.status.map(s => s.name),
              datasets: [{ data: d.status.map(s => s.lots),
                           backgroundColor: d.status.map(s => s.color),
                           borderWidth: 0 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: 0, animation: false,
        // 기본 툴팁은 canvas 안에 그려져 우측 글자에 가리거나 잘린다.
        // 화면 최상단에 뜨는 HTML 툴팁을 쓴다.
        plugins: { legend: { display: false },
                   tooltip: { enabled: false, external: dnTooltip } },
        onClick: (e, els) => {
          if (!els.length) { return; }
          // pickStatus 가 setCond + syncFromDF 를 모두 한다.
          // 여기서 한 번 더 부르면 같은 값이라 곧바로 해제된다.
          pickStatus(els[0].index, e.native || e);
        }
      },
      plugins: [sliceLabels]
    });
  }
  dnChart.data.labels = d.status.map(s => s.name);
  dnChart.data.datasets[0].data = d.status.map(s => s.lots);
  dnChart.data.datasets[0].backgroundColor = d.status.map(s => s.color);
  dnChart.$status = d.status;
  // 고른 상태를 전부 표시한다(Ctrl 로 여러 개 고를 수 있다).
  const picked = new Set(DF.status || []);
  dnChart.$selSet = picked;
  markSelected(dnChart, d.status.findIndex(x => picked.has(x.name)));
  dnChart.update();
  setStatusInfo();
}

/* --- W/T 0 재공 분포 : 마지막 작업 이후 경과일 --- */
let wt0Chart = null;

function renderWt0() {
  const d = DATA, u = WT0_UNIT;
  const list = d.wt0_dist || [];
  const sts = d.wt0_status || [];
  const unit = (u === "lots") ? "lot" : "매";

  const datasets = sts.map(st => ({
    label: st.name, backgroundColor: st.color, borderWidth: 0,
    data: list.map(x => {
      const v = (x.by_status || {})[st.name];
      return v ? (u === "lots" ? v.lots : v.qty) : 0;
    })
  }));
  const tot = list.map(x => (u === "lots" ? x.lots : x.qty) || 0);

  if (!wt0Chart) {
    wt0Chart = new Chart(document.getElementById("wt0c"), {
      type: "bar",
      data: { labels: [], datasets: [] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        layout: { padding: { top: 16 } },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: (t) => {
                     const g = (wt0Chart.$tot || [])[t.dataIndex] || 0;
                     const v = t.raw || 0;
                     return t.dataset.label + " " + nf(v)
                       + (WT0_UNIT === "lots" ? " lot" : " 매")
                       + (g ? " (" + Math.round(v / g * 100) + "%)" : "");
                   } } } },
        scales: { x: { stacked: true, grid: { display: false },
                       ticks: { font: { size: 10 } } },
                  y: { stacked: true, display: false, beginAtZero: true,
                       grace: "18%" } },
        onClick: (e, els) => {
          const ev = e.native || e;
          // els 는 Chart.js 기본 모드가 고른 것이라 누른 조각과 다를 수 있다.
          // 커서가 실제로 얹힌 조각을 먼저 찾는다.
          const hit = wt0Chart.getElementsAtEventForMode(
            ev, "nearest", { intersect: true }, false);
          const idx = hit.length ? hit[0].index
                                 : (els.length ? els[0].index : -1);
          if (idx < 0) { return; }
          const x = (DATA.wt0_dist || [])[idx];
          if (!x) { return; }
          const seg = hit.length
            ? (wt0Chart.data.datasets[hit[0].datasetIndex] || {}).label : null;
          pickStacked("wt0", x.name, seg, ev, x.label, "wt0");
          if (DBG_PICK) { logPick("W/T 0", wt0Chart, ev, els, hit); }
          syncFromDF();
        }
      },
      plugins: [{
        id: "wt0Val",
        afterDatasetsDraw(ch) {
          const ctx = ch.ctx; ctx.save();
          ctx.textAlign = "center";
          const tot = ch.$tot || [];

          // 조각마다 값과 비율을 두 줄로. 얇으면 생략한다.
          ctx.font = "9px 'Poppins','Noto Sans KR',sans-serif";
          ctx.textBaseline = "middle";
          ch.data.datasets.forEach((ds, di) => {
            ch.getDatasetMeta(di).data.forEach((el, k) => {
              const v = ds.data[k];
              if (!v) { return; }
              const h = Math.abs(el.base - el.y);
              if (h < 20) { return; }
              const p = tot[k] ? Math.round(v / tot[k] * 100) : 0;
              const cy = (el.y + el.base) / 2;
              ctx.fillStyle = "#1F2937";
              ctx.fillText(kfmt(v), el.x, cy - 5);
              ctx.fillText("(" + p + "%)", el.x, cy + 5);
            });
          });

          // 구간 합계는 막대 위에
          ctx.font = "10px 'Poppins','Noto Sans KR',sans-serif";
          ctx.textBaseline = "bottom";
          ctx.fillStyle = "#374151";
          const top = ch.getDatasetMeta(ch.data.datasets.length - 1);
          (top ? top.data : []).forEach((el, k) => {
            if (tot[k]) {
              ctx.fillText(kfmt(tot[k]) + (WT0_UNIT === "lots" ? "lot" : "매"),
                           el.x, el.y - 4);
            }
          });
          ctx.restore();
        }
      }]
    });
  }
  wt0Chart.$tot = tot;
  wt0Chart.data.labels = list.map(x => x.label);
  wt0Chart.data.datasets = datasets;
  // 고른 (구간, status) 쌍을 모두 표시한다.
  const bins = (DF.wt0 || []).map(k => list.findIndex(y => y.name === k))
    .filter(k => k >= 0);
  const dss = (DF.status || []).map(n => sts.findIndex(x => x.name === n))
    .filter(k => k >= 0);
  const pairs = [];
  bins.forEach(k => {
    if (dss.length) { dss.forEach(di => pairs.push([k, di])); }
    else { pairs.push([k, sts.length - 1]); }   // status 미선택이면 맨 위 조각
  });
  keepBarWidth(wt0Chart, list.length);
  wt0Chart.$selPairs = pairs;
  wt0Chart.$selSet = null;
  markSelected(wt0Chart, -1);
  wt0Chart.update();

  // 전체 status 비율. 한 줄에 들어가게 k 표기를 쓴다.
  const gt = sts.reduce((a, x) => a + (u === "lots" ? x.lots : x.qty), 0);
  document.getElementById("wt0sum").innerHTML = gt
    ? `<span class="stchip"><b>전체</b></span>`
      + sts.map(x => {
          const v = (u === "lots" ? x.lots : x.qty);
          return `<span class="stchip"><i style="background:${x.color}"></i>`
            + `${x.name} ${kfmt(v)}${unit}(${Math.round(v / gt * 100)}%)</span>`;
        }).join("")
    : "";
}

/* --- LOT BALANCE : LAYER 별 재공 --------------------------------------
   접힌 상태는 전체 합산 한 줄. 펼치면 PLAN 별로 나뉘되 LAYER 는 같은
   x 위치에 맞춘다(없는 LAYER 는 빈칸). 메인 PLAN 이 맨 위.
----------------------------------------------------------------------- */
let BAL_UNIT = "qty";
let BAL_OPEN = false;
let BAL_DATA = null;
let BAL_PICK = null;      // 펼칠 목록. null 이면 전부
let BAL_BY = "";          // "" 면 접힘. prod / plan / prod,plan
let BAL_OPEN_ID = null;   // 받아온 뒤 열어 둘 메뉴
let BAL_LABEL = "";       // 어떤 드릴다운에서 왔는지
let BAL_SRC = "";         // 그 드릴다운의 출처(되돌아갈 때 쓴다)
const balCharts = [];

function setBalUnit(u) {
  BAL_UNIT = u;
  document.getElementById("bu_lots").className = (u === "lots") ? "on" : "";
  document.getElementById("bu_qty").className = (u === "qty") ? "on" : "";
  drawBalance();
}

// 펼치기 팝업. 기준(제품/PLAN)과 항목을 한 곳에서 고른다.


// 기준 토글. 제품과 PLAN 을 함께 고르면 '제품 · PLAN' 으로 묶인다.
// 경로에서 원인 계층을 눌러 그 단계로 되돌아간다.
function czBackTo(level) {
  if (!DF_CAUSE) { return; }
  if (level === "big") { DF_CAUSE = null; }
  else { DF_CAUSE = { i: DF_CAUSE.i, big: DF_CAUSE.big, mid: null, subs: [] }; }
  dfResetBelow(4);
  syncFromDF();
}

function balByName() {
  return BAL_BY.split(",").filter(Boolean)
    .map(x => x === "prod" ? "제품" : "PLAN").join(" · ");
}

// 제품 / PLAN 을 각각 켜고 끈다. 둘 다 켜면 '제품 · PLAN' 으로 묶인다.
function balOpenMenu(which) {
  const id = (which === "prod") ? "balpick" : "balpick2";
  const box = document.getElementById(id);
  const open = box.classList.contains("open");
  document.querySelectorAll(".dd.open").forEach(d => d.classList.remove("open"));
  if (open) { return; }
  if (BAL_BY.split(",").indexOf(which) < 0) {   // 아직 안 켠 기준이면 켠다
    balBy(which, true, id);                     // 목록만 받아 온다(아직 접힘)
    return;
  }
  renderBalMenu(which);
  box.classList.add("open");
}

function balBy(which, on, openId) {
  const set = new Set(BAL_BY.split(",").filter(Boolean));
  if (on) { set.add(which); } else { set.delete(which); }
  BAL_BY = ["prod", "plan"].filter(x => set.has(x)).join(",");
  // 축을 켰다고 바로 펼치지 않는다. 목록에서 고르면 그때 나뉜다.
  BAL_PICK = [];
  BAL_OPEN = false;
  BAL_OPEN_ID = openId || null;
  loadBalance(true);
}

function renderBalMenu(which) {
  const list = (BAL_DATA && BAL_DATA.plans) || [];
  const plans = list.map(p => p.name);
  const mainOf = {};
  list.forEach(p => { mainOf[p.name] = !!p.main; });
  const on = BAL_PICK ? new Set(BAL_PICK) : new Set(plans);
  const mid = (which === "prod") ? "Prod" : "Plan";

  document.getElementById("balmenu" + mid).innerHTML =
    `<label class="dfall"><input type="checkbox" checked`
    + ` onclick="balBy('${which}', this.checked)">`
    + `<b>${which === "prod" ? "제품" : "PLAN"} 으로 나누기</b></label>`
    + `<input class="ddq" id="balq${mid}" type="text" placeholder="검색"`
    + ` oninput="balSearch('${mid}')" onclick="event.stopPropagation()">`
    + `<label class="dfall"><input type="checkbox"`
    + `${BAL_PICK === null ? " checked" : ""} onclick="balAll(event,'${mid}')">`
    + `<b>ALL</b></label>`
    + plans.map(p => `<label data-opt="${p}"><input type="checkbox" value="${p}"`
        + `${on.has(p) ? " checked" : ""} onclick="balPick('${mid}')">`
        + `${mainOf[p] ? "<b>★ " + p + "</b>" : p}</label>`).join("");
}

function balSearch(mid) {
  const q = (document.getElementById("balq" + mid).value || "")
    .trim().toLowerCase();
  document.querySelectorAll("#balmenu" + mid + " label[data-opt]").forEach(el => {
    const v = (el.getAttribute("data-opt") || "").toLowerCase();
    el.style.display = (!q || v.indexOf(q) >= 0) ? "" : "none";
  });
}

function balAll(ev, mid) {
  const on = ev.target.checked;
  document.querySelectorAll("#balmenu" + mid + " input[value]").forEach(x => {
    x.checked = on;
  });
  balPick(mid);
}

function balPick(mid) {
  const boxes = [...document.querySelectorAll("#balmenu" + mid + " input[value]")];
  const sel = boxes.filter(x => x.checked).map(x => x.value);
  BAL_PICK = (sel.length === boxes.length) ? null : sel;
  // 하나도 안 고르면 합산 한 줄로 돌아간다. 축(BAL_BY)은 그대로 둔다.
  BAL_OPEN = (BAL_PICK === null) || BAL_PICK.length > 0;
  balSyncBtns();
  drawBalance();
}

function balSyncBtns() {
  const by = new Set(BAL_BY.split(",").filter(Boolean));
  const set = (id, key, name) => {
    const b = document.getElementById(id);
    if (!b) { return; }
    const on = by.has(key);
    b.innerHTML = `${name} ${on ? (BAL_PICK ? BAL_PICK.length + "개" : "전체")
                              : "펼치기"}<span class="cv">${on ? "▲" : "▼"}</span>`;
    b.classList.toggle("on", on);
  };
  set("balexpProd", "prod", "제품");
  set("balexpPlan", "plan", "PLAN");
  const f = document.getElementById("balfold");
  if (f) { f.style.display = BAL_OPEN ? "" : "none"; }
}

// 펼치기 자체를 해제한다.
function balCollapse() {
  BAL_OPEN = false; BAL_PICK = null; BAL_BY = "";
  balSyncBtns();
  document.querySelectorAll(".dd.open").forEach(d => d.classList.remove("open"));
  drawBalance();
}

function loadBalance(show) {
  const box = document.getElementById("balpanel");
  if (!show) { box.style.display = "none"; return; }
  const base = Object.assign({
    line: LINE, types: selectedTypes().join(","),
    prod1: PROD1.join(","), prod2: PROD2.join(","), area: AREAS.join(","),
    biz_date: SNAP_DATE, shift: SNAP_SHIFT, by: (BAL_BY || "plan")
  }, dfFilter());
  delete base.layer_id;                 // LAYER 는 이 차트의 x축이라 뺀다
  const q = Object.entries(base)
    .filter(([, v]) => v !== undefined && v !== null && v !== "")
    .map(([k, v]) => k + "=" + encodeURIComponent(v)).join("&");
  fetch("/api/balance/?" + q).then(r => r.json()).then(d => {
    BAL_DATA = d;
    box.style.display = (d.layers || []).length ? "block" : "none";
    balSyncBtns();
    drawBalance();
    resizeCharts();
    if (BAL_OPEN_ID) {
      renderBalMenu(BAL_OPEN_ID === "balpick" ? "prod" : "plan");
      document.getElementById(BAL_OPEN_ID).classList.add("open");
      BAL_OPEN_ID = null;
    }
  });
}

function drawBalance() {
  const d = BAL_DATA;
  if (!d) { return; }
  const xs = d.layers || [];
  let rows = BAL_OPEN ? (d.plans || [])
                      : [{ name: "전체", qty: (d.total || {}).qty,
                           lots: (d.total || {}).lots }];
  if (BAL_OPEN && BAL_PICK && BAL_PICK.length) {
    const on = new Set(BAL_PICK);
    rows = rows.filter(r => on.has(r.name));
  }
  if (!rows.length) {
    rows = [{ name: "전체", qty: (d.total || {}).qty,
              lots: (d.total || {}).lots }];
  }

  // 경로를 눌러 그 단계로 돌아간다.
  const unit = balByName();
  // 상위 조건은 각 단계를 눌러 되돌아갈 수 있어야 한다.
  // 조건 표기는 dfTitle 한 곳에서만 만든다(여기서 따로 조립하면 어긋난다).
  const conds = [];
  DF_DEF.forEach(dd => {
    const n = dfOneName(dd);
    if (n) { conds.push(`<a onclick="dfClear('${dd.k}')">${n}</a>`); }
  });
  if (DF_CAUSE) {
    conds.push(`<a onclick="dfClear('cause')">${causeName()}</a>`);
  }
  let html = `<a onclick="dfClearAllConds()">LOT BALANCE</a>`;
  if (conds.length) { html += "  ·  " + conds.join("  ·  "); }
  if (BAL_OPEN) {
    html += `  ·  <a onclick="balCollapse()">${unit} `
      + `${BAL_PICK ? BAL_PICK.join(", ") : "전체"}</a>`;
  }
  document.getElementById("balpath").innerHTML = html;

  // 캔버스를 필요한 만큼만 만들고 재사용한다.
  const body = document.getElementById("balbody");
  if (body.childElementCount !== rows.length) {
    balCharts.forEach(c => c && c.destroy());
    balCharts.length = 0;
    body.innerHTML = rows.map((r, i) =>
      `<div class="balrow"><div class="ballab">${r.name}</div>`
      + `<div class="balc"><canvas id="balc${i}"></canvas></div></div>`).join("");
  } else {
    rows.forEach((r, i) => {
      const el = body.children[i].querySelector(".ballab");
      if (el) { el.textContent = r.name; }
    });
  }

  const sts = d.status || [];
  rows.forEach((r, i) => {
    const src = (BAL_UNIT === "lots") ? r.lots : r.qty;
    const datasets = sts.map(st => ({
      label: st.name, backgroundColor: st.color, borderWidth: 0,
      data: (src && src[st.name]) ? src[st.name] : xs.map(() => 0)
    }));
    const tot = xs.map((_, k) =>
      datasets.reduce((a, ds) => a + (ds.data[k] || 0), 0));

    if (!balCharts[i]) {
      balCharts[i] = new Chart(document.getElementById("balc" + i), {
        type: "bar",
        data: { labels: xs, datasets: datasets },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          plugins: { legend: { display: false },
                     tooltip: { callbacks: { label: (t) => {
                       const g = (balCharts[i].$tot || [])[t.dataIndex] || 0;
                       const v = t.raw || 0;
                       return t.dataset.label + " " + nf(v)
                         + (BAL_UNIT === "lots" ? " lot" : " 매")
                         + (g ? " (" + Math.round(v / g * 100) + "%)" : "");
                     } } } },
          scales: { x: { stacked: true, grid: { display: false },
                         ticks: { color: "#111827", autoSkip: false,
                                  font: { size: 8, weight: "700" },
                                  maxRotation: 90, minRotation: 90,
                                  padding: 0 } },
                    y: { stacked: true, display: false, beginAtZero: true,
                         grace: "20%" } },
          onClick: (e, els) => {
            if (!els.length) { return; }
            // 차트는 한 번만 만들고 재사용한다. 생성 시점의 xs 를 붙잡으면
            // 이후 갱신된 LAYER 와 어긋난다. 지금 라벨을 직접 읽는다.
            const ch = balCharts[i];
            const ev = e.native || e;
            const lay = ch.data.labels[els[0].index];
            if (lay === undefined || lay === null) { return; }
            // 누적막대라 조각 색은 status 다. 구간과 한 쌍으로 다룬다.
            const hit = ch.getElementsAtEventForMode(
              ev, "nearest", { intersect: true }, false);
            const seg = hit.length
              ? (ch.data.datasets[hit[0].datasetIndex] || {}).label : null;
            pickStacked("layer", String(lay), seg, ev, null, "bal");
            if (DBG_PICK) { logPick("LOT BALANCE", ch, ev, els, hit); }
            syncFromDF();
          }
        },
        plugins: [{
          id: "balVal" + i,
          afterDatasetsDraw(ch) {
            const ctx = ch.ctx; ctx.save();
            ctx.font = "bold 9px 'Poppins','Noto Sans KR',sans-serif";
            ctx.fillStyle = "#374151";
            const top = ch.getDatasetMeta(ch.data.datasets.length - 1);
            (top ? top.data : []).forEach((el, k) => {
              const v = (ch.$tot || [])[k];
              if (!v) { return; }
              // x축 라벨과 같은 방향(시계방향 90도)으로 세워 쓴다.
              ctx.save();
              ctx.translate(el.x, el.y - 4);
              ctx.rotate(-Math.PI / 2);
              ctx.textAlign = "left";
              ctx.textBaseline = "middle";
              ctx.fillText(kfmt(v), 0, 0);
              ctx.restore();
            });
            ctx.restore();
          },
          // x축 아래에 모듈 구간을 선으로 나누고 가운데에 이름을 쓴다.
          afterDraw(ch) {
            const bands = (BAL_DATA && BAL_DATA.modules) || [];
            if (!bands.length) { return; }
            const meta = ch.getDatasetMeta(0).data;
            if (!meta.length) { return; }
            const ctx = ch.ctx;
            const y = ch.chartArea.bottom;
            const h = ch.height;
            const half = (meta.length > 1)
              ? Math.abs(meta[1].x - meta[0].x) / 2
              : (ch.chartArea.right - ch.chartArea.left) / 2;
            ctx.save();
            ctx.font = "bold 9px 'Poppins','Noto Sans KR',sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "bottom";
            ctx.strokeStyle = "#9CA3AF";
            ctx.lineWidth = 1;
            bands.forEach(b => {
              const a = meta[b.from], z = meta[b.to];
              if (!a || !z) { return; }
              const x1 = a.x - half, x2 = z.x + half;
              ctx.beginPath();                    // 구간 경계
              ctx.moveTo(x2, y); ctx.lineTo(x2, h - 2);
              ctx.stroke();
              ctx.fillStyle = "#374151";          // 가운데 이름
              ctx.fillText(b.name, (x1 + x2) / 2, h - 3);
            });
            ctx.restore();
          }
        }]
      });
    } else {
      balCharts[i].data.labels = xs;
      balCharts[i].data.datasets = datasets;
    }
    balCharts[i].$tot = tot;
    const bk = (DF.layer || []).map(v => xs.indexOf(v)).filter(k => k >= 0);
    const bd = (DF.status || []).map(n => sts.findIndex(x => x.name === n))
      .filter(k => k >= 0);
    const bp = [];
    bk.forEach(k => {
      if (bd.length) { bd.forEach(di => bp.push([k, di])); }
      else { bp.push([k, sts.length - 1]); }
    });
    // LAYER 를 고르면 고른 것만 남기고 나머지는 감춘다.
    // 축 자리와 막대 굵기는 그대로 두어 위치 감각이 유지된다.
    const pick = new Set(DF.layer || []);
    if (pick.size) {
      balCharts[i].data.datasets.forEach(ds => {
        ds.data = ds.data.map((v, k) => pick.has(xs[k]) ? v : null);
      });
      balCharts[i].$tot = tot.map((v, k) => pick.has(xs[k]) ? v : 0);
    }
    keepBarWidth(balCharts[i], xs.length);
    balCharts[i].$selPairs = bp;
    balCharts[i].$selSet = null;
    markSelected(balCharts[i], -1);
    balCharts[i].update();
  });
}

// 7300 -> 7.3k. 라벨이 길어지지 않게 줄인다.
function kfmt(v) {
  const n = Number(v) || 0;
  return n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(Math.round(n));
}

/* --- 원인 분석 -------------------------------------------------------------
   상단 3개(대분류)는 항상 고정. 막대를 누르면 아래에 드릴다운 차트가 생긴다.
   경로 항목은 {name, kind} 로 들고 있어야 필터에서 중분류/소분류를 구분한다.
   (Hold / Bottleneck 은 중분류가 없어 첫 단계가 곧 소분류다.)
--------------------------------------------------------------------------- */
const czCharts = [null, null, null];
let czDrill = null;
let CZ_SEL = { i: -1, path: [] };          // 한 번에 하나만 파고든다
let DRILL_KEY = { i: -1, node: null, list: [] };  // 표가 어느 차트·막대에서 나왔는지

/* ── 드릴다운 조건 (한 곳에서 관리) ──────────────────────────────────────
   차트마다 조건을 따로 들고 있으면 무엇이 걸렸는지 알 수 없다.
   여기 모아 두고 표 위에 칩으로 보여준다.

   클릭 규칙 (단순하게)
     그냥 클릭       이전 조건을 모두 지우고 그것만 본다
     Ctrl 클릭       같은 차트 안에서 여러 개
     같은 것 재클릭   해제
--------------------------------------------------------------------------- */
/* 계층(lv). 위를 고르면 아래는 모두 리셋된다. 아래가 위를 바꾸지는 못한다.
     1  좌측 최상단 필터(날짜/SHIFT/라인/제품군/제품/lot_type)
     2  좌측 차트(재공막대·status 원·W/T·W/T 0)
     3  SHIFT 추이  (과거를 포함한 시계열이라 원인 분석보다 위다)
     4  원인 분석
     5  원인 분석 전체보기
     6  LOT BALANCE
     7  드릴다운 표
   같은 계층에서 다른 차트를 누르면 **그것만 남기고 리셋**한다
   (Ctrl 은 같은 차트 안에서만 여러 개). */
/* 조건은 **차트가 아니라 필드** 단위다.
   차트가 달라도 같은 필드를 건드리면 같은 조건이다.
     status   원차트 · W/T 0 조각 · LOT BALANCE 조각
     wt0      W/T 0 막대(경과기간)
     type     재공 막대
     wt       W/T 분포
     layer    LOT BALANCE 막대
     cause    원인 분석

   같은 필드의 여러 값  ->  OR (한 LOT 은 그 값 하나만 갖는다)
   서로 다른 필드끼리   ->  AND
   조합 결과가 0 이면 0 을 그대로 보여 준다(자동으로 풀지 않는다). */
const DF_DEF = [
  { k: "type",   t: "재공",   param: "lot_type", lv: 2, one: true },
  { k: "status", t: "STATUS", param: "status",   lv: 2, one: true },
  { k: "wt",     t: "W/T",    param: "wt_range", lv: 2, one: true },
  { k: "wt0",    t: "W/T 0",  param: "wt0",      lv: 2, one: true },
  { k: "iarea",  t: "AREA",   param: "f_area",   lv: 2, one: true },
  { k: "layer",  t: "LAYER",  param: "layer_id", lv: 5, one: true },
];
const DF_LV = {};
DF_DEF.forEach(d => { DF_LV[d.k] = d.lv; });
DF_LV.cause = 4;              // 원인 분석

// 이 계층보다 아래의 조건을 모두 지운다.
function dfResetBelow(lv, keepCz) {
  Object.keys(DF).forEach(k => { if ((DF_LV[k] || 9) > lv) { delete DF[k]; } });
  if (DF_LV.cause > lv) { DF_CAUSE = null; }
  // 원인 분석(4)보다 위를 고르면 그 아래 시각화도 전부 접는다.
  // keepCz: 원인 분석 안에서 파고드는 중이라 방금 만든 차트를 지키고 싶을 때.
  if (lv < 5 && !keepCz) {
    CZ_WIDE = null; CZ_STACK = []; CZ_SEL = { i: -1, path: [] };
  }
  if (lv < 6) { BAL_BY = ""; BAL_OPEN = false; BAL_PICK = null; }
}

// 같은 계층의 다른 차트 조건을 지운다.
let DF = {};                 // {키: [값...]}
let DF_X = {};               // 요약카드 전용 조건(x_prod / x_mod / x_area / x_eqp)
let DF_CAUSE = null;         // {big, mid, subs:[], i}
let DF_LABEL = {};           // 화면 표시용 라벨

function dfReset() {
  DF = {}; DF_CAUSE = null; DF_LABEL = {}; DF_X = {};
  Object.keys(DF_SRC).forEach(k => delete DF_SRC[k]);
  CZ_STACK = []; CZ_WIDE = null; CZ_SEL = { i: -1, path: [] };
}

// 같은 차트 안에서의 다중선택. 같은 값을 다시 누르면 빠진다.
function multiPick(cur, name, ev) {
  const add = ev && (ev.ctrlKey || ev.metaKey);
  const list = add ? (cur || []).slice() : [];
  const at = list.indexOf(name);
  if (at >= 0) { list.splice(at, 1); } else { list.push(name); }
  return list;                       // 비면 해제
}

// noToggle: 한 번의 클릭으로 두 필드를 함께 거는 경우(누적막대의 구간+조각).
//   구간이 같아도 조각이 다르면 '다시 누른 것' 이 아니다. 해제하면 안 된다.
/* 누적막대 클릭. 구간(bin)과 조각(status)을 **한 쌍**으로 다룬다.
     그냥 클릭  그 쌍만 남긴다. 같은 차트의 같은 쌍이면 둘 다 푼다.
     Ctrl      그 쌍을 더한다. 같은 차트의 같은 쌍이면 뺀다.
   status 처럼 다른 차트도 쓰는 필드는 setCond 가 교집합으로 처리한다.
--------------------------------------------------------------------- */
function pickStacked(binKey, binVal, seg, ev, label, src) {
  const add = ev && (ev.ctrlKey || ev.metaKey);
  const hasBin = (DF[binKey] || []).indexOf(binVal) >= 0;
  const hasSeg = !seg || (DF.status || []).indexOf(seg) >= 0;
  // 이 차트에서 걸었던 것이라야 '다시 누름' 이다.
  const mineBin = DF_SRC[binKey] === undefined || DF_SRC[binKey] === src;
  const mineSeg = DF_SRC.status === undefined || DF_SRC.status === src;

  if (add && hasBin && hasSeg && mineBin && mineSeg) {
    setCond(binKey, binVal, { ctrlKey: true }, label, false, src);
    if (seg) { setCond("status", seg, { ctrlKey: true }, null, false, src); }
    return;
  }
  if (add) {
    if (!hasBin) {
      setCond(binKey, binVal, { ctrlKey: true }, label, false, src);
    }
    if (seg && !hasSeg) {
      setCond("status", seg, { ctrlKey: true }, null, false, src);
    }
    return;
  }
  // 이 차트가 걸어 둔 것과 완전히 같은 쌍을 다시 누르면 둘 다 푼다.
  const onlyBin = (DF[binKey] || []).length === 1 && hasBin && mineBin;
  const onlySeg = !seg
    || ((DF.status || []).length === 1 && hasSeg && mineSeg);
  if (onlyBin && onlySeg) {
    delete DF[binKey];
    if (seg) { delete DF.status; }
    dfResetBelow(DF_LV[binKey] || 9);
    return;
  }
  setCond(binKey, binVal, null, label, true, src);
  if (seg) { setCond("status", seg, null, null, true, src); }
}

/* src: 어느 차트에서 눌렀는지.

   같은 차트  값 목록을 OR 로 넓힌다(Ctrl). 같은 값을 다시 누르면 해제.
   다른 차트  **교집합**이다. 같은 필드를 다른 차트에서 다시 고르는 것은
              "그 값으로 범위를 좁히겠다" 는 뜻이므로 그 값만 남긴다.
              (원차트에서 진행불가 OR HOLD 를 고른 뒤 W/T 0 에서 HOLD 를
               고르면 (a OR b) AND b = b 가 되어 양쪽 모두 HOLD 만 남는다)
--------------------------------------------------------------------- */
const DF_SRC = {};

function setCond(key, name, ev, label, noToggle, src) {
  const add = ev && (ev.ctrlKey || ev.metaKey);
  const sameSrc = src === undefined || DF_SRC[key] === undefined
    || DF_SRC[key] === src;
  const same = (DF[key] || []).length === 1 && DF[key][0] === name && sameSrc;
  let next;
  if (!sameSrc) {
    next = [name];                   // 다른 차트 = 교집합. 그 값만 남긴다.
  } else if (add) {
    next = multiPick(DF[key], name, ev);
  } else if (same && !noToggle) {
    next = [];                       // 같은 것을 다시 누르면 해제
  } else {
    next = [name];                   // 그 축의 값만 교체(다른 축은 유지)
  }
  const lv = DF_LV[key] || 9;
  if (next.length) { DF[key] = next; } else { delete DF[key]; }
  if (src !== undefined) { DF_SRC[key] = src; }
  if (label) { DF_LABEL[key + ":" + name] = label; }
  dfResetBelow(lv);                      // 아래 계층은 무효가 된다
  return next;
}

function dfChipLabel(k, v) { return DF_LABEL[k + ":" + v] || v; }

// 원인 조건 이름. OR 로 묶였으면 'A 또는 B' 로 보여 준다.
// 지금 선택된 원인 항목 이름들. 막대 테두리 표시에 쓴다.
function causeSelNames(i) {
  if (!DF_CAUSE) { return new Set(); }
  const list = DF_CAUSE.or
    || (DF_CAUSE.subs || []).map(x => ({ big: DF_CAUSE.big,
                                         mid: DF_CAUSE.mid, sub: x }));
  const out = new Set();
  list.forEach(x => {
    if (i !== undefined && x.big && x.big !== czGroup(i).name) { return; }
    out.add(x.sub || x.mid);          // 소분류가 없으면 중분류가 선택 대상
  });
  return out;
}

// 원인 조건 이름.
//   '>' 는 상위를 좁힌다는 뜻이므로 갈래마다 제 경로를 끝까지 적고,
//   서로 다른 갈래는 '또는' 으로 잇는다. 공통 상위가 있으면 앞으로 묶는다.
//     Hold > FLOW금지  또는  Wait성 진행불가 > 설비이슈 > TIT405
//     Wait성 진행불가 > (설비이슈 또는 TIP)      <- 공통 상위는 묶는다
function causeName() {
  if (!DF_CAUSE) { return ""; }
  const list = DF_CAUSE.or
    || (DF_CAUSE.subs || []).map(x => ({ big: DF_CAUSE.big,
                                         mid: DF_CAUSE.mid, sub: x }));
  if (!list.length) { return ""; }
  const full = (x) => [x.big, x.mid, x.sub].filter(Boolean);

  // 모든 갈래가 앞부분을 공유하면 그만큼 앞으로 뺀다.
  const paths = list.map(full);
  let common = 0;
  while (paths[0] && common < paths[0].length - 1
         && paths.every(p => p[common] === paths[0][common])) {
    common++;
  }
  const head = paths[0].slice(0, common);
  const tails = paths.map(p => p.slice(common).join(" > "));
  const uniq = [...new Set(tails)];
  if (!head.length) { return uniq.join("  또는  "); }
  return head.join(" > ")
    + " > " + (uniq.length > 1 ? "(" + uniq.join(" 또는 ") + ")" : uniq[0]);
}

function dfClear(k, v) {
  if (k === "cause") { DF_CAUSE = null; }
  else if (v === undefined) { delete DF[k]; }
  else {
    DF[k] = (DF[k] || []).filter(x => x !== v);
    if (!DF[k].length) { delete DF[k]; }
  }
  syncFromDF();
}

function dfClearAllConds() {
  dfReset();
  CZ_STACK = []; CZ_WIDE = null; CZ_SEL = { i: -1, path: [] };
  DRILL_KEY = { i: -1, node: null, list: [] };
  czAskClose();
  syncFromDF();
}

function dfFilter() {
  const f = {};
  Object.keys(DF_X).forEach(k => { f[k] = DF_X[k].join(","); });
  DF_DEF.forEach(d => { if (DF[d.k]) { f[d.param] = DF[d.k].join(","); } });
  if (DF_CAUSE) {
    // 서로 다른 대분류를 함께 고르면 AND 로는 늘 0 이다. OR 로 보낸다.
    if (DF_CAUSE.or && DF_CAUSE.or.length) {
      f.causes = DF_CAUSE.or
        .map(x => [x.big || "", x.mid || "", x.sub || ""].join(">")).join("|");
    } else {
      if (DF_CAUSE.big) { f.big = DF_CAUSE.big; }
      if (DF_CAUSE.mid) { f.mid = DF_CAUSE.mid; }
      if (DF_CAUSE.subs && DF_CAUSE.subs.length) {
        f.sub = DF_CAUSE.subs.join(",");
      }
    }
  }
  return f;
}

// 한 조건 안의 여러 값은 '또는'(같은 계층이라 AND 가 성립하지 않는다).
// 서로 다른 조건끼리는 '·' 로 잇는다(이쪽은 AND 다).
function dfOneName(d) {
  const vs = (DF[d.k] || []).map(v => dfChipLabel(d.k, v));
  if (!vs.length) { return ""; }
  return d.t + " " + (vs.length > 1 ? vs.join(" 또는 ") : vs[0]);
}

function dfTitle() {
  const out = [];
  DF_DEF.forEach(d => { const n = dfOneName(d); if (n) { out.push(n); } });
  if (DF_CAUSE) { out.push(causeName()); }
  const XT = { x_prod: "제품", x_mod: "모듈", x_area: "AREA", x_eqp: "설비" };
  Object.keys(DF_X).forEach(k => out.push(XT[k] + " " + DF_X[k].join(", ")));
  return out.join(" · ");
}

function dfChips() {
  const c = [];
  DF_DEF.forEach(d => {
    const vs = DF[d.k] || [];
    if (!vs.length) { return; }
    // 값이 여럿이면 '또는' 으로 한 칩에 묶는다(AND 가 아니다).
    const body = vs.map(v => dfChipLabel(d.k, v)).join(" 또는 ");
    c.push(`<span class="fchip">${d.t} ${body}`
      + `<i onclick="dfClear('${d.k}')">×</i></span>`);
  });
  if (DF_CAUSE) {
    c.push(`<span class="fchip">원인 ${causeName()}`
      + `<i onclick="dfClear('cause')">×</i></span>`);
  }
  if (!c.length) { return ""; }
  return c.join("")
    + `<button class="dfclear" onclick="dfClearAllConds()">모두 지우기</button>`;
}

// 조건이 바뀌면 차트 표시와 표를 함께 맞춘다.
function syncFromDF() {
  // 표시는 모두 DF 를 직접 읽는다. 별도 선택 변수를 두지 않는다.
  DRILL_KEY = DF_CAUSE
    ? { i: DF_CAUSE.i, node: (DF_CAUSE.subs || []).slice(-1)[0] || null,
        list: DF_CAUSE.subs || [] }
    : { i: -1, node: null, list: [] };

  if (DATA) {
    renderWip(); renderStatus(); renderWt(); renderWt0(); renderCause();
    }
  const any = Object.keys(DF).length || DF_CAUSE || Object.keys(DF_X).length;
  markActiveCards();      // 표가 없어도 카드 강조는 항상 맞춘다

  // 요약(원인 분석)을 먼저 띄운다. 표는 응답이 수 MB 라 먼저 보내면
  // 브라우저 연결을 물고 있어 요약이 1~2초 뒤에야 그려진다.
  loadSummary(true);
