{% extends "flowmonitor/base.html" %}
{% load static %}
{% block body %}
<div class="layout">
  <div class="summary">
    <div class="gfilter">
      <div class="lineseg" id="lineseg">
        {% for l in lines %}
          <button data-line="{{ l.line }}" {% if not l.ready %}disabled
            title="아직 적재된 데이터가 없습니다"{% endif %}
            onclick="pickLine('{{ l.line }}')">{{ l.label }}</button>
        {% endfor %}
      </div>
      <div class="prodf">
        <div class="dd" id="dp1">
          <button onclick="toggleProd('dp1')" id="p1b">제품군 전체 &#9662;</button>
          <div class="menu" id="p1m"></div>
        </div>
        <div class="dd" id="dp2">
          <button onclick="toggleProd('dp2')" id="p2b">제품 전체 &#9662;</button>
          <div class="menu" id="p2m"></div>
        </div>
      </div>
    </div>

    <div id="err" class="err"></div>

    <!-- 재공 뷰 -->
    <div class="cell">
      <div class="wip">
        <div class="top">
          <div class="nums">
            <div><b id="wl">-</b><div class="lbl">재공 LOT</div></div>
            <div><b id="wq">-</b><div class="lbl">재공 매</div></div>
          </div>
          <div class="dd" id="dd">
            <button onclick="toggleDd()" id="ddb">전체 &#9662;</button>
            <div class="menu" id="ddm"></div>
          </div>
        </div>
        <div class="stack" id="ws"></div>
        <div class="stleg" id="wg"></div>
      </div>
    </div>

    <!-- status 뷰 -->
    <div class="cell">
      <div class="donut">
        <div class="legend" id="lg"></div>
        <div class="cv"><canvas id="dn"></canvas></div>
        <div class="pickinfo" id="dt"></div>
      </div>
    </div>

    <!-- WT 분포 뷰 -->
    <div class="cell">
      <div class="cellttl"><span>W/T 분포</span>
        <span class="seg">
          <button id="wu_lots" onclick="setWtUnit('lots')">LOT</button>
          <button class="on" id="wu_qty" onclick="setWtUnit('qty')">매</button>
        </span></div>
      <div style="height:190px"><canvas id="wtc"></canvas></div>
    </div>

    <!-- W/T 0 재공 분포 -->
    <div class="cell">
      <div class="cellttl"><span>W/T 0 재공 분포</span>
        <span class="seg">
          <button id="zu_lots" onclick="setWt0Unit('lots')">LOT</button>
          <button class="on" id="zu_qty" onclick="setWt0Unit('qty')">매</button>
        </span></div>
      <div class="minittl" style="margin-bottom:6px">마지막 작업 이후 경과일 기준</div>
      <div style="height:210px"><canvas id="wt0c"></canvas></div>
    </div>
  </div>

  <div style="flex:1; min-width:0">
    <div class="cell" style="border:1px solid var(--bd);border-radius:6px;
                             padding:11px 12px;margin-bottom:10px">
      <div class="cellttl"><span>원인 분석</span>
        <span class="seg">
          <button id="cu_lots" onclick="setCauseUnit('lots')">LOT</button>
          <button class="on" id="cu_qty" onclick="setCauseUnit('qty')">매</button>
        </span></div>
      <div class="cz3">
        <div class="czcol"><div class="subttl czh" id="czh0"></div>
          <div id="czp0" class="czpath"></div>
          <div style="height:170px"><canvas id="czc0"></canvas></div></div>
        <div class="czcol"><div class="subttl czh" id="czh1"></div>
          <div id="czp1" class="czpath"></div>
          <div style="height:170px"><canvas id="czc1"></canvas></div></div>
        <div class="czcol"><div class="subttl czh" id="czh2"></div>
          <div id="czp2" class="czpath"></div>
          <div style="height:170px"><canvas id="czc2"></canvas></div></div>
      </div>

      <!-- 상단 3개는 그대로 두고, 파고든 결과는 아래에 전체 폭으로 -->
      <div id="czdrill" style="display:none;margin-top:12px;
                               border-top:1px solid var(--bd);padding-top:10px">
        <div class="subttl"><span id="czdttl"></span>
          <span class="v" id="czdcnt"></span></div>
        <div id="czdpath" class="czpath"></div>
        <div style="height:230px"><canvas id="czdc"></canvas></div>
      </div>
    </div>

    <div class="detail" id="drill">
      <div class="empty">좌측 <b>W/T 분포</b>·<b>W/T 0 재공 분포</b> 막대나
        위 <b>원인 분석</b> 항목을 클릭하면 해당 LOT 상세가 여기에 표시됩니다.</div>
    </div>
  </div>
</div>

<script src="{% static 'flowmonitor/chart.umd.js' %}"></script>
<script>
if (window.Chart) {
  Chart.defaults.font.family = "'Poppins','Noto Sans KR','Malgun Gothic',sans-serif";
  Chart.defaults.font.size = 11;
  Chart.defaults.color = "#374151";
}

const BRAND = "#2F4B7C";
const TYPE_COLORS = ["#2F4B7C", "#4C7DD1", "#7FB3E8", "#B9D4F2", "#D8E5F5"];
const nf = (n) => Number(n || 0).toLocaleString("ko-KR");

let LINE = "{{ default_line }}";
let DATA = null;
let SEL_STATUS = null;
let WT_UNIT = "qty";
// lot_type 선택은 라인/뷰를 바꿔도 유지된다. 기본은 PP+PG.
let TYPE_PREF = (() => {
  try {
    const v = JSON.parse(localStorage.getItem("lotTypePref"));
    if (Array.isArray(v)) return v;
  } catch (e) {}
  return ["PP", "PG"];
})();
let CAUSE_UNIT = "qty";
let WT0_UNIT = "qty";
let dnChart = null;

function smoothTo(el) {
  const y = el.getBoundingClientRect().top + window.pageYOffset - 12;
  window.scrollTo({ top: y, behavior: "smooth" });
}

function toggleDd() {
  document.getElementById("dd").classList.toggle("open");
}
// 바깥을 누르면 열려 있는 드롭다운을 모두 닫는다(.dd 전체 대상)
document.addEventListener("click", e => {
  if (e.target.closest(".dd")) { return; }
  document.querySelectorAll(".dd.open").forEach(d => d.classList.remove("open"));
});

function selectedTypes() {
  const boxes = document.querySelectorAll("#ddm input:checked");
  if (!document.getElementById("ddm").innerHTML) return TYPE_PREF;   // 초기 로드
  return [...boxes].map(x => x.value);
}

function syncTypeLabel() {
  const t = selectedTypes();
  document.getElementById("ddb").innerHTML =
    (t.length ? (t.length <= 3 ? t.join(",") : t.length + "개 선택") : "전체") + " &#9662;";
}

function onTypeCheck() {
  TYPE_PREF = selectedTypes();
  try { localStorage.setItem("lotTypePref", JSON.stringify(TYPE_PREF)); } catch (e) {}
  syncTypeLabel();
  loadSummary();
}

let PROD1 = [], PROD2 = [];

function toggleProd(id) {
  const el = document.getElementById(id);
  const open = el.classList.contains("open");
  document.querySelectorAll(".dd").forEach(d => d.classList.remove("open"));
  if (!open) { el.classList.add("open"); }
}

const PROD_LABEL = { 1: "제품군", 2: "제품" };

// ALL 은 목록 맨 위의 전체 선택 스위치다.
// 내부적으로는 "선택 없음 = 전체" 로 다루므로, ALL 이 켜지면 빈 배열로 둔다.
function prodPicked(which, isAll) {
  const box = document.getElementById("p" + which + "m");
  const all = box.querySelector("input[data-all]");

  if (isAll) {
    const on = all.checked;
    box.querySelectorAll("input:not([data-all])").forEach(x => { x.checked = on; });
  }
  const opts = [...box.querySelectorAll("input:not([data-all])")];
  const sel = opts.filter(x => x.checked).map(x => x.value);
  if (all) { all.checked = (sel.length === opts.length && opts.length > 0); }

  // 전부 선택 == 전체. 서버에는 빈 값으로 보내 필터를 걸지 않는다.
  const eff = (sel.length === opts.length) ? [] : sel;
  if (which === 1) { PROD1 = eff; PROD2 = []; } else { PROD2 = eff; }
  loadSummary();
}

// 검색: 대소문자 무시 부분일치. 'dd' 로 *dd / dd* / *dd* 가 모두 걸린다.
function prodSearch(which) {
  const q = (document.getElementById("p" + which + "q").value || "")
    .trim().toLowerCase();
  document.querySelectorAll("#p" + which + "m label[data-opt]").forEach(el => {
    const v = (el.getAttribute("data-opt") || "").toLowerCase();
    el.style.display = (!q || v.indexOf(q) >= 0) ? "" : "none";
  });
}

function renderProd(d) {
  const fill = (which, opts, cur) => {
    opts = opts || [];
    const box = document.getElementById("p" + which + "m");
    const isAll = (cur.length === 0);          // 선택 없음 = 전체
    const set = new Set(cur);
    box.innerHTML =
      `<input class="ddq" id="p${which}q" type="text" placeholder="검색"`
      + ` oninput="prodSearch(${which})" onclick="event.stopPropagation()">`
      + `<label style="border-bottom:1px solid var(--bd);font-weight:600">`
      + `<input type="checkbox" data-all ${isAll ? "checked" : ""}`
      + ` onchange="prodPicked(${which}, true)">ALL</label>`
      + (opts.map(o =>
          `<label data-opt="${o}"><input type="checkbox" value="${o}"`
          + ` ${isAll || set.has(o) ? "checked" : ""}`
          + ` onchange="prodPicked(${which}, false)">${o}</label>`).join("")
         || `<label style="color:var(--mut)">값 없음</label>`);
    const btn = document.getElementById("p" + which + "b");
    btn.innerHTML = `<span>${PROD_LABEL[which]} `
      + (isAll ? "전체" : (cur.length <= 2 ? cur.join(",") : cur.length + "개"))
      + `</span><span>&#9662;</span>`;
    btn.classList.toggle("on", !isAll);      // 필터가 걸려 있으면 라인처럼 강조
  };
  fill(1, d.prod1_options, PROD1);
  fill(2, d.prod2_options, PROD2);
}

function pickLine(line) {
  LINE = line;
  document.querySelectorAll("#lineseg button").forEach(b =>
    b.classList.toggle("on", b.dataset.line === line));
  document.getElementById("ddm").innerHTML = "";   // 라인마다 lot_type 이 다를 수 있다
  PROD1 = []; PROD2 = [];                          // 제품구분도 라인별로 다르다
  loadSummary();
}

function setWtUnit(u) {
  WT_UNIT = u;
  document.getElementById("wu_lots").className = (u === "lots") ? "on" : "";
  document.getElementById("wu_qty").className = (u === "qty") ? "on" : "";
  renderWt();
}

function setCauseUnit(u) {
  CAUSE_UNIT = u;
  document.getElementById("cu_lots").className = (u === "lots") ? "on" : "";
  document.getElementById("cu_qty").className = (u === "qty") ? "on" : "";
  renderCause();
}

function setWt0Unit(u) {
  WT0_UNIT = u;
  document.getElementById("zu_lots").className = (u === "lots") ? "on" : "";
  document.getElementById("zu_qty").className = (u === "qty") ? "on" : "";
  renderWt0();
}

/* --- 재공 --- */
function renderWip() {
  const d = DATA;
  document.getElementById("wl").textContent = nf(d.total.lots);
  document.getElementById("wq").textContent = nf(d.total.qty);

  if (!document.getElementById("ddm").innerHTML) {
    const sel = new Set(d.selected_types || []);
    document.getElementById("ddm").innerHTML = d.types.map(t =>
      `<label><input type="checkbox" value="${t}" ${sel.has(t) ? "checked" : ""}`
      + ` onchange="onTypeCheck()">${t}</label>`).join("");
    syncTypeLabel();
  }
  const tot = d.by_lot_type.reduce((a, x) => a + x.lots, 0) || 1;
  document.getElementById("ws").innerHTML = d.by_lot_type.map((x, k) =>
    `<i class="${SEL_TYPE === x.name ? 'sel' : ''}"
        style="width:${x.lots / tot * 100}%;background:${TYPE_COLORS[k % 5]}"
        onclick="pickType('${x.name}')" title="${x.name} ${nf(x.lots)} LOT / ${nf(x.qty)} 매"
        ></i>`).join("");
  document.getElementById("wg").innerHTML = d.by_lot_type.map((x, k) =>
    `<span><i style="background:${TYPE_COLORS[k % 5]}"></i>${x.name}
       ${(x.lots / tot * 100).toFixed(0)}%</span>`).join("");
}

function pickType(name) {
  SEL_TYPE = (SEL_TYPE === name) ? null : name;
  renderWip();                       // 선택 표시를 먼저 반영하고
  requestAnimationFrame(() => {      // 그다음 프레임에 요청을 건다
    if (SEL_TYPE) { openDrill({ lot_type: name }, name, "type"); }
    else { closeDrill(); }
  });
}

/* --- status --- */
const sliceLabels = {
  id: "sliceLabels",
  afterDatasetsDraw(ch) {
    const st = ch.$status || [];
    const ctx = ch.ctx;
    ctx.save();
    ctx.font = "600 10px 'Poppins','Noto Sans KR',sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ch.getDatasetMeta(0).data.forEach((arc, k) => {
      const v = st[k];
      if (!v || v.pct < 6) return;
      const a = (arc.startAngle + arc.endAngle) / 2;
      const r = arc.outerRadius * 0.62;
      ctx.fillStyle = "#fff";
      ctx.fillText(v.pct + "%", arc.x + Math.cos(a) * r, arc.y + Math.sin(a) * r);
    });
    ctx.restore();
  }
};

function setStatusInfo() {
  const d = DATA;
  const s = (SEL_STATUS === null)
    ? { label: d.default.label, pct: d.default.pct, lots: d.default.lots,
        qty: d.default.qty, color: BRAND }
    : { label: d.status[SEL_STATUS].name, pct: d.status[SEL_STATUS].pct,
        lots: d.status[SEL_STATUS].lots, qty: d.status[SEL_STATUS].qty,
        color: d.status[SEL_STATUS].color };
  document.getElementById("dt").innerHTML =
    `<div class="nm" style="color:${s.color}">${s.label}</div>
     <div class="pc">${s.pct.toFixed(1)}%</div>
     <div class="sub">${nf(s.lots)} LOT &middot; ${nf(s.qty)} 매</div>`;
  document.querySelectorAll("#lg span").forEach((el, k) =>
    el.classList.toggle("on", k === (SEL_STATUS === null ? 0 : SEL_STATUS + 1)));
}

function pickStatus(i) { SEL_STATUS = (SEL_STATUS === i) ? null : i; setStatusInfo(); }
function pickDefault() { SEL_STATUS = null; setStatusInfo(); }

function renderStatus() {
  const d = DATA;
  document.getElementById("lg").innerHTML =
    `<span onclick="pickDefault()"><i style="background:${BRAND}"></i>`
    + `${d.default.label}</span>`
    + d.status.map((st, i) =>
        `<span onclick="pickStatus(${i})"><i style="background:${st.color}"></i>`
        + `${st.name}</span>`).join("");

  if (!dnChart) {
    dnChart = new Chart(document.getElementById("dn"), {
      type: "doughnut",
      data: { labels: d.status.map(s => s.name),
              datasets: [{ data: d.status.map(s => s.lots),
                           backgroundColor: d.status.map(s => s.color),
                           borderWidth: 0 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: 0, animation: false,
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: (t) => {
                     const st = (t.chart.$status || [])[t.dataIndex] || {};
                     return st.name + "  " + st.pct + "% / " + nf(st.lots) + " LOT / "
                            + nf(st.qty) + " 매";
                   } } } },
        onClick: (e, els) => {
          if (!els.length) return;
          const i = els[0].index;
          pickStatus(i);
          const st = DATA.status[i];
          SEL_PIE = (SEL_PIE === st.name) ? null : st.name;
          markSelected(dnChart, DATA.status.findIndex(x => x.name === SEL_PIE));
          dnChart.update();
          if (SEL_PIE) { openDrill({ status: st.name }, st.name, "status"); }
          else { closeDrill(); }
        }
      },
      plugins: [sliceLabels]
    });
  }
  dnChart.data.labels = d.status.map(s => s.name);
  dnChart.data.datasets[0].data = d.status.map(s => s.lots);
  dnChart.data.datasets[0].backgroundColor = d.status.map(s => s.color);
  dnChart.$status = d.status;
  markSelected(dnChart, d.status.findIndex(s => s.name === SEL_PIE));
  dnChart.update();
  setStatusInfo();
}

/* --- W/T 분포 : 위가 WT0(가장 심각), 아래로 갈수록 정상 --- */
let wtChart = null;

function renderWt() {
  const d = DATA, u = WT_UNIT;
  const vals = d.wt_dist.map(x => u === "lots" ? x.lots : x.qty);
  const colors = d.wt_dist.map((_, i) =>
    `rgba(220,20,60,${Math.max(1 - 0.13 * i, 0.18).toFixed(2)})`);

  if (!wtChart) {
    wtChart = new Chart(document.getElementById("wtc"), {
      type: "bar",
      data: { labels: [], datasets: [{ data: [], borderRadius: 3 }] },
      options: {
        indexAxis: "y", responsive: true, maintainAspectRatio: false,
        animation: false,
        layout: { padding: { right: 34 } },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: (t) => {
                     const x = DATA.wt_dist[t.dataIndex];
                     return nf(x.lots) + " LOT / " + nf(x.qty) + " 매";
                   } } } },
        scales: { x: { display: false, beginAtZero: true, grace: "12%" },
                  y: { grid: { display: false }, ticks: { font: { size: 11 } } } },
        onClick: (e, els) => {
          if (!els.length) return;
          const x = DATA.wt_dist[els[0].index];
          SEL_WT = x.name;
          openDrill({ wt_range: x.name }, x.label, "wt");
          renderWt();
        }
      },
      plugins: [{
        id: "wtVal",
        afterDatasetsDraw(ch) {
          const ctx = ch.ctx;
          ctx.save();
          ctx.font = "11px 'Poppins','Noto Sans KR',sans-serif";
          ctx.textAlign = "left"; ctx.textBaseline = "middle";
          ctx.fillStyle = "#374151";
          ch.getDatasetMeta(0).data.forEach((el, k) => {
            ctx.fillText(nf(ch.data.datasets[0].data[k]), el.x + 6, el.y);
          });
          ctx.restore();
        }
      }]
    });
  }
  wtChart.data.labels = d.wt_dist.map(x => x.label);
  wtChart.data.datasets[0].data = vals;
  wtChart.data.datasets[0].backgroundColor = colors;
  markSelected(wtChart, d.wt_dist.findIndex(x => x.name === SEL_WT));
  wtChart.update();
}

/* --- W/T 0 재공 분포 : 마지막 작업 이후 경과일 --- */
let wt0Chart = null;

function renderWt0() {
  const d = DATA, u = WT0_UNIT;
  const list = d.wt0_dist || [];
  const vals = list.map(x => u === "lots" ? x.lots : x.qty);
  // 오래 방치될수록 진하게
  const colors = list.map((_, i) =>
    `rgba(220,20,60,${Math.min(0.25 + 0.1 * i, 1).toFixed(2)})`);

  if (!wt0Chart) {
    wt0Chart = new Chart(document.getElementById("wt0c"), {
      type: "bar",
      data: { labels: [], datasets: [{ data: [], borderRadius: 3 }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        layout: { padding: { top: 16 } },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: (t) => {
                     const x = (DATA.wt0_dist || [])[t.dataIndex] || {};
                     return nf(x.lots) + " LOT / " + nf(x.qty) + " 매";
                   } } } },
        scales: { x: { grid: { display: false }, ticks: { font: { size: 10 } } },
                  y: { display: false, beginAtZero: true, grace: "18%" } },
        onClick: (e, els) => {
          if (!els.length) return;
          const x = (DATA.wt0_dist || [])[els[0].index];
          SEL_WT0 = x.name;
          openDrill({ wt0: x.name }, x.label, "wt0");
          renderWt0();
        }
      },
      plugins: [{
        id: "wt0Val",
        afterDatasetsDraw(ch) {
          const ctx = ch.ctx; ctx.save();
          ctx.font = "10px 'Poppins','Noto Sans KR',sans-serif";
          ctx.textAlign = "center"; ctx.fillStyle = "#374151";
          ch.getDatasetMeta(0).data.forEach((el, k) => {
            ctx.fillText(nf(ch.data.datasets[0].data[k]), el.x, el.y - 4);
          });
          ctx.restore();
        }
      }]
    });
  }
  wt0Chart.data.labels = list.map(x => x.label);
  wt0Chart.data.datasets[0].data = vals;
  wt0Chart.data.datasets[0].backgroundColor = colors;
  markSelected(wt0Chart, list.findIndex(x => x.name === SEL_WT0));
  wt0Chart.update();
}

/* --- 원인 분석 -------------------------------------------------------------
   상단 3개(대분류)는 항상 고정. 막대를 누르면 아래에 드릴다운 차트가 생긴다.
   경로 항목은 {name, kind} 로 들고 있어야 필터에서 중분류/소분류를 구분한다.
   (Hold / Bottleneck 은 중분류가 없어 첫 단계가 곧 소분류다.)
--------------------------------------------------------------------------- */
const czCharts = [null, null, null];
let czDrill = null;
let CZ_SEL = { i: -1, path: [] };          // 한 번에 하나만 파고든다
let DRILL_KEY = { i: -1, node: null };     // 표가 어느 차트·막대에서 나왔는지

// 드릴다운 표 상태. closeDrill 이 초기 로딩에서도 불리므로 선언을 앞에 둔다.
let DRILL_DATA = null;      // 현재 표에 뿌린 원자료
let SORT_KEYS = [];         // [{k, dir}] 순서가 곧 정렬 우선순위
let HIDE_COLS = {};         // 감춘 컬럼
let DFILT = {};             // 표 자체 필터 {컬럼: Set(값)}
let DFILT_WT = null;        // WT 는 구간으로 고른다
let FCACHE = null;          // 필터 결과. 정렬만 바뀌면 재사용한다
let dfLast = {};            // shift 범위 선택 기준점
let COL_ORDER = null;       // 사용자가 드래그로 바꾼 컬럼 순서(키 배열)

function drillCols() {
  const cols = (DRILL_DATA && DRILL_DATA.cols) ? DRILL_DATA.cols : [];
  if (!COL_ORDER) { return cols; }
  const by = {};
  cols.forEach(c => { by[c.k] = c; });
  const out = COL_ORDER.map(k => by[k]).filter(Boolean);
  cols.forEach(c => { if (out.indexOf(c) < 0) { out.push(c); } });
  return out;
}
let SEL_WT = null, SEL_WT0 = null, SEL_TYPE = null, SEL_PIE = null;

function czGroup(i) { return (DATA.causes || [])[i] || { name: "", children: [] }; }

function czNodesAt(i, path) {
  let list = czGroup(i).children || [];
  for (const p of path) {
    const hit = list.find(x => x.name === p.name);
    list = (hit && hit.children) || [];
  }
  return list;
}

function czFilter() {
  const f = { big: czGroup(CZ_SEL.i).name };
  for (const p of CZ_SEL.path) {
    if (p.kind === "mid") { f.mid = p.name; } else { f.sub = p.name; }
  }
  return f;
}

function czLabel(v, max) {
  v = String(v == null ? "" : v);
  return v.length > max ? v.slice(0, max - 1) + "…" : v;
}

function czReset() {
  CZ_SEL = { i: -1, path: [] };
  DRILL_KEY = { i: -1, node: null };
  closeDrill();
  renderCause();
}
function czGo(depth) { CZ_SEL.path = CZ_SEL.path.slice(0, depth); renderCause(); }

// depth=0 : 상단 요약 차트 -> 경로를 새로 시작
// depth>0 : 드릴다운 차트   -> 현재 경로에 덧붙임
function czPick(i, node, depth) {
  if (!node) { return; }
  const leaf = !(node.children && node.children.length);
  if (depth === 0 || CZ_SEL.i !== i) {
    CZ_SEL = { i: i, path: [] };        // 다른 막대를 누르면 이전 경로는 버린다
  }
  CZ_SEL.path = CZ_SEL.path.filter(p => p.kind !== "all");

  if (leaf) {
    // 말단: 차트는 그대로 두고 아래 표만 바꾼다.
    const keep = CZ_SEL.path.slice();
    const f = { big: czGroup(i).name };
    for (const p of keep) { f[p.kind === "mid" ? "mid" : "sub"] = p.name; }
    f[node.kind === "mid" ? "mid" : "sub"] = node.name;
    DRILL_KEY = { i: i, node: node.name };
    renderCause();
    openDrill(f, [czGroup(i).name].concat(keep.map(p => p.name))
                 .concat([node.name]).join(" > "), "cause");
    return;
  }

  CZ_SEL.path.push({ name: node.name, kind: node.kind || "sub" });
  DRILL_KEY = { i: -1, node: null };
  DRILL_SRC = "cause";
  closeDrill();                 // 단계를 옮기면 이전 표는 무효다
  DRILL_SRC = "cause";
  renderCause();
}

// x축 라벨을 세로(시계방향 90도)로 세우고 길면 줄인다.
const CZ_SCALE_X = {
  grid: { display: false },
  ticks: { font: { size: 9 }, autoSkip: false, maxRotation: 0, minRotation: 0,
           callback: function (v) { return czLabel(this.getLabelForValue(v), 10); } }
};

function czBarChart(canvasId, onPick, pluginId) {
  return new Chart(document.getElementById(canvasId), {
    type: "bar",
    data: { labels: [], datasets: [
      { data: [], borderRadius: 3, order: 2, yAxisID: "y" },
      // 경과일 평균(일/lot). 막대 위에 겹치지 않게 별도 축을 쓴다.
      { type: "line", data: [], order: 1, yAxisID: "y2",
        borderColor: "#B4504F", backgroundColor: "#B4504F",
        borderWidth: 2, pointRadius: 3, pointHoverRadius: 4,
        tension: 0.25, spanGaps: true }
    ] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      layout: { padding: { top: 16 } },
      plugins: { legend: { display: false },
                 tooltip: { callbacks: {
                   title: (t) => (t[0].chart.$nodes[t[0].dataIndex] || {}).name,
                   label: (t) => {
                     const x = t.chart.$nodes[t.dataIndex] || {};
                     if (t.datasetIndex === 1) {
                       return "경과 평균 " + (x.elapsed_d == null ? "-"
                              : x.elapsed_d.toFixed(1) + " 일/lot");
                     }
                     return nf(x.lots) + " LOT / " + nf(x.qty) + " 매";
                   } } } },
      // 막대와 라인을 세로로 분리한다.
      //   막대 : 바닥 ~ 50%      (라벨은 그 바로 위)
      //   라인 : 68% ~ 90%       (라벨은 그 위)
      // 두 대역 사이 여백이 있어 막대·라인·라벨이 서로 겹치지 않는다.
      scales: {
        x: CZ_SCALE_X,
        y: { display: false, beginAtZero: true,
             afterDataLimits: (sc) => { sc.max = (sc.max || 1) / 0.50; } },
        y2: { display: false, position: "right",
              afterDataLimits: (sc) => {
                let a = sc.min, b = sc.max;
                if (!isFinite(a) || !isFinite(b)) { return; }
                if (b - a < 1e-9) {
                  const pad = Math.abs(b) * 0.5 || 1;   // 값이 하나뿐이거나 0
                  a = b - pad;
                }
                // a -> 68%, b -> 90% 위치에 오도록 축 범위를 역산
                const range = (b - a) / 0.22;
                sc.min = a - 0.68 * range;
                sc.max = sc.min + range;
              } } },
      onClick: (e, els) => { if (els.length) { onPick(els[0].index); } },
      interaction: { mode: "index", intersect: false }
    },
    plugins: [{
      id: pluginId,
      afterDatasetsDraw(ch) {
        const ctx = ch.ctx; ctx.save();
        ctx.font = "10px 'Poppins','Noto Sans KR',sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "bottom";
        ctx.fillStyle = "#374151";
        const unit = (CAUSE_UNIT === "lots") ? " lot" : " 매";
        ch.getDatasetMeta(0).data.forEach((el, k) => {
          ctx.fillText(nf(ch.data.datasets[0].data[k]) + unit, el.x, el.y - 4);
        });
        ctx.fillStyle = "#B4504F";
        ch.getDatasetMeta(1).data.forEach((el, k) => {
          const v = ch.data.datasets[1].data[k];
          if (v === null || v === undefined) { return; }
          ctx.fillText(v.toFixed(1) + " 일/lot", el.x, el.y - 7);
        });
        ctx.restore();
      }
    }]
  });
}

/* 선택된 요소를 굵은 테두리로 표시한다(발광 없음).
   Chart.register 로 전역 등록하므로 앞으로 만드는 차트도 자동 적용된다.
   각 차트는 ch.$sel 에 선택 인덱스(없으면 -1)만 넣으면 된다. */
const SEL_COLOR = "#FFD700";

// 선택된 요소는 자기 계열에서 가장 진한 색으로 채운다.
// rgba(...) 는 알파를 1 로, 그 외(hex 등)는 그대로 쓴다.
function strongest(c) {
  if (typeof c !== "string") { return c; }
  const i = c.indexOf("(");
  const j = c.lastIndexOf(")");
  if (i > 0 && j > i && c.slice(0, i).trim().toLowerCase().indexOf("rgb") === 0) {
    const p = c.slice(i + 1, j).split(",").map(x => x.trim());
    if (p.length >= 3) { return "rgb(" + p[0] + ", " + p[1] + ", " + p[2] + ")"; }
  }
  return c;
}

const popSelected = {
  id: "popSelected",
  afterDatasetsDraw(chart) {
    const sel = chart.$sel;
    if (sel === undefined || sel === null || sel < 0) { return; }
    const el = (chart.getDatasetMeta(0).data || [])[sel];
    if (!el) { return; }
    const ctx = chart.ctx;
    const bg = chart.data.datasets[0].backgroundColor;
    const fill = strongest(Array.isArray(bg) ? bg[sel] : bg);

    ctx.save();
    ctx.fillStyle = fill;
    ctx.strokeStyle = SEL_COLOR;
    ctx.lineWidth = 3;
    ctx.lineJoin = "round";

    if (el.outerRadius !== undefined) {          // 원차트 조각
      ctx.beginPath();
      ctx.arc(el.x, el.y, el.outerRadius - 1.5, el.startAngle, el.endAngle);
      ctx.arc(el.x, el.y, el.innerRadius + 1.5, el.endAngle, el.startAngle, true);
      ctx.closePath();
      ctx.fill();                                // 계열 최강색으로 다시 채우고
      ctx.stroke();
    } else {                                     // 막대
      // 가로막대(indexAxis:'y')와 세로막대는 width/height/base 의미가 다르다.
      // 두 경우를 나눠 실제 막대와 정확히 겹치게 그린다.
      const p = el.getProps(["x", "y", "base", "width", "height"], true);
      const horiz = (chart.options.indexAxis === "y");
      let x0, y0, w, h;
      if (horiz) {
        x0 = Math.min(p.base, p.x);
        w  = Math.abs(p.x - p.base);
        h  = p.height || 0;
        y0 = p.y - h / 2;
      } else {
        y0 = Math.min(p.base, p.y);
        h  = Math.abs(p.base - p.y);
        w  = p.width || 0;
        x0 = p.x - w / 2;
      }
      const in_ = 1.5;                           // 선 굵기의 절반만큼 안쪽으로
      ctx.fillRect(x0, y0, w, h);                // 계열 최강색으로 다시 채우고
      ctx.strokeRect(x0 + in_, y0 + in_,
                     Math.max(w - in_ * 2, 1), Math.max(h - in_ * 2, 1));
    }
    ctx.restore();
  }
};
if (window.Chart) { Chart.register(popSelected); }

function markSelected(ch, selIdx) {
  ch.$sel = (selIdx === undefined || selIdx === null) ? -1 : selIdx;
}

function czApply(ch, nodes, u, selName) {
  // 값에 따라 농도를 달리하면 1위 막대가 '선택된 것' 처럼 보인다.
  // 선택 표시는 3D 팝업이 전담하므로 막대색은 전부 같은 남색으로 둔다.
  const vals = nodes.map(x => u === "lots" ? x.lots : x.qty);
  ch.$nodes = nodes;
  ch.data.labels = nodes.map(x => x.name);
  ch.data.datasets[0].data = vals;
  // 안 좋은 지표라 적색 계열(#F08080). 상위일수록 진하다(값 내림차순으로 온다).
  ch.data.datasets[0].backgroundColor = nodes.map((_, i) =>
    `rgba(240,128,128,${Math.max(1 - 0.11 * i, 0.25).toFixed(2)})`);
  ch.data.datasets[1].data = nodes.map(x =>
    (x.elapsed_d === null || x.elapsed_d === undefined) ? null : x.elapsed_d);
  markSelected(ch, nodes.findIndex(x => x.name === selName));
  ch.update();
}

const CZ_TOP = 5;        // 상단 요약 차트
const CZ_DEEP = 15;      // 드릴다운 차트

// 전체 순위 보기 = 상위 5개 제한 없이 차트로 펼친다
function czShowAll(i) {
  const on = (CZ_SEL.i === i && CZ_SEL.path.length
              && CZ_SEL.path[0].kind === "all");
  CZ_SEL = on ? { i: -1, path: [] }
              : { i: i, path: [{ name: "__ALL__", kind: "all" }] };
  renderCause();
}

// 소제목 클릭 = 그 대분류 전체를 드릴다운 표로
function czWhole(i) {
  const g = czGroup(i);
  DRILL_KEY = { i: -1, node: null };
  renderCause();
  openDrill({ big: g.name }, g.name + " 전체", "cause");
}

function renderCause() {
  const u = CAUSE_UNIT;
  const unit = (u === "lots") ? " LOT" : " 매";

  for (let i = 0; i < 3; i++) {
    const g = czGroup(i);
    const all = g.children || [];
    const nodes = all.slice(0, CZ_TOP);
    const more = all.length - nodes.length;

    const hd = document.getElementById("czh" + i);
    hd.innerHTML = `<span>${g.name || "-"}</span>`
      + `<span class="v">전체 ${nf(u === "lots" ? g.lots : g.qty)}${unit}</span>`;
    hd.onclick = function () { czWhole(i); };      // 제목 = 전체 표

    const openAll = (CZ_SEL.i === i && CZ_SEL.path.length
                     && CZ_SEL.path[0].kind === "all");
    document.getElementById("czp" + i).innerHTML = more > 0
      ? `<button class="rankbtn ${openAll ? "on" : ""}"`
        + ` onclick="czShowAll(${i})">전체 순위 보기`
        + `<span class="cv">${openAll ? "▲" : "▼"}</span></button>`
      : "";

    if (!czCharts[i]) {
      czCharts[i] = czBarChart("czc" + i,
        (idx) => czPick(i, (czCharts[i].$nodes || [])[idx], 0), "czVal" + i);
    }
    // 상단 차트의 선택 표시: 파고든 경로의 첫 단계, 또는 표를 띄운 말단 막대
    let sel = null;
    if (CZ_SEL.i === i && CZ_SEL.path.length && CZ_SEL.path[0].kind !== "all") {
      sel = CZ_SEL.path[0].name;
    } else if (DRILL_KEY.i === i) {
      sel = DRILL_KEY.node;
    }
    czApply(czCharts[i], nodes, u, sel);
  }

  // ── 드릴다운 차트 ──────────────────────────────────────────────────
  const box = document.getElementById("czdrill");
  if (CZ_SEL.i < 0 || !CZ_SEL.path.length) { box.style.display = "none"; return; }

  const g = czGroup(CZ_SEL.i);
  const isAll = CZ_SEL.path[0].kind === "all";
  const nodes = (isAll ? (g.children || [])
                       : czNodesAt(CZ_SEL.i, CZ_SEL.path)).slice(0, CZ_DEEP);

  if (!nodes.length) { box.style.display = "none"; return; }
  box.style.display = "block";

  const names = CZ_SEL.path.filter(p => p.kind !== "all").map(p => p.name);
  document.getElementById("czdttl").textContent =
    [g.name].concat(names).join(" > ") + (isAll ? " 전체" : "");
  document.getElementById("czdcnt").textContent = nodes.length + "개";
  document.getElementById("czdpath").innerHTML =
    `<span class="czback" onclick="czGo(${Math.max(CZ_SEL.path.length - 1, 0)})">`
    + `◀ 뒤로</span><a onclick="czReset()">닫기</a>`
    + names.map((n, k) => ` &gt; <a onclick="czGo(${k + 1})">${n}</a>`).join("");

  if (!czDrill) {
    czDrill = czBarChart("czdc",
      (idx) => czPick(CZ_SEL.i, (czDrill.$nodes || [])[idx], 1), "czdVal");
  }
  czApply(czDrill, nodes, u, DRILL_KEY.node);
}

/* --- 드릴다운 --- */
const NUM_COLS = new Set(["qty", "wt", "마지막이벤트경과_일", "스텝도착경과_일",
                          "마지막작업경과_일"]);

function closeDrill() {
  DRILL_SRC = ""; DRILL_DATA = null; SORT_KEYS = [];
  HIDE_COLS = {}; DFILT = {}; DFILT_WT = null; dfLast = {}; FCACHE = null;
  COL_ORDER = null;
  document.getElementById("drill").innerHTML =
    `<div class="empty">좌측 <b>재공</b>·<b>status</b>·<b>W/T 분포</b>·
      <b>W/T 0 재공 분포</b> 또는 위 <b>원인 분석</b> 항목을 클릭하면
      해당 LOT 상세가 여기에 표시됩니다.</div>`;
}

// 표가 어느 뷰에서 나왔는지. 다른 뷰를 누르면 이전 선택 표시를 지운다.
let DRILL_SRC = "";

function clearOtherSelections(src) {
  if (DRILL_SRC === src) { return; }
  // 선택 상태만 지우면 차트에 이전 표시가 남는다. 반드시 다시 그린다.
  if (src !== "cause")  { DRILL_KEY = { i: -1, node: null };
                          CZ_SEL = { i: -1, path: [] }; }
  if (src !== "wt")     { SEL_WT = null; }
  if (src !== "wt0")    { SEL_WT0 = null; }
  if (src !== "type")   { SEL_TYPE = null; }
  if (src !== "status") { SEL_PIE = null; }
  DRILL_SRC = src;
  if (!DATA) { return; }
  if (src !== "wt")     { renderWt(); }
  if (src !== "wt0")    { renderWt0(); }
  if (src !== "type")   { renderWip(); }
  if (src !== "status") { renderStatus(); }
  if (src !== "cause")  { renderCause(); }
}

// 표 안에서 필터를 걸 컬럼
const FILTER_COLS = ["line", "전산라인", "dest_line_id", "fa_object4",
  "prod1", "prod2", "lot_id", "lot_type", "wt", "lot_status", "proc_id",
  "module1", "module2", "layer_id", "step_seq", "step_desc", "eqpgroup", "cause"];

function drillSort(k) {
  const i = SORT_KEYS.findIndex(x => x.k === k);
  if (i < 0) { SORT_KEYS.push({ k: k, dir: 1 }); }
  else if (SORT_KEYS[i].dir === 1) { SORT_KEYS[i].dir = -1; }
  else { SORT_KEYS.splice(i, 1); }
  renderDrillTable();
}

function wtKey(v) {
  const n = Number(v);
  if (!isFinite(n) || n <= 0) { return "0"; }
  if (n <= 1) { return "0-1"; }
  if (n <= 2) { return "1-2"; }
  if (n <= 3) { return "2-3"; }
  if (n <= 4) { return "3-4"; }
  if (n <= 5) { return "4-5"; }
  return "5+";
}
const WT_LABEL = { "0": "WT = 0", "0-1": "0 < WT ≤ 1", "1-2": "1 < WT ≤ 2",
  "2-3": "2 < WT ≤ 3", "3-4": "3 < WT ≤ 4", "4-5": "4 < WT ≤ 5", "5+": "WT > 5" };

function passFilter(r) {
  for (const k in DFILT) {
    const set = DFILT[k];
    if (!set || !set.size) { continue; }
    const v = (r[k] === null || r[k] === undefined || r[k] === "")
      ? "(없음)" : String(r[k]);
    if (!set.has(v)) { return false; }
  }
  if (DFILT_WT && DFILT_WT.size && !DFILT_WT.has(wtKey(r.wt))) { return false; }
  return true;
}

function filteredRows() {
  if (FCACHE) { return FCACHE; }
  const rows = (DRILL_DATA && DRILL_DATA.rows) ? DRILL_DATA.rows : [];
  let need = !!(DFILT_WT && DFILT_WT.size);
  for (const k in DFILT) { if (DFILT[k] && DFILT[k].size) { need = true; break; } }
  FCACHE = need ? rows.filter(passFilter) : rows.slice();
  return FCACHE;
}

function sortedRows() {
  const rows = filteredRows();          // 캐시된 배열을 그대로 정렬한다
  if (!SORT_KEYS.length) { return rows; }
  const num = (v) => { const n = parseFloat(v); return isNaN(n) ? null : n; };
  rows.sort((a, b) => {
    for (const s of SORT_KEYS) {
      let x = a[s.k], y = b[s.k];
      if (x === undefined || x === null || x === "") { x = null; }
      if (y === undefined || y === null || y === "") { y = null; }
      if (x === null && y === null) { continue; }
      if (x === null) { return 1; }
      if (y === null) { return -1; }
      const nx = num(x), ny = num(y);
      let c;
      if (nx !== null && ny !== null) { c = nx - ny; }
      else { c = String(x).localeCompare(String(y), "ko"); }
      if (c) { return c * s.dir; }
    }
    return 0;
  });
  return rows;
}

/* 컬럼 표시/숨김 ------------------------------------------------------- */
function toggleCol(k, on) {
  HIDE_COLS[k] = !on;
  syncAllColBox();
  renderDrillTable();
}

// 전체 체크박스는 '지금 다 보이는가' 를 그대로 반영한다.
// 끄면 전부 감추고, 켜면 전부 되살린다.
function showAllCols(on) {
  drillCols().forEach(c => { HIDE_COLS[c.k] = !on; });
  renderDrillHead();
  renderDrillTable();
}

function syncAllColBox() {
  const el = document.getElementById("colAll");
  if (!el) { return; }
  el.checked = drillCols().every(c => !HIDE_COLS[c.k]);
}

/* 표 필터 -------------------------------------------------------------- */
function dfOpen(k) {
  const el = document.getElementById("df_" + k);
  const open = el.classList.contains("open");
  document.querySelectorAll(".dd.open").forEach(d => d.classList.remove("open"));
  if (!open) { el.classList.add("open"); }
}

function dfSearch(k) {
  const q = (document.getElementById("dfq_" + k).value || "").trim().toLowerCase();
  document.querySelectorAll("#dfm_" + k + " label[data-opt]").forEach(el => {
    const v = (el.getAttribute("data-opt") || "").toLowerCase();
    el.style.display = (!q || v.indexOf(q) >= 0) ? "" : "none";
  });
}

function dfPick(ev, k, idx) {
  const box = document.getElementById("dfm_" + k);
  const boxes = [...box.querySelectorAll("input[data-opt-i]")];
  if (ev.shiftKey && dfLast[k] !== undefined) {      // shift 범위 선택
    const a = Math.min(dfLast[k], idx), b = Math.max(dfLast[k], idx);
    for (let i = a; i <= b; i++) { boxes[i].checked = ev.target.checked; }
  }
  dfLast[k] = idx;
  const sel = new Set(boxes.filter(x => x.checked).map(x => x.value));
  const target = (k === "wt") ? "wt" : k;
  if (sel.size === boxes.length) {                   // 전부 = 필터 없음
    if (target === "wt") { DFILT_WT = null; } else { delete DFILT[k]; }
  } else if (target === "wt") { DFILT_WT = sel; } else { DFILT[k] = sel; }
  const all = document.querySelector("#dfm_" + k + " input[data-all]");
  if (all) { all.checked = (sel.size === boxes.length); }
  dfLabel(k, sel.size, boxes.length);
  FCACHE = null;                        // 필터가 바뀌었으니 다시 거른다
  renderDrillTable();
}

function dfLabel(k, n, total) {
  const b = document.getElementById("dfb_" + k);
  if (!b) { return; }
  const t = (DRILL_DATA.cols.find(c => c.k === k) || {}).t || k;
  const all = (n === 0 || n === total);
  b.innerHTML = `<span>${t}${all ? "" : " " + n}</span><span>&#9662;</span>`;
  b.classList.toggle("on", !all);
}

function dfOptions(k) {
  const rows = (DRILL_DATA && DRILL_DATA.rows) ? DRILL_DATA.rows : [];
  if (k === "wt") { return Object.keys(WT_LABEL); }
  const set = new Set();
  for (const r of rows) {
    const v = (r[k] === null || r[k] === undefined || r[k] === "")
      ? "(없음)" : String(r[k]);
    set.add(v);
  }
  return [...set].sort((a, b) => a.localeCompare(b, "ko"));
}

function renderDrillHead() {
  const cols = drillCols();
  const allOn = cols.every(c => !HIDE_COLS[c.k]);
  document.getElementById("drillCols").innerHTML =
    `<label><input type="checkbox" id="colAll" ${allOn ? "checked" : ""}`
    + ` onchange="showAllCols(this.checked)"><b>전체</b></label>`
    + cols.map(c => `<label><input type="checkbox"`
        + `${HIDE_COLS[c.k] ? "" : " checked"}`
        + ` onchange="toggleCol('${c.k}',this.checked)">${c.t}</label>`).join("");

  document.getElementById("drillFilters").innerHTML =
    `<button class="dfclear" onclick="dfClearAll()">필터 해제</button>`
    + FILTER_COLS.filter(k => cols.some(c => c.k === k)).map(k => {
      const opts = dfOptions(k);
      const label = (cols.find(c => c.k === k) || {}).t || k;
      return `<div class="dd df" id="df_${k}">`
        + `<button id="dfb_${k}" onclick="dfOpen('${k}')">`
        + `<span>${label}</span><span>&#9662;</span></button>`
        + `<div class="menu" id="dfm_${k}">`
        + `<input class="ddq" id="dfq_${k}" type="text" placeholder="검색"`
        + ` oninput="dfSearch('${k}')" onclick="event.stopPropagation()">`
        + `<label class="dfall"><input type="checkbox" data-all checked`
        + ` onclick="dfAll(event,'${k}')"><b>ALL</b></label>`
        + opts.map((o, i) => `<label data-opt="${o}"><input type="checkbox"`
            + ` data-opt-i="${i}" value="${o}" checked`
            + ` onclick="dfPick(event,'${k}',${i})">`
            + `${k === "wt" ? WT_LABEL[o] : o}</label>`).join("")
        + `</div></div>`;
    }).join("");
}

// 필터 메뉴의 ALL: 전부 선택 / 전부 해제
function dfAll(ev, k) {
  const on = ev.target.checked;
  const boxes = [...document.querySelectorAll("#dfm_" + k + " input[data-opt-i]")];
  boxes.forEach(x => { x.checked = on; });
  const sel = new Set(on ? boxes.map(x => x.value) : []);
  if (k === "wt") { DFILT_WT = on ? null : sel; }
  else if (on) { delete DFILT[k]; } else { DFILT[k] = sel; }
  dfLabel(k, sel.size, boxes.length);
  FCACHE = null;
  renderDrillTable();
}

function dfClearAll() {
  DFILT = {}; DFILT_WT = null; dfLast = {}; FCACHE = null;
  renderDrillHead();
  renderDrillTable();
}

/* 컬럼 드래그 정렬 ------------------------------------------------------ */
let dragKey = null;

function colDragStart(ev, k) {
  dragKey = k;
  ev.dataTransfer.effectAllowed = "move";
  try { ev.dataTransfer.setData("text/plain", k); } catch (e) { /* 무시 */ }
  ev.target.classList.add("dragging");
}
function colDragOver(ev) { ev.preventDefault(); ev.dataTransfer.dropEffect = "move"; }
function colDragEnd(ev) {
  dragKey = null;
  document.querySelectorAll("th.dragging").forEach(x =>
    x.classList.remove("dragging"));
}
function colDrop(ev, target) {
  ev.preventDefault();
  ev.stopPropagation();                       // 드롭으로 정렬이 걸리지 않게
  if (!dragKey || dragKey === target) { return; }
  const order = drillCols().map(c => c.k);
  const from = order.indexOf(dragKey);
  const to = order.indexOf(target);
  if (from < 0 || to < 0) { return; }
  order.splice(to, 0, order.splice(from, 1)[0]);
  COL_ORDER = order;
  dragKey = null;
  renderDrillHead();
  renderDrillTable();
}

function renderDrillTable() {
  const d = DRILL_DATA;
  if (!d) { return; }
  const cols = drillCols().filter(c => !HIDE_COLS[c.k]);
  const rows = sortedRows();

  const head = cols.map(c => {
    const i = SORT_KEYS.findIndex(x => x.k === c.k);
    const mark = i < 0 ? ""
      : `<sup class="so">${i + 1}${SORT_KEYS[i].dir === 1 ? "▲" : "▼"}</sup>`;
    return `<th class="${NUM_COLS.has(c.k) ? "num " : ""}sortable" draggable="true"`
         + ` data-k="${c.k}" onclick="drillSort('${c.k}')"`
         + ` ondragstart="colDragStart(event,'${c.k}')"`
         + ` ondragover="colDragOver(event)"`
         + ` ondrop="colDrop(event,'${c.k}')"`
         + ` ondragend="colDragEnd(event)">${c.t}${mark}</th>`;
  }).join("");

  // 셀마다 <span class="c"> 를 넣으면 DOM 노드가 두 배가 되어 느려진다.
  // 가로 스크롤이 필요한 긴 값에만 span 을 쓴다.
  const LONG = 14;
  const keys = cols.map(c => c.k);
  const isNum = cols.map(c => NUM_COLS.has(c.k));
  const isWt = cols.map(c => c.k === "wt");
  const nc = cols.length;

  const buf = [];
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    buf.push("<tr>");
    for (let j = 0; j < nc; j++) {
      const raw = r[keys[j]];
      let v = (raw === null || raw === undefined) ? ""
        : (isWt[j] ? Number(raw).toFixed(1) : String(raw));
      if (v.length > LONG) {
        buf.push(isNum[j] ? '<td class="num"><span class="c">'
                          : '<td><span class="c">');
        buf.push(v);
        buf.push("</span></td>");
      } else {
        buf.push(isNum[j] ? '<td class="num">' : "<td>");
        buf.push(v);
        buf.push("</td>");
      }
    }
    buf.push("</tr>");
  }

  const cnt = document.getElementById("drillCount");
  if (cnt) {
    cnt.textContent = nf(rows.length) + " / " + nf((d.rows || []).length) + " 행";
  }
  document.getElementById("drillBody").innerHTML =
    `<table class="grid"><thead><tr>${head}</tr></thead><tbody>`
    + (buf.length ? buf.join("")
       : `<tr><td colspan="${cols.length}" style="color:#6B7280">`
         + `해당 조건의 LOT 이 없습니다.</td></tr>`)
    + `</tbody></table>`;
}

const SRC_TITLE = {
  cause: "원인 분석 상세", wt: "W/T 분포 상세", wt0: "W/T 0 재공 상세",
  type: "재공 lot_type 상세", status: "status 상세",
};

// 드릴다운 소제목. 영문은 대문자, 단계는 > 로 잇는다.
function drillTitle(src, label) {
  return [SRC_TITLE[src] || "LOT 상세", LINE, label]
    .filter(Boolean)
    .join(" > ")
    .replace(/[a-z]+/g, (m) => m.toUpperCase());
}

function openDrill(filt, label, src) {
  clearOtherSelections(src || "");
  const el = document.getElementById("drill");
  // 곧바로 자리표시자를 그려 '눌리지 않은 것처럼' 보이지 않게 한다.
  el.classList.add("loading");
  el.innerHTML = `<div class="cellttl"><span>${drillTitle(src, label)}</span></div>`
    + `<div class="bar"><b>불러오는 중…</b><span class="spin"></span></div>`;
  smoothTo(el);
  const base = { line: LINE, types: selectedTypes().join(","),
                 prod1: PROD1.join(","), prod2: PROD2.join(",") };
  const q = Object.entries(Object.assign(base, filt || {}))
    .filter(([, v]) => v !== undefined && v !== null && v !== "")
    .map(([k, v]) => k + "=" + encodeURIComponent(v)).join("&");

  fetch("/api/lots-live/?" + q).then(r => r.json()).then(d => {
    el.classList.remove("loading");
    DRILL_DATA = d;
    SORT_KEYS = [];                       // 새 조건이면 정렬/필터 초기화
    HIDE_COLS = {}; DFILT = {}; DFILT_WT = null; dfLast = {}; FCACHE = null;
    el.innerHTML = `<div class="cellttl"><span>${drillTitle(src, label)}</span></div>
      <div class="bar">
        <div><b>${nf(d.lots || (d.rows || []).length)} LOT</b>
          <b style="margin-left:8px">${nf(d.qty || 0)} 매</b>
          <span class="path" id="drillCount"></span>
          <span class="path">컬럼명을 누르면 정렬 (1회 오름 · 2회 내림 · 3회 해제)
            · 컬럼명을 끌어 순서를 바꿀 수 있습니다</span>
        </div>
        <button onclick="closeDrill()">닫기</button></div>
      <div class="dtools">
        <div class="drow"><span class="minittl">컬럼</span>
          <div class="chips" id="drillCols"></div></div>
        <div class="drow"><span class="minittl">필터</span>
          <div class="dfs" id="drillFilters"></div></div>
      </div>
      <div class="gridwrap" id="drillBody"></div>`;
    renderDrillHead();
    renderDrillTable();
  });
}

/* --- 로딩 --- */
function loadSummary() {
  // 라인/lot_type/제품구분이 바뀌면 지금 표는 다른 조건의 결과다.
  // 그대로 두면 잘못된 데이터를 보게 되므로 선택과 표를 함께 지운다.
  SEL_WT = null; SEL_WT0 = null; SEL_TYPE = null; SEL_PIE = null;
  CZ_SEL = { i: -1, path: [] };
  DRILL_KEY = { i: -1, node: null };
  closeDrill();

  fetch("/api/summary/?line=" + encodeURIComponent(LINE)
        + "&types=" + encodeURIComponent(selectedTypes().join(","))
        + "&prod1=" + encodeURIComponent(PROD1.join(","))
        + "&prod2=" + encodeURIComponent(PROD2.join(",")))
    .then(r => r.ok ? r.json() : Promise.reject("HTTP " + r.status))
    .then(d => {
      const err = document.getElementById("err");
      if (!d.ready) {
        err.textContent = d.reason || "데이터 없음";
        if (d.prod1_options) { renderProd(d); }   // 필터는 되돌릴 수 있어야 한다
        return;
      }
      err.textContent = "";
      DATA = d;
      SEL_STATUS = null;
      CZ_SEL = { i: -1, path: [] };
      document.getElementById("snapAt").textContent = d.snapshot_at || "-";
      renderProd(d);
      renderWip(); renderStatus(); renderWt(); renderWt0(); renderCause();
    })
    .catch(e => { document.getElementById("err").textContent = "조회 실패: " + e; });
}

pickLine(LINE);
</script>
{% endblock %}
