{% extends "flowmonitor/base.html" %}
{% load static %}
{% block body %}
<div class="layout">
  <div class="summary">
    <div class="lineseg" id="lineseg">
      {% for l in lines %}
        <button data-line="{{ l.line }}" {% if not l.ready %}disabled
          title="아직 적재된 데이터가 없습니다"{% endif %}
          onclick="pickLine('{{ l.line }}')">{{ l.label }}</button>
      {% endfor %}
    </div>

    <div id="err" class="err"></div>

    <!-- 재공 뷰 -->
    <div class="cell">
      <div class="wip">
        <div class="top">
          <div class="nums">
            <div><b id="wl">-</b><div class="lbl">재공 LOT</div></div>
            <div><b id="wq">-</b><div class="lbl">재공 매</div></div>
          </div>
          <div class="dd" id="dd">
            <button onclick="toggleDd()" id="ddb">전체 &#9662;</button>
            <div class="menu" id="ddm"></div>
          </div>
        </div>
        <div class="stack" id="ws"></div>
        <div class="stleg" id="wg"></div>
      </div>
    </div>

    <!-- status 뷰 -->
    <div class="cell">
      <div class="donut">
        <div class="legend" id="lg"></div>
        <div class="cv"><canvas id="dn"></canvas></div>
        <div class="pickinfo" id="dt"></div>
      </div>
    </div>

    <!-- WT 분포 뷰 -->
    <div class="cell">
      <div class="cellttl"><span>W/T 분포</span>
        <span class="seg">
          <button id="wu_lots" onclick="setWtUnit('lots')">LOT</button>
          <button class="on" id="wu_qty" onclick="setWtUnit('qty')">매</button>
        </span></div>
      <div style="height:190px"><canvas id="wtc"></canvas></div>
    </div>

    <!-- W/T 0 재공 분포 -->
    <div class="cell">
      <div class="cellttl"><span>W/T 0 재공 분포</span>
        <span class="seg">
          <button id="zu_lots" onclick="setWt0Unit('lots')">LOT</button>
          <button class="on" id="zu_qty" onclick="setWt0Unit('qty')">매</button>
        </span></div>
      <div class="sub" style="font-size:11px;color:var(--mut);margin-bottom:6px">
        마지막 작업 이후 경과일 기준</div>
      <div style="height:210px"><canvas id="wt0c"></canvas></div>
    </div>
  </div>

  <div style="flex:1; min-width:0">
    <div class="cell" style="border:1px solid var(--bd);border-radius:6px;
                             padding:11px 12px;margin-bottom:10px">
      <div class="cellttl"><span>원인 분석</span>
        <span class="seg">
          <button id="cu_lots" onclick="setCauseUnit('lots')">LOT</button>
          <button class="on" id="cu_qty" onclick="setCauseUnit('qty')">매</button>
        </span></div>
      <div class="cz3">
        <div><div class="czh" id="czh0"></div>
          <div id="czp0" class="czpath"></div>
          <div style="height:170px"><canvas id="czc0"></canvas></div></div>
        <div><div class="czh" id="czh1"></div>
          <div id="czp1" class="czpath"></div>
          <div style="height:170px"><canvas id="czc1"></canvas></div></div>
        <div><div class="czh" id="czh2"></div>
          <div id="czp2" class="czpath"></div>
          <div style="height:170px"><canvas id="czc2"></canvas></div></div>
      </div>
    </div>

    <div class="detail" id="drill">
      <div class="empty">좌측 <b>W/T 분포</b>·<b>W/T 0 재공 분포</b> 막대나
        위 <b>원인 분석</b> 항목을 클릭하면 해당 LOT 상세가 여기에 표시됩니다.</div>
    </div>
  </div>
</div>

<script src="{% static 'flowmonitor/chart.umd.js' %}"></script>
<script>
if (window.Chart) {
  Chart.defaults.font.family = "'Poppins','Noto Sans KR','Malgun Gothic',sans-serif";
  Chart.defaults.font.size = 11;
  Chart.defaults.color = "#374151";
}

const BRAND = "#2F4B7C";
const TYPE_COLORS = ["#2F4B7C", "#4C7DD1", "#7FB3E8", "#B9D4F2", "#D8E5F5"];
const nf = (n) => Number(n || 0).toLocaleString("ko-KR");

let LINE = "{{ default_line }}";
let DATA = null;
let SEL_STATUS = null;
let WT_UNIT = "qty";
// lot_type 선택은 라인/뷰를 바꿔도 유지된다. 기본은 PP+PG.
let TYPE_PREF = (() => {
  try {
    const v = JSON.parse(localStorage.getItem("lotTypePref"));
    if (Array.isArray(v)) return v;
  } catch (e) {}
  return ["PP", "PG"];
})();
let CAUSE_UNIT = "qty";
let WT0_UNIT = "qty";
let dnChart = null;

function smoothTo(el) {
  const y = el.getBoundingClientRect().top + window.pageYOffset - 12;
  window.scrollTo({ top: y, behavior: "smooth" });
}

function toggleDd() {
  document.getElementById("dd").classList.toggle("open");
}
document.addEventListener("click", e => {
  if (!e.target.closest(".dd")) document.getElementById("dd").classList.remove("open");
});

function selectedTypes() {
  const boxes = document.querySelectorAll("#ddm input:checked");
  if (!document.getElementById("ddm").innerHTML) return TYPE_PREF;   // 초기 로드
  return [...boxes].map(x => x.value);
}

function syncTypeLabel() {
  const t = selectedTypes();
  document.getElementById("ddb").innerHTML =
    (t.length ? (t.length <= 3 ? t.join(",") : t.length + "개 선택") : "전체") + " &#9662;";
}

function onTypeCheck() {
  TYPE_PREF = selectedTypes();
  try { localStorage.setItem("lotTypePref", JSON.stringify(TYPE_PREF)); } catch (e) {}
  syncTypeLabel();
  loadSummary();
}

function pickLine(line) {
  LINE = line;
  document.querySelectorAll("#lineseg button").forEach(b =>
    b.classList.toggle("on", b.dataset.line === line));
  document.getElementById("ddm").innerHTML = "";   // 라인마다 lot_type 이 다를 수 있다
  loadSummary();
}

function setWtUnit(u) {
  WT_UNIT = u;
  document.getElementById("wu_lots").className = (u === "lots") ? "on" : "";
  document.getElementById("wu_qty").className = (u === "qty") ? "on" : "";
  renderWt();
}

function setCauseUnit(u) {
  CAUSE_UNIT = u;
  document.getElementById("cu_lots").className = (u === "lots") ? "on" : "";
  document.getElementById("cu_qty").className = (u === "qty") ? "on" : "";
  renderCause();
}

function setWt0Unit(u) {
  WT0_UNIT = u;
  document.getElementById("zu_lots").className = (u === "lots") ? "on" : "";
  document.getElementById("zu_qty").className = (u === "qty") ? "on" : "";
  renderWt0();
}

/* --- 재공 --- */
function renderWip() {
  const d = DATA;
  document.getElementById("wl").textContent = nf(d.total.lots);
  document.getElementById("wq").textContent = nf(d.total.qty);

  if (!document.getElementById("ddm").innerHTML) {
    const sel = new Set(d.selected_types || []);
    document.getElementById("ddm").innerHTML = d.types.map(t =>
      `<label><input type="checkbox" value="${t}" ${sel.has(t) ? "checked" : ""}`
      + ` onchange="onTypeCheck()">${t}</label>`).join("");
    syncTypeLabel();
  }
  const tot = d.by_lot_type.reduce((a, x) => a + x.lots, 0) || 1;
  document.getElementById("ws").innerHTML = d.by_lot_type.map((x, k) =>
    `<i style="width:${x.lots / tot * 100}%;background:${TYPE_COLORS[k % 5]}"
        title="${x.name} ${nf(x.lots)} LOT / ${nf(x.qty)} 매"></i>`).join("");
  document.getElementById("wg").innerHTML = d.by_lot_type.map((x, k) =>
    `<span><i style="background:${TYPE_COLORS[k % 5]}"></i>${x.name}
       ${(x.lots / tot * 100).toFixed(0)}%</span>`).join("");
}

/* --- status --- */
const sliceLabels = {
  id: "sliceLabels",
  afterDatasetsDraw(ch) {
    const st = ch.$status || [];
    const ctx = ch.ctx;
    ctx.save();
    ctx.font = "600 10px 'Poppins','Noto Sans KR',sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ch.getDatasetMeta(0).data.forEach((arc, k) => {
      const v = st[k];
      if (!v || v.pct < 6) return;
      const a = (arc.startAngle + arc.endAngle) / 2;
      const r = arc.outerRadius * 0.62;
      ctx.fillStyle = "#fff";
      ctx.fillText(v.pct + "%", arc.x + Math.cos(a) * r, arc.y + Math.sin(a) * r);
    });
    ctx.restore();
  }
};

function setStatusInfo() {
  const d = DATA;
  const s = (SEL_STATUS === null)
    ? { label: d.default.label, pct: d.default.pct, lots: d.default.lots,
        qty: d.default.qty, color: BRAND }
    : { label: d.status[SEL_STATUS].name, pct: d.status[SEL_STATUS].pct,
        lots: d.status[SEL_STATUS].lots, qty: d.status[SEL_STATUS].qty,
        color: d.status[SEL_STATUS].color };
  document.getElementById("dt").innerHTML =
    `<div class="nm" style="color:${s.color}">${s.label}</div>
     <div class="pc">${s.pct.toFixed(1)}%</div>
     <div class="sub">${nf(s.lots)} LOT &middot; ${nf(s.qty)} 매</div>`;
  document.querySelectorAll("#lg span").forEach((el, k) =>
    el.classList.toggle("on", k === (SEL_STATUS === null ? 0 : SEL_STATUS + 1)));
}

function pickStatus(i) { SEL_STATUS = (SEL_STATUS === i) ? null : i; setStatusInfo(); }
function pickDefault() { SEL_STATUS = null; setStatusInfo(); }

function renderStatus() {
  const d = DATA;
  document.getElementById("lg").innerHTML =
    `<span onclick="pickDefault()"><i style="background:${BRAND}"></i>`
    + `${d.default.label}</span>`
    + d.status.map((st, i) =>
        `<span onclick="pickStatus(${i})"><i style="background:${st.color}"></i>`
        + `${st.name}</span>`).join("");

  if (!dnChart) {
    dnChart = new Chart(document.getElementById("dn"), {
      type: "doughnut",
      data: { labels: d.status.map(s => s.name),
              datasets: [{ data: d.status.map(s => s.lots),
                           backgroundColor: d.status.map(s => s.color),
                           borderWidth: 0 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: 0, animation: false,
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: (t) => {
                     const st = (t.chart.$status || [])[t.dataIndex] || {};
                     return st.name + "  " + st.pct + "% / " + nf(st.lots) + " LOT / "
                            + nf(st.qty) + " 매";
                   } } } },
        onClick: (e, els) => { if (els.length) pickStatus(els[0].index); }
      },
      plugins: [sliceLabels]
    });
  }
  dnChart.data.labels = d.status.map(s => s.name);
  dnChart.data.datasets[0].data = d.status.map(s => s.lots);
  dnChart.data.datasets[0].backgroundColor = d.status.map(s => s.color);
  dnChart.$status = d.status;
  dnChart.update();
  setStatusInfo();
}

/* --- W/T 분포 : 위가 WT0(가장 심각), 아래로 갈수록 정상 --- */
let wtChart = null;

function renderWt() {
  const d = DATA, u = WT_UNIT;
  const vals = d.wt_dist.map(x => u === "lots" ? x.lots : x.qty);
  const colors = d.wt_dist.map((_, i) =>
    `rgba(220,20,60,${Math.max(1 - 0.13 * i, 0.18).toFixed(2)})`);

  if (!wtChart) {
    wtChart = new Chart(document.getElementById("wtc"), {
      type: "bar",
      data: { labels: [], datasets: [{ data: [], borderRadius: 3 }] },
      options: {
        indexAxis: "y", responsive: true, maintainAspectRatio: false,
        animation: false,
        layout: { padding: { right: 34 } },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: (t) => {
                     const x = DATA.wt_dist[t.dataIndex];
                     return nf(x.lots) + " LOT / " + nf(x.qty) + " 매";
                   } } } },
        scales: { x: { display: false, beginAtZero: true, grace: "12%" },
                  y: { grid: { display: false }, ticks: { font: { size: 11 } } } },
        onClick: (e, els) => {
          if (!els.length) return;
          const x = DATA.wt_dist[els[0].index];
          openDrill({ wt_range: x.name }, x.label);
        }
      },
      plugins: [{
        id: "wtVal",
        afterDatasetsDraw(ch) {
          const ctx = ch.ctx;
          ctx.save();
          ctx.font = "11px 'Poppins','Noto Sans KR',sans-serif";
          ctx.textAlign = "left"; ctx.textBaseline = "middle";
          ctx.fillStyle = "#374151";
          ch.getDatasetMeta(0).data.forEach((el, k) => {
            ctx.fillText(nf(ch.data.datasets[0].data[k]), el.x + 6, el.y);
          });
          ctx.restore();
        }
      }]
    });
  }
  wtChart.data.labels = d.wt_dist.map(x => x.label);
  wtChart.data.datasets[0].data = vals;
  wtChart.data.datasets[0].backgroundColor = colors;
  wtChart.update();
}

/* --- W/T 0 재공 분포 : 마지막 작업 이후 경과일 --- */
let wt0Chart = null;

function renderWt0() {
  const d = DATA, u = WT0_UNIT;
  const list = d.wt0_dist || [];
  const vals = list.map(x => u === "lots" ? x.lots : x.qty);
  // 오래 방치될수록 진하게
  const colors = list.map((_, i) =>
    `rgba(220,20,60,${Math.min(0.25 + 0.1 * i, 1).toFixed(2)})`);

  if (!wt0Chart) {
    wt0Chart = new Chart(document.getElementById("wt0c"), {
      type: "bar",
      data: { labels: [], datasets: [{ data: [], borderRadius: 3 }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        layout: { padding: { top: 16 } },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: (t) => {
                     const x = (DATA.wt0_dist || [])[t.dataIndex] || {};
                     return nf(x.lots) + " LOT / " + nf(x.qty) + " 매";
                   } } } },
        scales: { x: { grid: { display: false }, ticks: { font: { size: 10 } } },
                  y: { display: false, beginAtZero: true, grace: "18%" } },
        onClick: (e, els) => {
          if (!els.length) return;
          const x = (DATA.wt0_dist || [])[els[0].index];
          openDrill({ wt0: x.name }, "W/T 0 · " + x.label);
        }
      },
      plugins: [{
        id: "wt0Val",
        afterDatasetsDraw(ch) {
          const ctx = ch.ctx; ctx.save();
          ctx.font = "10px 'Poppins','Noto Sans KR',sans-serif";
          ctx.textAlign = "center"; ctx.fillStyle = "#374151";
          ch.getDatasetMeta(0).data.forEach((el, k) => {
            ctx.fillText(nf(ch.data.datasets[0].data[k]), el.x, el.y - 4);
          });
          ctx.restore();
        }
      }]
    });
  }
  wt0Chart.data.labels = list.map(x => x.label);
  wt0Chart.data.datasets[0].data = vals;
  wt0Chart.data.datasets[0].backgroundColor = colors;
  wt0Chart.update();
}

/* --- 원인 분석 : 대분류 3개를 각각 별도 차트로. 각 차트에서 하위로 파고든다 --- */
const czCharts = [null, null, null];
const CZ_PATHS = [[], [], []];      // 대분류별 파고든 경로

function czGroup(i) { return (DATA.causes || [])[i] || { name: "", children: [] }; }

function czNodes(i) {
  let list = czGroup(i).children || [];
  for (const p of CZ_PATHS[i]) {
    const hit = list.find(x => x.name === p);
    list = (hit && hit.children) || [];
  }
  return list;
}

function czFilter(i) {
  const f = { big: czGroup(i).name };
  if (CZ_PATHS[i][0]) f.mid = CZ_PATHS[i][0];
  if (CZ_PATHS[i][1]) f.sub = CZ_PATHS[i][1];
  return f;
}

function czGo(i, depth) { CZ_PATHS[i] = CZ_PATHS[i].slice(0, depth); renderCause(); }

function renderCause() {
  const u = CAUSE_UNIT;
  for (let i = 0; i < 3; i++) {
    const g = czGroup(i);
    const nodes = czNodes(i);

    document.getElementById("czh" + i).innerHTML =
      `<span>${g.name || "-"}</span><span>${nf(u === "lots" ? g.lots : g.qty)}`
      + `${u === "lots" ? " LOT" : " 매"}</span>`;
    document.getElementById("czp" + i).innerHTML =
      CZ_PATHS[i].length
        ? `<a onclick="czGo(${i},0)">전체</a>`
          + CZ_PATHS[i].map((p, k) =>
              ` &rsaquo; <a onclick="czGo(${i},${k + 1})">${p}</a>`).join("")
        : "";

    if (!czCharts[i]) {
      czCharts[i] = new Chart(document.getElementById("czc" + i), {
        type: "bar",
        data: { labels: [], datasets: [{ data: [], borderRadius: 3 }] },
        options: {
          indexAxis: "y", responsive: true, maintainAspectRatio: false,
          animation: false,
          layout: { padding: { right: 34 } },
          plugins: { legend: { display: false },
                     tooltip: { callbacks: { label: (t) => {
                       const x = czNodes(i)[t.dataIndex] || {};
                       return nf(x.lots) + " LOT / " + nf(x.qty) + " 매";
                     } } } },
          scales: { x: { display: false, beginAtZero: true, grace: "12%" },
                    y: { grid: { display: false }, ticks: { font: { size: 10 } } } },
          onClick: (e, els) => {
            if (!els.length) return;
            const x = czNodes(i)[els[0].index];
            if (x.children && x.children.length) {
              CZ_PATHS[i].push(x.name);      // 더 파고들 수 있으면 진입
              renderCause();
            } else {
              CZ_PATHS[i].push(x.name);
              renderCause();
              openDrill(czFilter(i),
                        [czGroup(i).name].concat(CZ_PATHS[i]).join(" › "));
            }
          }
        },
        plugins: [{
          id: "czVal" + i,
          afterDatasetsDraw(ch) {
            const ctx = ch.ctx; ctx.save();
            ctx.font = "10px 'Poppins','Noto Sans KR',sans-serif";
            ctx.textAlign = "left"; ctx.textBaseline = "middle";
            ctx.fillStyle = "#374151";
            ch.getDatasetMeta(0).data.forEach((el, k) => {
              ctx.fillText(nf(ch.data.datasets[0].data[k]), el.x + 6, el.y);
            });
            ctx.restore();
          }
        }]
      });
    }
    const vals = nodes.map(x => u === "lots" ? x.lots : x.qty);
    const mx = Math.max.apply(null, vals.concat([1]));
    czCharts[i].data.labels = nodes.map(x => x.name);
    czCharts[i].data.datasets[0].data = vals;
    czCharts[i].data.datasets[0].backgroundColor = vals.map(v =>
      `rgba(47,75,124,${(0.3 + 0.7 * v / mx).toFixed(2)})`);
    czCharts[i].update();
  }
}

/* --- 드릴다운 --- */
const NUM_COLS = new Set(["qty", "wt", "마지막이벤트경과_일", "스텝도착경과_일",
                          "마지막작업경과_일"]);

function closeDrill() {
  document.getElementById("drill").innerHTML =
    `<div class="empty">좌측 <b>W/T 분포</b> 막대나 <b>원인 분석</b> 항목을 클릭하면
      해당 LOT 상세가 여기에 표시됩니다.</div>`;
}

function openDrill(filt, label) {
  const el = document.getElementById("drill");
  el.innerHTML = `<div class="bar"><b>불러오는 중…</b></div>`;
  smoothTo(el);
  const base = { line: LINE, types: selectedTypes().join(",") };
  const q = Object.entries(Object.assign(base, filt || {}))
    .filter(([, v]) => v !== undefined && v !== null && v !== "")
    .map(([k, v]) => k + "=" + encodeURIComponent(v)).join("&");
  fetch("/api/lots-live/?" + q).then(r => r.json()).then(d => {
    const cols = d.cols || [], rows = d.rows || [];
    const head = cols.map(c =>
      `<th class="${NUM_COLS.has(c.k) ? "num" : ""}">${c.t}</th>`).join("");
    const body = rows.map(r => "<tr>" + cols.map(c => {
      var v = (r[c.k] === null || r[c.k] === undefined) ? "" : String(r[c.k]);
      // 셀 내용을 .c 로 감싸야 셀 안에서 가로 스크롤이 된다
      return `<td class="${NUM_COLS.has(c.k) ? "num" : ""}">`
           + `<span class="c">${v}</span></td>`;
    }).join("") + "</tr>").join("");
    el.innerHTML = `<div class="bar">
        <div><b>${nf(rows.length)} LOT</b>
          <span class="path">${[LINE, label].filter(Boolean).join(" / ")}</span></div>
        <button onclick="closeDrill()">닫기</button></div>
      <div class="gridwrap"><table class="grid"><thead><tr>${head}</tr></thead><tbody>${body
        || `<tr><td colspan="${cols.length}" style="color:#6B7280">`
           + `해당 조건의 LOT 이 없습니다.</td></tr>`}</tbody></table></div>`;
  });
}

/* --- 로딩 --- */
function loadSummary() {
  fetch("/api/summary/?line=" + encodeURIComponent(LINE)
        + "&types=" + encodeURIComponent(selectedTypes().join(",")))
    .then(r => r.ok ? r.json() : Promise.reject("HTTP " + r.status))
    .then(d => {
      const err = document.getElementById("err");
      if (!d.ready) { err.textContent = d.reason || "데이터 없음"; return; }
      err.textContent = "";
      DATA = d;
      SEL_STATUS = null;
      CZ_PATHS[0] = []; CZ_PATHS[1] = []; CZ_PATHS[2] = [];
      document.getElementById("snapAt").textContent = d.snapshot_at || "-";
      renderWip(); renderStatus(); renderWt(); renderWt0(); renderCause();
    })
    .catch(e => { document.getElementById("err").textContent = "조회 실패: " + e; });
}

pickLine(LINE);
</script>
{% endblock %}
