let DRILL_DATA = null;      // 현재 표에 뿌린 원자료
let SORT_KEYS = [];         // [{k, dir}] 순서가 곧 정렬 우선순위
let HIDE_COLS = {};         // 감춘 컬럼
let DFILT = {};             // 표 자체 필터 {컬럼: Set(값)}
let DFILT_WT = null;        // WT 는 구간으로 고른다
let FCACHE = null;          // 필터 결과. 정렬만 바뀌면 재사용한다
let dfLast = {};            // shift 범위 선택 기준점
let COL_ORDER = null;       // 사용자가 드래그로 바꾼 컬럼 순서(키 배열)

function allCols() {
  if (DRILL_DATA && DRILL_DATA.all_cols) { return DRILL_DATA.all_cols; }
  return (DRILL_DATA && DRILL_DATA.cols) ? DRILL_DATA.cols : [];
}

function visibleKeys() {
  const all = allCols();
  const v = all.filter(c => !HIDE_COLS[c.k]).map(c => c.k);
  return v.length ? v : all.map(c => c.k);
}

function drillCols() {
  const cols = (DRILL_DATA && DRILL_DATA.cols) ? DRILL_DATA.cols : [];
  if (!COL_ORDER) { return cols; }
  const by = {};
  cols.forEach(c => { by[c.k] = c; });
  const out = COL_ORDER.map(k => by[k]).filter(Boolean);
  cols.forEach(c => { if (out.indexOf(c) < 0) { out.push(c); } });
  return out;
}

function czGroup(i) { return (DATA.causes || [])[i] || { name: "", children: [] }; }

function czNodesAt(i, path) {
  let list = czGroup(i).children || [];
  for (const p of path) {
    const hit = list.find(x => x.name === p.name);
    list = (hit && hit.children) || [];
  }
  return list;
}

function czFilter() {
  const f = { big: czGroup(CZ_SEL.i).name };
  for (const p of CZ_SEL.path) {
    if (p.kind === "mid") { f.mid = p.name; } else { f.sub = p.name; }
  }
  return f;
}

function czLabel(v, max) {
  v = String(v == null ? "" : v);
  return v.length > max ? v.slice(0, max - 1) + "…" : v;
}

function czReset() {
  CZ_SEL = { i: -1, path: [] };
  DRILL_KEY = { i: -1, node: null, list: [] };
  closeDrill();
  renderCause();
}
function czGo(depth) { CZ_SEL.path = CZ_SEL.path.slice(0, depth); renderCause(); }

// depth=0 : 상단 요약 차트 -> 경로를 새로 시작
// depth>0 : 드릴다운 차트   -> 현재 경로에 덧붙임
const SEL_COLOR = "#FFD700";

const CZ_TOP = 5;

const CZ_DEEP = 15;

const CZ_SCALE_X = {
  grid: { display: false },
  ticks: { font: { size: 9 }, autoSkip: false, maxRotation: 0, minRotation: 0,
           callback: function (v) {
             const lb = this.chart.data.labels[v];
             // 배열이면 두 줄 라벨이다(전체 제약). 각 줄만 줄여 준다.
             if (Array.isArray(lb)) { return lb.map(x => czLabel(x, 10)); }
             return czLabel(this.getLabelForValue(v), 10);
           } }
};

const popSelected = {
  id: "popSelected",
  afterDatasetsDraw(chart) {
    // 누적막대는 (구간, 계열) 쌍으로 지정한다. 계열이 다르면 자리도 다르다.
    const pairs = chart.$selPairs;
    if (pairs && pairs.length) {
      pairs.forEach(([k, di]) => drawSel(chart, k, di));
      return;
    }
    // 여러 개를 고른 경우 전부 표시한다.
    const many = chart.$selSet;
    if (many && many.size > 1 && chart.data.labels) {
      chart.data.labels.forEach((lb, k) => {
        if (many.has(lb)) { drawSel(chart, k); }
      });
      return;
    }
    const sel = chart.$sel;
    if (sel === undefined || sel === null || sel < 0) { return; }
    drawSel(chart, sel);
  }
};

if (window.Chart) { Chart.register(popSelected); }

function strongest(c) {
  if (typeof c !== "string") { return c; }
  const i = c.indexOf("(");
  const j = c.lastIndexOf(")");
  if (i > 0 && j > i && c.slice(0, i).trim().toLowerCase().indexOf("rgb") === 0) {
    const p = c.slice(i + 1, j).split(",").map(x => x.trim());
    if (p.length >= 3) { return "rgb(" + p[0] + ", " + p[1] + ", " + p[2] + ")"; }
  }
  return c;
}

function drawSel(chart, sel, dsIdx) {
  {
    // 누적막대는 어느 계열을 골랐는지가 중요하다.
    const di = (dsIdx !== undefined && dsIdx !== null) ? dsIdx
      : ((chart.$selDs === undefined || chart.$selDs === null)
         ? 0 : chart.$selDs);
    const el = (chart.getDatasetMeta(di).data || [])[sel];
    if (!el) { return; }
    const ctx = chart.ctx;
    const bg = chart.data.datasets[di].backgroundColor;
    const fill = strongest(Array.isArray(bg) ? bg[sel] : bg);

    ctx.save();
    ctx.fillStyle = fill;
    ctx.strokeStyle = SEL_COLOR;
    ctx.lineWidth = 3;
    ctx.lineJoin = "round";

    if (el.outerRadius !== undefined) {          // 원차트 조각
      ctx.beginPath();
      ctx.arc(el.x, el.y, el.outerRadius - 1.5, el.startAngle, el.endAngle);
      ctx.arc(el.x, el.y, el.innerRadius + 1.5, el.endAngle, el.startAngle, true);
      ctx.closePath();
      ctx.fill();                                // 계열 최강색으로 다시 채우고
      ctx.stroke();
    } else {                                     // 막대
      // 가로막대(indexAxis:'y')와 세로막대는 width/height/base 의미가 다르다.
      // 두 경우를 나눠 실제 막대와 정확히 겹치게 그린다.
      const p = el.getProps(["x", "y", "base", "width", "height"], true);
      const horiz = (chart.options.indexAxis === "y");
      let x0, y0, w, h;
      if (horiz) {
        x0 = Math.min(p.base, p.x);
        w  = Math.abs(p.x - p.base);
        h  = p.height || 0;
        y0 = p.y - h / 2;
      } else {
        y0 = Math.min(p.base, p.y);
        h  = Math.abs(p.base - p.y);
        w  = p.width || 0;
        x0 = p.x - w / 2;
      }
      const in_ = 1.5;                           // 선 굵기의 절반만큼 안쪽으로
      ctx.fillRect(x0, y0, w, h);                // 계열 최강색으로 다시 채우고
      ctx.strokeRect(x0 + in_, y0 + in_,
                     Math.max(w - in_ * 2, 1), Math.max(h - in_ * 2, 1));
    }
    ctx.restore();
  }
}

function czBarChart(canvasId, onPick, pluginId) {
  return new Chart(document.getElementById(canvasId), {
    type: "bar",
    data: { labels: [], datasets: [
      { data: [], borderRadius: 3, order: 2, yAxisID: "y" },
      // 경과일 평균(일/lot). 막대 위에 겹치지 않게 별도 축을 쓴다.
      { type: "line", data: [], order: 1, yAxisID: "y2",
        borderColor: "#B4504F", backgroundColor: "#B4504F",
        borderWidth: 2, pointRadius: 3, pointHoverRadius: 4,
        tension: 0.25, spanGaps: true }
    ] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      layout: { padding: { top: 16 } },
      plugins: { legend: { display: false },
                 tooltip: { callbacks: {
                   title: (t) => (t[0].chart.$nodes[t[0].dataIndex] || {}).name,
                   label: (t) => {
                     const x = t.chart.$nodes[t.dataIndex] || {};
                     if (t.datasetIndex === 1) {
                       return "경과 평균 " + (x.elapsed_d == null ? "-"
                              : x.elapsed_d.toFixed(1) + " 일/lot");
                     }
                     return nf(x.lots) + " LOT / " + nf(x.qty) + " 매";
                   } } } },
      // 막대와 라인을 세로로 분리한다.
      //   막대 : 바닥 ~ 50%      (라벨은 그 바로 위)
      //   라인 : 68% ~ 90%       (라벨은 그 위)
      // 두 대역 사이 여백이 있어 막대·라인·라벨이 서로 겹치지 않는다.
      scales: {
        x: CZ_SCALE_X,
        y: { display: false, beginAtZero: true,
             afterDataLimits: (sc) => { sc.max = (sc.max || 1) / 0.50; } },
        y2: { display: false, position: "right",
              afterDataLimits: (sc) => {
                let a = sc.min, b = sc.max;
                if (!isFinite(a) || !isFinite(b)) { return; }
                if (b - a < 1e-9) {
                  const pad = Math.abs(b) * 0.5 || 1;   // 값이 하나뿐이거나 0
                  a = b - pad;
                }
                // a -> 68%, b -> 90% 위치에 오도록 축 범위를 역산
                const range = (b - a) / 0.22;
                sc.min = a - 0.68 * range;
                sc.max = sc.min + range;
              } } },
      onClick: (e, els) => {
        if (els.length) { onPick(els[0].index, e.native || e); }
      },
      interaction: { mode: "index", intersect: false }
    },
    plugins: [{
      id: pluginId,
      afterDatasetsDraw(ch) {
        const ctx = ch.ctx; ctx.save();
        ctx.font = "10px 'Poppins','Noto Sans KR',sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "bottom";
        ctx.fillStyle = "#374151";
        const unit = (CAUSE_UNIT === "lots") ? " lot" : " 매";
        ch.getDatasetMeta(0).data.forEach((el, k) => {
          ctx.fillText(nf(ch.data.datasets[0].data[k]) + unit, el.x, el.y - 4);
        });
        ctx.fillStyle = "#B4504F";
        ch.getDatasetMeta(1).data.forEach((el, k) => {
          const v = ch.data.datasets[1].data[k];
          if (v === null || v === undefined) { return; }
          ctx.fillText(v.toFixed(1) + " 일/lot", el.x, el.y - 7);
        });
        ctx.restore();
      }
    }]
  });
}

function czApply(ch, nodes, u, selName, selList) {
  // 값에 따라 농도를 달리하면 1위 막대가 '선택된 것' 처럼 보인다.
  // 선택 표시는 3D 팝업이 전담하므로 막대색은 전부 같은 남색으로 둔다.
  const vals = nodes.map(x => u === "lots" ? x.lots : x.qty);
  ch.$nodes = nodes;
  ch.data.labels = nodes.map(x => x.name);
  ch.data.datasets[0].data = vals;
  // 안 좋은 지표라 적색 계열(#F08080). 상위일수록 진하다(값 내림차순으로 온다).
  ch.data.datasets[0].backgroundColor = nodes.map((_, i) =>
    `rgba(240,128,128,${Math.max(1 - 0.11 * i, 0.25).toFixed(2)})`);
  ch.data.datasets[1].data = nodes.map(x =>
    (x.elapsed_d === null || x.elapsed_d === undefined) ? null : x.elapsed_d);
  const on = new Set(selList && selList.length ? selList : [selName]);
  ch.$selSet = on;
  markSelected(ch, nodes.findIndex(x => on.has(x.name)));
  keepBarWidth(ch, nodes.length);
  ch.update();
}

/* 항목이 줄어도 막대 굵기와 축 자리를 그대로 둔다.
   10 개이던 x축이 2 개가 되면 막대가 지나치게 굵어져 다른 카드처럼 보인다.
   기준 개수를 기억해 두고 그만큼의 자리를 유지한다.
--------------------------------------------------------------------- */
function keepBarWidth(ch, n) {
  if (!ch || !n) { return; }
  // 그 차트에서 본 가장 많은 개수를 기준으로 삼는다.
  ch.$slots = Math.max(ch.$slots || 0, n);
  const slots = ch.$slots;
  const ds = ch.data.datasets[0];
  // Chart.js 는 카테고리 폭의 비율로 막대를 그린다. 자리 수만큼 좁힌다.
  ds.barPercentage = Math.min(0.9, 0.9 * n / slots);
  ds.categoryPercentage = 0.9;
  ds.maxBarThickness = Math.max(8, Math.round(240 / slots));
}

function markSelected(ch, selIdx) {
  ch.$sel = (selIdx === undefined || selIdx === null) ? -1 : selIdx;
}

// 이 대분류에서 지금 파고든 경로. 다른 차트 경로를 물려받지 않는다.
function basePathOf(i) {
  const st = CZ_STACK.filter(x => x.i === i).slice(-1)[0];
  if (st) { return st.path.slice(); }
  if (CZ_WIDE && CZ_WIDE.i === i) { return CZ_WIDE.path.slice(); }
  return [];
}

// 항목 하나를 조건으로 건다. OR 목록은 늘 (대분류, 중분류, 소분류) 3쌍이다.
function czSelect(i, basePath, node, ev) {
  const add = ev && (ev.ctrlKey || ev.metaKey);
  const path = basePath.concat([{ name: node.name, kind: node.kind || "sub" }]);
  const midP = path.find(p => p.kind === "mid");
  const subP = path.filter(p => p.kind !== "mid").slice(-1)[0];
  const pick = {
    big: czGroup(i).name,
    mid: midP ? midP.name : null,
    // 고른 것이 중분류면 소분류는 비운다(그 중분류 전체를 뜻한다).
    sub: (node.kind === "mid") ? null : (subP ? subP.name : null),
  };
  const ck = (x) => [x.big || "", x.mid || "", x.sub || ""].join(">");

  // 이미 고른 갈래를 더 파고든 것이면 그 항목을 '대체' 한다.
  // (안 그러면 Hold 또는 설비이슈 또는 설비이슈>TIT405 처럼 쌓인다)
  const ancestor = (a, b) => a.big === b.big
    && (!a.mid || a.mid === b.mid)
    && (!a.sub || a.sub === b.sub);

  const prev = (DF_CAUSE && DF_CAUSE.or) ? DF_CAUSE.or.slice() : [];
  const same = prev.findIndex(x => ck(x) === ck(pick));
  let or;
  if (same >= 0) {
    or = prev.filter((_, k) => k !== same);      // 같은 것 재클릭 = 해제
  } else {
    const up = prev.findIndex(x => ancestor(x, pick));
    if (up >= 0) {
      or = prev.slice();
      or[up] = pick;                             // 그 갈래만 좁힌다
    } else if (add) {
      or = prev.concat([pick]);                  // 다른 갈래를 더한다
    } else {
      or = [pick];                               // 새로 시작
    }
  }
  DF_CAUSE = or.length ? { i: i, or: or } : null;
  dfResetBelow(4, true);
  syncFromDF();
}

function czPick(i, node, depth, ev) {
  if (!node) { return; }
  const add = ev && (ev.ctrlKey || ev.metaKey);
  const leaf = !(node.children && node.children.length);

  // Ctrl 이 아니면 이전 드릴다운은 모두 버린다(같은 차트 안이라도).
  if (!add) {
    if (CZ_STACK.length && CZ_STACK[0].i !== i) { CZ_STACK = []; }
    if (CZ_WIDE && CZ_WIDE.i !== i) { CZ_WIDE = null; }
  }
  if (depth === 0 && !add) { CZ_SEL = { i: i, path: [] }; }
  CZ_SEL.path = CZ_SEL.path.filter(p => p.kind !== "all");

  if (leaf) {
    czSelect(i, basePathOf(i), node, ev);
    return;
  }

  // 하위가 있다. Ctrl 이어도 무엇을 볼지 물어본다(둘 다 고를 수 있어야 한다).
  czAsk(i, basePathOf(i), node, ev);
}

/* 하위가 있는 항목: 전체로 볼지, 세부로 파고들지 고른다 -----------------
   좌측 차트는 해당 없다(늘 바로 적용).
--------------------------------------------------------------------- */
let CZ_ASK = null;

function czAsk(i, basePath, node, ev) {
  // Ctrl 여부를 기억한다. 팝업에서 고른 뒤에도 '함께 보기' 가 유지된다.
  CZ_ASK = { i: i, base: basePath.slice(), node: node,
             add: !!(ev && (ev.ctrlKey || ev.metaKey)) };
  const el = document.getElementById("czask");
  const kids = czNodesAt(i, basePath.concat(
    [{ name: node.name, kind: node.kind || "sub" }])).length;
  el.innerHTML =
    `<span class="askx" onclick="czAskClose()">×</span>`
    + `<div class="askttl">${node.name}</div>`
    + `<button onclick="czAskGo('all')">전체 보기</button>`
    + `<button onclick="czAskGo('deep')">세부 요소 보기 (${kids})</button>`;
  el.style.display = "block";
  // 누른 자리 근처에 띄운다.
  const x = (ev && ev.clientX) || 0;
  const y = (ev && ev.clientY) || 0;
  el.style.left = (x + window.pageXOffset + 8) + "px";
  el.style.top = (y + window.pageYOffset - 8) + "px";
}

function czAskClose() {
  CZ_ASK = null;
  const el = document.getElementById("czask");
  if (el) { el.style.display = "none"; }
}

function czAskGo(mode) {
  if (!CZ_ASK) { return; }
  const { i, base, node, add } = CZ_ASK;
  const path = base.concat([{ name: node.name, kind: node.kind || "sub" }]);
  czAskClose();

  if (mode === "deep") {
    // 세부 요소. 아래에 차트를 하나 더 쌓는다.
    CZ_STACK = CZ_STACK.filter(x => x.i !== i || x.path.length < base.length)
      .concat([{ i: i, path: path }]);
    CZ_SEL = { i: i, path: path.slice() };
    CZ_WIDE = null;
  }
  // 전체 보기든 세부 보기든 '그 항목을 골랐다' 는 사실은 같다.
  czSelect(i, base, node, add ? { ctrlKey: true } : null);
}

function czWhole(i) {
  // 조건 저장소를 거쳐야 LOT BALANCE 등 하위가 함께 좁혀진다.
  DF_CAUSE = { i: i, big: czGroup(i).name, mid: null, subs: [] };
  CZ_SEL = { i: -1, path: [] };
  dfResetBelow(4);
  syncFromDF();
}

/* 전체보기 : 셋을 합쳐 가로막대로 --------------------------------------
   카드가 세로로 길어 x/y 를 뒤집는다. y축 라벨은 '대분류' 줄바꿈 '중분류'.
--------------------------------------------------------------------- */
// 대분류별 막대 색. 원인 분석 카드의 색 계열을 따른다.
const STATUS_TONE = {
  "Hold": "#F08080",
  "Wait성 진행불가": "#E8C46A",
  "Bottleneck": "#84C09A",
};

let CAUSE_VIEW = "split";
let CAUSE_ALL_TOP = 20;        // 전체보기에 세울 항목 수
let czAllChart = null;

function setCauseView(v) {
  CAUSE_VIEW = v;
  document.getElementById("cv_split").className = (v === "split") ? "on" : "";
  document.getElementById("cv_all").className = (v === "all") ? "on" : "";
  document.getElementById("cz3").style.display = (v === "all") ? "none" : "";
  document.getElementById("czallw").style.display = (v === "all") ? "" : "none";
  CZ_STACK = []; CZ_WIDE = null;
  renderCause();
  resizeCharts();
}

// 대분류 이름을 짧게. y축 폭을 아낀다.
const BIG_SHORT = { "Wait성 진행불가": "Wait(불가)", "Bottleneck": "B/N" };

function setCauseAllTop(n) { CAUSE_ALL_TOP = n; renderCauseAllBar(); }

function renderCauseAllBar() {
  const u = CAUSE_UNIT;
  // 세 대분류를 한데 놓고 값 순으로 줄 세운다.
  // 한쪽으로 쏠리면 그것이 곧 답이다. 대분류별로 나눠 뽑지 않는다.
  const items = [];
  for (let i = 0; i < 3; i++) {
    const g = czGroup(i);
    (g.children || []).forEach(n => {
      items.push(Object.assign({}, n, { $big: g.name, $i: i }));
    });
  }
  items.sort((a, b) => (u === "lots" ? b.lots - a.lots : b.qty - a.qty));
  const nodes = items.slice(0, CAUSE_ALL_TOP);

  const vals = nodes.map(n => u === "lots" ? n.lots : n.qty);
  const eld = nodes.map(n => (n.eln ? +(n.eld / n.eln).toFixed(1) : null));
  const mx = Math.max(1, ...vals);
  const colors = nodes.map(n => (STATUS_TONE[n.$big] || "#F08080"));

  if (!czAllChart) {
    czAllChart = new Chart(document.getElementById("czall"), {
      type: "bar",
      data: { labels: [], datasets: [
        { data: [], borderRadius: 3, order: 2, xAxisID: "x" },
        { type: "line", data: [], order: 1, xAxisID: "x2",
          borderColor: "#B4504F", backgroundColor: "#B4504F",
          borderWidth: 2, pointRadius: 3, tension: .25, spanGaps: true }
      ] },
      options: {
        indexAxis: "y",                    // 시계방향 90도 회전
        responsive: true, maintainAspectRatio: false, animation: false,
        layout: { padding: { right: 46 } },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: (t) => {
                     const n = (czAllChart.$nodes || [])[t.dataIndex] || {};
                     if (t.dataset.xAxisID === "x2") {
                       return "평균 경과 " + t.raw + "일";
                     }
                     return n.$big + " > " + n.name + "  "
                       + nf(n.lots) + " LOT / " + nf(n.qty) + " 매";
                   } } } },
        scales: {
          x: { display: false, beginAtZero: true,
               afterDataLimits: (sc) => { sc.max = (sc.max || 1) / 0.78; } },
          x2: { display: false, position: "top", beginAtZero: true,
                afterDataLimits: (sc) => { sc.max = (sc.max || 1) * 2.6; } },
          y: { grid: { display: false },
               ticks: { autoSkip: false, font: { size: 9 },
                        callback: function (v) {
                          const n = (czAllChart.$nodes || [])[v] || {};
                          // 위: 대분류, 아래: 중분류(길면 줄임)
                          const nm = String(n.name || "").trim() || "(빈 값)";
                          return [BIG_SHORT[n.$big] || n.$big,
                                  czLabel(nm, 14)];
                        } } }
        },
        onClick: (e) => {
          const hit = czAllChart.getElementsAtEventForMode(
            e.native || e, "nearest", { intersect: false }, false);
          if (!hit.length) { return; }
          const n = (czAllChart.$nodes || [])[hit[0].index];
          if (n) { czPick(n.$i, n, 0, e.native || e); }
        }
      },
      plugins: [{
        id: "czAllVal",
        afterDatasetsDraw(ch) {
          const ctx = ch.ctx; ctx.save();
          ctx.font = "9px 'Poppins','Noto Sans KR',sans-serif";
          ctx.textAlign = "left"; ctx.textBaseline = "middle";
          ctx.fillStyle = "#374151";
          ch.getDatasetMeta(0).data.forEach((el, k) => {
            const v = ch.data.datasets[0].data[k];
            if (v) { ctx.fillText(kfmt(v), el.x + 5, el.y); }
          });
          ctx.restore();
        }
      }]
    });
  }

  const p = document.getElementById("czallp");
  if (p) {
    p.innerHTML = `<span class="minittl">상위 ${nodes.length} / 전체 `
      + `${items.length}개 · </span>`
      + [20, 40, 80].map(n =>
          `<button class="rankbtn ${CAUSE_ALL_TOP === n ? "on" : ""}"`
          + ` onclick="setCauseAllTop(${n})">${n}</button>`).join("");
  }

  // 한 항목당 최소 높이를 주고, 넘치면 카드 안에서 세로 스크롤한다.
  const hbox = document.getElementById("czallh");
  if (hbox) { hbox.style.height = Math.max(240, nodes.length * 26) + "px"; }

  czAllChart.$nodes = nodes;
  czAllChart.data.labels = nodes.map((_, k) => k);
  czAllChart.data.datasets[0].data = vals;
  czAllChart.data.datasets[0].backgroundColor = colors;
  czAllChart.data.datasets[1].data = eld;
  const on = causeSelNames();
  czAllChart.$selSet = on;
  markSelected(czAllChart, nodes.findIndex(n => on.has(n.name)));
  czAllChart.update();
}

function renderCause() {
  const u = CAUSE_UNIT;
  // 상위 계층(좌측 차트)에서 좁혀진 조건을 제목 옆에 보여 준다.
  const up = document.getElementById("czup");
  if (up) {
    // 좌측 차트 조건은 서로 다른 축이라 '>' 가 아니라 '·' 로 잇는다.
    const parts = [];
    DF_DEF.forEach(dd => {
      if ((DF_LV[dd.k] || 9) < 4) {
        const n = dfOneName(dd);
        if (n) { parts.push(n); }
      }
    });
    up.textContent = parts.length ? parts.join(" · ") : "";
  }

  for (let i = 0; i < 3; i++) {
    const g = czGroup(i);
    // 이 칸을 파고들었으면 그 단계의 목록을, 아니면 대분류 바로 아래를 그린다.
    // 대분류 차트는 늘 그 바로 아래 단계만 보여 준다.
    // 파고든 결과는 오른쪽 중분류 차트(#czside)에 따로 나온다.
    const all = g.children || [];
    const nodes = all.slice(0, CZ_TOP);
    const more = all.length - nodes.length;
    const deep = false;
    const path = [];

    const hd = document.getElementById("czh" + i);
    hd.innerHTML = `<span>${g.name || "-"}</span>`
      + `<span class="v">전체 ${nf(u === "lots" ? g.lots : g.qty)}`
      + `${u === "lots" ? " LOT" : " 매"}</span>`;
    hd.onclick = function () { czWhole(i); };      // 제목 = 전체 표

    // 경로 + 전체 순위 보기(계층과 무관하게 항목이 더 있으면 늘 제공)
    const p = document.getElementById("czp" + i);
    const rank = (more > 0)
      ? `<button class="rankbtn" onclick="czShowAll(${i})">전체 순위`
        + `<span class="cv">▸</span></button>` : "";
    if (deep) {
      p.innerHTML =
        `<span class="czback" onclick="czGo(${path.length - 1})">◀ 뒤로</span>`
        + `<a onclick="czGo(0)">전체</a>`
        + path.map((x, k) =>
            ` &gt; <a onclick="czGo(${k + 1})">${x.name}</a>`).join("")
        + (rank ? " " + rank : "");
    } else {
      p.innerHTML = rank;
    }

    if (!czCharts[i]) {
      czCharts[i] = czBarChart("czc" + i,
        (idx, ev) => czPick(i, (czCharts[i].$nodes || [])[idx], 0, ev),
        "czVal" + i);
    }
    // 이 칸에서 파고들었으면(중분류 차트든 표든) 연결 관계를 보인다.
    const srcHere = CZ_STACK.some(x => x.i === i)
      || (CZ_WIDE && CZ_WIDE.i === i)
      || causeSelNames(i).size > 0;
    // 이 대분류에서 고른 것 + 파고든 것 모두 테두리로 표시한다.
    const marks = causeSelNames(i);
    CZ_STACK.filter(x => x.i === i).forEach(x => marks.add(x.path[0].name));
    czApply(czCharts[i], nodes, u, null, [...marks]);
    const col = document.getElementById("czh" + i).parentNode;
    col.classList.toggle("czsrc", !!srcHere);
  }

  if (CAUSE_VIEW === "all") { renderCauseAllBar(); }
  renderCzStack();
  renderCzWide();
}

/* 우측 드릴다운 중분류 차트 --------------------------------------------
   상위 차트를 그대로 두고 그 하위를 옆에 새로 띄운다.
   어느 막대에서 왔는지 남색 테두리로 표시한다.
--------------------------------------------------------------------- */
// 우측 열은 안의 카드가 하나라도 보일 때만 자리를 차지한다.






/* 선택 테두리와 내용이 겹치는지 잰다.
   콘솔에서 checkOverlap() 을 부르면 서버 터미널에 찍힌다.
--------------------------------------------------------------------- */


// 보이는 모든 차트를 컨테이너 폭에 다시 맞춘다.






/* 전체 제약 : 세 대분류를 합쳐 상위 15 ------------------------------------
   x축은 두 줄이다. 위가 더 아래 계층(중·소분류), 아래가 대분류.
--------------------------------------------------------------------------- */
/* 파고든 단계들 : LOT BALANCE 위에 하나씩 쌓인다 ----------------------
   더 쪼갤 게 없을 때까지 카드가 늘어난다. 각 카드는 자기 아래 단계를 만든다.
--------------------------------------------------------------------- */
function czStackClose(n) {
  CZ_STACK = CZ_STACK.slice(0, n);
  CZ_SEL = CZ_STACK.length
    ? { i: CZ_STACK[CZ_STACK.length - 1].i,
        path: CZ_STACK[CZ_STACK.length - 1].path.slice() }
    : { i: -1, path: [] };
  renderCause();
}

function renderCzStack() {
  const box = document.getElementById("czstack");
  if (!box) { return; }

  // 필요한 만큼만 카드를 만든다.
  if (box.childElementCount !== CZ_STACK.length) {
    czStackCharts.forEach(c => { if (c) { c.destroy(); } });
    czStackCharts.length = 0;
    box.innerHTML = CZ_STACK.map((_, n) =>
      `<div class="cell" style="border:1px solid var(--bd);border-radius:6px;`
      + `padding:11px 12px;margin-bottom:10px">`
      + `<div class="cellttl"><span id="czst${n}"></span>`
      + `<span class="czback" onclick="czStackClose(${n})">닫기</span></div>`
      + `<div id="czsp${n}" class="czpath"></div>`
      + `<div style="height:230px"><canvas id="czsc${n}"></canvas></div>`
      + `</div>`).join("");
  }

  CZ_STACK.forEach((step, n) => {
    const g = czGroup(step.i);
    const nodes = czNodesAt(step.i, step.path).slice(0, 20);
    document.getElementById("czst" + n).textContent =
      [g.name].concat(step.path.map(x => x.name)).join(" > ");
    document.getElementById("czsp" + n).innerHTML =
      `<span class="minittl">상위 ${nodes.length}개 · 막대를 누르면 `
      + `${n + 1 < CZ_STACK.length ? "이 아래로 다시 파고든다"
                                   : "더 파고들거나 LOT 상세"}</span>`;

    if (!czStackCharts[n]) {
      czStackCharts[n] = czBarChart("czsc" + n, (idx, ev) => {
        const st = CZ_STACK[n];
        const node = (czStackCharts[n].$nodes || [])[idx];
        if (!st || !node) { return; }
        const next = st.path.concat([{ name: node.name,
                                       kind: node.kind || "sub" }]);
        // 더 쪼갤 게 있으면 무엇을 볼지 물어본다.
        if (!(ev && (ev.ctrlKey || ev.metaKey))
            && czNodesAt(st.i, next).length) {
          czAsk(st.i, st.path, node, ev);
          return;
        }
        // 말단이면 표만 바꾸고 카드는 그대로 둔다.
        const keep = CZ_STACK;
        czPick(st.i, node, 1, ev);
        CZ_STACK = keep;
        renderCzStack();
      }, "czsVal" + n);
    }
    czStackCharts[n].$selSet = causeSelNames(step.i);
    czApply(czStackCharts[n], nodes, CAUSE_UNIT, null,
            [...causeSelNames(step.i)]);
  });
}

/* 전체 순위 : 아래 넓은 패널 --------------------------------------------- */
let CZ_WIDE = null;          // {i, path}
let czWideChart = null;

function czShowAll(i) {
  // 다른 카드에서 열려 있던 것은 닫는다(리셋 규칙).
  if (CZ_WIDE && CZ_WIDE.i !== i) { CZ_WIDE = null; }
  if (CZ_STACK.length && CZ_STACK[0].i !== i) { CZ_STACK = []; }
  if (CZ_SEL.i !== i) { CZ_SEL = { i: i, path: [] }; }
  const path = CZ_SEL.path.slice();
  const same = CZ_WIDE && CZ_WIDE.i === i
    && CZ_WIDE.path.map(x => x.name).join("|") === path.map(x => x.name).join("|");
  CZ_WIDE = same ? null : { i: i, path: path };
  if (CAUSE_VIEW === "all") { renderCauseAllBar(); }
  renderCzStack();
  renderCzWide();
}

/* 우측 드릴다운 중분류 차트 --------------------------------------------
   상위 차트를 그대로 두고 그 하위를 옆에 새로 띄운다.
   어느 막대에서 왔는지 남색 테두리로 표시한다.
--------------------------------------------------------------------- */
// 좌측 세로축(필터~W/T 0)과 원인 분석 카드의 높이를 맞춘다.
// 우측 열 높이와는 무관하게 둔다.
function syncLeftHeight() {
  const sm = document.querySelector(".summary");
  const lc = document.querySelector(".rowcards > .leftcol");
  if (!sm || !lc) { return; }
  const h = sm.offsetHeight;
  if (h > 0 && lc.style.height !== h + "px") {
    lc.style.height = h + "px";
    resizeCharts();
  }
}

/* 라인 요약 카드 --------------------------------------------------------
   매수가 많이 쌓인 곳을 순서대로 놓고, 그것이 만든 W/T 저해를 잇는다.
   카드를 누르면 그 원인으로 화면 전체가 좁혀진다.
--------------------------------------------------------------------- */
function renderInsight() {
  const box = document.getElementById("insight");
  const cards = (DATA && DATA.insights) || [];
  const any = cards.some(c => (c.rank || []).length);
  if (!any) { box.style.display = "none"; return; }
  box.style.display = "";

  document.getElementById("insSub").textContent =
    `비율은 라인 전체 재공 ${nf((DATA.total || {}).qty || 0)}매 대비`;

  document.getElementById("insBody").innerHTML = cards.map((c, ci) => {
    if (!(c.rank || []).length) { return ""; }
    const rows = c.rank.map((x, n) => {
      // 경로: 첫 칸은 굵게, 나머지는 > 로 잇는다
      const p = x.path.map((v, k) => k === 0
        ? `<b>${v}</b>` : `<span>${v}</span>`).join(`<i>&gt;</i>`);
      // 호환 그룹에서 막힌 설비가 있으면 그 때문에 neck 이 된 것이다.
      const bl = x.blocked
        ? `<span class="insbl" title="호환 그룹의 이 설비가 막혀 있다">`
          + `막힘 ${x.blocked.map(z => z.name).join(", ")}</span>`
        : (c.key === "neck" ? `<span class="insbl ok">순수 몰림</span>` : "");
      const idle = (x.idle_avg !== null && x.idle_avg !== undefined)
        ? ` · 평균 ${x.idle_avg}일` : "";
      const tip = x.path.join(" > ")
        + `  ${nf(x.qty)}매 (${x.pct}%)`
        + `  W/T0 ${nf(x.wt0_qty)}`
        + (x.idle_avg !== null && x.idle_avg !== undefined
           ? `  평균 ${x.idle_avg}일 정체` : "")
        + (x.blocked ? `  막힘 ${x.blocked.map(z => z.name).join(", ")}` : "");
      return `<div class="insline" title="${tip}" onclick="insPick(${ci},${n})">`
        + `<span class="insno">${n + 1}</span>`
        + `<span class="inspath">${p}</span>${bl}`
        + `<span class="insqty">${nf(x.qty)}<em>매</em></span>`
        + `<span class="inspc">${x.pct}%</span>`
        + `<span class="inswt">W/T0 ${kfmt(x.wt0_qty)}${idle}</span></div>`;
    }).join("");
    return `<div class="inscard"><div class="insh">${c.title}`
      + `<span>${nf(c.qty)}매</span></div>${rows}</div>`;
  }).join("");
}

// 카드를 누르면 그 원인으로 화면 전체를 좁힌다.
function insPick(ci, n) {
  const c = (DATA.insights || [])[ci];
  const x = c && (c.rank || [])[n];
  if (!x) { return; }
  dfReset();
  const p = x.path.slice();
  const head = p.shift();

  // 요약카드 전용 조건. 최상단 필터를 건드리면 요약카드 자체가 바뀐다.
  DF_X = {};
  if (c.key === "lot") {
    // [제품, (모듈), LAYER]
    if (p[0]) { DF_X.x_prod = [p[0]]; }
    if (p.length === 3) { DF_X.x_mod = [p[1]]; }
    if (p.length >= 2) {
      setCond("layer", p[p.length - 1], null, null, false, "insight");
    }
  } else {
    // [AREA, 설비]
    if (p[0]) { DF_X.x_area = [p[0]]; }
    if (p[1]) { DF_X.x_eqp = [p[1]]; }
  }

  // 원인도 함께 건다. 카드 머리가 곧 원인이다.
  const CAUSE_OF = {
    "HOLD": ["Hold", null],
    "예약제외": ["Wait성 진행불가", "예약제외"],
    "FTP": ["Wait성 진행불가", "FTP"],
    "PREVENT": ["Wait성 진행불가", "TIP"],
    "B/N": ["Bottleneck", null],
  };
  const cz = CAUSE_OF[head] || ["Wait성 진행불가", "설비이슈"];
  const i = (DATA.causes || []).findIndex(g => g.name === cz[0]);
  DF_CAUSE = { i: i < 0 ? 0 : i,
               or: [{ big: cz[0], mid: cz[1], sub: null }] };
  syncFromDF();
}

/* 레이아웃 진단 --------------------------------------------------------
   화면 오른쪽을 넘는 요소를 재서 서버 로그로 보낸다.
   콘솔 복사가 어려울 때 터미널에서 바로 확인한다.
   호출: 주소창에 ?debug=layout 을 붙이거나 콘솔에서 checkLayout()
----------------------------------------------------------------------- */
function selOf(el) {
  if (!el || el === document.documentElement) { return "html"; }
  let t = el.tagName.toLowerCase();
  if (el.id) { t += "#" + el.id; }
  else if (el.className && typeof el.className === "string") {
    const c = el.className.trim().split(/\s+/)[0];
    if (c) { t += "." + c; }
  }
  return t;
}

function checkLayout() {
  const vw = document.documentElement.clientWidth;
  const items = [];
  document.querySelectorAll("body *").forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) { return; }
    const over = Math.round(r.right - vw);
    if (over > 1) {
      items.push({ over: over, sel: selOf(el),
                   w: Math.round(r.width),
                   parent: selOf(el.parentElement) });
    }
  });
  // 바깥쪽(폭이 큰 것)부터 본다. 대개 첫 줄이 원인이다.
  items.sort((a, b) => b.w - a.w);
  fetch("/api/debug-layout/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ vw: vw,
                           sw: document.documentElement.scrollWidth,
                           items: items })
  });
  return items.length + "개 초과. 서버 터미널을 확인하세요.";
}

/* 선택 테두리와 내용이 겹치는지 잰다.
   콘솔에서 checkOverlap() 을 부르면 서버 터미널에 찍힌다.
--------------------------------------------------------------------- */
function checkOverlap() {
  const items = [];
  document.querySelectorAll(".czcol").forEach((col, n) => {
    const cs = getComputedStyle(col);
    const box = col.getBoundingClientRect();
    const on = col.classList.contains("czsrc");
    items.push({
      sel: `czcol#${n}${on ? " (선택됨)" : ""}`,
      note: `padding=${cs.paddingTop}/${cs.paddingRight}/`
        + `${cs.paddingBottom}/${cs.paddingLeft}`
        + ` box-shadow=${cs.boxShadow !== "none" ? "있음" : "없음"}`
        + ` w=${Math.round(box.width)} h=${Math.round(box.height)}`
    });
    // 자식이 테두리(안쪽 2px)를 침범하는지
    [...col.children].forEach((ch, k) => {
      const r = ch.getBoundingClientRect();
      const L = Math.round(r.left - box.left);
      const R = Math.round(box.right - r.right);
      const T = Math.round(r.top - box.top);
      const B = Math.round(box.bottom - r.bottom);
      const bad = [];
      if (L < 3) { bad.push("좌" + L); }
      if (R < 3) { bad.push("우" + R); }
      if (T < 3) { bad.push("상" + T); }
      if (B < 3) { bad.push("하" + B); }
      items.push({
        sel: `  └ ${ch.tagName.toLowerCase()}`
          + (ch.className ? "." + String(ch.className).split(" ")[0] : ""),
        note: `여백 상${T} 우${R} 하${B} 좌${L}`
          + (bad.length ? "   !! 테두리와 겹침(" + bad.join(",") + ")" : "")
      });
    });
  });
  // 좌측 세로축과 원인 분석 카드의 아래선이 맞는지도 함께 잰다.
  const sm = document.querySelector(".summary");
  const lc = document.querySelector(".rowcards > .leftcol");
  const cz = document.getElementById("czcard");
  if (sm && lc && cz) {
    const a = sm.getBoundingClientRect();
    const b = lc.getBoundingClientRect();
    const c = cz.getBoundingClientRect();
    items.push({ sel: "── 높이 정렬 ──", note: "" });
    items.push({ sel: "summary(좌측 전체)",
                 note: `top=${Math.round(a.top)} bottom=${Math.round(a.bottom)}`
                   + ` h=${Math.round(a.height)}` });
    items.push({ sel: "leftcol(원인 분석 열)",
                 note: `top=${Math.round(b.top)} bottom=${Math.round(b.bottom)}`
                   + ` h=${Math.round(b.height)}` });
    items.push({ sel: "czcard(원인 분석 카드)",
                 note: `top=${Math.round(c.top)} bottom=${Math.round(c.bottom)}`
                   + ` h=${Math.round(c.height)}` });
    // summary 는 마지막 카드에 margin-bottom 이 있어 컨테이너 bottom 과
    // 눈에 보이는 카드 아래선이 다르다. 마지막 카드를 직접 잰다.
    const lastL = sm.querySelector(".cell:last-of-type");
    if (lastL) {
      const d = lastL.getBoundingClientRect();
      const ms = getComputedStyle(lastL).marginBottom;
      items.push({ sel: "  좌측 마지막 카드",
                   note: `bottom=${Math.round(d.bottom)} margin-bottom=${ms}` });
      items.push({ sel: "  눈에 보이는 차이",
                   note: `${Math.round(c.bottom - d.bottom)}px` });
    }
    const gap = Math.round(c.bottom - a.bottom);
    items.push({ sel: "아래선 차이",
                 note: `${gap}px  `
                   + (Math.abs(gap) <= 2 ? "맞음"
                      : (gap > 0 ? "원인 분석이 더 아래로 내려감"
                                 : "원인 분석이 더 짧음")) });
    // 내부 차트 높이
    document.querySelectorAll(".cz3 > .czcol").forEach((el, k) => {
      const r = el.getBoundingClientRect();
      items.push({ sel: `  cz3 칸 ${k}`, note: `h=${Math.round(r.height)}` });
    });
  }

  fetch("/api/debug-layout/", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ kind: "overlap", items: items })
  });
  return "서버 터미널을 확인하세요.";
}

// 표가 어느 뷰에서 나왔는지. 다른 뷰를 누르면 이전 선택 표시를 지운다.
let DRILL_SRC = "";

function clearOtherSelections(src) {
  if (DRILL_SRC === src) { return; }
  if (!src) { DRILL_SRC = ""; return; }
  // 표시는 syncFromDF 가 맞춘다. 여기서는 출처만 기록한다.
  DRILL_SRC = src;
}

// 표 안에서 필터를 걸 컬럼
const FILTER_COLS = ["line", "전산라인", "dest_line_id", "fa_object4",
  "prod1", "prod2", "lot_id", "lot_type", "wt", "lot_status", "proc_id",
  "module1", "module2", "layer_id", "AREA", "step_seq", "step_desc",
  "eqpgroup", "eqpgroup_cham", "recipe_id", "cause"];

function drillSort(k) {
  const i = SORT_KEYS.findIndex(x => x.k === k);
  if (i < 0) { SORT_KEYS.push({ k: k, dir: 1 }); }
  else if (SORT_KEYS[i].dir === 1) { SORT_KEYS[i].dir = -1; }
  else { SORT_KEYS.splice(i, 1); }
  renderDrillTable();
}

function wtKey(v) {
  const n = Number(v);
  if (!isFinite(n) || n <= 0) { return "0"; }
  if (n <= 1) { return "0-1"; }
  if (n <= 2) { return "1-2"; }
  if (n <= 3) { return "2-3"; }
  if (n <= 4) { return "3-4"; }
  if (n <= 5) { return "4-5"; }
  return "5+";
}
const WT_LABEL = { "0": "WT = 0", "0-1": "0 < WT ≤ 1", "1-2": "1 < WT ≤ 2",
  "2-3": "2 < WT ≤ 3", "3-4": "3 < WT ≤ 4", "4-5": "4 < WT ≤ 5", "5+": "WT > 5" };

function passFilter(r) {
  for (const k in DFILT) {
    const set = DFILT[k];
    if (!set || !set.size) { continue; }
    const v = (r[k] === null || r[k] === undefined || r[k] === "")
      ? "(없음)" : String(r[k]);
    if (!set.has(v)) { return false; }
  }
  if (DFILT_WT && DFILT_WT.size && !DFILT_WT.has(wtKey(r.wt))) { return false; }
  return true;
}

function filteredRows() {
  if (FCACHE) { return FCACHE; }
  const rows = (DRILL_DATA && DRILL_DATA.rows) ? DRILL_DATA.rows : [];
  let need = !!(DFILT_WT && DFILT_WT.size);
  for (const k in DFILT) { if (DFILT[k] && DFILT[k].size) { need = true; break; } }
  FCACHE = need ? rows.filter(passFilter) : rows.slice();
  return FCACHE;
}

function sortedRows() {
  const rows = filteredRows();          // 캐시된 배열을 그대로 정렬한다
  if (!SORT_KEYS.length) { return rows; }
  const num = (v) => { const n = parseFloat(v); return isNaN(n) ? null : n; };
  rows.sort((a, b) => {
    for (const s of SORT_KEYS) {
      let x = a[s.k], y = b[s.k];
      if (x === undefined || x === null || x === "") { x = null; }
      if (y === undefined || y === null || y === "") { y = null; }
      if (x === null && y === null) { continue; }
      if (x === null) { return 1; }
      if (y === null) { return -1; }
      const nx = num(x), ny = num(y);
      let c;
      if (nx !== null && ny !== null) { c = nx - ny; }
      else { c = String(x).localeCompare(String(y), "ko"); }
      if (c) { return c * s.dir; }
    }
    return 0;
  });
  return rows;
}

/* 컬럼 표시/숨김 ------------------------------------------------------- */

function dfSearch(k) {

    const v = (el.getAttribute("data-opt") || "").toLowerCase();

function dfPick(ev, k, idx) {
  const box = document.getElementById("dfm_" + k);
  const boxes = [...box.querySelectorAll("input[data-opt-i]")];
  if (ev.shiftKey && dfLast[k] !== undefined) {      // shift 범위 선택
    const a = Math.min(dfLast[k], idx), b = Math.max(dfLast[k], idx);
    for (let i = a; i <= b; i++) { boxes[i].checked = ev.target.checked; }
  }
  dfLast[k] = idx;
  const sel = new Set(boxes.filter(x => x.checked).map(x => x.value));
  const target = (k === "wt") ? "wt" : k;
  if (sel.size === boxes.length) {                   // 전부 = 필터 없음
    if (target === "wt") { DFILT_WT = null; } else { delete DFILT[k]; }
  } else if (target === "wt") { DFILT_WT = sel; } else { DFILT[k] = sel; }
  const all = document.querySelector("#dfm_" + k + " input[data-all]");
  if (all) { all.checked = (sel.size === boxes.length); }
  dfLabel(k, sel.size, boxes.length);
  FCACHE = null;                        // 필터가 바뀌었으니 다시 거른다
  renderDrillTable();
}

function dfLabel(k, n, total) {
  const b = document.getElementById("dfb_" + k);
  if (!b) { return; }
  const t = (DRILL_DATA.cols.find(c => c.k === k) || {}).t || k;
  const all = (n === total);
  b.innerHTML = `<span>${t}${all ? "" : " " + n}</span><span>&#9662;</span>`;
  b.classList.toggle("on", !all);
}

function dfOptions(k) {
  const rows = (DRILL_DATA && DRILL_DATA.rows) ? DRILL_DATA.rows : [];
  if (k === "wt") { return Object.keys(WT_LABEL); }
  const set = new Set();
  for (const r of rows) {
    const v = (r[k] === null || r[k] === undefined || r[k] === "")
      ? "(없음)" : String(r[k]);
    set.add(v);
  }
  // 업무 순서가 있는 컬럼은 그 순서를 먼저 쓴다(lot_type, PLAN).
  const pri = ((DRILL_DATA && DRILL_DATA.order) || {})[k] || [];
  const at = (v) => {
    const i = pri.indexOf(v);
    return i < 0 ? pri.length : i;
  };
  return [...set].sort((a, b) =>
    (at(a) - at(b)) || a.localeCompare(b, "ko"));
}

// 보이는 컬럼과 필터·정렬이 적용된 그대로 탭 구분으로 복사한다.
function copyDrill() {
  if (!DRILL_DATA) { return; }
  const cols = drillCols().filter(c => !HIDE_COLS[c.k]);
  const rows = sortedRows();
  const line = (r) => cols.map(c => {
    const v = r[c.k];
    if (v === null || v === undefined) { return ""; }
    return c.k === "wt" ? Number(v).toFixed(1) : String(v);
  }).join("\t");
  const text = [cols.map(c => c.t).join("\t")]
    .concat(rows.map(line)).join("\n");

  const done = () => {
    const el = document.getElementById("drillCount");
    if (!el) { return; }
    const keep = el.textContent;
    el.textContent = nf(rows.length) + "행 복사됨";
    setTimeout(() => { el.textContent = keep; }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else { fallbackCopy(text, done); }
}

function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { /* 무시 */ }
  document.body.removeChild(ta);
}

function dfAll(ev, k) {

/* 연속공정 스텝 펼치기 --------------------------------------------------
   표의 재공 수는 lot 단위 집계라, 여기서 행을 늘려도 카운트는 그대로다.
----------------------------------------------------------------------- */
const STEP_CACHE = {};

function toggleSteps(ev, lot) {
  ev.stopPropagation();
  const btn = ev.target;
  const tr = btn.closest("tr");
  const open = tr.nextElementSibling
    && tr.nextElementSibling.classList.contains("steprow");

  // 이미 펼쳐져 있으면 접는다
  let n = tr.nextElementSibling;
  while (n && n.classList.contains("steprow")) {
    const x = n; n = n.nextElementSibling; x.remove();
  }
  if (open) { btn.textContent = "+"; return; }

  btn.textContent = "−";
  const draw = (rows) => {
    if (!rows.length) { btn.textContent = "+"; return; }
    const cols = drillCols().filter(c => !HIDE_COLS[c.k]);
    const keys = cols.map(c => c.k);
    const frag = [];
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      frag.push('<tr class="steprow"><td class="expcol"></td>');
      for (let j = 0; j < keys.length; j++) {
        const raw = r[keys[j]];
        frag.push("<td>");
        frag.push((raw === null || raw === undefined || keys[j] === "wt")
                  ? "" : raw);
        frag.push("</td>");
      }
      frag.push("</tr>");
    }
    tr.insertAdjacentHTML("afterend", frag.join(""));
  };

  if (STEP_CACHE[lot]) { draw(STEP_CACHE[lot]); return; }
  btn.textContent = "…";
  fetch("/api/lot-steps/?line=" + encodeURIComponent(LINE)
        + "&lot_id=" + encodeURIComponent(lot))
    .then(r => r.json()).then(d => {
      // 현스텝은 위에 이미 있으니 후속 스텝만 남긴다.
      STEP_CACHE[lot] = (d.rows || []).filter(r => !r["현스텝"]);
      btn.textContent = "−";
      draw(STEP_CACHE[lot]);
    })
    .catch(() => { btn.textContent = "+"; });
}

/* 컬럼 드래그 정렬 ------------------------------------------------------ */
let dragKey = null;

function colDragStart(ev, k) {
  dragKey = k;
  ev.dataTransfer.effectAllowed = "move";
  try { ev.dataTransfer.setData("text/plain", k); } catch (e) { /* 무시 */ }
  ev.target.classList.add("dragging");
}
function colDragOver(ev) {
  ev.preventDefault();
  ev.dataTransfer.dropEffect = "move";
  autoScroll(ev.clientX);           // 가장자리에 오면 표를 밀어준다
}

// 드래그 중에는 브라우저가 스크롤을 안 해준다. 직접 민다.
let scrollTimer = null;
function autoScroll(x) {
  const box = document.getElementById("drillBody");
  if (!box) { return; }
  const r = box.getBoundingClientRect();
  const EDGE = 60;                  // 가장자리 감지 폭
  let dx = 0;
  if (x < r.left + EDGE) { dx = -Math.max(8, (r.left + EDGE - x) / 2); }
  else if (x > r.right - EDGE) { dx = Math.max(8, (x - (r.right - EDGE)) / 2); }

  if (!dx) { stopScroll(); return; }
  if (scrollTimer) { return; }
  scrollTimer = setInterval(() => { box.scrollLeft += dx; }, 16);
}
function stopScroll() {
  if (scrollTimer) { clearInterval(scrollTimer); scrollTimer = null; }
}
function colDragEnd(ev) {
  stopScroll();
  dragKey = null;
  document.querySelectorAll("th.dragging").forEach(x =>
    x.classList.remove("dragging"));
}
function colDrop(ev, target) {
  ev.preventDefault();
  ev.stopPropagation();
  stopScroll();                       // 드롭으로 정렬이 걸리지 않게
  if (!dragKey || dragKey === target) { return; }
  const order = drillCols().map(c => c.k);
  const from = order.indexOf(dragKey);
  const to = order.indexOf(target);
  if (from < 0 || to < 0) { return; }
  order.splice(to, 0, order.splice(from, 1)[0]);
  COL_ORDER = order;
  dragKey = null;
  renderDrillHead();
  renderDrillTable();
}

function renderDrillSorts() {
  const box = document.getElementById("drillSorts");
  if (!box) { return; }
  const cols = allCols();
  const name = (k) => (cols.find(c => c.k === k) || {}).t || k;
  box.innerHTML = `<button class="dfclear" onclick="sortClearAll()">정렬 해제</button>`
    + (SORT_KEYS.length
       ? SORT_KEYS.map((s, i) =>
           `<button class="sortchip" onclick="drillSort('${s.k}')">`
           + `<b>${i + 1}</b> ${name(s.k)} ${s.dir === 1 ? "▲" : "▼"}</button>`).join("")
       : `<span class="minittl">컬럼명을 눌러 정렬</span>`);
}

function sortClearAll() { SORT_KEYS = []; renderDrillTable(); }

function renderDrillTable() {
  const d = DRILL_DATA;
  if (!d) { return; }
  const cols = drillCols().filter(c => !HIDE_COLS[c.k]);
  const rows = sortedRows();

  const head = `<th class="expcol"></th>` + cols.map(c => {
    const i = SORT_KEYS.findIndex(x => x.k === c.k);
    const mark = i < 0 ? ""
      : `<sup class="so">${i + 1}${SORT_KEYS[i].dir === 1 ? "▲" : "▼"}</sup>`;
    return `<th class="${NUM_COLS.has(c.k) ? "num " : ""}sortable" draggable="true"`
         + ` data-k="${c.k}" onclick="drillSort('${c.k}')"`
         + ` ondragstart="colDragStart(event,'${c.k}')"`
         + ` ondragover="colDragOver(event)"`
         + ` ondrop="colDrop(event,'${c.k}')"`
         + ` ondragend="colDragEnd(event)">${c.t}${mark}</th>`;
  }).join("");

  // 셀마다 <span class="c"> 를 넣으면 DOM 노드가 두 배가 되어 느려진다.
  // 가로 스크롤이 필요한 긴 값에만 span 을 쓴다.
  const LONG = 14;
  const keys = cols.map(c => c.k);
  const isNum = cols.map(c => NUM_COLS.has(c.k));
  const isWt = cols.map(c => c.k === "wt");
  const isSt = cols.map(c => c.k === "lot_status");
  const SC = d.status_colors || {};
  const nc = cols.length;

  const buf = [];
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const lot = r.lot_id;
    const many = (r._steps || 1) > 1;
    buf.push('<tr data-lot="' + lot + '">');
    buf.push('<td class="expcol">');
    if (many) {
      buf.push('<span class="expbtn" onclick="toggleSteps(event,\'' + lot
               + '\')">+</span>');
    }
    buf.push("</td>");
    for (let j = 0; j < nc; j++) {
      const raw = r[keys[j]];
      let v = (raw === null || raw === undefined) ? ""
        : (isWt[j] ? Number(raw).toFixed(1) : String(raw));
      // 상태 셀은 좌측 원차트와 같은 색을 배경으로 쓴다.
      const bg = isSt[j] && SC[v] ? ' style="background:' + SC[v] + '33"' : "";
      if (v.length > LONG) {
        buf.push(isNum[j] ? '<td class="num"' + bg + '><span class="c">'
                          : "<td" + bg + '><span class="c">');
        buf.push(v);
        buf.push("</span></td>");
      } else {
        buf.push(isNum[j] ? '<td class="num"' + bg + ">" : "<td" + bg + ">");
        buf.push(v);
        buf.push("</td>");
      }
    }
    buf.push("</tr>");
  }

  const cnt = document.getElementById("drillCount");
  if (cnt) {
    cnt.textContent = nf(rows.length) + " / " + nf((d.rows || []).length) + " 행";
  }
  renderDrillSorts();
  const body = document.getElementById("drillBody");
  const keepTop = body.scrollTop, keepLeft = body.scrollLeft;
  body.innerHTML =
    `<table class="grid"><thead><tr>${head}</tr></thead><tbody>`
    + (buf.length ? buf.join("")
       : `<tr><td colspan="${cols.length + 1}" style="color:#6B7280">`
         + `해당 조건의 LOT 이 없습니다.</td></tr>`)
    + `</tbody></table>`;
  body.scrollTop = keepTop;          // 다시 그려도 보던 위치를 지킨다
  body.scrollLeft = keepLeft;
}

const SRC_TITLE = {
  multi: "LOT 상세",
  balance: "LOT BALANCE 상세",
  cause: "원인 분석 상세", wt: "W/T 분포 상세", wt0: "W/T 0 재공 상세",
  type: "재공 lot_type 상세", status: "status 상세",
};

// 드릴다운 소제목.
//   'LOT 상세 > KFR4' 까지는 위치를 좁히는 것이라 '>' 가 맞다.
//   그 뒤 조건들은 서로 다른 축이라 '·' 로 잇는다(dfTitle 규칙).
function drillTitle(src, label) {
  const head = [SRC_TITLE[src] || "LOT 상세", LINE]
    .filter(Boolean).join(" > ");
  return (label ? head + "  ·  " + label : head)
    .replace(/[a-z]+/g, (m) => m.toUpperCase());
}

let LAST_DRILL = null;
let DRILL_ABORT = null;      // 이전 표 조회를 끊는다

function reopenDrill() {
  if (LAST_DRILL) { openDrill(LAST_DRILL.f, LAST_DRILL.l, LAST_DRILL.s, true); }
}

function openDrill(filt, label, src, keepView) {
  LAST_DRILL = { f: filt, l: label, s: src };
  clearOtherSelections(src || "");
  // W/T 0 조건이 걸려 있는 동안 계속 보인다(조건 저장소 기준).
  // 드릴다운이 열리면 LOT BALANCE 도. balance 자체에서 다시 부르지는 않는다.
  if (src !== "balance") {
    BAL_LABEL = label || ""; BAL_SRC = src || "";
    loadBalance(true);
  }
  const el = document.getElementById("drill");
  // 곧바로 자리표시자를 그려 '눌리지 않은 것처럼' 보이지 않게 한다.
  el.classList.add("loading");
  el.innerHTML = `<div class="cellttl"><span>${drillTitle(src, label)}</span></div>`
    + `<div class="bar"><b>불러오는 중…</b><span class="spin"></span></div>`;
  const base = { line: LINE, types: selectedTypes().join(","),
                 prod1: PROD1.join(","), prod2: PROD2.join(","),
                 area: AREAS.join(","),
                 biz_date: SNAP_DATE, shift: SNAP_SHIFT,
                 src: src || "",
                 cols: keepView ? visibleKeys().join(",") : "" };
  const q = Object.entries(Object.assign(base, filt || {}))
    .filter(([, v]) => v !== undefined && v !== null && v !== "")
    .map(([k, v]) => k + "=" + encodeURIComponent(v)).join("&");

  if (DRILL_ABORT) { DRILL_ABORT.abort(); }
  DRILL_ABORT = new AbortController();
  fetch("/api/lots-live/?" + q, { signal: DRILL_ABORT.signal })
    .then(r => r.json()).then(d => {
    el.classList.remove("loading");
    DRILL_DATA = d;
    SORT_KEYS = [];                       // 새 조건이면 정렬/필터 초기화
    HIDE_COLS = {}; DFILT = {}; DFILT_WT = null; dfLast = {}; FCACHE = null;
    el.innerHTML = `<div class="cellttl"><span>${drillTitle(src, label)}</span></div>
      <div class="bar">
        <div><b>${nf(d.lots || (d.rows || []).length)} LOT</b>
          <b style="margin-left:8px">${nf(d.qty || 0)} 매</b>
          <span class="path" id="drillCount"></span>
          <span class="path">컬럼명을 누르면 정렬 (1회 오름 · 2회 내림 · 3회 해제)
            · 컬럼명을 끌어 순서를 바꿀 수 있습니다</span>
        </div>
        <span style="margin-left:auto;display:flex;gap:6px">
          <button onclick="copyDrill()">복사하기</button>
          <button onclick="dfClearAllConds()">닫기</button></span></div>
      <div class="dtools">
        <div class="drow" id="condrow"><span class="minittl">조건</span>
          <div class="dfs" id="drillConds"></div></div>
        <div class="drow"><span class="minittl">컬럼</span>
          <div class="chips" id="drillCols"></div></div>
        <div class="drow"><span class="minittl">필터</span>
          <div class="dfs" id="drillFilters"></div></div>
        <div class="drow"><span class="minittl">정렬</span>
          <div class="dfs" id="drillSorts"></div></div>
      </div>
      <div class="gridwrap" id="drillBody"></div>`;
    renderDrillHead();
    renderDrillTable();
    renderConds();
    resizeCharts();
  }).catch(e => { if (e.name !== "AbortError") { throw e; } });
}

/* --- 로딩 --- */
let SUM_SEQ = 0;          // 늦게 온 응답이 최신을 덮지 않게

function loadSummary(keepFocus) {
  // 라인/lot_type/제품구분이 바뀌면 지금 표는 다른 조건의 결과다.
  // keepFocus 는 좌측 막대를 눌러 원인 분석만 좁히는 경우라 선택을 유지한다.
  if (!keepFocus) {
    // 레벨 1(날짜/SHIFT/라인/제품구분/lot_type) 이 바뀌면 아래는 전부 리셋
    dfReset();
    dfResetBelow(1);
    CZ_SEL = { i: -1, path: [] };
    DRILL_KEY = { i: -1, node: null, list: [] };
    closeDrill();
  }

  const seq = ++SUM_SEQ;
  fetch("/api/summary/?line=" + encodeURIComponent(LINE)
        + "&types=" + encodeURIComponent(selectedTypes().join(","))
        + "&prod1=" + encodeURIComponent(PROD1.join(","))
        + "&prod2=" + encodeURIComponent(PROD2.join(","))
        + "&area=" + encodeURIComponent(AREAS.join(","))
        // 같은 필드를 여러 개 고를 수 있다. 조건 저장소를 그대로 보낸다.
        + "&x_prod=" + encodeURIComponent((DF_X.x_prod || []).join(","))
        + "&x_mod=" + encodeURIComponent((DF_X.x_mod || []).join(","))
        + "&x_area=" + encodeURIComponent((DF_X.x_area || []).join(","))
        + "&x_eqp=" + encodeURIComponent((DF_X.x_eqp || []).join(","))
        + "&f_status=" + encodeURIComponent((DF.status || []).join(","))
        + "&f_wt=" + encodeURIComponent((DF.wt || []).join(","))
        + "&f_wt0=" + encodeURIComponent((DF.wt0 || []).join(","))
        + "&f_type=" + encodeURIComponent((DF.type || []).join(","))
        + "&f_area=" + encodeURIComponent((DF.iarea || []).join(","))
        // 원인 / LAYER 도 좌측 차트에 그대로 반영한다.
        + "&layer_id=" + encodeURIComponent((DF.layer || []).join(","))
        + "&causes=" + encodeURIComponent(dfFilter().causes || "")
        + "&big=" + encodeURIComponent(dfFilter().big || "")
        + "&mid=" + encodeURIComponent(dfFilter().mid || "")
        + "&sub=" + encodeURIComponent(dfFilter().sub || "")
        + "&biz_date=" + encodeURIComponent(SNAP_DATE)
        + "&shift=" + encodeURIComponent(SNAP_SHIFT))
    .then(r => r.ok ? r.json() : Promise.reject("HTTP " + r.status))
    .then(d => {
      if (seq !== SUM_SEQ) { return; }     // 더 최신 요청이 있다
      const err = document.getElementById("err");
      if (!d.ready) {
        err.textContent = d.reason || "데이터 없음";
        if (d.snapshots) { renderSnap(d); }
        if (d.prod1_options) { renderProd(d); }   // 필터는 되돌릴 수 있어야 한다
        return;
      }
      err.textContent = "";
      DATA = d;
      if (!keepFocus) { CZ_SEL = { i: -1, path: [] }; }
      document.getElementById("snapAt").textContent = d.snapshot_at || "-";
      renderSnap(d);
      renderProd(d);
      renderWip(); renderStatus(); renderWt(); renderWt0(); renderArea();
      renderCause();
      renderInsight();
      requestAnimationFrame(syncLeftHeight);
      if (location.search.indexOf("debug=layout") >= 0) {
        setTimeout(checkLayout, 800);      // 차트가 그려진 뒤에 잰다
      }
      if (location.search.indexOf("debug=overlap") >= 0) {
        setTimeout(checkOverlap, 800);
      }
    })
    .catch(e => { document.getElementById("err").textContent = "조회 실패: " + e; });
}
