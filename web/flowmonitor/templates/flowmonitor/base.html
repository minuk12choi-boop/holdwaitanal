{% load static %}<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title|default:"Multi Line Fab Monitor" }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Sans+KR:wght@500;600;700&family=Poppins:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bd:#E5E7EB; --fg:#111827; --mut:#6B7280;
    --brand:#2F4B7C; --brand-on:#4C7DD1; --accent:#6A5ACD;
  /* 제목 위계: h1 > .cellttl(--accent) > .subttl(--accent-2) > .minittl */
  --accent-2:#9B93DB;
    /* 라틴 폰트를 먼저 두면 영문에만 적용되고 한글은 뒤 폰트로 넘어간다 */
    --f-body:"Poppins","Noto Sans KR","Malgun Gothic",sans-serif;
    --f-title:"Plus Jakarta Sans","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  }
  html { scroll-behavior:smooth; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--f-body); color:var(--fg); font-size:14px; }
  h1, h2, .brand, .card .head, .cellttl, .subttl, .minittl, .lbl {
    font-family:var(--f-title); }

  /* 스크롤을 내려도 메뉴가 항상 보이도록 고정한다. */
  header { position:sticky; top:0; z-index:60; background:#fff;
           border-bottom:1px solid var(--bd); padding:0 18px; display:flex;
           align-items:center; height:52px; gap:26px; }
  header .brand { font-weight:700; letter-spacing:-.02em; }
  header nav a { color:var(--mut); text-decoration:none; margin-right:18px;
                 font-size:14px; padding:6px 0; }
  header nav a.on { color:var(--fg); border-bottom:2px solid var(--fg); }
  header .meta { margin-left:auto; font-size:12px; color:var(--mut);
                 white-space:nowrap; }
  header .meta b { color:var(--fg); font-weight:600; }

  /* 상단 현황 */
  .status { display:grid; grid-template-columns:repeat(4,1fr);
            border-bottom:1px solid var(--bd); }
  .card { border-right:1px solid var(--bd); position:relative; }
  .card:last-child { border-right:0; }
  .card .head { color:#fff; text-align:center; font-weight:700; padding:9px 0;
                font-size:16px; cursor:pointer; background:var(--brand);
                transition:background .15s; }
  .card.on .head { background:var(--brand-on); }
  .card.on { box-shadow:inset 0 0 0 2px var(--brand-on); }
  .card .cell { border-top:1px solid var(--bd); padding:11px 12px; }
  /* 카드 소제목 아래 단계. 같은 계열이되 한 톤 옅게 해 위계를 구분한다. */
  .subttl { font-size:12px; font-weight:700; color:var(--accent-2);
            display:flex; justify-content:space-between; align-items:baseline;
            gap:6px; border-bottom:1px solid var(--bd);
            padding-bottom:3px; margin-bottom:4px; }
  .subttl .v { color:var(--mut); font-weight:400; font-size:11px; }
  .minittl { font-size:11px; font-weight:600; color:var(--mut); }

  .cellttl { font-size:14px; font-weight:700; color:var(--accent);
             margin-bottom:9px; display:flex; justify-content:space-between;
             align-items:center; gap:6px; }
  .lbl { font-size:13px; font-weight:700; color:var(--fg); }

  /* 재공 */
  .wip .top { display:flex; align-items:flex-end; justify-content:space-between;
              gap:8px; margin-bottom:8px; }
  .wip .nums { display:flex; gap:14px; flex:0 0 auto; }
  .wip b { display:block; font-size:19px; line-height:1.1; font-weight:600; }
  .wip .nums .lbl { font-size:10px; white-space:nowrap; }
  /* 버튼이 줄바꿈되지 않게. 숫자를 줄여 자리를 내준다. */
  .wip .top > div:last-child { flex:0 0 auto; }
  .wip .top .rankbtn, .wip .top .dd > button { white-space:nowrap;
                                               font-size:10px;
                                               padding:2px 7px; }
  /* 제품 필터 다섯 개만 격자로 접는다(날짜 · SHIFT · 라인 줄은 그대로).
     좌측 칸 폭(380px)은 유지하고 3 x 2 로 놓아 칸마다 폭을 고르게 한다. */
  .prodf.pgrid { display:grid; grid-template-columns:repeat(3, 1fr);
                 gap:4px; }
  .prodf.pgrid > .dd { min-width:0; }
  .prodf.pgrid > .dd > button {
      width:100%; font-size:10px; padding:2px 4px; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis;
      justify-content:space-between; }
  .prodf.pgrid > .dd > button > span:first-child {
      overflow:hidden; text-overflow:ellipsis; }
  /* 선택지가 많으면 메뉴 안에서 굴린다. */
  .dd .menu { max-height:300px; overflow-y:auto; }
  .wip .stack { display:flex; height:10px; border-radius:5px; overflow:hidden;
                background:#F3F4F6; }
  .wip .stack i { display:block; height:100%; }
  .wip .stleg { display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:5px; }
  .wip .stleg span { font-size:11px; color:var(--mut);
                     display:inline-flex; align-items:center; gap:4px; }
  .wip .stleg i { width:8px; height:8px; border-radius:2px; }

  /* 체크박스 드롭다운 */
  .dd { position:relative; }
  .dd > button { font-size:11px; padding:4px 8px; border:1px solid var(--bd);
                 border-radius:4px; background:#fff; cursor:pointer; }
  /* 열린 메뉴는 표의 sticky 헤더(z 20~30) 보다 위에 와야 가리지 않는다. */
  .dd.open { position:relative; z-index:80; }
  .dd .menu { display:none; position:absolute; right:0; top:26px; z-index:80;
              background:#fff; border:1px solid var(--bd); border-radius:5px;
              box-shadow:0 4px 14px rgba(0,0,0,.10); padding:6px; min-width:118px; }
  .dd.open .menu { display:block; }
  .dd .menu label { display:flex; align-items:center; gap:6px; font-size:12px;
                    padding:3px 4px; cursor:pointer; white-space:nowrap; }
  .dd .menu label:hover { background:#F3F4F6; border-radius:3px; }

  /* 상태 원차트 */
  /* 화면 최상단에 뜨는 툴팁. 어떤 카드에도 가리지 않는다. */
  /* 하위가 있는 항목을 눌렀을 때 뜨는 선택 말풍선 */
  /* 조건이 걸린 카드의 '해제' 버튼. 제목 줄 오른쪽 끝에 붙는다. */
  .cardclr { margin-left:auto; border:1px solid var(--brand);
             background:#fff; color:var(--brand); font-size:10px;
             font-weight:700; border-radius:4px; padding:1px 7px;
             cursor:pointer; white-space:nowrap; }
  .cardclr:hover { background:var(--brand); color:#fff; }
  .cellttl { display:flex; align-items:center; gap:6px; }

  /* 누를 수 있는 곳은 모두 손가락 커서로. 눌리는 곳임을 알 수 있게 한다. */
  button, a, label, summary, canvas,
  .fchip i, .czback, .rankbtn, .hdrbtn, .seg > button,
  .insline, .inscard, .czcol, .dd > button, .menu label,
  .grid th.dh, .grid td.dh, .grid .expcol,
  [onclick], [role="button"] { cursor:pointer; }
  button:disabled, .dd > button:disabled { cursor:not-allowed; }
  /* 팝업 가림막은 '바깥을 눌러 닫기' 때문에 onclick 이 있을 뿐이다.
     그 자리가 눌리는 곳처럼 보이면 안 된다. 안쪽 상자도 기본 커서로 둔다. */
  .updmask, .updbox, .updbox * { cursor:default; }
  .updbox button, .updbox a, .updbox label,
  .updbox .dd > button, .updbox .menu label { cursor:pointer; }
  .updbox input[type="text"] { cursor:text; }
  /* 값을 직접 고치는 칸은 글자 커서가 맞다. */
  input[type="text"], input[type="number"], input[type="date"],
  textarea, select { cursor:auto; }
  input[type="checkbox"], input[type="radio"] { cursor:pointer; }

  /* HOLD 유형 적용 순서 칸. 손잡이로 끌거나 번호를 직접 넣는다.
     손잡이와 입력칸이 함께 들어가야 하므로 폭을 넉넉히 둔다.
     칸 전체에 user-select:none 을 걸면 입력칸까지 막힌다. */
  .grid th.dh, .grid td.dh { width:62px; min-width:62px; max-width:62px;
                             text-align:center; color:var(--mut);
                             font-size:11px; white-space:nowrap;
                             padding:2px 3px; }
  .grid td.dh { display:table-cell; }
  .grid td.dh .grip { cursor:grab; margin-right:2px; font-size:10px;
                      display:inline-block; user-select:none;
                      vertical-align:middle; }
  .grid td.dh .ordin { width:28px; text-align:center; font-size:11px;
                       font-weight:600; color:var(--fg);
                       border:1px solid var(--bd); border-radius:3px;
                       background:#fff; padding:1px 0; cursor:text;
                       vertical-align:middle; box-sizing:border-box; }
  .grid td.dh .ordin:hover { border-color:var(--brand); }
  .grid td.dh .ordin:focus { border-color:var(--brand); background:#fff;
                             outline:none; }
  .grid tr.dragging { opacity:.45; }
  .grid tr.dropup td { box-shadow:inset 0 2px 0 var(--brand); }
  .grid tr.dropdn td { box-shadow:inset 0 -2px 0 var(--brand); }
  .grid tr.moved td { background:#FFF7CC; transition:background .9s; }

  .askpop { position:absolute; z-index:9998; background:#fff;
            border:1px solid var(--brand); border-radius:8px; padding:8px;
            box-shadow:0 6px 18px rgba(0,0,0,.16); min-width:150px; }
  .askpop .askttl { font-size:11px; font-weight:700; color:var(--brand);
                    margin:0 16px 6px 0; max-width:200px; overflow:hidden;
                    text-overflow:ellipsis; white-space:nowrap; }
  .askpop .askx { position:absolute; top:4px; right:6px; cursor:pointer;
                  color:var(--mut); font-size:14px; line-height:1; }
  .askpop .askx:hover { color:#B91C1C; }
  .askpop button { display:block; width:100%; text-align:left; border:0;
                   background:#F3F4F6; border-radius:5px; font-size:11px;
                   padding:6px 9px; cursor:pointer; color:var(--fg); }
  .askpop button + button { margin-top:4px; }
  .askpop button:hover { background:var(--brand); color:#fff; }

  /* 누를 수 있는 곳은 모두 손가락 커서로. 눌러도 되는지 바로 알 수 있게. */
  button, a, label, summary,
  .seg > button, .rankbtn, .czback, .balback, .fchip i, .insline,
  .inscard, .dd > button, .menu label, .lineseg button, .datef,
  .stack i, .askpop button,
  [onclick] { cursor:pointer; }
  /* 차트는 막대·조각 위에서만 손가락이 된다(JS 가 바꾼다). 여백은 기본 커서. */
  canvas { cursor:default; }
  button:disabled, .lineseg button:disabled { cursor:not-allowed; }

  /* 라인 범례. 글자가 짧아 차트를 가리지 않는다. */
  .linelg { display:inline-flex; align-items:center; gap:3px; font-size:10px;
            color:var(--mut); margin-left:6px; white-space:nowrap; }
  .linelg b { color:var(--fg); font-size:9px; margin-right:2px; }
  .linelg i { width:8px; height:8px; border-radius:2px; display:inline-block;
              margin-left:4px; }

  /* 드릴다운 흐름 화살표. 카드 사이 여백을 타고 흐른다. */
  /* ── 추이 요약 카드 ───────────────────────────────────────────────── */
  .maincol > #trend { border:1px solid var(--bd); border-radius:6px;
                      padding:10px 12px; margin:0 0 12px;
                      box-sizing:border-box; }
  .trtt > span:first-child { font-size:15px; font-weight:700; }
  .trtt .v { font-size:11px; color:var(--mut); font-weight:400; }
  /* 히트맵 · 전체 보기는 한 덩어리로 붙여 둔다. */
  .trbtns { display:inline-flex; gap:4px; margin-left:auto; }
  /* 카드 안에서만 굴린다. 메인 페이지는 길어지지 않는다. */
  .trbody { max-height:150px; overflow-y:auto; margin-top:4px; }
  .trsec { position:sticky; top:0; background:#fff; z-index:20;
           font-size:10px; font-weight:700; color:var(--brand);
           border-bottom:1px solid #EEF0F3; padding:3px 0 2px;
           margin-top:4px; }
  .trrow { display:flex; gap:6px; font-size:12px; line-height:1.65;
           padding:3px 0; border-bottom:1px solid #F5F6F8; }
  .trno { flex:0 0 14px; color:var(--mut); font-weight:700; }
  .trtx { flex:1; min-width:0; }
  .trboxin .grid { width:100%; font-size:11px; }
  /* 스크롤해도 컬럼명이 위에 붙어 있게 한다. */
  .trboxin .grid { border-collapse:separate; border-spacing:0; }
  .trboxin .grid th { background:#F7F8FA; text-align:left; padding:4px 6px;
                      position:sticky; top:0; z-index:20;
                      box-shadow:inset 0 -1px 0 var(--bd); }
  .trboxin .grid td { padding:3px 6px; border-top:1px solid var(--bd); }
  .trboxin .grid td.num { text-align:right; }

  /* ── 추이 히트맵 ──────────────────────────────────────────────────── */
  /* 팝업 폭은 기간에 맞춘다. 7일인데 30일 폭이면 여백만 남는다.
     fit-content 로 표 크기를 따라가되, 넘치면 상한에서 멈추고
     본문 안에서만 가로로 굴린다. 도구줄이 밀리지 않게 min-width 를 둔다. */
  .hmtools { display:flex; align-items:center; gap:8px; }
  /* 위 여백을 두면 sticky 헤더 위쪽에 틈이 생겨 셀이 그 사이로 지나간다.
     여백은 표 안쪽(첫 행 padding)으로 옮긴다. */
  .hmbody .hmt { margin-top:0; }
  .hmt { border-collapse:separate; border-spacing:1px; font-size:10px; }
  /* 틀고정 층
       모서리(th.hk)  30   왼쪽·위가 겹치는 칸
       위 날짜(th)    20
       왼쪽 이름(td.hk) 10
       본문 셀          0
     배경을 반드시 채워야 아래 셀이 비쳐 보이지 않는다.
     border-spacing 이 있으면 그 틈으로 셀이 지나가므로 collapse 로 둔다. */
  .hmt { border-collapse:separate; border-spacing:0; }
  /* 헤더 칸에 배경이 없으면 그 아래로 셀이 비쳐 보인다.
     th 는 기본이 투명이므로 반드시 채운다. 위쪽 여백으로 셀이 지나가지
     않도록 상자의 padding-top 은 0 이어야 한다(.hmbody 참고). */
  .hmt thead { position:sticky; top:0; z-index:20; }
  .hmt th { position:sticky; top:0; z-index:20; background:#fff;
            color:var(--mut); font-weight:600; padding:3px;
            white-space:nowrap; box-shadow:inset 0 -1px 0 var(--bd); }
  /* 헤더 위쪽을 흰색으로 덮어 스크롤된 셀이 보이지 않게 한다. */
  .hmt thead::before { content:""; position:absolute; left:0; right:0;
                       bottom:100%; height:24px; background:#fff; }
  .hmt td.hk { position:sticky; left:0; z-index:10; background:#fff;
               text-align:left; padding:2px 6px 2px 2px;
               font-weight:700; color:var(--fg);
               box-shadow:inset -1px 0 0 var(--bd); }
  .hmt th.hk { position:sticky; left:0; top:0; z-index:30; background:#fff;
               text-align:left;
               box-shadow:inset -1px 0 0 var(--bd), inset 0 -1px 0 var(--bd); }
  /* 셀 안에 값을 k 단위로 적는다. */
  .hmt td { min-width:34px; height:16px; border-radius:2px; text-align:center;
            font-size:9px; color:#1F2937; padding:0 2px; }
  .hmnote { font-size:10px; color:var(--mut); margin-top:8px;
            display:flex; align-items:center; gap:5px; }
  .hmnote .nodbox { width:11px; height:11px; border-radius:2px;
                    display:inline-block; flex:0 0 auto;
                    background:repeating-linear-gradient(45deg,
                      #F3F4F6 0 3px, #E5E7EB 3px 6px); }
  /* 그날 적재가 없는 칸. 0매(흰 칸)와 눈으로 구분되게 빗금을 둔다. */
  .hmt td.nod { background:repeating-linear-gradient(45deg,
                  #F3F4F6 0 3px, #E5E7EB 3px 6px) !important;
                color:transparent; }
  /* 칸을 누르면 그 조건으로 좁힌다. 그 칸만 손가락 커서다. */
  .updbox .hmt td.hcell { cursor:pointer; }
  .hmt td.hcell:hover { outline:2px solid var(--brand); outline-offset:-2px; }

  /* ── 업데이트 내역 ───────────────────────────────────────────────── */
  /* 업데이트 내역 버튼과 팝업 */
  .updbar { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .updmask { position:fixed; inset:0; z-index:9500; display:none;
             background:rgba(17,24,39,.45); align-items:center;
             justify-content:center; padding:24px; }
  .updmask.on { display:flex; }
  .updbox { background:#fff; border-radius:8px; width:min(900px, 100%);
            max-height:86vh; display:flex; flex-direction:column;
            box-shadow:0 12px 40px rgba(0,0,0,.25); }
  /* 히트맵은 표 크기에 맞춘다. .updbox 의 고정 폭을 덮어야 하므로
     반드시 그 규칙 **뒤에** 둔다.

     [주의] .updbox 는 display:flex + column 이다. 그 안에서
     overflow:auto 인 자식(.hmbody)은 **내용 폭을 부모에게 알리지 않는다.**
     그래서 fit-content 를 줘도 부모가 표 폭을 모른다.
     블록 레이아웃으로 바꾸고 자식이 스스로 폭을 정하게 한다. */
  /* 폭은 JS 가 표를 재서 정한다(renderHeat).
     CSS 만으로는 도구줄이 폭을 끌고 가 표가 좁아도 여백이 남는다. */
  /* overflow 는 visible 이어야 열린 필터 메뉴가 잘리지 않는다.
     세로/가로 스크롤은 본문(.hmbody)이 맡는다. */
  .updbox.hmbox { display:block; width:auto; min-width:0;
                  max-width:min(1400px, 100%); overflow:visible; }
  /* 머리글 높이를 뺀 만큼만 본문에 준다(세로도 팝업 안에서만 굴린다). */
  /* 드릴다운 표와 같은 버튼을 쓴다. 도구줄에서 눌리지 않게 높이를 준다. */
  .hmbox .dfclear { height:24px; line-height:22px; }
  /* 본문(표)이 팝업 폭을 정한다.
     내용이 max-width 를 넘을 때만 가로로 굴린다. */
  .hmbody { max-height:70vh; overflow:auto; padding:0 12px 16px; }
  .updtop { display:flex; align-items:center; justify-content:space-between;
            padding:12px 16px; border-bottom:1px solid var(--bd); }
  .updtop b { font-family:var(--f-title); font-size:16px; }

  /* 히트맵 도구줄. **반드시 .updtop 뒤에** 둔다(같은 특정도면 나중 것이 이긴다).
     도구줄이 한 줄로 길게 늘어서면 그 폭이 팝업 폭이 되어, 표가 좁아도
     여백이 남는다. 줄바꿈시켜 표 폭을 넘지 않게 한다. */
  /* 도구줄이 본문(표 헤더 z 20~30) 보다 위여야 필터 메뉴가 가리지 않는다.
     sticky 는 쌓임 맥락을 만들므로 자식 메뉴의 z-index 만으로는 안 된다. */
  .hmbox .updtop { position:sticky; top:0; z-index:100; background:#fff;
                   flex-wrap:wrap; gap:6px 8px; }

  .hmbox .hmtools { flex-wrap:wrap; min-width:0; }
  .updbody { overflow-y:auto; padding:14px 18px 20px; }
  /* 표를 담는 본문은 위 여백을 빼야 헤더 고정이 어긋나지 않는다. */
  .updbody.trboxin { padding-top:0; }
  .updnote { font-size:12px; color:var(--mut); line-height:1.7; margin:0; }
  .updbody .legend { margin:6px 0 0; font-size:11px; }
  .lg-ok { color:var(--fg); font-weight:600; }
  .lg-no { color:var(--mut); text-decoration:line-through;
           background:#EEF0F3; padding:0 4px; border-radius:3px; }

  .updver { display:flex; gap:16px; padding:16px 0;
            border-top:1px solid var(--bd); }
  .updver:first-of-type { border-top:0; }
  .vtag { flex:0 0 92px; text-align:right; }
  .vtag b { display:block; font-size:14px; color:var(--brand); }
  .vtag span { font-size:11px; color:var(--mut); }
  .vbody { flex:1; min-width:0; }
  .vbody h2 { font-size:14px; margin:0 0 8px; font-weight:700; }
  .vbody ul { margin:0; padding-left:16px; }
  .vbody li { font-size:12.5px; line-height:1.75; margin-bottom:4px; }

  /* 되돌린 항목. 회색 음영에 취소선. */
  .vbody li.gone > .txt { color:var(--mut); text-decoration:line-through;
                          background:#EEF0F3; padding:1px 5px;
                          border-radius:3px; }
  .vbody li.gone { list-style:none; margin-left:-16px; }
  .vbody li.gone::before { content:"취소"; font-size:10px; color:#B91C1C;
                           border:1px solid #F3C7C7; border-radius:3px;
                           padding:0 4px; margin-right:6px; }
  .moved { font-size:11px; color:var(--brand); margin-left:6px; }
  .note { display:block; font-size:11px; color:#B4504F; margin-left:2px; }

  /* 로딩 가림막 */
  #busy { position:fixed; inset:0; z-index:10000; display:none;
          background:rgba(255,255,255,.82);
          align-items:center; justify-content:center; }
  #busy.on { display:flex; }
  /* 첫 화면 이후에는 가리지 않는다. 상단 얇은 바로만 알린다. */
  #bar { position:fixed; top:0; left:0; height:2px; width:0;
         background:#2E1A47; z-index:10001; opacity:0;
         transition:width .2s ease, opacity .2s; }
  #bar.on { opacity:1; animation:barflow 1.1s ease-in-out infinite; }
  @keyframes barflow {
    0%   { width:8%;  margin-left:0; }
    50%  { width:42%; margin-left:58%; }
    100% { width:8%;  margin-left:92%; }
  }
  /* 갱신 중인 카드만 살짝 흐리게. 화면은 그대로 남는다. */
  .cell.upd, .detail.upd { opacity:.55; transition:opacity .15s; }
  .busytxt { font-size:13px; font-weight:600; color:#2E1A47;
             letter-spacing:.02em; }
  /* 첫 화면이 다 그려질 때까지 본문을 감춘다.
     반쯤 그려진 뼈대가 스치는 것을 막는다. */
  body.booting > *:not(#busy):not(script) { visibility:hidden; }

  .htip { position:absolute; z-index:9999; pointer-events:none; opacity:0;
          background:rgba(17,24,39,.94); color:#fff; font-size:11px;
          padding:5px 9px; border-radius:5px; white-space:nowrap;
          display:flex; align-items:center; gap:6px;
          transition:opacity .08s; }
  .htip i { width:9px; height:9px; border-radius:2px; display:inline-block; }
  .htip b { color:#FFD700; }
  /* GRADE 표. 재공막대 아래에 붙는다. */
  .gradebox { margin-top:10px; border-top:1px solid var(--bd); padding-top:8px; }
  .gradebox .cellttl { margin-bottom:6px; }
  .gradebox .rankbtn { margin-left:auto; }
  .gradet { width:100%; border-collapse:collapse; font-size:11px;

  .gradet th, .gradet td { padding:2px 4px; text-align:right;

  .gradet thead th { color:var(--mut); font-weight:600;

  .gradet th:first-child { text-align:left; color:var(--fg);

  .gradet tr.gv td { font-variant-numeric:tabular-nums; }
  .gradet tr.gtop td, .gradet tr.gtop th { font-weight:700; }
  .gradet tr.gp td { color:var(--mut); font-size:10px;
                     border-bottom:1px solid var(--bd-l, #F1F2F4); }
  .gradet .gsum { border-left:1px solid var(--bd); }

  .donut { display:flex; align-items:center; gap:10px; }

  /* 라인 ALL 일 때 원 우측에 라인별 값을 한 줄 더. */
  .pickinfo u { display:block; margin-top:3px; font-size:10px;

  /* 토글 */
  .seg { display:inline-flex; border:1px solid var(--bd); border-radius:5px;

  .seg button { border:0; background:#fff; color:var(--mut); font-size:11px;

  /* Shift MOVE (세로 배치, 맨 위가 당일 계) */
  .mv .row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .mv .row .k { width:34px; font-size:12px; color:var(--mut); flex:0 0 34px; }
  .mv .row .bar { flex:1; height:16px; background:#F3F4F6; border-radius:3px;

  .wt table { width:100%; border-collapse:collapse; font-size:11px; }
  .wt th, .wt td { padding:3px 4px; text-align:right; white-space:nowrap; }
  .wt th:first-child, .wt td:first-child { text-align:left; color:var(--mut); }
  .wt thead th { color:var(--mut); font-weight:600; border-bottom:1px solid var(--bd); }

  .wt .sec { color:var(--mut); padding-top:7px; font-size:10px; }
  .wt tr.pick { cursor:pointer; }
  .wt tr.on > td:first-child { font-weight:700; color:var(--fg); }
  .wt td.cell-pick { cursor:pointer; border-radius:3px; }
  .wt td.cell-pick:hover { background:var(--brand); color:#fff; }
  .wt td.none { color:#C4C7CE; }
  .wt select, .wt input { font-size:11px; padding:2px 4px;

  /* 개발중 */
  .dev { position:absolute; inset:40px 0 0 0; background:rgba(255,255,255,.72);

  .ghost .cell { opacity:.5; }
  .ghost .gcircle { width:112px; height:112px; border-radius:50%; margin:0 auto;

  .ghost .gbars { display:flex; align-items:flex-end; gap:8px; height:84px; }
  .ghost .gbars i { flex:1; background:var(--brand); border-radius:2px 2px 0 0; }
  .ghost .glines i { display:block; height:9px; margin-bottom:7px;
                     background:var(--brand); border-radius:3px; opacity:.75; }

  /* 본문 */
  main { display:flex; gap:16px; padding:16px; align-items:flex-start; }
  .left { flex:0 0 32%; min-width:400px; }
  .detail { flex:1; border:1px solid var(--bd); border-radius:6px;
            padding:11px 12px; background:#fff;
            overflow:hidden; scroll-margin-top:16px; }
  .detail .empty { padding:14px 4px; color:var(--mut); font-size:13px; }
  .panel { border:1px solid var(--bd); border-radius:6px; padding:10px 12px 6px;
           margin-bottom:10px; }
  .panel h2 { margin:0; font-size:14px; display:flex;
              justify-content:space-between; align-items:baseline;
              color:var(--accent); }
  .panel h2 .unit { color:var(--mut); font-size:11px; font-weight:400; }
  .wrap { position:relative; opacity:0; transition:opacity .28s ease-out; }
  .wrap.ready { opacity:1; }
  .topbar { display:flex; justify-content:space-between; align-items:center;
            margin:0 0 8px 2px; }
  #legend2 { display:flex; gap:14px; font-size:12px; }
  #legend2 span { display:inline-flex; align-items:center; gap:5px; }
  #legend2 i { width:14px; height:3px; border-radius:2px; }
  .notice { background:#FFFBEB; border:1px solid #FDE68A; color:#92400E;
            border-radius:5px; padding:8px 10px; font-size:12px; margin-bottom:10px; }
  .err { color:#B91C1C; font-size:13px; padding:8px 2px; }
  .err code { background:#FEF2F2; padding:1px 4px; border-radius:3px; }

  /* 드릴다운 */
  .bar { display:flex; align-items:center; justify-content:space-between;
         padding:9px 12px; border-bottom:1px solid var(--bd); background:#F9FAFB; }
  .bar b { font-size:13px; }
  .bar .path { color:var(--mut); font-size:12px; margin-left:8px; }
  .bar button { border:1px solid var(--bd); background:#fff; border-radius:4px;
                font-size:12px; padding:4px 10px; cursor:pointer; }
  .scroll { max-height:560px; overflow:auto; }
  /* sticky 헤더를 쓰므로 collapse 를 피한다(본문이 헤더 위로 지나간다). */
  .scroll table { border-collapse:separate; border-spacing:0;
                  font-size:11px; width:100%; }
  .scroll th, .scroll td { padding:4px 7px; white-space:nowrap;
                           text-align:left;
                           box-shadow:inset 0 -1px 0 var(--bd); }
  .scroll thead { position:sticky; top:0; z-index:20; }
  .scroll thead::before { content:""; position:absolute; left:0; right:0;
                          bottom:100%; height:24px; background:#fff; }
  .scroll thead th { position:sticky; top:0; z-index:20;
                     background:#F3F4F6; color:var(--mut);
                     font-weight:600; z-index:1; }
  .scroll td.num { text-align:right; font-variant-numeric:tabular-nums; }

  /* FAB현황 단일 라인 레이아웃 */
  /* 좌측 세로축과 우측이 같은 높이로 끝나도록 맞춘다. */
  /* 가로 스크롤이 생기지 않게 각 단계마다 min-width:0 을 준다.
     flex 아이템은 기본 min-width:auto 라 내용 폭만큼 부풀어 오른다. */
  /* Chart.js 는 canvas 에 픽셀 폭을 인라인으로 박는다. 열이 좁아져도 그 값이
     남아 페이지를 오른쪽으로 늘린다. 반드시 부모 폭으로 묶는다. */
  canvas { max-width:100% !important; display:block; }

  /* 우측이 길어져도 좌측이 따라 늘어나지 않게 flex-start 로 둔다.
     좌측 세로축과 원인 분석의 높이 맞춤은 syncLeftHeight() 가 한다. */
  .layout { display:flex; gap:14px; padding:14px; align-items:flex-start;
            min-width:0; max-width:100%; box-sizing:border-box; }
  /* 드릴다운을 '거는' 좌측과 그 '결과' 인 우측을 굵은 선으로 가른다. */
  .maincol { flex:1 1 0; min-width:0; width:0; display:flex;
             flex-direction:column;
             border-left:3px solid #888B90; padding-left:14px; }
  /* 요약카드와 그 아래 내용도 가른다. */
  /* 요약카드와 그 아래를 가른다. .cell 규칙이 테두리를 덮으므로 뒤에 둔다. */
  .maincol > #insight { border:1px solid var(--bd); border-radius:6px;
                        padding:10px 12px; margin:0 0 14px;
                        box-sizing:border-box; position:relative; }
  /* 요약카드와 아래 내용을 가르는 굵은 선. 카드 테두리가 아니라 여백에 둔다. */
  .maincol > #insight::after { content:""; position:absolute;
                               left:-14px; right:0; bottom:-8px; height:3px;
                               background:#888B90; }
  .summary { flex:0 0 380px; display:flex; flex-direction:column; }

  .summary .cell { border:1px solid var(--bd); border-radius:6px; padding:11px 12px;
                   margin-bottom:10px; }
  /* 마지막 카드의 아래 여백만큼 원인 분석 카드가 더 내려가 보인다. 없앤다. */
  .summary > .cell:last-of-type { margin-bottom:0; }
  /* ── 전역 필터 (라인 + 제품구분) ────────────────────────────────────────
     /main/ 전체에 걸리는 최상위 필터라 한 묶음으로 보이게 한다. */
  .gfilter { border:1px solid var(--bd); border-radius:6px; background:#F7F8FA;
             padding:8px; margin-bottom:12px; }
  .gfilter .lineseg { margin-bottom:8px; }
  .gfilter .prodf { margin-bottom:0; }
  .gfilter .prodf .dd > button {
      width:100%; text-align:left; font-family:var(--f-title);
      font-weight:700; font-size:13px; padding:7px 10px;
      border:1px solid var(--bd); border-radius:6px; background:#fff;
      color:var(--mut); display:flex; justify-content:space-between;
      align-items:center; gap:6px; }
  .gfilter .prodf .dd > button.on { background:var(--brand); color:#fff;
                                    border-color:var(--brand); }
  .gfilter .prodf .menu { left:0; right:auto; top:34px; max-height:300px;
                          overflow:auto; min-width:100%; }
  .ddq { width:100%; box-sizing:border-box; margin-bottom:5px; padding:4px 6px;
         border:1px solid var(--bd); border-radius:4px; font-size:12px; }

  .lineseg { display:flex; gap:0; border:1px solid var(--bd); border-radius:6px;
             overflow:hidden; margin-bottom:12px; }
  .lineseg button { flex:1; border:0; border-right:1px solid var(--bd);
                    background:#fff; color:var(--mut); font-family:var(--f-title);
                    font-weight:700; font-size:14px; padding:8px 0; cursor:pointer; }
  .lineseg button:last-child { border-right:0; }
  .lineseg button.on { background:var(--brand); color:#fff; }
  .lineseg button:disabled { color:#C4C7CE; cursor:not-allowed; background:#FAFAFA; }

  /* WT 분포 (세로 나열, 위가 WT0) */
  .wtb .row { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
  .wtb .row .k { width:82px; flex:0 0 82px; font-size:11px; color:var(--mut); }
  .wtb .row .bar { flex:1; height:16px; background:#F3F4F6; border-radius:3px;

  .wtb .row .bar i { display:block; height:100%; }
  .wtb .row .v { width:62px; text-align:right; font-size:12px;

  .wtb .row:first-child .k, .wtb .row:first-child .v { color:#B45309; font-weight:700; }

  .cz .grp { margin-bottom:10px; }
  .cz .gh { display:flex; justify-content:space-between; font-size:12px;

  /* 기준정보 */

  .std { padding:18px; max-width:none; }

  .applybtns { display:inline-flex; align-items:center; gap:6px; }

            cursor:pointer; }

  .std table { border-collapse:collapse; width:100%; font-size:13px;
               margin-bottom:16px; }
  .std th, .std td { border-bottom:1px solid var(--bd); padding:6px 8px;
                     text-align:left; }
  .std th { color:var(--mut); font-size:12px; }
  .std input, .std select { padding:5px 7px; border:1px solid var(--bd);
                            border-radius:4px; font-size:13px; }
  .std .msg { color:#065F46; font-size:12px; margin-bottom:10px; }

  /* ── 공용 표(.grid) ─────────────────────────────────────────────────────
     - 셀 경계선을 그어 컬럼을 구분
     - 헤더 가운데 정렬
     - 내용 길이에 맞춰 폭을 잡되 최대 폭을 두고, 넘치면 셀 안에서 가로 스크롤
     ------------------------------------------------------------------- */
  /* border-collapse:collapse 는 sticky 헤더와 함께 쓰면 테두리가 사라지고
     본문 셀이 헤더 위로 지나간다. separate 로 두고 테두리는 box-shadow 로
     그린다. */
  .grid { border-collapse:separate; border-spacing:0; width:auto;
          font-size:12px; table-layout:auto; }
  /* 컬럼이 많은 표는 카드 폭을 넘기지 않고 래퍼 안에서만 가로 스크롤한다. */
  .farcol .gridwrap { width:100%; max-width:100%; overflow-x:auto; }
  .grid th, .grid td { padding:5px 8px; white-space:nowrap;
                       vertical-align:middle;
                       box-shadow:inset -1px -1px 0 var(--bd); }
  .grid tr > *:first-child { box-shadow:inset 1px -1px 0 var(--bd),
                             inset -1px 0 0 var(--bd); }
  .grid thead tr:first-child > * { box-shadow:inset -1px -1px 0 var(--bd),
                                   inset 0 1px 0 var(--bd); }
  .grid thead tr:first-child > *:first-child {
      box-shadow:inset 1px 1px 0 var(--bd), inset -1px -1px 0 var(--bd); }
  .grid thead th.sortable { cursor:pointer; user-select:none; }
  .grid thead th.sortable:hover { background:#E9EBEF; }
  .grid thead th .so { color:#DC143C; font-size:9px; margin-left:2px; }
  .grid thead { position:sticky; top:0; z-index:20; }
  .grid thead th { text-align:center; background:#F3F4F6; color:var(--mut);
                   font-size:11px; font-weight:600;
                   position:sticky; top:0; z-index:20; }
  .grid thead::before { content:""; position:absolute; left:0; right:0;
                        bottom:100%; height:24px; background:#fff; }
  .grid tbody td { text-align:left; }
  .grid td.num, .grid th.num { text-align:right;
                               font-variant-numeric:tabular-nums; }
  /* 셀 내부 스크롤. td 자체에는 overflow 가 먹지 않아 내부 div 를 쓴다. */
  .grid td { max-width:240px; overflow:hidden; text-overflow:ellipsis; }
  /* 긴 값만 이 래퍼로 감싸 셀 안에서 가로 스크롤한다(짧은 값은 감싸지 않는다). */
  .grid .c { display:block; max-width:240px; overflow-x:auto; overflow-y:hidden;
             white-space:nowrap; scrollbar-width:thin; }
  .grid .c::-webkit-scrollbar { height:6px; }
  .grid .c::-webkit-scrollbar-thumb { background:#D1D5DB; border-radius:3px; }
  .grid tbody tr:hover td { background:#FAFAFA; }
  .grid tr.tot td { font-weight:700; background:#F9FAFB;
                    border-top:2px solid var(--bd); }

  .gridwrap { overflow:auto; padding-top:0; border:1px solid var(--bd);
              border-radius:6px;
              max-height:60vh; contain:paint; }

  /* ── 해상도 대응 ──────────────────────────────────────────────────────── */
  @media (max-width: 1600px) {
    .summary { flex:0 0 340px; }
    .grid .c { max-width:200px; }
  }
  @media (max-width: 1280px) {
    .layout, main { flex-wrap:wrap; }
    .summary, .left { flex:1 1 100%; min-width:0; }
    .detail, .right { flex:1 1 100%; }
    .status { grid-template-columns:repeat(2, 1fr); }
    .grid .c { max-width:170px; }
  }
  @media (max-width: 820px) {
    .status { grid-template-columns:1fr; }
    header { flex-wrap:wrap; height:auto; padding:8px 12px; }
    header .meta { margin-left:0; width:100%; }
    .dl .split { flex-wrap:wrap; }
    .dl .split > .left, .dl .split > .right { flex:1 1 100%; }
  }

  /* ── 원인 분석 (대분류 3개 차트) ──────────────────────────────────────── */
  /* 항상 1 x 3. 폭이 모자라면 세로로 쌓지 말고 가로 스크롤한다. */
  /* SHIFT 추이 + 대분류 3개 = 4등분. 좁으면 세로로 쌓지 말고 가로 스크롤. */
  /* 원인 분석은 SHIFT 추이 아래에 3행 1열로 쌓는다. */
  /* 세 차트가 남는 높이를 균등하게 나눈다. */
  /* 전체보기(가로막대)도 카드의 남는 높이를 모두 쓴다. */
  /* 토글은 제목 아래 한 줄로. 제목 글자 공간을 뺏지 않는다. */
  .cztools { display:flex; gap:6px; align-items:center; flex:0 0 auto;
             margin-bottom:6px; }
  /* 제목 옆 계층 표시가 길어도 줄바꿈되지 않게 한 줄로 흘린다. */
  #czcard > .cellttl { flex-wrap:nowrap; }
  #czcard > .cellttl > span:first-child { flex:0 0 auto; }
  #czup { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
          white-space:nowrap; text-align:right; }

  #czallw { display:flex; flex-direction:column; min-height:0; }
  /* 항목이 많으면 캔버스가 길어진다. 카드 안에서만 스크롤한다. */
  .czallbox { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; }

  /* minmax(0,1fr) 이라야 내용이 행을 밀지 않는다. 1fr 만 쓰면 min-content
     가 바닥이 되어 카드가 좌측 세로축보다 길어진다(224px 초과의 원인). */
  .cz3 { display:grid; grid-template-columns:1fr;
         grid-template-rows:repeat(3, minmax(0, 1fr));
         gap:10px; flex:1; min-height:0; overflow:hidden; }
  /* padding 은 선택 여부와 무관하게 늘 준다(선택 시 폭이 흔들리지 않게).
     선택 테두리는 ::before 로 그 안쪽에 그린다. */
  .cz3 .czcol { display:flex; flex-direction:column; min-height:0;
                padding:8px 10px; position:relative; }
  /* 좌측이 길어지면 세 차트가 그만큼 균등하게 늘어난다. */
  .cz3 .czcol > div:last-child { flex:1; min-height:0; }
  /* SHIFT 추이 + 원인 분석을 같은 등급 카드로 나란히 */
  /* 두 카드의 세로를 맞춘다. 추이가 길어지면 원인 분석도 같이 늘어난다. */
  /* ── 3열 배치 ─────────────────────────────────────────────────────────
     원인 분석(고정) | 드릴다운 중분류(고정) | 나머지 전부
     마지막 열은 flex-basis 0 으로 두어야 내용이 열을 넓히지 못한다.
     min-width:auto 가 기본이라 반드시 0 으로 덮어쓴다.
  ------------------------------------------------------------------- */
  /* ── 라인 요약 카드 ───────────────────────────────────────────────── */
  /* 요약카드 제목은 이 화면의 머리글이라 조금 크게. */
  .instt > #insTtl { font-size:16px; font-weight:700; }   /* 기본 14 + 2 */
  .instt > #insTtl em { font-style:normal; font-weight:600; font-size:13px;
                        color:var(--brand); }

  .insrow { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  /* 전체 순위: 한 카드만 남기고 그 안을 네 칸으로 나눈다. */
  .insrow.full { grid-template-columns:1fr; }
  .insgrid { display:grid; grid-template-columns:repeat(4, 1fr);
             gap:0 12px; }
  .inscard { border:1px solid var(--bd); border-radius:6px; padding:7px 8px;
             background:#FCFCFD; min-width:0; }
  .insh { font-size:11px; font-weight:700; color:var(--brand);
          display:flex; gap:6px; margin-bottom:4px; white-space:nowrap;
          overflow:hidden; text-overflow:ellipsis; }
  .insh > span { margin-left:auto; color:var(--mut); font-weight:400; }
  /* 설비 카드의 '전 라인' 토글 */
  .insall { border:1px solid var(--bd); background:#fff; color:var(--mut);
            font-size:9px; border-radius:3px; padding:0 5px; cursor:pointer; }
  .insall.on { border-color:var(--brand); background:var(--brand); color:#fff; }
  .czallwrap { margin-top:4px; }
  .czallrow { font-size:9px; color:#2E1A47; background:#F4F1F8;
              border-radius:3px; padding:2px 5px; margin-bottom:2px;
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .czallrow b { color:var(--fg); margin-right:3px; }

  .insall-row { font-size:9px; color:#2E1A47; background:#F4F1F8;
                border-radius:3px; padding:2px 5px; margin:0 0 3px 16px; }
  .insline { display:flex; align-items:center; gap:5px; font-size:10px;
             padding:3px 2px; border-top:1px solid #EEF0F3; cursor:pointer;
             white-space:nowrap; }
  .insline:hover { background:#F1F5FB; }
  .insno { color:var(--mut); width:11px; }
  .inspath { min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .inspath b { color:var(--fg); }
  .inspath i { color:var(--mut); font-style:normal; margin:0 3px; }
  .inspath span { color:var(--mut); }
  .insbl { color:#B91C1C; font-size:9px; border:1px solid #F3C7C7;
           border-radius:3px; padding:0 3px; }
  .insbl.ok { color:#15803D; border-color:#CBE7D5; }
  .insqty { margin-left:auto; font-weight:700; }
  .insqty em { font-size:9px; font-weight:400; font-style:normal;
               color:var(--mut); margin-left:1px; }
  .inspc { color:var(--mut); width:66px; text-align:right; }
  .inspc em { font-style:normal; color:#8B93A1; margin-left:2px; }
  .instr { font-weight:700; width:38px; text-align:right; }
  .instr.up { color:#B91C1C; }
  .instr.dn { color:#15803D; }
  .inswt { color:#B4504F; width:132px; text-align:right; overflow:hidden;
           text-overflow:ellipsis; }
  @media (max-width: 1400px) {
    .insrow { grid-template-columns:repeat(2, 1fr); }
  }

  .rowcards { display:flex; gap:10px; align-items:flex-start;
              flex:1; min-height:0; min-width:0; }

  .rowcards > .leftcol { flex:0 0 340px; display:flex; flex-direction:column;
                         gap:10px; min-width:0; }
  /* 원인 분석 카드가 좌측 컬럼의 남는 높이를 모두 차지한다. */
  .leftcol > #czcard { flex:1; display:flex; flex-direction:column;
                       min-height:0; }


  .rowcards > .farcol { flex:1 1 0; width:0; min-width:0;
                        display:flex; flex-direction:column; gap:10px; }
  .farcol > * { min-width:0; max-width:100%; box-sizing:border-box; }
  /* 어느 막대에서 파고들었는지 보이도록 그 칸을 남색으로 두른다. */
  /* box-shadow inset 은 padding 안쪽이 아니라 요소 경계에 그려져 내용과
     겹친다. 테두리는 ::before 로 따로 깔아 안쪽으로 물린다. */
  .czcol.czsrc::before { content:""; position:absolute; inset:2px;
                         border:2px solid var(--brand); border-radius:6px;
                         pointer-events:none; }
  /* 무엇을 파고들었는지 보이도록 그 칸에서 오른쪽으로 이어지는 표시. */
  .czcol.czsrc::after { content:"▶"; position:absolute; right:-12px; top:50%;
                        transform:translateY(-50%); color:var(--brand);
                        font-size:12px; font-weight:700; }
  .rowcards .cz3 { flex:1; align-items:stretch; }

  @media (max-width: 1180px) {
    .rowcards { flex-wrap:wrap; }
    .rowcards > .leftcol, .rowcards > .farcol { flex:1 1 100%; }
  }
  #trdshift { display:inline-flex; width:auto; align-self:flex-start; }
  .trdpath { font-size:12px; font-weight:700; color:var(--accent);
             min-height:16px; margin-bottom:3px; }
  .trdpath a { color:var(--accent); cursor:pointer; text-decoration:none; }
  .trdpath a:hover { text-decoration:underline; }
  .trdlg { display:flex; flex-wrap:wrap; gap:1px 8px; min-height:16px;
           margin-bottom:2px; }
  .trdlg label { font-size:10px; display:inline-flex; align-items:center;
                 gap:2px; cursor:pointer; white-space:nowrap; }
  .trdlg label.drill { text-decoration:underline dotted; }
  /* 원인 분석은 세로 3행이다. 경계는 아래쪽에 긋고 여백은 사방으로 준다.
     (가로 3열이던 시절의 좌우 padding 규칙이 남아 테두리와 글자가 겹쳤다) */
  .cz3 > .czcol { padding:8px 10px; border-bottom:1px solid var(--bd); }
  .cz3 > .czcol:last-child { border-bottom:0; }
  /* 재공 구성 막대 등 canvas 가 아닌 요소의 선택 표시(차트의 3D 팝업과 동일 개념) */
  .stack i.sel { outline:3px solid #FFD700; outline-offset:-3px;
                 position:relative; z-index:2; filter:saturate(1.6); }
  .prodf { display:flex; gap:6px; margin-bottom:12px; }
  .prodf > .dd { flex:1; min-width:0; }
  .prodf > .dd > button { width:100%; }
  /* 캘린더 입력. 표기는 26-08-15 로 짧게 보여주고 실제 입력은 겹쳐 둔다. */
  /* 날짜는 목록에서 고른다. 적재된 날만 나오므로 빈 날을 누를 일이 없다. */
  .datef { flex:1; min-width:0; position:relative; }
  .datef > button { width:100%; box-sizing:border-box;
                    padding:7px 10px; border:1px solid var(--bd);
                    border-radius:6px; background:#fff;
                    font-family:var(--f-title); font-weight:700;
                    font-size:13px; color:var(--mut); cursor:pointer;
                    display:flex; align-items:center; }
  .datef > button::after { content:"\1F4C5"; margin-left:auto;
                           font-size:12px; }
  .datef.on > button { background:var(--brand); border-color:var(--brand);
                       color:#fff; }
  /* 고를 수 없는 SHIFT 는 흐리게. 눌러도 반응하지 않는다. */
  .menu label.off { color:var(--mut); cursor:not-allowed; }

  /* 달력. 적재된 날만 고를 수 있고 나머지는 회색이다. */
  .menu.cal { width:224px; padding:8px; max-height:none; overflow:visible; }
  .calhd { display:flex; align-items:center; justify-content:space-between;
           margin-bottom:6px; }
  .calhd b { font-size:12px; font-family:var(--f-title); }
  .calhd button { border:1px solid var(--bd); background:#fff;
                  border-radius:4px; width:22px; height:22px; cursor:pointer;
                  font-size:13px; line-height:1; color:var(--fg); }
  .calhd button:hover { border-color:var(--brand); color:var(--brand); }
  .calwk, .calgrid { display:grid; grid-template-columns:repeat(7, 1fr);
                     gap:2px; }
  .calwk i { font-style:normal; font-size:10px; color:var(--mut);
             text-align:center; padding:2px 0; }
  .calgrid i { font-style:normal; font-size:11px; text-align:center;
               padding:4px 0; border-radius:4px; }
  .calgrid i.pad { visibility:hidden; }
  .calgrid i.ok { color:var(--fg); cursor:pointer; }
  .calgrid i.ok:hover { background:#EEF2FA; }
  /* 데이터가 없는 날. 회색이고 눌리지 않는다. */
  .calgrid i.no { color:#C9CDD4; cursor:not-allowed; }
  .calgrid i.today { box-shadow:inset 0 0 0 1px var(--bd); }
  .calgrid i.sel { background:var(--brand); color:#fff; font-weight:700; }
  .calnow { width:100%; margin-top:8px; border:1px solid var(--bd);
            background:#fff; border-radius:4px; padding:4px 0;
            font-size:11px; cursor:pointer; color:var(--brand);
            font-weight:600; }
  .calnow:hover { background:var(--brand); color:#fff;
                  border-color:var(--brand); }
  .prodf .dd { flex:1; min-width:0; }
  .prodf .dd > button { width:100%; }
  /* ── 전환 효과 ─────────────────────────────────────────────────────────
     클릭에 즉시 반응한 것처럼 보이게 한다. 실제 로딩은 그 뒤에 끝난다. */
  .cell, .detail, .card { transition:box-shadow .18s ease, border-color .18s ease; }
  .detail.loading { opacity:.55; }
  .detail { transition:opacity .18s ease; }
  .spin { display:inline-block; width:12px; height:12px; margin-left:8px;
          border:2px solid var(--bd); border-top-color:var(--brand);
          border-radius:50%; animation:spin .7s linear infinite;
          vertical-align:-2px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .lineseg button, .gfilter .prodf .dd > button, .seg button, .dd > button {
    transition:background .15s ease, color .15s ease, border-color .15s ease; }
  .stack i { transition:box-shadow .15s ease, outline-color .15s ease; }
  .grid tbody tr { transition:background .12s ease; }
  .czpath a, .legend span { transition:color .15s ease; }

  @media (prefers-reduced-motion: reduce) {
    * { transition:none !important; animation:none !important; }
  }

  /* '전체 순위 보기' 는 정보가 아니라 동작이다. 버튼처럼 보이게 한다. */
  .rankbtn { display:inline-flex; align-items:center; gap:4px;
             border:1px solid var(--bd); background:#fff; color:var(--brand);
             border-radius:999px; font-size:11px; font-weight:600;
             padding:2px 9px; cursor:pointer; line-height:1.6;
             transition:background .15s ease, color .15s ease; }
  .rankbtn:hover { background:#EEF2F9; }
  .rankbtn.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  .rankbtn .cv { font-size:9px; }

  /* 드릴다운 표 도구 (컬럼 토글 + 필터) */
  .dtools { border:1px solid var(--bd); border-radius:6px; background:#F9FAFB;
            padding:7px 9px; margin-bottom:8px; }
  .dtools .drow { display:flex; align-items:flex-start; gap:8px; }
  .dtools .drow + .drow { margin-top:6px; border-top:1px solid var(--bd);
                          padding-top:6px; }
  .dtools .minittl { flex:0 0 34px; padding-top:3px; }
  .chips { display:flex; flex-wrap:wrap; gap:2px 10px; flex:1; }
  .chips label { font-size:11px; color:var(--fg); display:inline-flex;
                 align-items:center; gap:3px; cursor:pointer; white-space:nowrap; }
  .dfs { display:flex; flex-wrap:wrap; gap:4px; flex:1; align-items:center; }
  .dfs > .minittl { flex:0 0 auto; white-space:nowrap; padding-top:0; }
  .dd.df { position:relative; }
  .dd.df > button { border:1px solid var(--bd); background:#fff; border-radius:5px;
                    font-size:11px; padding:0 8px; cursor:pointer;
                    gap:5px; color:var(--mut); }
  .dd.df > button.on { background:var(--brand); color:#fff;
                       border-color:var(--brand); }
  .dd.df .menu { left:0; right:auto; top:26px; max-height:260px; overflow:auto;
                 min-width:170px; }
  .dfall { border-bottom:1px solid var(--bd); font-weight:600; }

  /* 필터가 아니라 '동작' 이므로 배경을 달리해 구분한다. */
  .dfclear { border:1px solid var(--brand); background:var(--brand); color:#fff;
             border-radius:5px; font-size:11px; font-weight:600;
             padding:0 10px; cursor:pointer; white-space:nowrap; }
  .dfclear:hover { background:var(--brand-on); border-color:var(--brand-on); }

  /* 현재 걸린 정렬 표시 */
  .sortchip { border:1px solid var(--bd); background:#fff; border-radius:5px;
              font-size:11px; padding:0 8px; cursor:pointer; color:var(--fg);
              white-space:nowrap; }
  .sortchip:hover { background:#F3F4F6; }
  .sortchip b { color:#DC143C; margin-right:3px; }

  /* 영문/한글이 섞여도 높이가 흔들리지 않게 한 줄 높이를 고정한다. */
  .dfs { align-items:center; }
  .dfs > .dfclear, .dfs > .sortchip, .dd.df > button {
      height:24px; line-height:22px; box-sizing:border-box;
      display:inline-flex; align-items:center; }
  /* 표 행이 적어 카드가 짧아져도 필터 목록이 잘리지 않게 한다. */
  .detail { overflow:visible; }
  .dtools { overflow:visible; position:relative; z-index:30; }
  .grid thead th.dragging { opacity:.45; }
  .grid th.expcol, .grid td.expcol { width:22px; min-width:22px; padding:2px;
                                     text-align:center; }
  .expbtn { display:inline-block; width:15px; height:15px; line-height:13px;
            border:1px solid var(--bd); border-radius:3px; cursor:pointer;
            font-size:11px; color:var(--mut); background:#fff; user-select:none; }
  .expbtn:hover { background:#EEF2F9; color:var(--brand); }
  .grid tr.steprow td { background:#FAFBFD; color:var(--mut); font-size:11px;
                        border-top:0; }
  .grid thead th[draggable="true"] { cursor:grab; }

  /* W/T 0 재공의 status 요약 */
  .stsum { display:flex; flex-wrap:wrap; gap:3px 10px; margin-bottom:5px; }
  .stchip { font-size:11px; color:var(--fg); display:inline-flex;
            align-items:center; gap:4px; white-space:nowrap; }
  .stchip i { width:9px; height:9px; border-radius:2px; display:inline-block; }

  /* LOT BALANCE : PLAN 을 세로로 쌓고 x축(LAYER)은 서로 맞춘다 */
  .balrow { display:flex; align-items:stretch; gap:8px; }
  /* 제품이 바뀌는 자리를 가른다. */
  .balrow.gsep { border-top:2px solid #C0C6C7; padding-top:6px;
                 margin-top:4px; }

  /* 재공막대 '제품별 비율'. 전체 막대 아래에 한 단 들여 쓴다. */
  #wprod:not(:empty) { margin-top:8px; padding-top:8px;
                       border-top:1px dashed #C0C6C7;
                       /* 다섯 줄까지만 보이고 나머지는 안에서 굴린다.
                          한 줄 = 막대 13 + 숫자 12 + 여백 5 ≒ 34px */
                       max-height:170px; overflow-y:auto; }
  .wprow { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
  .wplab { flex:0 0 92px; padding-left:12px; font-size:11px; color:var(--mut);
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wpbar { flex:1; min-width:0; }
  .wpbar .stack { height:13px; }
  /* 고른 조각 표시. 재공막대와 같은 방식. */
  .wpbar .stack i.sel { outline:3px solid #FFD700; outline-offset:-3px;
                        position:relative; z-index:2; }
  .wpnum { font-size:9px; color:var(--mut); margin-top:2px; text-align:right; }
  .wpmore { font-size:9px; color:var(--mut); margin-bottom:4px;
            position:sticky; top:0; z-index:20; background:#fff; }
  .balrow + .balrow { border-top:1px solid var(--bd); padding-top:4px;
                      margin-top:4px; }
  /* PLAN 선택 팝업이 아래 카드에 가리지 않게 */
  #balpanel { position:relative; z-index:40; overflow:visible; }
  #balpick .menu { left:auto; right:0; top:26px; max-height:300px;
                   overflow:auto; min-width:190px; z-index:70; }
  .balpath { font-size:12px; font-weight:700; color:var(--accent);
             min-height:16px; margin-bottom:4px; }
  /* 제품 > PLAN 을 줄바꿈해 전부 보여 준다. 잘라내지 않는다. */
  .ballab { flex:0 0 110px; font-size:10px; color:var(--brand);
            display:flex; align-items:center; line-height:1.35;
            word-break:break-all; white-space:normal; padding-right:4px; }
  .ballab b { font-weight:700; }
  .ballab i { font-style:normal; color:var(--mut); margin:0 2px; }
  .ballab span { font-weight:400; }
  /* 아래에 모듈2 · 모듈1 두 단이 붙어 그만큼 높게 잡는다. */
  .balc { flex:1; min-width:0; height:190px; }

  /* 조건 칩 */
  .hdrbtn { border:1px solid var(--brand); background:var(--brand); color:#fff;
            border-radius:5px; font-size:11px; font-weight:600; padding:3px 9px;
            cursor:pointer; margin:0 8px; }
  .hdrbtn:hover { background:var(--brand-on); border-color:var(--brand-on); }

  .fchip { display:inline-flex; align-items:center; gap:4px; height:24px;
           padding:0 6px 0 9px; border:1px solid var(--brand);
           border-radius:999px; background:#EEF2F9; color:var(--brand);
           font-size:11px; font-weight:600; white-space:nowrap; }
  .fchip i { font-style:normal; cursor:pointer; font-size:13px; line-height:1;
             padding:0 2px; opacity:.7; }
  .fchip i:hover { opacity:1; color:#B91C1C; }

  /* 조건이 걸린 카드 강조 */
  .cell.active { box-shadow:0 0 0 2px var(--brand) inset; position:relative; }
  /* 원인 분석은 안의 대분류 칸에만 표시한다. 카드 전체는 두르지 않는다. */
  #czcard.active { box-shadow:none; }
  #czcard.active::after { content:none; }
  .cell.active::after { content:attr(data-n); position:absolute; top:6px;
                        right:8px; min-width:15px; height:15px; padding:0 3px;
                        border-radius:8px; background:var(--brand); color:#fff;
                        font-size:10px; font-weight:700; line-height:15px;
                        text-align:center; }

  .czh { cursor:pointer; }
  .czh span:first-child::after { content:" ▸"; color:var(--mut); font-size:10px; }
  .czh:hover span:first-child { text-decoration:underline; }
  .czpath { font-size:11px; color:var(--mut); margin-bottom:4px; min-height:16px; }
  .czpath a { color:var(--brand); cursor:pointer; text-decoration:none; }
  .czpath a:hover { text-decoration:underline; }
  .czback { display:inline-block; border:1px solid var(--bd); background:#fff;
            border-radius:4px; font-size:11px; padding:1px 7px; cursor:pointer;
            color:var(--fg); margin-right:6px; }
  .czback:hover { background:#F3F4F6; }
</style>
</head>
<body>
<header>
  <div class="brand">Multi Line Fab Monitor</div>
  <nav>
    {% for name, url in menu %}
      <a href="{{ url }}" {% if request.path == url %}class="on"{% endif %}>{{ name }}</a>
    {% endfor %}
  </nav>
  <div class="meta">
    <button class="hdrbtn" id="clearAllBtn" style="display:none"
            onclick="dfClearAllConds()"
            title="좌측 필터와 드릴다운 조건을 모두 푼다">조건 ALL 해제</button>
    문의: <b>minuk12.choi</b>
    / 적재시각: <b id="snapAt">{{ snapshot_at|default:"-" }}</b></div>
</header>
{% block body %}{% endblock %}
<!-- 로딩 가림막. 무엇이든 불러오는 동안 화면 전체를 덮는다.
     반쯤 그려진 화면을 보이지 않게 한다. -->
<div id="busy"><div class="busytxt">불러오는 중입니다…</div></div>
<div id="bar"></div>

<script>
/* 진행 중인 요청을 센다. 하나라도 있으면 가림막을 띄운다.
   fetch 를 감싸므로 어느 페이지에서든 따로 부를 필요가 없다.
------------------------------------------------------------------ */
(function () {
  let n = 0, timer = null, booted = false;
  // 첫 화면이 언제 걷히는지 추적한다. 값은 담지 않고 시각과 단계만 남긴다.
  const T0 = Date.now();
  const TRACE = [];
  const DBG = location.search.indexOf("debug=boot") >= 0;

  function mark(what, extra) {
    TRACE.push({ t: Date.now() - T0, what: what, extra: extra || "" });
  }

  function sendTrace() {
    if (!DBG) { return; }
    fetch("/api/debug-layout/", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        kind: "boot",
        items: TRACE.map(x => ({ sel: `  +${x.t}ms  ${x.what}`,
                                 note: String(x.extra) })),
      })
    });
  }
  const el = () => document.getElementById("busy");

  const bar = () => document.getElementById("bar");

  function show() {
    // 요약처럼 오래 걸리는 조회는 화면을 가리지 않는다(카드만 흐려진다).
    if (window.__noBusy) { return; }
    // 첫 화면만 덮는다. 그 뒤에는 상단 바로만 알린다.
    if (!booted) {
      const b = el();
      if (b) { b.classList.add("on"); }
      return;
    }
    const g = bar();
    if (g) { g.classList.add("on"); }
    document.querySelectorAll(".cell, .detail")
      .forEach(x => x.classList.add("upd"));
  }
  function hide() {
    const b = el();
    if (b) { b.classList.remove("on"); }
    const g = bar();
    if (g) { g.classList.remove("on"); }
    document.querySelectorAll(".upd").forEach(x => x.classList.remove("upd"));
  }

  const orig = window.fetch;
  window.fetch = function () {
    // 자리 진단(디버그) 요청은 화면을 가리지 않는다.
    const url = String(arguments[0] || "");
    if (url.indexOf("/api/debug-layout/") >= 0) {
      return orig.apply(this, arguments);
    }
    // 요약처럼 오래 걸리는 조회는 화면을 가리지 않는다.
    //   부르는 쪽이 __noBusy 를 올려 두면 이 요청은 세지 않는다.
    if (window.__noBusy) {
      mark("fetch 시작(가리지 않음)", url.split("?")[0]);
      return orig.apply(this, arguments);
    }
    n++;
    mark("fetch 시작", url.split("?")[0] + "  (동시 " + n + ")");
    show();
    // 응답 promise 는 **헤더가 오면** 바로 끝난다. 여기서 걷으면
    // 아직 JSON 을 읽고 그리는 중이라 뼈대가 스친다.
    // 부르는 쪽의 .then 들이 다 끝난 뒤(태스크 큐 뒤)로 미룬다.
    const done = () => setTimeout(() => {
      n = Math.max(0, n - 1);
      mark("fetch 끝", url.split("?")[0] + "  (남은 " + n + ")");
      if (n || !booted) { return; }      // 첫 화면은 boot() 가 걷는다
      // 그린 직후 프레임에 걷는다. 인위적 대기는 두지 않는다.
      cancelAnimationFrame(timer);
      timer = requestAnimationFrame(() => { if (!n) { hide(); } });
    }, 0);

    return orig.apply(this, arguments).then(
      (res) => { done(); return res; },
      (err) => { done(); throw err; });
  };

  // 첫 화면: 본문을 감춘 채 덮어 두고, 첫 조회까지 끝나면 함께 보인다.
  //   이 스크립트는 </body> 직전에 있어 DOMContentLoaded 가 이미 지났을 수
  //   있다. 이벤트에 기대지 말고 그 자리에서 바로 붙인다.
  mark("스크립트 실행");
  function markBooting() {
    if (document.body) { document.body.classList.add("booting"); }
    else { requestAnimationFrame(markBooting); }
  }
  markBooting();
  show();

  // 첫 화면은 **그리기가 끝났다고 알려 올 때** 걷는다.
  //   페이지가 __bootDone() 을 부른다. 부르지 않는 페이지를 위해
  //   요청이 모두 끝나고도 조용하면 알아서 걷는다.
  function boot(why) {
    if (booted) { mark("boot 무시(이미 걷음)", why); return; }
    booted = true;
    mark("boot 실행", why);
    // 한 프레임 기다렸다 걷는다. 다만 그 사이 무슨 일이 생겨도
    // 본문은 반드시 보이게 지금 바로 한 번 벗긴다.
    document.body.classList.remove("booting");
    requestAnimationFrame(() => {
      document.body.classList.remove("booting");
      hide();
      mark("가림막 걷음");
      setTimeout(sendTrace, 50);
    });
  }
  window.__bootDone = () => boot("페이지가 그리기 끝냈다고 알림");
  window.__busyCount = () => n;
  // 콘솔에서 어디서 막혔는지 볼 수 있게 남긴다.
  //   console.table(window.__bootTrace())
  window.__bootTrace = () => TRACE;

  // 어떤 이유로든 알림이 오지 않으면 3초 뒤 강제로 연다.
  //   화면이 영영 '불러오는 중' 에 머무는 것이 가장 나쁘다.
  setTimeout(() => {
    if (booted) { return; }
    mark("강제 해제", `3초 경과 · 진행 중 ${n}건`);
    console.warn(`[BOOT] 3초 안에 알림이 오지 않아 강제로 엽니다. 진행 중 ${n}건`);
    boot("시간 초과");
  }, 3000);

  window.addEventListener("load", () => {
    mark("window load", "진행 중 " + n);
    // 조회가 아예 없는 페이지(정적 화면)만 여기서 걷는다.
    //   첫 조회가 아직 시작도 안 했을 수 있어 넉넉히 기다리고,
    //   한 번이라도 불렀다면 페이지가 알려 줄 때까지 기다린다.
    // 조회를 할 페이지는 __bootWait 을 세워 둔다. 그 페이지는 스스로 알린다.
    if (window.__bootWait) {
      mark("자동 걷기 보류", "페이지가 조회를 예고했다");
      return;
    }
    if (!n && !TRACE.some(x => x.what === "fetch 시작")) {
      boot("조회 없는 페이지");
    }
  });
})();
</script>
</body>
</html>
